name: Chalin03 one-off finance fix

on:
  push:
    branches: [production]
    paths:
      - '.github/workflows/chalin03-oneoff-finance-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Finance source of truth
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path('backend/services/equipmentFinanceProfessionalService.js')
          text = service.read_text()
          old = '  if (machine.sale_status !== "available") missing.push("available sale status");'
          new = '  if (!["available", "installment_active"].includes(machine.sale_status)) missing.push("available sale status");'
          if old not in text:
              raise SystemExit('machine readiness source pattern not found')
          text = text.replace(old, new, 1)
          old2 = '    photo_count: media.length,\n  };'
          new2 = '    photo_count: media.length,\n    workflow_status: machine.sale_status === "installment_active" ? "installment" : "available",\n    workflow_status_label: machine.sale_status === "installment_active" ? "Under Installment" : "Available",\n  };'
          if old2 not in text:
              raise SystemExit('readiness return pattern not found')
          text = text.replace(old2, new2, 1)
          service.write_text(text)

          lifecycle = Path('backend/routes/equipmentFinanceFinalLifecycleRoutes.js')
          text = lifecycle.read_text()
          old = '      agreement.next_due_date,\n      agreement.final_due_date,'
          new = '''      (SELECT MIN(schedule.due_date)\n         FROM equipment_installment_schedule schedule\n        WHERE schedule.agreement_id = agreement.id\n          AND schedule.schedule_status NOT IN ('paid','cancelled','waived','rescheduled')\n          AND schedule.due_date >= CURRENT_DATE) AS next_due_date,\n      agreement.final_due_date,'''
          if old not in text:
              raise SystemExit('account list next due pattern not found')
          text = text.replace(old, new, 1)
          lifecycle.write_text(text)

          route = Path('backend/routes/equipmentFinanceIndependentRoutes.js')
          text = route.read_text()
          marker = 'router.use(equipmentFinancePhaseOneRoutes);'
          insert = '''router.get(\n  "/phase-one/bootstrap",\n  requirePermission("fleet.assets.view"),\n  async (req, res, next) => {\n    try {\n      const machines = await listProfessionalMachines({\n        search: req.query.search,\n        status: req.query.status,\n        limit: req.query.limit,\n      });\n      return res.json({\n        status: "success",\n        count: machines.length,\n        machines,\n      });\n    } catch (error) {\n      return next(error);\n    }\n  }\n);\n\n'''
          if marker not in text:
              raise SystemExit('phase-one mount marker not found')
          if 'router.get(\n  "/phase-one/bootstrap"' not in text:
              text = text.replace(marker, insert + marker, 1)
          route.write_text(text)
          PY

      - name: Commit and push patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/services/equipmentFinanceProfessionalService.js backend/routes/equipmentFinanceFinalLifecycleRoutes.js backend/routes/equipmentFinanceIndependentRoutes.js
          git commit -m 'fix installment status and next payment source of truth'
          git push origin HEAD:production

      - name: Remove one-off workflow
        run: |
          git rm .github/workflows/chalin03-oneoff-finance-fix.yml
          git commit -m 'remove one-off finance fix workflow'
          git push origin HEAD:production
