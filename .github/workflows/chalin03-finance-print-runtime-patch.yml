name: Apply Chalin 03 Finance Print Runtime Patch

on:
  push:
    branches:
      - production

permissions:
  contents: write

jobs:
  patch-production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production

      - name: Patch PDF print window handling
        shell: python
        run: |
          from pathlib import Path
          path = Path("frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'const printWindow = window.open(url, "_blank", "noopener,noreferrer");',
              'const printWindow = window.open(url, "_blank");',
              1,
          )
          if 'const printWindow = window.open(url, "_blank");' not in text:
              raise SystemExit("Expected finance print-window code was not found; refusing to modify production.")
          if 'try { printWindow.focus(); } catch {}' not in text:
              text = text.replace(
                  '      window.setTimeout(() => URL.revokeObjectURL(url), 60000);\n      return;\n',
                  '      try { printWindow.focus(); } catch {}\n      window.setTimeout(() => URL.revokeObjectURL(url), 60000);\n      return;\n',
                  1,
              )
          path.write_text(text, encoding="utf-8")
      - name: Verify print path
        run: |
          test "$(grep -c 'const printWindow = window.open(url, "_blank");' frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx)" -eq 1
          grep -n 'printWindow = window.open' frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx
      - name: Remove temporary workflow and commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chalin03-finance-print-runtime-patch.yml
          git add frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx .github/workflows/chalin03-finance-print-runtime-patch.yml
          git commit -m "fix: make Chalin 03 finance PDF printing reliable"
          git push origin HEAD:production
