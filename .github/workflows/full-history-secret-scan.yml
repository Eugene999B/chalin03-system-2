name: Full-History Secret Scan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: full-history-secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks complete Git history
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history without printing findings
        id: scan
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          mkdir -p secret-scan-output

          scan_range_args=()
          scan_scope="complete repository history"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ -z "$PR_BASE_SHA" ] || [ -z "$PR_HEAD_SHA" ]; then
              echo "Pull-request secret scan is missing its base/head commit range." >&2
              exit 2
            fi
            scan_range_args=(--log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA}")
            scan_scope="pull-request commit range ${PR_BASE_SHA}..${PR_HEAD_SHA}"
          fi

          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . \
            "${scan_range_args[@]}" \
            --redact \
            --report-format json \
            --report-path /repo/secret-scan-output/gitleaks-report.json \
            --exit-code 1 \
            --log-level error \
            > secret-scan-output/gitleaks-console.log 2>&1
          status=$?
          set -e

          if [ -s secret-scan-output/gitleaks-report.json ]; then
            count="$(jq 'length' secret-scan-output/gitleaks-report.json)"
          else
            count=0
            printf '[]\n' > secret-scan-output/gitleaks-report.json
          fi

          printf 'finding_count=%s\n' "$count" >> "$GITHUB_OUTPUT"
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf 'Gitleaks scan completed for %s. Redacted candidate count: %s\n' "$scan_scope" "$count" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private redacted scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-history-secret-scan-redacted
          path: secret-scan-output
          if-no-files-found: error
          retention-days: 14

      - name: Enforce clean history
        shell: bash
        run: |
          count='${{ steps.scan.outputs.finding_count }}'
          exit_code='${{ steps.scan.outputs.exit_code }}'
          if [ "$exit_code" != "0" ]; then
            echo "Secret scan contains ${count} redacted candidate secret finding(s). Review the private artifact, rotate real credentials, and remove false positives only with evidence." >&2
            exit 1
          fi
          echo 'Secret scan is clean under the pinned Gitleaks ruleset.'
