name: Payroll Processing Phase 4

on:
  push:
    branches:
      - feature/payroll-processing-approval-phase4-20260810
  pull_request:
    branches:
      - feature/payroll-worker-profile-phase3-20260810

permissions:
  contents: read

concurrency:
  group: payroll-processing-phase4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  processing-centre:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend syntax and regression
        working-directory: backend
        run: |
          npm run syntax-check
          npm test
      - name: Additive migration safety
        working-directory: backend
        shell: bash
        run: |
          git fetch origin feature/payroll-worker-profile-phase3-20260810 --depth=1
          base_sha="$(git merge-base HEAD origin/feature/payroll-worker-profile-phase3-20260810)"
          node scripts/verifyMigrationSafety.js --repo-root .. --base "$base_sha" --head HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend source tests and build
        working-directory: frontend
        run: |
          npm test
          npm run build
