name: Stage 2 readiness diagnostic patch

on:
  push:
    branches:
      - finance/opening-deposit-readiness-diagnostic

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch readiness schema probe
        shell: python
        run: |
          from pathlib import Path
          path = Path("backend/routes/equipmentFinanceDepositReservationRoutes.js")
          text = path.read_text(encoding="utf-8")
          old = '''  const migrationPlaceholders = REQUIRED_MIGRATIONS.map(() => "?").join(",");\n  const [migrationRows] = await connection.query(\n    `SELECT migration_name\n     FROM schema_migrations\n     WHERE migration_name IN (${migrationPlaceholders})`,\n    REQUIRED_MIGRATIONS\n  );\n  const installedMigrations = new Set(\n    migrationRows.map((row) => row.migration_name)\n  );\n  const missingMigrations = REQUIRED_MIGRATIONS.filter(\n    (migrationName) => !installedMigrations.has(migrationName)\n  );\n'''
          new = '''  let missingMigrations = [];\n  const [[schemaMigrationsTable]] = await connection.query(\n    `SELECT COUNT(*) AS present\n     FROM information_schema.TABLES\n     WHERE TABLE_SCHEMA = DATABASE()\n       AND TABLE_NAME = 'schema_migrations'`\n  );\n\n  if (Number(schemaMigrationsTable?.present || 0) !== 1) {\n    missingMigrations = [...REQUIRED_MIGRATIONS];\n  } else {\n    const migrationPlaceholders = REQUIRED_MIGRATIONS.map(() => "?").join(",");\n    const [migrationRows] = await connection.query(\n      `SELECT migration_name\n       FROM schema_migrations\n       WHERE migration_name IN (${migrationPlaceholders})`,\n      REQUIRED_MIGRATIONS\n    );\n    const installedMigrations = new Set(\n      migrationRows.map((row) => row.migration_name)\n    );\n    missingMigrations = REQUIRED_MIGRATIONS.filter(\n      (migrationName) => !installedMigrations.has(migrationName)\n    );\n  }\n'''
          if old not in text:
              raise SystemExit("Expected schema_migrations probe was not found; refusing to edit")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Syntax check
        run: node --check backend/routes/equipmentFinanceDepositReservationRoutes.js
      - name: Commit diagnostic patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/equipmentFinanceDepositReservationRoutes.js
          git commit -m "diagnostic(finance): expose missing deposit foundation migration state"
          git push
          rm -f .github/workflows/stage2-readiness-diagnostic.yml
          git add -u .github/workflows/stage2-readiness-diagnostic.yml
          git commit -m "chore: remove temporary Stage 2 diagnostic workflow"
          git push
