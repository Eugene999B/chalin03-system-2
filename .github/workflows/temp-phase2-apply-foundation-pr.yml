name: Temporary Apply Phase 2 Foundation PR

on:
  pull_request:
    branches:
      - feature/equipment-finance-phase1-integrity-verification-20260807

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payroll-financial-foundation-phase2-20260810
          fetch-depth: 0
      - name: Apply tested Phase 2 patch
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/phase2.patch
          git apply --check /tmp/phase2.patch
          git apply /tmp/phase2.patch
          git rm --ignore-unmatch .github/workflows/temp-phase2-apply-foundation-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build payroll financial foundation"
          git push origin HEAD:feature/payroll-financial-foundation-phase2-20260810
