name: Fix debt business dates

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.event.pull_request.head.ref == 'fix/debt-business-date-display'
    runs-on: ubuntu-latest
    steps:
      - name: Check out date-fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply bounded debt date correction
        id: patch
        shell: bash
        run: |
          python scripts/fixDebtBusinessDates.py | tee /tmp/debt-business-date-result
          if grep -q '^changed=true$' /tmp/debt-business-date-result; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify backend syntax and tests
        if: steps.patch.outputs.changed == 'true'
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Verify frontend tests, lint and production build
        if: steps.patch.outputs.changed == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Commit verified debt date correction
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "Chalin 03 Release Automation"
          git config user.email "actions@users.noreply.github.com"
          if [ -f docs/.debt-business-date-trigger ]; then
            git rm docs/.debt-business-date-trigger
          fi
          git add \
            frontend/src/pages/DebtsPage.jsx \
            frontend/src/utils/businessDate.js \
            frontend/public/sw.js \
            backend/routes/saleRoutes.js \
            backend/tests/debtBusinessDateContract.test.js
          git diff --cached --check
          git commit -m "Correct debt dates for Ghana business time"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
