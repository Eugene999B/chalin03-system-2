name: Phase 1 Backend Lockfile Refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase1-lockfile-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-backend-lockfile:
    if: github.head_ref == 'agent/phase1-runtime-finance-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase1-runtime-finance-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Generate and verify compatible audited lockfile
        working-directory: backend
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only
          npm ci
          npm test
          npm audit --omit=dev --audit-level=low
      - name: Commit only the reviewed lockfile change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/package-lock.json; then
            echo 'Lockfile is already current.'
            exit 0
          fi
          git config user.name 'chalin03-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/package-lock.json
          git commit -m 'fix(deps): update audited backend lockfile'
          git push origin HEAD:agent/phase1-runtime-finance-hardening
