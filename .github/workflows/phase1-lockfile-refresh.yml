name: Phase 1 Backend Lockfile Refresh

on:
  push:
    branches:
      - agent/phase1-runtime-finance-hardening
    paths:
      - .github/workflows/phase1-lockfile-refresh.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-backend-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Generate compatible audited lockfile
        working-directory: backend
        run: |
          set -euo pipefail
          cp package-lock.json package-lock.before.json
          npm audit fix --package-lock-only
          npm ci
          npm test
          npm audit --omit=dev --audit-level=low --json > backend-npm-audit-after.json
          git diff -- package-lock.json > package-lock.diff
      - name: Upload reviewed inputs
        uses: actions/upload-artifact@v4
        with:
          name: phase1-backend-lockfile-refresh
          path: |
            backend/package-lock.json
            backend/package-lock.before.json
            backend/package-lock.diff
            backend/backend-npm-audit-after.json
          if-no-files-found: error
          retention-days: 2
