name: Phase 1 Backend Lockfile Refresh

on:
  push:
    branches:
      - agent/phase1-runtime-finance-hardening
    paths:
      - .github/workflows/phase1-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh-backend-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase1-runtime-finance-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Generate and verify the compatible audited lockfile
        working-directory: backend
        run: |
          set -euo pipefail
          cp package-lock.json package-lock.before.json
          npm audit fix --package-lock-only
          npm ci
          npm test
          npm audit --omit=dev --audit-level=low --json > backend-npm-audit-after.json
          node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('package-lock.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const audit = JSON.parse(fs.readFileSync('backend-npm-audit-after.json', 'utf8'));
          const changed = [];
          const keys = new Set([
            ...Object.keys(before.packages || {}),
            ...Object.keys(after.packages || {}),
          ]);
          for (const key of [...keys].sort()) {
            const oldVersion = before.packages?.[key]?.version || null;
            const newVersion = after.packages?.[key]?.version || null;
            if (oldVersion !== newVersion) changed.push([key, oldVersion, newVersion]);
          }
          const expected = [
            ['node_modules/body-parser', '1.20.5', '1.20.6'],
            ['node_modules/brace-expansion', '5.0.7', '5.0.8'],
          ];
          if (JSON.stringify(changed) !== JSON.stringify(expected)) {
            throw new Error(`Unexpected lockfile version changes: ${JSON.stringify(changed)}`);
          }
          const vulnerabilities = audit.metadata?.vulnerabilities || {};
          if (Number(vulnerabilities.total || 0) !== 0) {
            throw new Error(`Backend audit still reports vulnerabilities: ${JSON.stringify(vulnerabilities)}`);
          }
          NODE
      - name: Commit only the reviewed lockfile
        run: |
          set -euo pipefail
          git diff --exit-code -- backend/package.json
          git add backend/package-lock.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix backend body-parser advisory"
          git push origin HEAD:agent/phase1-runtime-finance-hardening
