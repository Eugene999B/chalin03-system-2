name: Align Password Guard Contract

on:
  push:
    branches:
      - agent/fix-password-change-session

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-password-change-session
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align guard contract
        run: python .github/scripts/align_password_guard_contract.py
      - name: Remove temporary applicator
        run: rm .github/scripts/align_password_guard_contract.py .github/workflows/align-password-guard-contract.yml
      - name: Commit alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Align password guard security contract"
          git push origin HEAD:agent/fix-password-change-session
