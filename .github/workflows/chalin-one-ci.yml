name: CHALIN ONE CI

on:
  workflow_dispatch:
  push:
    branches:
      - chalin-one
  pull_request:
    branches:
      - chalin-one
      - main
      - production

permissions:
  contents: read
  statuses: write

concurrency:
  group: chalin-one-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-status-start:
    name: Publish pending CI status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark CHALIN ONE CI as pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -nc \
            --arg state pending \
            --arg context chalin-one/ci \
            --arg description "CHALIN ONE CI is running" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "${payload}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Verify CHALIN ONE staging safety package
        env:
          NODE_ENV: staging
          CHALIN_ONE_STAGING_CONFIRM: CHALIN_ONE_STAGING_PREVIEW_ONLY
          DB_HOST: 127.0.0.1
          DB_NAME: chalin_one_staging_ci
          FRONTEND_URL: https://preview-ci.example-chalin03.com
          CHALIN_ONE_STAGING_API_URL: https://api-preview-ci.example-chalin03.com
          FEATURE_PUBLIC_WEBSITE: "true"
          FEATURE_CONTENT_STUDIO: "true"
          FEATURE_AI_ENABLED: "false"
          FEATURE_CHALIN_COPILOT: "false"
          FEATURE_CHALIN_EXECUTIVE: "false"
          FEATURE_CHALIN_GUIDE: "false"
          FEATURE_CUSTOMER_PORTAL: "false"
          FEATURE_SUPPLIER_PORTAL: "false"
          FEATURE_APPLICANT_PORTAL: "false"
          FEATURE_AI_ACTIONS: "false"
          FEATURE_AI_SCHEDULED_JOBS: "false"
          PUBLIC_MEDIA_STORAGE_PROVIDER: local
          PUBLIC_MEDIA_LOCAL_ROOT: ./tmp/chalin-one-staging-media
          PUBLIC_FORM_IP_HASH_SECRET: chalin-one-staging-ci-only-public-form-secret-000000000000000000000000000000
          CHALIN_ONE_STAGING_AUTHOR_USER_ID: "101"
          CHALIN_ONE_STAGING_REVIEWER_USER_ID: "102"
          CHALIN_ONE_STAGING_PUBLISHER_USER_ID: "103"
          CHALIN_ONE_ALLOW_SCHEMA_MIGRATION: "false"
          CHALIN_ONE_PUBLIC_CONTENT_MIGRATION_CONFIRM: ""
        run: |
          npm run verify:chalin-one:staging
          npm run seed:chalin-one:staging:dry-run
          CHALIN_ONE_ALLOW_SCHEMA_MIGRATION=true CHALIN_ONE_PUBLIC_CONTENT_MIGRATION_CONFIRM=20260805_CHALIN_ONE_PUBLIC_CONTENT_FOUNDATION npm run verify:chalin-one:staging:migration

      - name: Enforce additive migration safety
        run: npm run migration-safety -- --base origin/main --head HEAD

      - name: Run backend syntax checks
        run: npm run syntax-check

      - name: Run backend tests
        run: npm test

  chalin-one-database-acceptance:
    name: CHALIN ONE database acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: acceptance-root-password
          MYSQL_DATABASE: chalin_one_acceptance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h localhost -pacceptance-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: acceptance-root-password
      DB_NAME: chalin_one_acceptance
      DB_SSL: "false"
      CHALIN_ONE_ALLOW_SCHEMA_MIGRATION: "true"
      CHALIN_ONE_PUBLIC_CONTENT_MIGRATION_CONFIRM: 20260805_CHALIN_ONE_PUBLIC_CONTENT_FOUNDATION
      PUBLIC_FORM_IP_HASH_SECRET: chalin-one-acceptance-only-ip-hash-secret-000000000000000000000000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Prepare isolated legacy database fixture
        run: npm run prepare:chalin-one:acceptance-db

      - name: Rehearse approved public-content migration
        run: npm run migrate:chalin-one:public-content

      - name: Verify migration idempotency
        run: npm run migrate:chalin-one:public-content

      - name: Run database-backed Content Studio acceptance
        run: npm run test:chalin-one:db

      - name: Generate machine-readable release evidence
        run: npm run evidence:chalin-one:release

      - name: Upload CHALIN ONE release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chalin-one-release-evidence-${{ github.sha }}
          path: backend/artifacts/chalin-one-release-evidence.json
          if-no-files-found: error
          retention-days: 30

  frontend-tests:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify Content Studio foundation
        run: node scripts/contentStudioFoundationTests.mjs

      - name: Verify governed Page Manager
        run: node scripts/contentStudioPageManagerTests.mjs

      - name: Verify governed Newsroom Manager
        run: node scripts/contentStudioNewsroomManagerTests.mjs

      - name: Verify governed Leadership Manager
        run: node scripts/contentStudioLeadershipManagerTests.mjs

      - name: Verify expanded company manager batch
        run: node scripts/contentStudioExpandedManagersTests.mjs

      - name: Verify complete operational workspace
        run: node scripts/contentStudioOperationalManagersTests.mjs

      - name: Verify acceptance and public delivery block
        run: node scripts/chalinOnePublicDeliveryTests.mjs

      - name: Compile complete CHALIN ONE JSX
        run: node scripts/contentStudioJsxSyntaxTests.mjs

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  ci-status-final:
    name: Publish final CI status
    if: always()
    needs:
      - backend-tests
      - chalin-one-database-acceptance
      - frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish aggregated CHALIN ONE result
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          DATABASE_RESULT: ${{ needs.chalin-one-database-acceptance.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
        run: |
          state=success
          description="Backend, MySQL acceptance, frontend tests and build passed"
          if [[ "${BACKEND_RESULT}" != "success" || "${DATABASE_RESULT}" != "success" || "${FRONTEND_RESULT}" != "success" ]]; then
            state=failure
            description="CHALIN ONE CI failed; inspect the workflow run"
          fi
          payload="$(jq -nc \
            --arg state "${state}" \
            --arg context chalin-one/ci \
            --arg description "${description}" \
            --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "${payload}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
