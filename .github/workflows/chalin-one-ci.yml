name: CHALIN ONE exact source correction

on:
  push:
    branches:
      - chalin-one

permissions:
  contents: write

concurrency:
  group: chalin-one-source-correction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-fix:
    name: Apply exact final source correction
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact public-content fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          public_path = Path('backend/services/publicContentService.js')
          source = public_path.read_text()
          pattern = re.compile(r'  try \{\n    return JSON\.parse\(value\);\n  \} catch \{\n    // mysql2 parses JSON columns by default\. A JSON scalar string therefore\n    // arrives here already decoded, while raw JSON text still parses above\.\n    return typeof value === "string" \? value : fallback;\n  \}')
          source, count = pattern.subn('  try {\n    return JSON.parse(value);\n  } catch {\n    return fallback;\n  }', source, count=1)
          if count != 1:
              raise SystemExit('Expected exactly one broadened safeJson catch block')

          old_setting = '    settings[row.setting_key] = safeJson(row.value_json, null);'
          new_setting = '\n'.join([
              '    settings[row.setting_key] =',
              '      typeof row.value_json === "string"',
              '        ? row.value_json',
              '        : safeJson(row.value_json, null);',
          ])
          if source.count(old_setting) != 1:
              raise SystemExit('Expected exactly one public setting assignment')
          public_path.write_text(source.replace(old_setting, new_setting, 1))

          company_path = Path('backend/services/contentStudioCompanyInfoWorkflow.js')
          source = company_path.read_text()
          old_publish = '    snapshot.publish_at = snapshot.publish_at || new Date();'
          new_publish = '\n'.join([
              '    // Immediate publication is represented by status + published_at.',
              '    // Keep publish_at NULL unless an explicit non-future timestamp was supplied.',
              '    snapshot.publish_at = snapshot.publish_at || null;',
          ])
          if source.count(old_publish) != 1:
              raise SystemExit('Expected exactly one company-info immediate publish assignment')
          company_path.write_text(source.replace(old_publish, new_publish, 1))
          PY

      - name: Commit exact source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/publicContentService.js backend/services/contentStudioCompanyInfoWorkflow.js
          git diff --cached --check
          git commit -m "Fix public settings parsing and company publication timing"
          git push origin HEAD:chalin-one
