name: Finance payment history release

on:
  push:
    branches: [production]

permissions:
  contents: write

jobs:
  patch-production:
    if: github.actor == 'Eugene999B'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Patch Finance payment history, receipt selection and arrears downloads
        env:
          TARGET_COMMIT: ba9a447005bf73714b5d099ea5493031da0fb761
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          # ----- Backend Phase 6 route: exact, permissioned payment-history endpoint -----
          route = root / 'backend/routes/equipmentFinancePhaseSixRoutes.js'
          text = route.read_text()
          assert 'equipmentFinancePaymentHistoryService' not in text
          needle = '} = require("../services/equipmentFinancePhaseSixService");'
          assert needle in text
          text = text.replace(needle, needle + '\nconst { listPaymentHistory } = require("../services/equipmentFinancePaymentHistoryService");', 1)
          marker = '\nmodule.exports = router;'
          assert marker in text
          block = r'''

router.get("/phase6/payment-history", requirePermission("fleet.assets.view"), async (req, res) => {
  try {
    const history = await listPaymentHistory({
      search: req.query.search,
      dateFrom: req.query.date_from,
      dateTo: req.query.date_to,
      paymentMethod: req.query.payment_method,
      paymentCategory: req.query.payment_category,
      status: req.query.status,
      sortBy: req.query.sort_by,
      sortDir: req.query.sort_dir,
      page: req.query.page,
      pageSize: req.query.page_size,
    });
    return res.json({ status: "success", ...history });
  } catch (error) {
    return sendError(res, error, "Could not load Finance payment history.");
  }
});
'''
          text = text.replace(marker, block + marker, 1)
          route.write_text(text)

          # ----- Frontend dispatcher -----
          dispatcher = root / 'frontend/src/pages/EquipmentSalesWorkspacePage.jsx'
          text = dispatcher.read_text()
          import_needle = 'const EquipmentFinanceCollectionsMinimalPage = lazy(() => import("./EquipmentFinanceCollectionsMinimalPage"));'
          assert import_needle in text
          assert 'EquipmentFinancePaymentHistoryPage' not in text
          text = text.replace(import_needle, import_needle + '\nconst EquipmentFinancePaymentHistoryPage = lazy(() => import("./EquipmentFinancePaymentHistoryPage"));', 1)
          stage_needle = 'if (stage === "collections-core") return <EquipmentFinanceCollectionsMinimalPage />;'
          assert stage_needle in text
          text = text.replace(stage_needle, stage_needle + '\n  if (stage === "payment-history") return <EquipmentFinancePaymentHistoryPage />;', 1)
          dispatcher.write_text(text)

          # ----- Finance navigation -----
          layout = root / 'frontend/src/layouts/InstallmentFinanceLayout.jsx'
          text = layout.read_text()
          assert 'Payment History & Receipts' not in text
          needle = '{ title: "Payments & Collections", description: "Record normal installment receipts and review allocation and payment history", path: "/equipment-installment-finance/applications?stage=collections", icon: "💳", matchSearch: true, permissions: ["fleet.assets.view"] },'
          assert needle in text
          insert = needle + '\n    { title: "Payment History & Receipts", description: "Search every recorded Finance payment by date, receipt, customer, method or agreement and download the exact receipt.", path: "/equipment-installment-finance/applications?stage=payment-history", icon: "🧾", matchSearch: true, permissions: ["fleet.assets.view"] },'
          text = text.replace(needle, insert, 1)
          layout.write_text(text)

          # ----- Payments Centre shortcut -----
          payments = root / 'frontend/src/pages/EquipmentFinancePaymentsCentrePage.jsx'
          text = payments.read_text()
          assert 'stage=payment-history' not in text
          needle = '<Link to="/equipment-installment-finance/applications?stage=corrections">Corrections &amp; Reversals</Link>'
          assert needle in text
          text = text.replace(needle, needle + '\n          <Link to="/equipment-installment-finance/applications?stage=payment-history">Payment History &amp; Receipts</Link>', 1)
          payments.write_text(text)

          # ----- Document Centre: show every valid payment, exact dates, and selected payment without changing receipt renderer -----
          doc = root / 'frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx'
          text = doc.read_text()
          old = '''function dateLabel(value) {\n  if (!value) return "Not recorded";\n  const date = new Date(value);\n  return Number.isNaN(date.getTime())\n    ? String(value).slice(0, 10)\n    : date.toLocaleDateString("en-GH", { year: "numeric", month: "short", day: "2-digit" });\n}\n'''
          assert old in text
          addition = '''function dateLabel(value) {\n  if (!value) return "Not recorded";\n  const date = new Date(value);\n  return Number.isNaN(date.getTime())\n    ? String(value).slice(0, 10)\n    : date.toLocaleDateString("en-GH", { year: "numeric", month: "short", day: "2-digit" });\n}\n\nfunction dateTimeLabel(value) {\n  if (!value) return "Not recorded";\n  const date = new Date(value);\n  return Number.isNaN(date.getTime())\n    ? String(value)\n    : date.toLocaleString("en-GH", { year: "numeric", month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Africa/Accra" });\n}\n'''
          text = text.replace(old, addition, 1)

          assert 'const paymentOptions = useMemo' not in text
          anchor = '  const selectedAccount = accounts.find((account) => String(account.agreement_id) === String(agreementId));\n'
          assert anchor in text
          memo = '''  const paymentOptions = useMemo(\n    () => (snapshot?.payments || [])\n      .filter((payment) => !payment.is_voided && !payment.voided_at && Number(payment.amount || 0) > 0 && Number(payment.id) > 0)\n      .sort((a, b) => new Date(b.payment_date || 0).getTime() - new Date(a.payment_date || 0).getTime() || Number(b.id || 0) - Number(a.id || 0)),\n    [snapshot]\n  );\n'''
          text = text.replace(anchor, anchor + memo, 1)

          # Replace the receipt selector UI by matching its dedicated label and parent wrapper.
          pattern = re.compile(r'\s*<section[^>]*>[\s\S]*?<\/section>', re.M)
          matches = [m for m in pattern.finditer(text) if 'Exact payment receipt' in m.group(0)]
          assert matches, 'Exact payment receipt selector section not found'
          target = matches[0].group(0)
          replacement = '''\n            <section className="finance-docs__payment-picker" aria-labelledby="finance-payment-picker-title">\n              <div className="finance-docs__payment-picker-header">\n                <div>\n                  <small>Exact payment receipt</small>\n                  <h3 id="finance-payment-picker-title">Choose the payment to print or download</h3>\n                  <p>Every valid committed payment is listed with its exact date and amount. Select one payment before issuing its official receipt.</p>\n                </div>\n                <span>{paymentOptions.length} valid payment{paymentOptions.length === 1 ? "" : "s"}</span>\n              </div>\n              {paymentOptions.length ? (\n                <div className="finance-docs__payment-list" role="listbox" aria-label="Finance payment receipts">\n                  {paymentOptions.map((payment) => {\n                    const selected = String(payment.id) === String(selectedPaymentId);\n                    return (\n                      <button\n                        key={payment.id}\n                        type="button"\n                        className={`finance-docs__payment-option ${selected ? "is-selected" : ""}`}\n                        aria-selected={selected}\n                        onClick={() => setSelectedPaymentId(String(payment.id))}\n                      >\n                        <span className="finance-docs__payment-option-main">\n                          <strong>{payment.receipt_number || payment.payment_number || `PAY-${payment.id}`}</strong>\n                          <small>{dateTimeLabel(payment.payment_date)} · {label(payment.payment_method)}{payment.reference_number ? ` · Ref ${payment.reference_number}` : ""}</small>\n                        </span>\n                        <span className="finance-docs__payment-option-amount">{money(payment.amount)}</span>\n                        <span className="finance-docs__payment-option-mark" aria-hidden="true">{selected ? "✓" : ""}</span>\n                      </button>\n                    );\n                  })}\n                </div>\n              ) : (\n                <div className="finance-docs__payment-empty">No valid committed installment payments are available for this agreement.</div>\n              )}\n            </section>'''
          text = text[:matches[0].start()] + replacement + text[matches[0].end():]
          doc.write_text(text)

          # ----- Arrears: replace legacy document download with the same professional immutable document pipeline -----
          arrears = root / 'frontend/src/pages/EquipmentFinanceArrearsPage.jsx'
          text = arrears.read_text()
          assert 'documents/${type}.pdf' in text or 'documents/\${type}.pdf' in text
          start = text.find('  async function downloadDocument')
          if start < 0:
            start = text.find('  const downloadDocument = useCallback')
          assert start >= 0, 'arrears download handler not found'
          end_candidates = [
            text.find('\n  async function ', start + 5),
            text.find('\n  const ', start + 5),
            text.find('\n  useEffect(', start + 5),
            text.find('\n  return (', start + 5),
          ]
          end = min([v for v in end_candidates if v >= 0], default=-1)
          assert end >= 0, 'could not determine arrears download handler end'
          new_handler = '''  async function downloadDocument(agreementId, type) {\n    const documentType = type === "overdue" ? "arrears_notice" : "customer_statement";\n    const workingKey = `${agreementId}:${type}`;\n    setBusyDocument(workingKey);\n    setProblem("");\n    try {\n      const issueResponse = await axiosClient.post("/equipment-catalogue/sales/professional/completion-documents/issue", {\n        agreement_id: Number(agreementId),\n        document_type: documentType,\n        format: "pdf",\n        payment_id: null,\n        amendment_id: null,\n      });\n      const issued = issueResponse.data?.document;\n      if (!issued?.id) throw new Error("The Finance document was not issued. Please refresh the account and try again.");\n      const fileResponse = await axiosClient.get(`/equipment-catalogue/sales/professional/completion-documents/${issued.id}/download`, { params: { format: "pdf" }, responseType: "blob" });\n      const contentType = String(fileResponse.headers?.["content-type"] || "application/pdf");\n      if (!contentType.toLowerCase().includes("pdf")) throw new Error("The Finance document service returned an invalid document format.");\n      const url = URL.createObjectURL(fileResponse.data);\n      const fallbackName = `Chalin03-${documentType}-${agreementId}.pdf`;\n      const disposition = String(fileResponse.headers?.["content-disposition"] || "");\n      const match = disposition.match(/filename="?([^";]+)"?/i);\n      const anchor = document.createElement("a");\n      anchor.href = url;\n      anchor.download = match?.[1] || fallbackName;\n      document.body.appendChild(anchor);\n      anchor.click();\n      anchor.remove();\n      window.setTimeout(() => URL.revokeObjectURL(url), 1000);\n    } catch (error) {\n      setProblem(errorMessage(error, documentType === "arrears_notice" ? "Could not prepare the official arrears notice. Verify that the account has an overdue installment balance." : "Could not prepare the Finance customer statement."));\n    } finally {\n      setBusyDocument("");\n    }\n  }\n'''
          text = text[:start] + new_handler + text[end:]
          # Make the account-level UI explicit when an account is current.
          text = text.replace('No overdue schedule balance.', 'Account current — no arrears notice is due.', 1)
          arrears_link = '<button type="button" className="is-secondary" onClick={() => onDocument(account.id, "statement")} disabled={busyDocument === `${account.id}:statement`}>\n          {busyDocument === `${account.id}:statement` ? "Preparing…" : "Statement"}\n        </button>'
          if arrears_link in text and 'stage=payment-history' not in text:
            pass
          arrears.write_text(text)

          # ----- Add payment-picker styling -----
          css = root / 'frontend/src/styles/equipmentFinanceDocumentDiscovery.css'
          text = css.read_text()
          assert 'finance-docs__payment-picker' not in text
          text += '''\n\n.finance-docs__payment-picker{margin:18px 0;padding:18px;border:1px solid rgba(31,54,45,.12);border-radius:18px;background:#fbfcfb}.finance-docs__payment-picker-header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.finance-docs__payment-picker-header small{display:block;text-transform:uppercase;letter-spacing:.08em;font-weight:800;font-size:.7rem;color:#68776f}.finance-docs__payment-picker-header h3{margin:5px 0 6px;font-size:1.04rem}.finance-docs__payment-picker-header p{margin:0;color:#66766f;line-height:1.45;font-size:.82rem}.finance-docs__payment-picker-header>span{white-space:nowrap;padding:6px 9px;border-radius:999px;background:#edf4ef;color:#28583e;font-size:.72rem;font-weight:800}.finance-docs__payment-list{display:grid;gap:8px;margin-top:13px;max-height:330px;overflow:auto;padding-right:2px}.finance-docs__payment-option{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;text-align:left;padding:12px 13px;border:1px solid #d8e0db;border-radius:12px;background:#fff;cursor:pointer}.finance-docs__payment-option:hover{border-color:#9fb2a7;background:#f8fbf9}.finance-docs__payment-option.is-selected{border-color:#1d6544;box-shadow:0 0 0 2px rgba(29,101,68,.08);background:#f4faf6}.finance-docs__payment-option-main{min-width:0}.finance-docs__payment-option-main strong{display:block;color:#26372e}.finance-docs__payment-option-main small{display:block;margin-top:4px;color:#708078;font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.finance-docs__payment-option-amount{font-weight:850;color:#203b2e;white-space:nowrap}.finance-docs__payment-option-mark{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:#1d6544;color:#fff;font-weight:900;font-size:.8rem}.finance-docs__payment-option:not(.is-selected) .finance-docs__payment-option-mark{background:#eef2ef;color:transparent}.finance-docs__payment-empty{margin-top:12px;padding:14px;border-radius:10px;background:#fff;border:1px dashed #cbd5cf;color:#68766f;font-size:.84rem}\n@media (max-width:700px){.finance-docs__payment-picker{padding:14px}.finance-docs__payment-picker-header{display:block}.finance-docs__payment-picker-header>span{display:inline-block;margin-top:10px}.finance-docs__payment-option{grid-template-columns:minmax(0,1fr) auto}.finance-docs__payment-option-mark{grid-column:2;grid-row:1}.finance-docs__payment-option-amount{grid-column:1;grid-row:2}.finance-docs__payment-list{max-height:300px}}\n'''
          css.write_text(text)

          # ----- Tests: contracts for new payment history / arrears pipeline -----
          phase = root / 'frontend/scripts/equipmentFinancePhaseSixTests.mjs'
          text = phase.read_text()
          if 'EquipmentFinancePaymentHistoryPage.jsx' not in text:
            text = text.replace('const page = fs.readFileSync(path.join(root, "src/pages/EquipmentSalesReportsPage.jsx"), "utf8");', 'const page = fs.readFileSync(path.join(root, "src/pages/EquipmentSalesReportsPage.jsx"), "utf8");\nconst paymentHistory = fs.readFileSync(path.join(root, "src/pages/EquipmentFinancePaymentHistoryPage.jsx"), "utf8");')
            text = text.replace('"Thermal Receipt",\n  "SMS History",', '"Thermal Receipt",\n  "SMS History",\n  "Payment History",')
            text = text.replace('assert.match(page, /data-testid="phase6-message-history"/);', 'assert.match(page, /data-testid="phase6-message-history"/);\nassert.match(paymentHistory, /data-testid="finance-payment-history"/);\nassert.match(paymentHistory, /payment-history/);\nassert.match(paymentHistory, /completion-documents\\/issue/);\nassert.match(paymentHistory, /payment_id: Number\\(payment\\.id\\)/);\nassert.match(paymentHistory, /date_from/);\nassert.match(paymentHistory, /date_to/);\nassert.match(paymentHistory, /sort_by/);\nassert.match(paymentHistory, /Reset/);\nassert.match(layout, /Payment History & Receipts/);')
            phase.write_text(text)

          arrears_test = root / 'frontend/scripts/equipmentFinanceArrearsControlTests.mjs'
          text = arrears_test.read_text()
          text = text.replace('assert.match(page, /documents\\/\\$\\{type\\}\\.pdf/);', 'assert.match(page, /professional\\/completion-documents\\/issue/);\nassert.match(page, /customer_statement/);\nassert.match(page, /arrears_notice/);')
          text = text.replace('assert.match(page, /Download overdue notice/);', 'assert.match(page, /Download overdue notice/);\nassert.match(page, /Account current — no arrears notice is due/);')
          arrears_test.write_text(text)

          simplified = root / 'frontend/scripts/equipmentFinanceSimplifiedWorkspaceTests.mjs'
          text = simplified.read_text()
          text = text.replace('assert.match(documentCentre, /setSelectedPaymentId\\(""\\)/);', 'assert.match(documentCentre, /const paymentOptions = useMemo/);\nassert.match(documentCentre, /dateTimeLabel/);\nassert.match(documentCentre, /finance-docs__payment-picker/);')
          simplified.write_text(text)

          # Ensure no stale temporary patch workflow exists and source files are non-empty.
          assert not any(p.name.startswith('finance-payment-selection-patch') for p in (root / '.github/workflows').iterdir())
          for relative in [
            'backend/services/equipmentFinancePaymentHistoryService.js',
            'frontend/src/pages/EquipmentFinancePaymentHistoryPage.jsx',
            'frontend/src/styles/equipmentFinancePaymentHistory.css',
          ]:
            assert (root / relative).stat().st_size > 500

          print('Finance payment history source patch complete.')
          PY

      - name: Run focused source tests
        run: |
          node --test backend/tests/equipmentFinancePaymentHistory.test.js
          node frontend/scripts/equipmentFinancePhaseSixTests.mjs
          node frontend/scripts/equipmentFinanceArrearsControlTests.mjs
          node frontend/scripts/equipmentFinanceSimplifiedWorkspaceTests.mjs

      - name: Check production source diff
        run: |
          git status --short
          git diff --check
          git diff -- backend/services/equipmentFinancePaymentHistoryService.js backend/routes/equipmentFinancePhaseSixRoutes.js frontend/src/pages/EquipmentFinancePaymentHistoryPage.jsx frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx frontend/src/pages/EquipmentFinanceArrearsPage.jsx frontend/src/layouts/InstallmentFinanceLayout.jsx frontend/src/pages/EquipmentSalesWorkspacePage.jsx

      - name: Commit source changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend frontend
          git add .github/workflows/finance-payment-history-build.yml
          git rm .github/workflows/finance-payment-history-build.yml
          git commit -m 'feat: add searchable Finance payment history and fix arrears documents'
          git push origin HEAD:production
