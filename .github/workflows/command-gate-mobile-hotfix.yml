name: Apply Command Gate Mobile Hotfix

on:
  push:
    branches:
      - hotfix/command-gate-mobile-auto-passkey-final2
    paths:
      - '.hotfix/apply_command_gate_mobile_hotfix.py'
      - '.github/workflows/command-gate-mobile-hotfix.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/command-gate-mobile-auto-passkey-final2
          fetch-depth: 0

      - name: Apply hotfix
        run: python .hotfix/apply_command_gate_mobile_hotfix.py

      - name: Install and verify frontend
        run: |
          set -euo pipefail
          npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
          npm --prefix frontend test
          npm --prefix frontend run build
          git diff --check

      - name: Remove temporary applicator and workflow
        run: |
          rm -rf .hotfix
          rm -f .github/workflows/command-gate-mobile-hotfix.yml

      - name: Commit verified hotfix
        run: |
          set -euo pipefail
          git config user.name "Chalin 03 Release Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix Command Gate mobile design and automatic device setup"
          git push origin HEAD:hotfix/command-gate-mobile-auto-passkey-final2
