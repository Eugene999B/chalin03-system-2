name: Finalize Security History and Migration Guards

on:
  push:
    branches:
      - agent/security-history-migration-guards
    paths:
      - .github/workflows/finalize-security-history-migration-guards.yml

permissions:
  contents: write

concurrency:
  group: finalize-security-history-migration-guards
  cancel-in-progress: false

jobs:
  finalize:
    name: Correct, verify and commit final gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/security-history-migration-guards
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Narrow schema execution detection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path("backend/scripts/verifyMigrationSafety.js")
          source = script_path.read_text(encoding="utf-8")

          old = '''function validateSchemaSqlExecutionReference({ repoRoot, filePath, status, errors }) {
            if (status === "D" || !isProductionExecutionFile(filePath)) {
              return;
            }

            const content = readRepositoryFile(repoRoot, filePath);
            if (/database[\\\\/]schema\\.sql/i.test(content)) {
              addError(
                errors,
                filePath,
                "SCHEMA_SQL_PRODUCTION_REFERENCE",
                "Production workflows and deployment configuration may not execute or reference database/schema.sql."
              );
            }
          }
          '''

          new = '''function containsSchemaSqlExecution(content) {
            const source = String(content || "");
            const executionPatterns = [
              /\\b(?:mysql|mariadb)\\b[^\\r\\n]*database[\\\\/]schema\\.sql\\b/i,
              /\\b(?:source|\\.)\\s+["']?database[\\\\/]schema\\.sql\\b/i,
              /\\b(?:node|npm|npx|bash|sh|powershell|pwsh)\\b[^\\r\\n]*database[\\\\/]schema\\.sql\\b/i,
              /\\b(?:readFileSync|readFile|createReadStream)\\s*\\([^)]*database[\\\\/]schema\\.sql\\b/i,
            ];

            return executionPatterns.some((pattern) => pattern.test(source));
          }

          function validateSchemaSqlExecutionReference({ repoRoot, filePath, status, errors }) {
            if (status === "D" || !isProductionExecutionFile(filePath)) {
              return;
            }

            const content = readRepositoryFile(repoRoot, filePath);
            if (containsSchemaSqlExecution(content)) {
              addError(
                errors,
                filePath,
                "SCHEMA_SQL_PRODUCTION_REFERENCE",
                "Production workflows and deployment configuration may not execute database/schema.sql."
              );
            }
          }
          '''

          import textwrap
          old = textwrap.dedent(old)
          new = textwrap.dedent(new)
          if old not in source:
              raise SystemExit("Expected schema execution validation block was not found")
          source = source.replace(old, new, 1)

          export_needle = '''  DESTRUCTIVE_MIGRATION_RULES,
          MIGRATION_NAME_PATTERN,
          VERIFY_WRITE_PATTERN,
          '''
          export_replacement = '''  DESTRUCTIVE_MIGRATION_RULES,
          MIGRATION_NAME_PATTERN,
          VERIFY_WRITE_PATTERN,
          containsSchemaSqlExecution,
          '''
          export_needle = textwrap.dedent(export_needle)
          export_replacement = textwrap.dedent(export_replacement)
          if export_needle not in source:
              raise SystemExit("Expected export block was not found")
          source = source.replace(export_needle, export_replacement, 1)
          script_path.write_text(source, encoding="utf-8")

          test_path = Path("backend/tests/migrationSafety.test.js")
          tests = test_path.read_text(encoding="utf-8")
          extra_test = r'''

test("a workflow path filter may watch schema.sql without executing it", () => {
  const repoRoot = createRepository();
  const workflowPath = ".github/workflows/schema-change-review.yml";

  write(
    repoRoot,
    workflowPath,
    'on:\n  pull_request:\n    paths:\n      - "database/schema.sql"\nsteps:\n  - run: echo "Review only"\n'
  );

  const errors = validateChangedEntries({
    repoRoot,
    entries: [{ status: "A", oldPath: null, path: workflowPath }],
  });

  assert.equal(
    errors.some(
      (error) => error.code === "SCHEMA_SQL_PRODUCTION_REFERENCE"
    ),
    false
  );
});
'''
          marker = 'test("a workflow path filter may watch schema.sql without executing it"'
          if marker not in tests:
              tests += extra_test
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run focused safety verification
        working-directory: backend
        run: |
          node --check scripts/verifyMigrationSafety.js
          node --test tests/migrationSafety.test.js
          npm run migration-safety -- \
            --base 6f32ff195aab5167db674613a2ae37f71d588bc5 \
            --head HEAD \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Run complete backend verification
        working-directory: backend
        run: npm run syntax-check && npm test

      - name: Remove temporary assessment and finalizer
        run: |
          rm -f .github/workflows/temporary-full-history-secret-assessment.yml
          rm -f .github/workflows/finalize-security-history-migration-guards.yml

      - name: Commit only verified final source
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: enforce secret history and migration safety"
          git push origin HEAD:agent/security-history-migration-guards
