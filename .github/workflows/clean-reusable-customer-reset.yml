name: Clean reusable customer reset

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove duplicate reset and verify source
        id: clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/NewSalePage.jsx')
          source = path.read_text(encoding='utf-8')
          old = '''    setCustomerName("");
    setCustomerPhone("");
    setCustomerLocation("");
    setCustomerSearch("");
    setCustomerMatches([]);
    setSelectedCustomerId("");
    setSelectedCustomer(null);
    setCustomerSearch("");
    setCustomerMatches([]);
    setSelectedCustomerId("");
    setSelectedCustomer(null);'''
          new = '''    setCustomerName("");
    setCustomerPhone("");
    setCustomerLocation("");
    setCustomerSearch("");
    setCustomerMatches([]);
    setSelectedCustomerId("");
    setSelectedCustomer(null);'''
          count = source.count(old)
          if count == 0:
              Path('/tmp/customer-clean-changed').write_text('false', encoding='utf-8')
          elif count == 1:
              path.write_text(source.replace(old, new, 1), encoding='utf-8')
              Path('/tmp/customer-clean-changed').write_text('true', encoding='utf-8')
          else:
              raise SystemExit(f'Expected at most one duplicate reset block, found {count}.')
          PY
          echo "changed=$(cat /tmp/customer-clean-changed)" >> "$GITHUB_OUTPUT"

      - name: Verify backend tests
        if: steps.clean.outputs.changed == 'true'
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Verify frontend tests and build
        if: steps.clean.outputs.changed == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit cleanup
        if: steps.clean.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "Chalin 03 Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/NewSalePage.jsx
          git diff --cached --check
          git commit -m "Clean reusable customer reset"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
