name: Clean reusable customer reset

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  clean-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Clean new customer reset function
        id: clean
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src/pages/NewSalePage.jsx')
          source = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'  function useNewCustomer\(\) \{.*?\n  \}\n\n  function formatCustomerHistoryDate',
              re.S,
          )
          replacement = '''  function useNewCustomer() {
            setSelectedCustomerId("");
            setSelectedCustomer(null);
            setCustomerSearch("");
            setCustomerMatches([]);
            setCustomerName("");
            setCustomerPhone("");
            setCustomerLocation("");
            setMessage("Enter the new customer's details. The system will save them after the sale.");
          }

          function formatCustomerHistoryDate'''
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'Expected one useNewCustomer function, found {count}.')
          if updated == source:
              Path('/tmp/customer-clean-changed').write_text('false', encoding='utf-8')
          else:
              path.write_text(updated, encoding='utf-8')
              Path('/tmp/customer-clean-changed').write_text('true', encoding='utf-8')
          PY
          echo "changed=$(cat /tmp/customer-clean-changed)" >> "$GITHUB_OUTPUT"

      - name: Verify backend tests
        if: steps.clean.outputs.changed == 'true'
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Verify frontend tests and build
        if: steps.clean.outputs.changed == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit cleanup
        if: steps.clean.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "Chalin 03 Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/NewSalePage.jsx
          git diff --cached --check
          git commit -m "Clean reusable customer reset"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
