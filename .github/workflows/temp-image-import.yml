name: Temporary image presentation import
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Import image override stylesheet
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/pages/EquipmentCataloguePage.jsx')
          t = p.read_text(encoding='utf-8')
          marker = 'import "../styles/equipmentCatalogue.css";'
          addition = marker + '\nimport "../styles/equipmentCatalogueImageFix.css";'
          if t.count(marker) != 1:
              raise SystemExit('expected catalogue stylesheet import exactly once')
          if 'equipmentCatalogueImageFix.css' not in t:
              p.write_text(t.replace(marker, addition), encoding='utf-8')
      - name: Validate and remove helper
        shell: bash
        run: |
          node --check frontend/src/pages/EquipmentCataloguePage.jsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-image-import.yml
          git add frontend/src/pages/EquipmentCataloguePage.jsx frontend/src/styles/equipmentCatalogueImageFix.css
          git diff --cached --check
          git commit -m 'fix: display excavator pictures fully without cropping'
          git push origin HEAD:main
