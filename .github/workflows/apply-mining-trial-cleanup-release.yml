name: Apply Mining Trial Cleanup Release

on:
  push:
    branches:
      - agent/mining-trial-purge

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mining-trial-purge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed release changes
        run: python .github/scripts/apply_mining_trial_cleanup_release.py
      - name: Verify generated source syntax
        run: |
          node --check backend/scripts/runMiningTrialCleanup.js
          node --check backend/routes/systemRoutes.js
          node --test backend/tests/miningTrialCleanupContract.test.js
      - name: Commit generated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/routes/systemRoutes.js backend/scripts/runMiningTrialCleanup.js backend/tests/miningTrialCleanupContract.test.js docs/MINING_TRIAL_DATA_CLEANUP_RELEASE.md
          git diff --cached --quiet || git commit -m "Prepare one-time Mining trial data cleanup"
          git push origin HEAD:agent/mining-trial-purge
