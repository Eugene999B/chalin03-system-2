name: Apply Chalin 03 Finance Payment Selection Fix

on:
  push:
    branches:
      - production

permissions:
  contents: write

jobs:
  patch-production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production
      - name: Patch receipt selection
        shell: python
        run: |
          from pathlib import Path
          path = Path("frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx")
          text = path.read_text(encoding="utf-8")
          old = '''      setAmendmentLookupProblem(\n        amendmentResult.error\n          ? errorMessage(amendmentResult.error, "Could not verify amendment availability.")\n          : ""\n      );\n      setSelectedPaymentId("");\n'''
          new = '''      setAmendmentLookupProblem(\n        amendmentResult.error\n          ? errorMessage(amendmentResult.error, "Could not verify amendment availability.")\n          : ""\n      );\n      const validPayments = (previewResponse.data?.snapshot?.payments || []).filter(\n        (payment) => !payment.is_voided && !payment.voided_at && Number(payment.amount || 0) > 0\n      );\n      setSelectedPaymentId((current) => {\n        if (current && validPayments.some((payment) => String(payment.id) === String(current))) return String(current);\n        return validPayments[0] ? String(validPayments[0].id) : "";\n      });\n'''
          if old not in text:
              raise SystemExit("Expected receipt-selection block was not found; refusing to modify production.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Update receipt selector wording
        shell: python
        run: |
          from pathlib import Path
          path = Path("frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx")
          text = path.read_text(encoding="utf-8")
          old = '<h2>Select a payment only when issuing its receipt</h2>\n              <span>No payment is selected automatically.</span>'
          new = '<h2>Choose the payment to print or download</h2>\n              <span>The latest valid committed payment is selected automatically. You can choose any other valid receipt.</span>'
          if old not in text:
              raise SystemExit("Expected receipt-selector wording was not found; refusing to modify production.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          text = Path("frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx").read_text(encoding="utf-8")
          required = [
              "const validPayments =",
              "setSelectedPaymentId((current) => {",
              "latest valid committed payment is selected automatically",
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f"Missing expected patch content: {item}")
      - name: Commit production fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finance-payment-selection-patch.yml
          git add frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx .github/workflows/finance-payment-selection-patch.yml
          git commit -m "fix: make Chalin 03 installment receipts immediately issuable"
          git push origin HEAD:production
