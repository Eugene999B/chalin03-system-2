name: Apply Finance Stabilization Bundle

on:
  push:
    branches:
      - fix/finance-company-wide-stabilization
    paths:
      - .finance-stabilization-bundle.tar.gz.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/finance-company-wide-stabilization
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and extract reviewed bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f .finance-stabilization-bundle.tar.gz.b64
          base64 --decode .finance-stabilization-bundle.tar.gz.b64 > /tmp/finance-stabilization-bundle.tar.gz
          echo "14d2e71a5a663458b27087360de388c50cacf56d3d4f183a7668b86e7c0506d9  /tmp/finance-stabilization-bundle.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/finance-stabilization-bundle.tar.gz | grep -Ev '(^|/)\.\.?(/|$)' >/tmp/finance-bundle-files.txt
          tar -xzf /tmp/finance-stabilization-bundle.tar.gz -C .
          rm -f .finance-stabilization-bundle.tar.gz.b64
          rm -f .github/workflows/apply-finance-stabilization-bundle.yml

      - name: Commit reviewed Finance stabilization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Chalin 03 Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finance: stabilize company-wide installment workflow"
          git push origin HEAD:fix/finance-company-wide-stabilization
