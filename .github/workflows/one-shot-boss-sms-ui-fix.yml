name: One-shot boss SMS history patch

on:
  push:
    paths:
      - ".github/workflows/one-shot-boss-sms-ui-fix.yml"
      - ".maintenance/fix-boss-sms-history"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check trigger
        shell: bash
        run: test -f .maintenance/fix-boss-sms-history

      - name: Apply narrow SMS history fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/pages/EquipmentSalesReportsPage.jsx')
          text = path.read_text()
          old = '<td>{row.last_error || row.message_preview}</td>'
          new = '<td>{row.message_preview || "Message not available"}</td>\n                      <td>{row.last_error || "—"}</td>'
          header_old = '<tr><th>Created</th><th>Type</th><th>Agreement / Receipt</th><th>Recipient</th><th>Status</th><th>Evidence</th></tr>'
          header_new = '<tr><th>Created</th><th>Type</th><th>Agreement / Receipt</th><th>Recipient</th><th>Status</th><th>Message</th><th>Delivery note</th></tr>'
          empty_old = '<tr><td colSpan="6">No Finance SMS evidence yet.</td></tr>'
          empty_new = '<tr><td colSpan="7">No Finance SMS evidence yet.</td></tr>'
          for needle, replacement in ((old, new), (header_old, header_new), (empty_old, empty_new)):
              if needle not in text:
                  raise SystemExit(f'Expected source text not found: {needle}')
              text = text.replace(needle, replacement, 1)
          path.write_text(text)
          PY

      - name: Verify narrow diff
        shell: bash
        run: |
          git diff -- frontend/src/pages/EquipmentSalesReportsPage.jsx
          git diff --check

      - name: Remove one-shot patch machinery
        shell: bash
        run: rm -f .maintenance/fix-boss-sms-history .github/workflows/one-shot-boss-sms-ui-fix.yml

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/EquipmentSalesReportsPage.jsx .maintenance/fix-boss-sms-history .github/workflows/one-shot-boss-sms-ui-fix.yml
          git commit -m "fix(finance): show exact boss SMS message in history"
          git push origin HEAD:main
