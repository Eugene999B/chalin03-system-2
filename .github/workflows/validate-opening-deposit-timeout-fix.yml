name: Validate Opening Deposit timeout fix
on:
  push:
    branches:
      - fix/opening-deposit-request-timeout
permissions:
  contents: write
jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch request path and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('backend/routes/equipmentFinanceDepositReservationRoutes.js')
          s = p.read_text()
          pattern = re.compile(r'let depositFoundationRepairPromise = null;\nasync function ensureDepositFoundationReady\(\) \{.*?\n\}', re.S)
          match = pattern.search(s)
          if not match:
              raise SystemExit('Expected stable Deposit request-path repair block was not found; aborting safely.')
          replacement = 'async function ensureDepositFoundationReady() {\n  return schemaStatus(pool);\n}'
          patched = s[:match.start()] + replacement + s[match.end():]
          helper_start = patched.find('async function ensureDepositFoundationReady')
          helper_end = patched.find('async function assertSchemaReady', helper_start)
          helper = patched[helper_start:helper_end]
          if 'runEquipmentFinanceOpeningDepositFoundationRepair' in helper or 'GET_LOCK' in helper:
              raise SystemExit('Opening Deposit request path still invokes repair/locking; aborting safely.')
          p.write_text(patched)
          PY
          node --check backend/routes/equipmentFinanceDepositReservationRoutes.js
          cd backend
          npm ci --omit=dev
          node --test tests/equipmentFinanceDepositReservationContract.test.js
          node - <<'NODE'
          const fs = require('fs');
          const route = fs.readFileSync('routes/equipmentFinanceDepositReservationRoutes.js', 'utf8');
          const helper = route.slice(
            route.indexOf('async function ensureDepositFoundationReady'),
            route.indexOf('async function assertSchemaReady')
          );
          if (!/async function ensureDepositFoundationReady\(\)\s*\{\s*return schemaStatus\(pool\);\s*\}/s.test(helper)) {
            throw new Error('Opening Deposit readiness helper is not read-only.');
          }
          if (helper.includes('runEquipmentFinanceOpeningDepositFoundationRepair') || helper.includes('GET_LOCK')) {
            throw new Error('Opening Deposit request path can still run a repair lock.');
          }
          console.log('Opening Deposit request-timeout regression guard passed.');
          NODE
      - name: Remove validation workflow and commit fix
        run: |
          rm -f .github/workflows/validate-opening-deposit-timeout-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/routes/equipmentFinanceDepositReservationRoutes.js .github/workflows/validate-opening-deposit-timeout-fix.yml
          git commit -m 'Fix Opening Deposit request-timeout path'
          git push origin HEAD
