name: Opening Deposit Production Gate

on:
  pull_request:
    branches:
      - production
    paths:
      - 'backend/scripts/finalizeEquipmentFinanceOpeningDepositReservationTrigger.js'
      - 'backend/services/installmentFinanceResetProductionService.js'
      - 'railway.json'
      - 'backend/**'
      - 'frontend/**'

permissions:
  contents: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend install
        working-directory: backend
        run: npm ci

      - name: Backend syntax check
        working-directory: backend
        run: npm run syntax-check

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Finance contract checks
        run: |
          node <<'NODE'
          const fs = require('fs');
          const route = fs.readFileSync('backend/routes/equipmentFinanceDepositReservationRoutes.js', 'utf8');
          const finalizer = fs.readFileSync('backend/scripts/finalizeEquipmentFinanceOpeningDepositReservationTrigger.js', 'utf8');
          const railway = JSON.parse(fs.readFileSync('railway.json', 'utf8'));
          const reset = fs.readFileSync('backend/services/installmentFinanceResetProductionService.js', 'utf8');
          if (!/NEW\.lock_status\s*=\s*['\"]installment_active['\"]/.test(finalizer)) throw new Error('Reservation finalizer status contract is missing.');
          if (!/ELSE\s+SIGNAL SQLSTATE '45000'/.test(finalizer)) throw new Error('Reservation finalizer rejection branch is missing.');
          if (!/v_deposit_received\s*\+\s*0\.01\s*<\s*v_deposit_required/.test(finalizer)) throw new Error('Deposit tolerance contract is missing.');
          if (!railway.deploy.preDeployCommand.includes('runEquipmentFinanceProductionPredeployRepair.js')) throw new Error('Opening Deposit repair missing from pre-deploy.');
          if (!railway.deploy.preDeployCommand.includes('finalizeEquipmentFinanceOpeningDepositReservationTrigger.js')) throw new Error('Reservation finalizer missing from pre-deploy.');
          if (!railway.deploy.preDeployCommand.includes('verifyEquipmentFinanceDepositReadiness.js')) throw new Error('Readiness verification missing from pre-deploy.');
          if (railway.deploy.startCommand.includes('runEquipmentFinanceOpeningDepositFoundationRepair.js')) throw new Error('Migration-dependent Opening Deposit repair remains in startup.');
          if (!/finalize\(\)/.test(reset)) throw new Error('Installment reset does not finalize Opening Deposit.');
          console.log('Opening Deposit production gate passed.');
          NODE
