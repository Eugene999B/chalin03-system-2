name: Finalize Mobile Debt Card Fix

on:
  push:
    branches:
      - agent/mobile-debt-card-polish

permissions:
  contents: write

jobs:
  fix:
    name: Apply compact mobile debt-card layout
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-debt-card-polish
          fetch-depth: 0

      - name: Apply focused mobile layout correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/pages/DebtsPage.jsx")
          source = path.read_text()

          def replace_once(old, new):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old[:100]!r}")
              source = source.replace(old, new, 1)

          replace_once(
'''  const compactModalActions = isMobile ? styles.modalActionsMobile : {};
''',
'''  const compactModalActions = isMobile ? styles.modalActionsMobile : {};
  const compactDebtCard = isMobile ? styles.debtCardMobile : {};
  const compactDebtCardTop = isMobile ? styles.debtCardTopMobile : {};
  const compactDebtNameRow = isMobile ? styles.debtNameRowMobile : {};
  const compactBalanceBox = isMobile ? styles.balanceBoxMobile : {};
  const compactDebtMiniGrid = isMobile ? styles.debtMiniGridMobile : {};
  const compactCardActions = isMobile ? styles.cardActionsMobile : {};
''')

          replace_once(
'''                  <article key={debt.id} style={styles.debtCard}>
                    <div style={styles.debtCardTop}>
                      <div>
                        <div style={styles.debtNameRow}>
                          <strong>{debt.customer_name}</strong>
''',
'''                  <article
                    key={debt.id}
                    style={{ ...styles.debtCard, ...compactDebtCard }}
                  >
                    <div style={{ ...styles.debtCardTop, ...compactDebtCardTop }}>
                      <div style={styles.debtIdentityBlock}>
                        <div style={{ ...styles.debtNameRow, ...compactDebtNameRow }}>
                          <strong
                            style={{
                              ...styles.debtCustomerName,
                              ...(isMobile ? styles.debtCustomerNameMobile : {}),
                            }}
                          >
                            {debt.customer_name || "Unnamed Customer"}
                          </strong>
''')

          replace_once(
'''                        <p>
                          {debt.customer_phone || "-"} • Receipt:{" "}
                          {debt.receipt_number || "-"}
                        </p>

                        <small>
                          Due: {formatDate(debt.due_date)} • Store:{" "}
                          {getDebtStoreCode(debt)}
                        </small>
''',
'''                        <p style={styles.debtContactLine}>
                          <span>{debt.customer_phone || "No phone"}</span>
                          <span>Receipt: {debt.receipt_number || "-"}</span>
                        </p>

                        <small style={styles.debtDueLine}>
                          <span>Due {formatDate(debt.due_date)}</span>
                          <span>Store {getDebtStoreCode(debt)}</span>
                        </small>
''')

          replace_once(
'''                      <div style={styles.balanceBox}>
''',
'''                      <div style={{ ...styles.balanceBox, ...compactBalanceBox }}>
''')

          replace_once(
'''                    <div style={styles.debtMiniGrid}>
''',
'''                    <div style={{ ...styles.debtMiniGrid, ...compactDebtMiniGrid }}>
''')

          replace_once(
'''                    <div style={styles.cardActions}>
                      <button type="button" onClick={() => viewDebt(debt.id)}>
''',
'''                    <div style={{ ...styles.cardActions, ...compactCardActions }}>
                      <button
                        type="button"
                        style={isMobile ? styles.cardActionButtonMobile : undefined}
                        onClick={() => viewDebt(debt.id)}
                      >
''')

          replace_once(
'''                            className="secondary-button"
                            onClick={() => preparePayment(debt)}
''',
'''                            className="secondary-button"
                            style={isMobile ? styles.cardActionButtonMobile : undefined}
                            onClick={() => preparePayment(debt)}
''')

          replace_once(
'''                            className="secondary-button"
                            onClick={() => sendDebtReminderSms(debt)}
''',
'''                            className="secondary-button"
                            style={isMobile ? styles.cardActionButtonMobile : undefined}
                            onClick={() => sendDebtReminderSms(debt)}
''')

          replace_once(
'''                              background: "#16a34a",
                              color: "#ffffff",
                              border: "none",
''',
'''                              background: "#16a34a",
                              color: "#ffffff",
                              border: "none",
                              ...(isMobile ? styles.cardActionButtonMobile : {}),
''')

          replace_once(
'''function MiniStat({ label, value }) {
  return (
    <div style={styles.miniStat}>
      <span>{label}</span>
      <strong>{value}</strong>
    </div>
  );
}
''',
'''function MiniStat({ label, value }) {
  return (
    <div style={styles.miniStat}>
      <span style={styles.miniStatLabel}>{label}</span>
      <strong style={styles.miniStatValue}>{value}</strong>
    </div>
  );
}
''')

          replace_once(
'''  debtCard: {
    borderRadius: "20px",
    border: "1px solid #e2e8f0",
    background: "linear-gradient(180deg, #ffffff, #f8fafc)",
    padding: "16px",
    boxShadow: "0 12px 30px rgba(15, 23, 42, 0.06)",
  },

  debtCardTop: {
''',
'''  debtCard: {
    borderRadius: "20px",
    border: "1px solid #e2e8f0",
    background: "linear-gradient(180deg, #ffffff, #f8fafc)",
    padding: "16px",
    boxShadow: "0 12px 30px rgba(15, 23, 42, 0.06)",
  },

  debtCardMobile: {
    borderRadius: "18px",
    padding: "13px",
    border: "1px solid #cbd5e1",
    background: "linear-gradient(145deg, #ffffff 0%, #f1f5f9 100%)",
    boxShadow: "0 10px 24px rgba(15, 23, 42, 0.08)",
  },

  debtCardTop: {
''')

          replace_once(
'''  debtNameRow: {
    display: "flex",
    gap: "8px",
    alignItems: "center",
    flexWrap: "wrap",
  },

  statusBadge: {
''',
'''  debtCardTopMobile: {
    gridTemplateColumns: "minmax(0, 1fr)",
    gap: "10px",
  },

  debtIdentityBlock: {
    minWidth: 0,
  },

  debtNameRow: {
    display: "flex",
    gap: "8px",
    alignItems: "center",
    flexWrap: "wrap",
    minWidth: 0,
  },

  debtNameRowMobile: {
    display: "grid",
    gridTemplateColumns: "minmax(0, 1fr) auto",
    alignItems: "start",
    gap: "8px",
  },

  debtCustomerName: {
    minWidth: 0,
    color: "#0f172a",
    fontSize: "17px",
    lineHeight: 1.25,
    overflowWrap: "anywhere",
    wordBreak: "break-word",
  },

  debtCustomerNameMobile: {
    fontSize: "19px",
    lineHeight: 1.15,
    letterSpacing: "-0.02em",
  },

  debtContactLine: {
    display: "flex",
    flexWrap: "wrap",
    gap: "5px 10px",
    margin: "9px 0 0",
    color: "#475569",
    fontSize: "12px",
    lineHeight: 1.4,
    overflowWrap: "anywhere",
  },

  debtDueLine: {
    display: "flex",
    flexWrap: "wrap",
    gap: "4px 10px",
    marginTop: "6px",
    color: "#64748b",
    fontSize: "11px",
    fontWeight: "800",
  },

  statusBadge: {
''')

          replace_once(
'''  balanceBox: {
    minWidth: "180px",
    textAlign: "right",
    color: "#0f172a",
  },

  debtMiniGrid: {
''',
'''  balanceBox: {
    minWidth: "180px",
    textAlign: "right",
    color: "#0f172a",
  },

  balanceBoxMobile: {
    minWidth: 0,
    textAlign: "left",
    display: "grid",
    gridTemplateColumns: "auto minmax(0, 1fr)",
    alignItems: "baseline",
    gap: "3px 8px",
    padding: "11px 12px",
    borderRadius: "14px",
    background: "linear-gradient(135deg, #e0f2fe, #eff6ff)",
    border: "1px solid #bae6fd",
  },

  debtMiniGrid: {
''')

          replace_once(
'''  miniStat: {
    padding: "10px",
    borderRadius: "14px",
    background: "#ffffff",
    border: "1px solid #e2e8f0",
  },

  cardActions: {
''',
'''  debtMiniGridMobile: {
    gridTemplateColumns: "repeat(2, minmax(0, 1fr))",
    gap: "8px",
    marginTop: "10px",
  },

  miniStat: {
    display: "grid",
    gap: "4px",
    minWidth: 0,
    padding: "10px",
    borderRadius: "14px",
    background: "#ffffff",
    border: "1px solid #e2e8f0",
  },

  miniStatLabel: {
    color: "#64748b",
    fontSize: "11px",
    fontWeight: "850",
  },

  miniStatValue: {
    minWidth: 0,
    color: "#0f172a",
    fontSize: "14px",
    lineHeight: 1.2,
    overflowWrap: "anywhere",
  },

  cardActions: {
''')

          replace_once(
'''  cardActions: {
    display: "flex",
    gap: "8px",
    flexWrap: "wrap",
    marginTop: "14px",
  },

  paymentPreview: {
''',
'''  cardActions: {
    display: "flex",
    gap: "8px",
    flexWrap: "wrap",
    marginTop: "14px",
  },

  cardActionsMobile: {
    display: "grid",
    gridTemplateColumns: "repeat(2, minmax(0, 1fr))",
    gap: "8px",
    marginTop: "10px",
  },

  cardActionButtonMobile: {
    width: "100%",
    minWidth: 0,
    minHeight: "42px",
    padding: "9px 8px",
    borderRadius: "12px",
    fontSize: "12px",
    lineHeight: 1.15,
    whiteSpace: "normal",
  },

  paymentPreview: {
''')

          path.write_text(source)
          PY

          rm -f .github/workflows/temp-mobile-debt-card-fix.yml
          git diff --check
          npm --prefix frontend ci
          npm --prefix frontend run lint
          npm --prefix frontend run build

      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: polish mobile debt cards"
          git push origin HEAD:agent/mobile-debt-card-polish
