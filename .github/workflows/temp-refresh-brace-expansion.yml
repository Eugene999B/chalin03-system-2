name: Refresh Safe Brace Expansion Locks

on:
  push:
    branches:
      - agent/customer-statement-debt-printing

permissions:
  contents: write

jobs:
  refresh-lock:
    name: Update vulnerable transitive lock entries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: agent/customer-statement-debt-printing
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Update only the vulnerable transitive package
        shell: bash
        run: |
          set -euo pipefail
          cp backend/package.json /tmp/backend-package.json.before
          cd backend
          npm update brace-expansion --package-lock-only
          cmp package.json /tmp/backend-package.json.before
          npm ci
          npm audit --omit=dev --audit-level=high --json > /tmp/backend-audit.json
          cd ..

          rm -f .github/workflows/temp-refresh-brace-expansion.yml

          changed="$(git status --short | awk '{print $2}' | sort -u)"
          printf '%s\n' "$changed"
          expected="backend/package-lock.json"
          actual="$(printf '%s\n' "$changed" | grep -v '^.github/workflows/temp-refresh-brace-expansion.yml$')"
          test "$actual" = "$expected"
          git diff --check

      - name: Commit verified lockfile correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update vulnerable transitive dependency locks"
          git push origin HEAD:agent/customer-statement-debt-printing
