name: Apply standalone employment release

on:
  push:
    branches:
      - agent/standalone-employment-documents-signature

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize release files
        shell: bash
        run: |
          cat .github/agent-payload/part-* > /tmp/standalone-release.b64
          base64 --decode /tmp/standalone-release.b64 > /tmp/standalone-release.tar.gz
          tar -xzf /tmp/standalone-release.tar.gz -C .
          node scripts/applyStandaloneEmploymentRelease.mjs

      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npx eslint src/pages/EmploymentDocumentsPage.jsx src/pages/DocumentSignatureSettingsPage.jsx
          npm run build

      - name: Commit verified release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add standalone employment documents and signature settings"
          git push origin HEAD
