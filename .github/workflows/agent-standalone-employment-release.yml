name: Apply standalone employment release

on:
  push:
    branches:
      - agent/standalone-employment-documents-signature
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/standalone-employment-documents-signature

      - name: Assemble release archive
        shell: bash
        run: |
          cat .github/agent-payload/part-00 .github/agent-payload/part-01 .github/agent-payload/part-02 .github/agent-payload/part-03 .github/agent-payload/part-04 .github/agent-payload/part-05 > /tmp/standalone-release.b64
          test "$(wc -c < /tmp/standalone-release.b64)" -eq 41808
          base64 --decode /tmp/standalone-release.b64 > /tmp/standalone-release.tar.gz

      - name: Validate and extract release archive
        shell: bash
        run: |
          gzip -t /tmp/standalone-release.tar.gz
          tar -tzf /tmp/standalone-release.tar.gz | head -40
          tar -xzf /tmp/standalone-release.tar.gz -C .

      - name: Apply source patches
        shell: bash
        run: |
          set +e
          node scripts/applyStandaloneEmploymentRelease.mjs > /tmp/apply-release.log 2>&1
          status=$?
          cat /tmp/apply-release.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/apply-release.log .github/agent-payload/APPLY_ERROR.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/agent-payload/APPLY_ERROR.txt
            git commit -m "Record standalone release patch failure"
            git push origin HEAD
          fi
          exit "$status"

      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npx eslint src/pages/EmploymentDocumentsPage.jsx src/pages/DocumentSignatureSettingsPage.jsx
          npm run build

      - name: Commit verified release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add standalone employment documents and signature settings"
          git push origin HEAD
