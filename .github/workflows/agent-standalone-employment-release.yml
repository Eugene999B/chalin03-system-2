name: Apply standalone employment release

on:
  push:
    branches:
      - agent/standalone-employment-documents-signature
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/standalone-employment-documents-signature

      - name: Assemble release archive
        shell: bash
        run: |
          cat .github/agent-payload/part-00 .github/agent-payload/part-01 .github/agent-payload/part-02 .github/agent-payload/part-03 .github/agent-payload/part-04 .github/agent-payload/part-05 > /tmp/standalone-release.b64
          test "$(wc -c < /tmp/standalone-release.b64)" -eq 41808
          base64 --decode /tmp/standalone-release.b64 > /tmp/standalone-release.tar.gz

      - name: Validate and extract release archive
        shell: bash
        run: |
          gzip -t /tmp/standalone-release.tar.gz
          tar -tzf /tmp/standalone-release.tar.gz | head -40
          tar -xzf /tmp/standalone-release.tar.gz -C .

      - name: Make release patch backward compatible
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/applyStandaloneEmploymentRelease.mjs")
          source = path.read_text()
          old = '''    const pattern = /^(\\s*)"worker_hr_letters",$/gm;
              const count = [...source.matchAll(pattern)].length;
              if (count === 0) {
                throw new Error(`Backup coverage anchor missing in ${file}`);
              }
              source = source.replace(
                pattern,
                '$1"worker_hr_letters",\\n$1"standalone_hr_documents",\\n$1"document_signature_settings",'
              );
              write(file, source);'''
          new = '''    const workerPattern = /^(\\s*)"worker_hr_letters",$/gm;
              if ([...source.matchAll(workerPattern)].length > 0) {
                source = source.replace(
                  workerPattern,
                  '$1"worker_hr_letters",\\n$1"standalone_hr_documents",\\n$1"document_signature_settings",'
                );
              } else {
                const printPattern = /^(\\s*)"worker_print_history",$/gm;
                if ([...source.matchAll(printPattern)].length === 0) {
                  throw new Error(`Backup coverage anchor missing in ${file}`);
                }
                source = source.replace(
                  printPattern,
                  '$1"worker_print_history",\\n$1"worker_hr_letters",\\n$1"standalone_hr_documents",\\n$1"document_signature_settings",'
                );
              }
              write(file, source);'''
          if old not in source:
              raise SystemExit("Expected backup coverage patch block was not found.")
          source = source.replace(old, new)
          workflow_delete = '''fs.rmSync(
            path.join(root, ".github", "workflows", "agent-standalone-employment-release.yml"),
            { force: true }
          );
          fs.rmSync(path.join(root, ".github", "agent-payload"), { recursive: true, force: true });
          '''
          if workflow_delete not in source:
              raise SystemExit("Expected temporary support cleanup block was not found.")
          path.write_text(source.replace(workflow_delete, ""))
          PY

      - name: Apply source patches
        shell: bash
        run: node scripts/applyStandaloneEmploymentRelease.mjs

      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npx eslint src/pages/EmploymentDocumentsPage.jsx src/pages/DocumentSignatureSettingsPage.jsx
          npm run build

      - name: Commit verified release
        shell: bash
        run: |
          rm -f .github/agent-payload/APPLY_ERROR.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add standalone employment documents and signature settings"
          git push origin HEAD
