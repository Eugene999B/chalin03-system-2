name: Phase 0 CodeQL Remediation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase0-codeql-remediation.yml

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-production-safety
          fetch-depth: 0

      - name: Apply reviewed CodeQL remediations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          login_paths = [
              Path('frontend/src/pages/LoginPageGroupOperations.jsx'),
              Path('frontend/src/pages/LoginPageBiometricBank.jsx'),
          ]

          old_import = 'import { useEffect, useMemo, useRef, useState } from "react";'
          new_import = 'import { useEffect, useId, useMemo, useRef, useState } from "react";'
          old_name = (
              '  const [passwordFieldName] = useState(\n'
              '    () => `chalin03-entry-${Date.now()}-${Math.random().toString(36).slice(2)}`\n'
              '  );'
          )
          new_name = '  const passwordFieldName = `chalin03-entry-${useId().replace(/:/g, "")}`;'

          for path in login_paths:
              text = path.read_text(encoding='utf-8')
              if old_import not in text:
                  raise SystemExit(f'Missing expected React import in {path}')
              if old_name not in text:
                  raise SystemExit(f'Missing expected password field name block in {path}')
              text = text.replace(old_import, new_import, 1)
              text = text.replace(old_name, new_name, 1)
              path.write_text(text, encoding='utf-8')

          startup = Path('backend/config/startupSecurity.js')
          text = startup.read_text(encoding='utf-8')
          old_hosts = (
              '    const trustedHosts = normalizedHosts(env.TRUSTED_API_HOSTS);\n'
              '    if (!trustedHosts.includes("api.chalin03.com")) {\n'
              '      errors.push("TRUSTED_API_HOSTS must include api.chalin03.com in production");\n'
              '    }\n'
              '    if (trustedHosts.some((host) => host.endsWith(".railway.app"))) {\n'
              '      errors.push("TRUSTED_API_HOSTS must not include Railway public hostnames");\n'
              '    }'
          )
          new_hosts = (
              '    const trustedHostSet = new Set(normalizedHosts(env.TRUSTED_API_HOSTS));\n'
              '    if (!trustedHostSet.has("api.chalin03.com")) {\n'
              '      errors.push("TRUSTED_API_HOSTS must include api.chalin03.com in production");\n'
              '    }\n'
              '    if ([...trustedHostSet].some((host) => host.endsWith(".railway.app"))) {\n'
              '      errors.push("TRUSTED_API_HOSTS must not include Railway public hostnames");\n'
              '    }'
          )
          if old_hosts not in text:
              raise SystemExit('Missing expected trusted-host validation block')
          startup.write_text(text.replace(old_hosts, new_hosts, 1), encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verify backend syntax and tests
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Verify frontend tests, lint and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Commit verified CodeQL remediations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/config/startupSecurity.js \
            frontend/src/pages/LoginPageGroupOperations.jsx \
            frontend/src/pages/LoginPageBiometricBank.jsx
          git diff --cached --check
          git commit -m 'Resolve remaining Phase 0 CodeQL findings'
          git push origin HEAD:agent/phase-0-production-safety
