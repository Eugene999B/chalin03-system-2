name: Chalin 03 Verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: chalin03-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD

  backend:
    name: Backend safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run syntax-check

      - name: Verify controlled migration safety
        run: npm run migration-safety

      - name: Run backend tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee backend-test.log

      - name: Preserve backend verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification-log
          path: backend/backend-test.log
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend source tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend source tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log

      - name: Build production frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log

      - name: Record legacy full-project lint debt
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee frontend-lint.log

      - name: Preserve frontend verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-logs
          path: |
            frontend/frontend-test.log
            frontend/frontend-build.log
            frontend/frontend-lint.log
          if-no-files-found: ignore
          retention-days: 14
