name: Chalin 03 Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: chalin03-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run syntax-check

      - name: Run backend tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee backend-test.log

      - name: Preserve backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend/backend-test.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend source tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log

      - name: Enforce full frontend lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee frontend-lint.log

      - name: Build production frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log

      - name: Preserve frontend verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-logs
          path: |
            frontend/frontend-test.log
            frontend/frontend-lint.log
            frontend/frontend-build.log
          if-no-files-found: ignore
          retention-days: 7

  maintenance-reset-safety:
    name: Verify and commit transactional maintenance reset
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: chalin03_ci_root
          MYSQL_DATABASE: chalin03_maintenance_acceptance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pchalin03_ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/post-phase1-full-system-audit
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Generate exact maintenance reset changes
        run: python3 .github/scripts/generate_post_phase1_maintenance_reset_fix.py

      - name: Verify focused contracts and syntax
        run: |
          python3 -m py_compile .github/scripts/generate_post_phase1_maintenance_reset_fix.py
          node --check backend/routes/maintenanceRoutes.js
          node --check backend/services/maintenanceResetService.js
          node --test backend/tests/maintenanceResetSafety.test.js
          ! grep -RniE 'TRUNCATE[[:space:]]+TABLE|ALTER[[:space:]]+TABLE' backend/routes/maintenanceRoutes.js backend/services/maintenanceResetService.js

      - name: Run complete backend suite against generated fix
        working-directory: backend
        run: |
          set -o pipefail
          npm ci
          npm run syntax-check
          npm test 2>&1 | tee ../maintenance-reset-backend-test.log

      - name: Test, lint and build frontend against generated fix
        working-directory: frontend
        run: |
          set -o pipefail
          npm ci
          npm test 2>&1 | tee ../maintenance-reset-frontend-test.log
          npm run lint 2>&1 | tee ../maintenance-reset-frontend-lint.log
          npm run build 2>&1 | tee ../maintenance-reset-frontend-build.log

      - name: Execute disposable MySQL rollback acceptance
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: chalin03_ci_root
          DB_NAME: chalin03_maintenance_acceptance
        run: |
          mysql -h 127.0.0.1 -uroot -pchalin03_ci_root chalin03_maintenance_acceptance <<'SQL'
          DROP TABLE IF EXISTS activity_log;
          DROP TABLE IF EXISTS sales;
          CREATE TABLE sales (
            id INT PRIMARY KEY,
            description VARCHAR(100) NOT NULL
          ) ENGINE=InnoDB;
          CREATE TABLE activity_log (
            id INT PRIMARY KEY,
            action VARCHAR(100) NOT NULL
          ) ENGINE=InnoDB;
          INSERT INTO sales (id, description) VALUES (1, 'retained sale');
          INSERT INTO activity_log (id, action) VALUES (1, 'retained audit');
          SQL

          node <<'NODE' | tee maintenance-reset-mysql-acceptance.log
          const assert = require('node:assert/strict');
          const mysql = require('./backend/node_modules/mysql2/promise');
          const {
            clearTablesTransactionally,
            resolveMaintenanceClearAvailability,
          } = require('./backend/services/maintenanceResetService');

          (async () => {
            const production = resolveMaintenanceClearAvailability({
              NODE_ENV: 'production',
              ALLOW_CLEAR_BUSINESS_DATA: 'true',
            });
            assert.equal(production.enabled, false);
            assert.equal(production.production_permanently_blocked, true);

            const connection = await mysql.createConnection({
              host: process.env.DB_HOST,
              port: Number(process.env.DB_PORT),
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME,
            });

            let injectedFailureObserved = false;
            try {
              await clearTablesTransactionally(
                connection,
                ['activity_log', 'sales'],
                {
                  afterDelete: async ({ index }) => {
                    if (index === 0) {
                      const error = new Error('Injected failure after first table delete.');
                      error.code = 'INJECTED_MAINTENANCE_FAILURE';
                      throw error;
                    }
                  },
                }
              );
            } catch (error) {
              injectedFailureObserved = error.code === 'INJECTED_MAINTENANCE_FAILURE';
            }
            assert.equal(injectedFailureObserved, true);

            const [[salesCount]] = await connection.query(
              'SELECT COUNT(*) AS count FROM sales'
            );
            const [[activityCount]] = await connection.query(
              'SELECT COUNT(*) AS count FROM activity_log'
            );
            const [[foreignKeyState]] = await connection.query(
              'SELECT @@FOREIGN_KEY_CHECKS AS enabled'
            );

            assert.equal(Number(salesCount.count), 1);
            assert.equal(Number(activityCount.count), 1);
            assert.equal(Number(foreignKeyState.enabled), 1);

            const success = await clearTablesTransactionally(
              connection,
              ['activity_log', 'sales'],
              {
                beforeCommit: async ({ connection: tx }) => {
                  const [[remainingSales]] = await tx.query(
                    'SELECT COUNT(*) AS count FROM sales'
                  );
                  const [[remainingActivity]] = await tx.query(
                    'SELECT COUNT(*) AS count FROM activity_log'
                  );
                  assert.equal(Number(remainingSales.count), 0);
                  assert.equal(Number(remainingActivity.count), 0);
                  return { verified_zero_counts: true };
                },
              }
            );

            assert.equal(success.clear_results.length, 2);
            assert.equal(success.before_commit_result.verified_zero_counts, true);

            const [[finalSalesCount]] = await connection.query(
              'SELECT COUNT(*) AS count FROM sales'
            );
            const [[finalActivityCount]] = await connection.query(
              'SELECT COUNT(*) AS count FROM activity_log'
            );
            assert.equal(Number(finalSalesCount.count), 0);
            assert.equal(Number(finalActivityCount.count), 0);

            console.log(JSON.stringify({
              production_permanently_blocked: true,
              rollback_restored_sales: Number(salesCount.count),
              rollback_restored_activity: Number(activityCount.count),
              foreign_key_checks_restored: Number(foreignKeyState.enabled),
              successful_transaction_table_count: success.clear_results.length,
            }, null, 2));

            await connection.end();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Package exact verified files and evidence
        run: |
          mkdir -p maintenance-reset-evidence/backend/routes
          mkdir -p maintenance-reset-evidence/backend/services
          mkdir -p maintenance-reset-evidence/backend/tests
          mkdir -p maintenance-reset-evidence/frontend/src/pages
          cp backend/routes/maintenanceRoutes.js maintenance-reset-evidence/backend/routes/
          cp backend/services/maintenanceResetService.js maintenance-reset-evidence/backend/services/
          cp backend/tests/maintenanceResetSafety.test.js maintenance-reset-evidence/backend/tests/
          cp frontend/src/pages/MaintenancePage.jsx maintenance-reset-evidence/frontend/src/pages/
          cp maintenance-reset-*.log maintenance-reset-evidence/ 2>/dev/null || true
          sha256sum \
            backend/routes/maintenanceRoutes.js \
            backend/services/maintenanceResetService.js \
            backend/tests/maintenanceResetSafety.test.js \
            frontend/src/pages/MaintenancePage.jsx \
            > maintenance-reset-evidence/SHA256SUMS.txt

      - name: Upload maintenance reset evidence
        uses: actions/upload-artifact@v4
        with:
          name: post-phase1-maintenance-reset-fix-files
          path: maintenance-reset-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified product files and restore permanent CI
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/post-phase1-full-system-audit'
        run: |
          git config user.name "chalin03-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/chalin03-verification.yml
          git rm .github/scripts/generate_post_phase1_maintenance_reset_fix.py
          git add \
            backend/routes/maintenanceRoutes.js \
            backend/services/maintenanceResetService.js \
            backend/tests/maintenanceResetSafety.test.js \
            frontend/src/pages/MaintenancePage.jsx \
            .github/workflows/chalin03-verification.yml
          git commit -m "Make test-data reset transactional and production-blocked"
          git push origin HEAD:agent/post-phase1-full-system-audit
