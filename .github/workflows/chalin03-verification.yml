name: Chalin 03 Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: write

concurrency:
  group: chalin03-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run syntax-check

      - name: Run backend tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee backend-test.log

      - name: Preserve backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend/backend-test.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend source tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log

      - name: Enforce full frontend lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee frontend-lint.log

      - name: Build production frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log

      - name: Preserve frontend verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-logs
          path: |
            frontend/frontend-test.log
            frontend/frontend-lint.log
            frontend/frontend-build.log
          if-no-files-found: ignore
          retention-days: 7

  post-phase1-immutability-artifact:
    name: Generate, verify and commit audit/expense immutability fix
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate exact source changes in runner only
        id: generate
        run: python3 .github/scripts/generate_post_phase1_immutability_fix.py

      - name: Verify focused contracts and syntax
        id: focused
        run: |
          node --check backend/routes/auditSignoffRoutes.js
          node --check backend/routes/expenseRoutes.js
          node --check backend/tests/operationsRouteReleaseContract.test.js
          node --test backend/tests/auditSignoffExpenseImmutability.test.js

      - name: Run complete backend suite against generated fix
        id: generated_backend
        working-directory: backend
        run: |
          set -o pipefail
          npm ci
          npm test 2>&1 | tee ../post-phase1-generated-backend-tests.log

      - name: Test, lint and build frontend against generated fix
        id: generated_frontend
        working-directory: frontend
        run: |
          set -o pipefail
          npm ci
          npm test 2>&1 | tee ../post-phase1-generated-frontend-tests.log
          npx eslint src/pages/AuditSignoffHistoryPage.jsx 2>&1 | tee ../post-phase1-generated-frontend-lint.log
          npm run build 2>&1 | tee ../post-phase1-generated-frontend-build.log

      - name: Package exact generated source files
        run: |
          set -euo pipefail
          git diff --check
          git diff --binary -- \
            backend/routes/auditSignoffRoutes.js \
            backend/routes/expenseRoutes.js \
            backend/tests/auditSignoffExpenseImmutability.test.js \
            backend/tests/operationsRouteReleaseContract.test.js \
            frontend/src/pages/AuditSignoffHistoryPage.jsx \
            > post-phase1-immutability-fix.patch
          sha256sum \
            backend/routes/auditSignoffRoutes.js \
            backend/routes/expenseRoutes.js \
            backend/tests/auditSignoffExpenseImmutability.test.js \
            backend/tests/operationsRouteReleaseContract.test.js \
            frontend/src/pages/AuditSignoffHistoryPage.jsx \
            post-phase1-immutability-fix.patch \
            > post-phase1-immutability-fix.sha256

      - name: Upload generated fix and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: post-phase1-immutability-fix-files
          path: |
            backend/routes/auditSignoffRoutes.js
            backend/routes/expenseRoutes.js
            backend/tests/auditSignoffExpenseImmutability.test.js
            backend/tests/operationsRouteReleaseContract.test.js
            frontend/src/pages/AuditSignoffHistoryPage.jsx
            post-phase1-immutability-fix.patch
            post-phase1-immutability-fix.sha256
            post-phase1-generated-backend-tests.log
            post-phase1-generated-frontend-tests.log
            post-phase1-generated-frontend-lint.log
            post-phase1-generated-frontend-build.log
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified product files and restore permanent CI
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/post-phase1-full-system-audit'
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/chalin03-verification.yml
          git rm .github/scripts/generate_post_phase1_immutability_fix.py

          git config user.name "chalin03-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/chalin03-verification.yml \
            backend/routes/auditSignoffRoutes.js \
            backend/routes/expenseRoutes.js \
            backend/tests/auditSignoffExpenseImmutability.test.js \
            backend/tests/operationsRouteReleaseContract.test.js \
            frontend/src/pages/AuditSignoffHistoryPage.jsx
          git commit -m "Preserve audit and expense evidence"
          git push origin HEAD:agent/post-phase1-full-system-audit
