name: Chalin 03 Verification

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - agent/release-31-ci-validation-base
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: chalin03-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject whitespace errors
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="$PR_BASE_SHA"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "null" ]]; then
            BASE_SHA="$PUSH_BASE_SHA"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          git diff --check "${BASE_SHA}...HEAD"

  backend:
    name: Backend safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run syntax-check

      - name: Verify controlled migration safety
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="$PR_BASE_SHA"
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "null" ]]; then
            BASE_SHA="$PUSH_BASE_SHA"
          fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          npm run migration-safety -- --base "$BASE_SHA" --head HEAD

      - name: Run backend tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee backend-test.log

      - name: Preserve backend verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification-log
          path: backend/backend-test.log
          if-no-files-found: ignore
          retention-days: 14

  database-drill:
    name: Disposable migration and recovery drill
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: release31-root
      DB_NAME: chalin03_release31_test
      DB_SSL: "false"
      SYSTEM_ADMIN_USER_ID: 1
      SYSTEM_ADMIN_USERNAME: admin
      CONFIRM_RELEASE31_DISPOSABLE_DRILL: RUN_RELEASE31_DISPOSABLE_DRILL
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: release31-root
          MYSQL_DATABASE: chalin03_release31_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --password=release31-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run destructive disposable drill
        run: npm run drill:release31

      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release31-disposable-recovery-evidence
          path: backend/release31-disposable-drill-evidence.json
          if-no-files-found: warn
          retention-days: 30

  frontend:
    name: Frontend source tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend source tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log

      - name: Build production frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log

      - name: Record legacy full-project lint debt
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee frontend-lint.log

      - name: Preserve frontend verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-logs
          path: |
            frontend/frontend-test.log
            frontend/frontend-build.log
            frontend/frontend-lint.log
          if-no-files-found: ignore
          retention-days: 14
