name: Chalin 03 Runner Diagnostic

on:
  pull_request:
    branches:
      - agent/release-31-ci-validation-base

permissions:
  contents: read

jobs:
  runner-diagnostic:
    name: Runner diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner execution
        shell: bash
        run: |
          echo "GitHub-hosted runner started successfully."
          echo "Runner OS: $RUNNER_OS"
          node --version
          npm --version
