name: Chalin 03 Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: chalin03-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run syntax-check

      - name: Run backend tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee backend-test.log

      - name: Preserve backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend/backend-test.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend source tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log

      - name: Enforce full frontend lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee frontend-lint.log

      - name: Build production frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log

      - name: Preserve frontend verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-logs
          path: |
            frontend/frontend-test.log
            frontend/frontend-lint.log
            frontend/frontend-build.log
          if-no-files-found: ignore
          retention-days: 7

  equipment-sales-reachability-update:
    name: Apply equipment sales reachability update
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/equipment-sales-reachability-docs'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: agent/equipment-sales-reachability-docs
          fetch-depth: 0

      - name: Generate documentation and regression evidence
        run: |
          python3 .github/scripts/apply_equipment_sales_reachability_update.py
          git diff --check
          grep -q '96ab439931e2331a5a537207881c4467a64856af' README.md
          grep -q 'Equipment Sales Routing Architecture' docs/EQUIPMENT_SALES_ROUTING_ARCHITECTURE.md
          grep -q 'Equipment Sales remains reachable' backend/tests/equipmentSalesReachabilityContract.test.js

      - name: Restore permanent workflow and commit generated files
        run: |
          git config user.name "chalin03-maintenance-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/chalin03-verification.yml
          git rm .github/scripts/apply_equipment_sales_reachability_update.py
          git add -A
          git diff --cached --check
          git commit -m "Document and protect Equipment Sales router reachability"
          git push origin HEAD:agent/equipment-sales-reachability-docs
