name: Chalin 03 Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: write

concurrency:
  group: chalin03-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run syntax-check

      - name: Run backend tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee backend-test.log

      - name: Preserve backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend/backend-test.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend source tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log

      - name: Enforce full frontend lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee frontend-lint.log

      - name: Build production frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log

      - name: Preserve frontend verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-logs
          path: |
            frontend/frontend-test.log
            frontend/frontend-lint.log
            frontend/frontend-build.log
          if-no-files-found: ignore
          retention-days: 7

  audit-schema-readiness:
    name: Generate, verify and commit read-only audit schema readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: chalin03_ci_root
          MYSQL_DATABASE: chalin03_audit_readiness_acceptance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pchalin03_ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Generate exact route, schema and migration changes
        run: python3 .github/scripts/generate_post_phase1_audit_schema_fix.py

      - name: Verify focused contracts and syntax
        run: |
          python3 -m py_compile .github/scripts/generate_post_phase1_audit_schema_fix.py
          node --check backend/routes/auditSignoffRoutes.js
          node --test backend/tests/auditSchemaReadiness.test.js
          node --test backend/tests/migrationSafety.test.js

      - name: Run complete backend suite against generated fix
        working-directory: backend
        run: |
          set -o pipefail
          npm ci
          npm test 2>&1 | tee ../post-phase1-audit-schema-backend-tests.log

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for disposable MySQL
        env:
          MYSQL_PWD: chalin03_ci_root
        run: |
          for attempt in {1..30}; do
            if mysqladmin --protocol=tcp -h 127.0.0.1 -P 3306 -u root ping --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "Disposable MySQL did not become ready." >&2
          exit 1

      - name: Build legacy audit schema without extended evidence columns
        env:
          MYSQL_PWD: chalin03_ci_root
        run: |
          cat > /tmp/audit_readiness_base.sql <<'SQL'
          CREATE TABLE schema_migrations (
            id INT AUTO_INCREMENT PRIMARY KEY,
            migration_name VARCHAR(150) NOT NULL UNIQUE,
            applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            description TEXT NULL
          );
          CREATE TABLE audit_signoffs (
            id INT AUTO_INCREMENT PRIMARY KEY,
            branch_id INT NOT NULL DEFAULT 1,
            period_type ENUM('all', 'today', 'week', 'month', 'year', 'custom') NOT NULL DEFAULT 'month',
            period_label VARCHAR(255) NOT NULL,
            period_start DATE NULL,
            period_end DATE NULL,
            audit_score INT NOT NULL DEFAULT 0,
            audit_status VARCHAR(50) NOT NULL DEFAULT 'Needs Review',
            prepared_by_name VARCHAR(150) NULL,
            reviewed_by_name VARCHAR(150) NULL,
            approved_by_name VARCHAR(150) NULL,
            review_date DATE NULL,
            period_status ENUM('draft', 'reviewed', 'approved', 'rejected') NOT NULL DEFAULT 'draft',
            sales_checked BOOLEAN NOT NULL DEFAULT FALSE,
            expenses_checked BOOLEAN NOT NULL DEFAULT FALSE,
            debts_checked BOOLEAN NOT NULL DEFAULT FALSE,
            stock_checked BOOLEAN NOT NULL DEFAULT FALSE,
            warnings_checked BOOLEAN NOT NULL DEFAULT FALSE,
            reports_checked BOOLEAN NOT NULL DEFAULT FALSE,
            accountant_notes TEXT NULL,
            management_notes TEXT NULL,
            created_by INT NULL,
            approved_by INT NULL,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP
          );
          CREATE TABLE audit_reapproval_log (
            id INT AUTO_INCREMENT PRIMARY KEY,
            audit_signoff_id INT NULL,
            unlock_request_id INT NULL,
            period_label VARCHAR(255) NOT NULL,
            period_start DATE NULL,
            period_end DATE NULL,
            previous_status VARCHAR(50) NULL,
            new_status VARCHAR(50) NOT NULL DEFAULT 'approved',
            audit_score INT NOT NULL DEFAULT 0,
            audit_status VARCHAR(50) NULL,
            reapproved_by INT NULL,
            reapproved_by_name VARCHAR(150) NULL,
            reapproved_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
            reapproval_notes TEXT NULL,
            accountant_notes TEXT NULL,
            management_notes TEXT NULL,
            created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          SQL
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root chalin03_audit_readiness_acceptance < /tmp/audit_readiness_base.sql

      - name: Apply additive migration twice and run read-only verification
        env:
          MYSQL_PWD: chalin03_ci_root
        run: |
          set -o pipefail
          migration="database/migrations/20260725_post_phase1_audit_signoff_readiness.sql"
          verification="database/migrations/20260725_post_phase1_audit_signoff_readiness_verify.sql"
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root chalin03_audit_readiness_acceptance < "$migration"
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root chalin03_audit_readiness_acceptance < "$migration"
          mysql --table --protocol=tcp -h 127.0.0.1 -P 3306 -u root chalin03_audit_readiness_acceptance < "$verification" | tee post-phase1-audit-schema-verify.log
          grep -A2 -F '| missing_audit_readiness_columns |' post-phase1-audit-schema-verify.log | tail -n1 | grep -Eq '^\|[[:space:]]*0[[:space:]]*\|$'
          grep -A2 -F '| missing_audit_readiness_indexes |' post-phase1-audit-schema-verify.log | tail -n1 | grep -Eq '^\|[[:space:]]*0[[:space:]]*\|$'

      - name: Execute production-mode read-only route readiness acceptance
        working-directory: backend
        env:
          NODE_ENV: production
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: chalin03_ci_root
          DB_NAME: chalin03_audit_readiness_acceptance
          DB_SSL: "false"
        run: |
          node <<'NODE' | tee ../post-phase1-audit-schema-runtime.log
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const {
            RUNTIME_DDL_PATTERN,
            pool,
            stripSqlComments,
          } = require("./config/db");

          const statements = [];
          const guardedQuery = pool.query.bind(pool);
          pool.query = async function observedQuery(statement, values) {
            const sql = typeof statement === "string" ? statement : statement?.sql || "";
            statements.push(stripSqlComments(sql));
            return guardedQuery(statement, values);
          };

          const auditRoutes = require("./routes/auditSignoffRoutes");

          async function run() {
            auditRoutes.resetAuditSchemaReadinessCache();
            const state = await auditRoutes.readAuditSchemaState(pool);
            assert.equal(state.ready, true);
            assert.deepEqual(state.missing_tables, []);
            assert.deepEqual(state.missing_columns, []);
            assert.deepEqual(state.missing_indexes, []);

            const cachedState = await auditRoutes.assertAuditSchemaReady(pool);
            assert.equal(cachedState.ready, true);

            const ddlStatements = statements.filter((sql) =>
              RUNTIME_DDL_PATTERN.test(sql)
            );
            assert.deepEqual(
              ddlStatements,
              [],
              `Audit readiness attempted runtime DDL: ${ddlStatements.join(" | ")}`
            );

            const evidence = {
              status: "passed",
              node_env: process.env.NODE_ENV,
              schema_ready: state.ready,
              missing_tables: state.missing_tables,
              missing_columns: state.missing_columns,
              missing_indexes: state.missing_indexes,
              observed_query_count: statements.length,
              runtime_ddl_query_count: ddlStatements.length,
            };
            fs.writeFileSync(
              "../post-phase1-audit-schema-runtime-evidence.json",
              `${JSON.stringify(evidence, null, 2)}\n`
            );
            console.log("AUDIT SCHEMA READ-ONLY ACCEPTANCE PASSED");
            console.log(JSON.stringify(evidence, null, 2));
            await pool.end();
          }

          run().catch(async (error) => {
            console.error(error);
            try {
              await pool.end();
            } catch {}
            process.exitCode = 1;
          });
          NODE

      - name: Package exact verified source and evidence
        run: |
          set -euo pipefail
          git diff --check
          git diff --binary -- \
            backend/routes/auditSignoffRoutes.js \
            backend/tests/auditSchemaReadiness.test.js \
            database/schema.* \
            database/migrations/20260725_post_phase1_audit_signoff_readiness.sql \
            database/migrations/20260725_post_phase1_audit_signoff_readiness_verify.sql \
            > post-phase1-audit-schema-fix.patch
          sha256sum \
            backend/routes/auditSignoffRoutes.js \
            backend/tests/auditSchemaReadiness.test.js \
            database/schema.* \
            database/migrations/20260725_post_phase1_audit_signoff_readiness.sql \
            database/migrations/20260725_post_phase1_audit_signoff_readiness_verify.sql \
            post-phase1-audit-schema-fix.patch \
            post-phase1-audit-schema-runtime-evidence.json \
            > post-phase1-audit-schema-fix.sha256

      - name: Upload verified audit schema evidence
        uses: actions/upload-artifact@v4
        with:
          name: post-phase1-audit-schema-fix-files
          path: |
            backend/routes/auditSignoffRoutes.js
            backend/tests/auditSchemaReadiness.test.js
            database/schema.*
            database/migrations/20260725_post_phase1_audit_signoff_readiness.sql
            database/migrations/20260725_post_phase1_audit_signoff_readiness_verify.sql
            post-phase1-audit-schema-fix.patch
            post-phase1-audit-schema-fix.sha256
            post-phase1-audit-schema-runtime-evidence.json
            post-phase1-audit-schema-runtime.log
            post-phase1-audit-schema-verify.log
            post-phase1-audit-schema-backend-tests.log
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified files and restore permanent CI
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/post-phase1-full-system-audit'
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/chalin03-verification.yml
          git rm .github/scripts/generate_post_phase1_audit_schema_fix.py

          git config user.name "chalin03-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -u
          git add \
            backend/tests/auditSchemaReadiness.test.js \
            database/migrations/20260725_post_phase1_audit_signoff_readiness.sql \
            database/migrations/20260725_post_phase1_audit_signoff_readiness_verify.sql
          git commit -m "Replace audit route DDL with read-only readiness"
          git push origin HEAD:agent/post-phase1-full-system-audit
