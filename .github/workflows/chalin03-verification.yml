name: Chalin 03 Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: write

concurrency:
  group: chalin03-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run syntax-check

      - name: Run backend tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee backend-test.log

      - name: Preserve backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend/backend-test.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend source tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee frontend-test.log

      - name: Enforce full frontend lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee frontend-lint.log

      - name: Build production frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log

      - name: Preserve frontend verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-logs
          path: |
            frontend/frontend-test.log
            frontend/frontend-lint.log
            frontend/frontend-build.log
          if-no-files-found: ignore
          retention-days: 7

  user-identity-preservation:
    name: Generate, verify and commit secure user offboarding
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: chalin03_ci_root
          MYSQL_DATABASE: chalin03_user_identity_acceptance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pchalin03_ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Generate exact source changes in runner only
        run: python3 .github/scripts/generate_post_phase1_user_identity_fix.py

      - name: Verify focused source contracts and syntax
        run: |
          node --check backend/routes/userRoutes.js
          node --check backend/services/userIdentityPreservationService.js
          node --test backend/tests/userIdentityPreservation.test.js

      - name: Run complete backend suite against generated fix
        working-directory: backend
        run: |
          set -o pipefail
          npm ci
          npm test 2>&1 | tee ../post-phase1-user-identity-backend-tests.log

      - name: Test, lint and build frontend against generated fix
        working-directory: frontend
        run: |
          set -o pipefail
          npm ci
          npm test 2>&1 | tee ../post-phase1-user-identity-frontend-tests.log
          npx eslint src/pages/UsersSettingsPage.jsx 2>&1 | tee ../post-phase1-user-identity-frontend-lint.log
          npm run build 2>&1 | tee ../post-phase1-user-identity-frontend-build.log

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for disposable MySQL
        env:
          MYSQL_PWD: chalin03_ci_root
        run: |
          for attempt in {1..30}; do
            if mysqladmin --protocol=tcp -h 127.0.0.1 -P 3306 -u root ping --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "Disposable MySQL did not become ready." >&2
          exit 1

      - name: Build isolated user-identity acceptance database
        env:
          MYSQL_PWD: chalin03_ci_root
        run: |
          cat > /tmp/user_identity_acceptance.sql <<'SQL'
          CREATE TABLE users (
            id INT AUTO_INCREMENT PRIMARY KEY,
            full_name VARCHAR(150) NOT NULL,
            username VARCHAR(80) NOT NULL UNIQUE,
            role VARCHAR(30) NOT NULL,
            is_active TINYINT(1) NOT NULL DEFAULT 1,
            token_version INT NOT NULL DEFAULT 0,
            default_branch_id INT NULL,
            can_access_all_branches TINYINT(1) NOT NULL DEFAULT 0
          );
          CREATE TABLE user_branch_access (
            user_id INT NOT NULL,
            branch_id INT NOT NULL,
            can_access TINYINT(1) NOT NULL DEFAULT 1,
            is_primary TINYINT(1) NOT NULL DEFAULT 0
          );
          CREATE TABLE user_business_access (
            id INT AUTO_INCREMENT PRIMARY KEY,
            user_id INT NOT NULL,
            business_unit_id INT NOT NULL,
            can_access TINYINT(1) NOT NULL DEFAULT 1,
            is_default TINYINT(1) NOT NULL DEFAULT 0
          );
          CREATE TABLE user_mining_site_access (
            id INT AUTO_INCREMENT PRIMARY KEY,
            user_id INT NOT NULL,
            site_id INT NOT NULL,
            can_access TINYINT(1) NOT NULL DEFAULT 1,
            is_default TINYINT(1) NOT NULL DEFAULT 0
          );
          CREATE TABLE user_hire_location_access (
            id INT AUTO_INCREMENT PRIMARY KEY,
            user_id INT NOT NULL,
            location_id INT NOT NULL,
            can_access TINYINT(1) NOT NULL DEFAULT 1,
            is_default TINYINT(1) NOT NULL DEFAULT 0
          );
          CREATE TABLE user_permission_overrides (
            id BIGINT AUTO_INCREMENT PRIMARY KEY,
            user_id INT NOT NULL,
            permission_code VARCHAR(120) NOT NULL,
            revoked_at DATETIME NULL,
            revoked_by INT NULL,
            revocation_reason VARCHAR(500) NULL
          );
          CREATE TABLE auth_sessions (
            id BIGINT AUTO_INCREMENT PRIMARY KEY,
            session_id VARCHAR(100) NOT NULL,
            user_id INT NOT NULL,
            revoked_at DATETIME NULL,
            revocation_reason VARCHAR(80) NULL
          );
          CREATE TABLE sales (
            id INT AUTO_INCREMENT PRIMARY KEY,
            staff_id INT NULL,
            approved_by INT NULL,
            total_amount DECIMAL(12,2) NOT NULL DEFAULT 0.00
          );
          CREATE TABLE activity_log (
            id INT AUTO_INCREMENT PRIMARY KEY,
            user_id INT NULL,
            action VARCHAR(150) NOT NULL
          );
          SQL
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root chalin03_user_identity_acceptance < /tmp/user_identity_acceptance.sql

      - name: Execute transaction-level identity preservation acceptance
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: chalin03_ci_root
          DB_NAME: chalin03_user_identity_acceptance
          DB_SSL: "false"
        run: |
          node <<'NODE' | tee ../post-phase1-user-identity-runtime.log
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const { pool } = require("./config/db");
          const {
            secureDeactivateUser,
          } = require("./services/userIdentityPreservationService");

          async function run() {
            const connection = await pool.getConnection();
            try {
              const [actorResult] = await connection.query(
                `INSERT INTO users (full_name, username, role, is_active, token_version, default_branch_id, can_access_all_branches)
                 VALUES ('System Administrator', 'admin', 'admin', 1, 0, 1, 1)`
              );
              const actorId = Number(actorResult.insertId);
              const [targetResult] = await connection.query(
                `INSERT INTO users (full_name, username, role, is_active, token_version, default_branch_id, can_access_all_branches)
                 VALUES ('Historical Worker', 'historical_worker', 'manager', 1, 4, 1, 1)`
              );
              const targetId = Number(targetResult.insertId);

              await connection.query(
                `INSERT INTO user_branch_access VALUES (?, 1, 1, 1)`,
                [targetId]
              );
              await connection.query(
                `INSERT INTO user_business_access (user_id, business_unit_id, can_access, is_default)
                 VALUES (?, 10, 1, 1)`,
                [targetId]
              );
              await connection.query(
                `INSERT INTO user_mining_site_access (user_id, site_id, can_access, is_default)
                 VALUES (?, 20, 1, 1)`,
                [targetId]
              );
              await connection.query(
                `INSERT INTO user_hire_location_access (user_id, location_id, can_access, is_default)
                 VALUES (?, 30, 1, 1)`,
                [targetId]
              );
              await connection.query(
                `INSERT INTO user_permission_overrides (user_id, permission_code)
                 VALUES (?, 'reports.export')`,
                [targetId]
              );
              await connection.query(
                `INSERT INTO auth_sessions (session_id, user_id)
                 VALUES ('active-session-1', ?), ('active-session-2', ?)`,
                [targetId, targetId]
              );
              const [saleResult] = await connection.query(
                `INSERT INTO sales (staff_id, approved_by, total_amount)
                 VALUES (?, ?, 1250.00)`,
                [targetId, targetId]
              );
              const saleId = Number(saleResult.insertId);
              await connection.query(
                `INSERT INTO activity_log (user_id, action)
                 VALUES (?, 'HISTORICAL_LOGIN')`,
                [targetId]
              );

              await connection.beginTransaction();
              const result = await secureDeactivateUser(connection, {
                targetUserId: targetId,
                actorUserId: actorId,
                reason: "Disposable CI secure offboarding acceptance.",
              });
              await connection.commit();

              const [[user]] = await connection.query(
                `SELECT * FROM users WHERE id = ?`,
                [targetId]
              );
              assert.ok(user, "User identity must remain in users table");
              assert.equal(Number(user.is_active), 0);
              assert.equal(Number(user.token_version), 5);
              assert.equal(Number(user.can_access_all_branches), 0);
              assert.equal(user.default_branch_id, null);

              for (const table of [
                "user_branch_access",
                "user_business_access",
                "user_mining_site_access",
                "user_hire_location_access",
              ]) {
                const [[row]] = await connection.query(
                  `SELECT can_access, ${table === "user_branch_access" ? "is_primary" : "is_default"} AS default_flag
                   FROM \`${table}\` WHERE user_id = ? LIMIT 1`,
                  [targetId]
                );
                assert.equal(Number(row.can_access), 0, `${table} access must be revoked`);
                assert.equal(Number(row.default_flag), 0, `${table} default flag must be cleared`);
              }

              const [[override]] = await connection.query(
                `SELECT revoked_at, revoked_by, revocation_reason
                 FROM user_permission_overrides WHERE user_id = ?`,
                [targetId]
              );
              assert.ok(override.revoked_at);
              assert.equal(Number(override.revoked_by), actorId);
              assert.match(String(override.revocation_reason), /secure offboarding|offboarded/i);

              const [sessions] = await connection.query(
                `SELECT revoked_at, revocation_reason
                 FROM auth_sessions WHERE user_id = ? ORDER BY id`,
                [targetId]
              );
              assert.equal(sessions.length, 2);
              assert.ok(sessions.every((row) => row.revoked_at));
              assert.ok(
                sessions.every(
                  (row) => row.revocation_reason === "account_securely_offboarded"
                )
              );

              const [[sale]] = await connection.query(
                `SELECT staff_id, approved_by, total_amount FROM sales WHERE id = ?`,
                [saleId]
              );
              assert.equal(Number(sale.staff_id), targetId);
              assert.equal(Number(sale.approved_by), targetId);
              assert.equal(Number(sale.total_amount), 1250);

              const [[activity]] = await connection.query(
                `SELECT user_id, action FROM activity_log WHERE user_id = ?`,
                [targetId]
              );
              assert.equal(Number(activity.user_id), targetId);
              assert.equal(activity.action, "HISTORICAL_LOGIN");

              assert.equal(result.revocation_summary.identity_preserved, true);
              assert.equal(
                result.revocation_summary.historical_references_preserved,
                true
              );
              assert.equal(result.revocation_summary.sessions_revoked, 2);

              const evidence = {
                status: "passed",
                user_id: targetId,
                identity_preserved: true,
                historical_sale_staff_id: Number(sale.staff_id),
                historical_sale_approved_by: Number(sale.approved_by),
                activity_user_id: Number(activity.user_id),
                token_version_before: 4,
                token_version_after: Number(user.token_version),
                sessions_revoked: result.revocation_summary.sessions_revoked,
                access_rows_revoked:
                  result.revocation_summary.access_rows_revoked,
                permission_overrides_revoked:
                  result.revocation_summary.permission_overrides_revoked,
              };
              fs.writeFileSync(
                "../post-phase1-user-identity-runtime-evidence.json",
                `${JSON.stringify(evidence, null, 2)}\n`
              );
              console.log("USER IDENTITY PRESERVATION ACCEPTANCE PASSED");
              console.log(JSON.stringify(evidence, null, 2));
            } finally {
              connection.release();
              await pool.end();
            }
          }

          run().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Package exact verified source and evidence
        run: |
          set -euo pipefail
          git diff --check
          git diff --binary -- \
            backend/routes/userRoutes.js \
            backend/services/userIdentityPreservationService.js \
            backend/tests/userIdentityPreservation.test.js \
            frontend/src/pages/UsersSettingsPage.jsx \
            > post-phase1-user-identity-fix.patch
          sha256sum \
            backend/routes/userRoutes.js \
            backend/services/userIdentityPreservationService.js \
            backend/tests/userIdentityPreservation.test.js \
            frontend/src/pages/UsersSettingsPage.jsx \
            post-phase1-user-identity-fix.patch \
            post-phase1-user-identity-runtime-evidence.json \
            > post-phase1-user-identity-fix.sha256

      - name: Upload verified user-identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: post-phase1-user-identity-fix-files
          path: |
            backend/routes/userRoutes.js
            backend/services/userIdentityPreservationService.js
            backend/tests/userIdentityPreservation.test.js
            frontend/src/pages/UsersSettingsPage.jsx
            post-phase1-user-identity-fix.patch
            post-phase1-user-identity-fix.sha256
            post-phase1-user-identity-runtime-evidence.json
            post-phase1-user-identity-runtime.log
            post-phase1-user-identity-backend-tests.log
            post-phase1-user-identity-frontend-tests.log
            post-phase1-user-identity-frontend-lint.log
            post-phase1-user-identity-frontend-build.log
          if-no-files-found: error
          retention-days: 14

      - name: Commit verified product files and restore permanent CI
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/post-phase1-full-system-audit'
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/chalin03-verification.yml
          git rm .github/scripts/generate_post_phase1_user_identity_fix.py

          git config user.name "chalin03-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            .github/workflows/chalin03-verification.yml \
            backend/routes/userRoutes.js \
            backend/services/userIdentityPreservationService.js \
            backend/tests/userIdentityPreservation.test.js \
            frontend/src/pages/UsersSettingsPage.jsx
          git commit -m "Preserve historical user identity during offboarding"
          git push origin HEAD:agent/post-phase1-full-system-audit
