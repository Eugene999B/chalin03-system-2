name: Chalin 03 Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: chalin03-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BEGIN TEMPORARY WORKER ID FINALIZER
  finalize-worker-id:
    name: Finalize worker identity review
    if: github.actor != 'github-actions[bot]' && (github.ref_name == 'agent/release-3f-d2-worker-id-card' || github.head_ref == 'agent/release-3f-d2-worker-id-card')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out worker ID branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-3f-d2-worker-id-card
          fetch-depth: 0

      - name: Apply final review fixes
        run: |
          set -o pipefail
          python .github/scripts/finalize_worker_id_upgrade.py 2>&1 | tee worker-id-finalizer.log

      - name: Preserve finalizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-id-finalizer-log
          path: worker-id-finalizer.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Commit finalized worker identity package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden worker identity generation and card settings"
          git push origin HEAD:agent/release-3f-d2-worker-id-card
  # END TEMPORARY WORKER ID FINALIZER

  backend:
    name: Backend syntax and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: npm run syntax-check

      - name: Run backend tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee backend-test.log

      - name: Preserve backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend/backend-test.log
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend source tests
        run: npm test

      - name: Lint Release 3F-D frontend files
        run: |
          npx eslint \
            src/pages/BackupPage.jsx \
            src/pages/SystemOperationsPage.jsx

      - name: Build production frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend-build.log

      - name: Record legacy full-project lint backlog
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee frontend-lint.log

      - name: Preserve frontend verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-logs
          path: |
            frontend/frontend-lint.log
            frontend/frontend-build.log
          if-no-files-found: ignore
          retention-days: 7
