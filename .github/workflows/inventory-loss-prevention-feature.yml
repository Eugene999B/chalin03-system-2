name: Inventory Loss Prevention Feature Verification

on:
  push:
    branches:
      - feature/inventory-loss-prevention-traceability

permissions:
  contents: write

concurrency:
  group: inventory-loss-prevention-feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-serialized-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-loss-prevention-traceability
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Apply atomic serialized-sale integration
        run: python .github/traceability-sale-integration/patch.py
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend syntax and regression
        working-directory: backend
        run: |
          npm run syntax-check
          npm test
          npm run migration-safety
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend regression lint and build
        working-directory: frontend
        run: |
          npm test
          npm run lint
          npm run build
      - name: Publish verified sale integration
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire atomic serialized unit checkout"
          git push origin HEAD:feature/inventory-loss-prevention-traceability
