name: Temporary Gitleaks Diagnostic
on:
  push:
    branches: ["agent/fix-finance-runtime-contract"]
jobs:
  gitleaks-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks with redacted JSON report
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . --report-format json --report-path /repo/gitleaks-report.json --redact --exit-code 0 --log-level info
          status=$?
          test -f gitleaks-report.json
          cat gitleaks-report.json
          exit 0
      - name: Upload redacted report
        uses: actions/upload-artifact@v4
        with:
          name: tmp-gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: error
