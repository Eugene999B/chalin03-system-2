name: Finalize Critical Request Validation V2

on:
  push:
    branches:
      - agent/critical-request-validation
    paths:
      - .github/workflows/finalize-critical-request-validation-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    name: Integrate and test critical validators
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/critical-request-validation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Integrate validators into critical routes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()

          debt_path = root / "backend/routes/debtRoutes.js"
          debt = debt_path.read_text(encoding="utf-8")

          import_anchor = 'const { markClosingStale } = require("../services/dailyClosingSecurityService");\n'
          import_block = import_anchor + 'const { validateRequest } = require("../middleware/requestValidationMiddleware");\nconst { validateDebtPaymentRequest } = require("../validation/requestValidators");\n'
          if 'validateDebtPaymentRequest' not in debt:
              if import_anchor not in debt:
                  raise SystemExit("Debt import anchor not found")
              debt = debt.replace(import_anchor, import_block, 1)

          old_signature = 'router.post("/:id/payments", requireAuth, async (req, res) => {'
          new_signature = '''router.post(
            "/:id/payments",
            requireAuth,
            validateRequest(validateDebtPaymentRequest),
            async (req, res) => {'''
          if old_signature not in debt:
              raise SystemExit("Debt route signature not found")
          debt = debt.replace(old_signature, new_signature, 1)

          debt = debt.replace(
              '    const { id } = req.params;\n    const { amount, payment_method, notes } = req.body;\n\n    const paymentAmount = toPositiveMoney(amount);\n    const cleanMethod = cleanPaymentMethod(payment_method);\n    const cleanNotes = cleanText(notes);\n\n    if (paymentAmount === null) {\n      return res.status(400).json({\n        status: "error",\n        message: "Payment amount must be greater than zero.",\n      });\n    }\n',
              '    const { id } = req.validated.params;\n    const {\n      amount: paymentAmount,\n      payment_method: cleanMethod,\n      notes: cleanNotes,\n    } = req.validated.body;\n',
              1,
          )

          if 'const { id } = req.validated.params;' not in debt:
              raise SystemExit("Debt validated body integration failed")

          debt_path.write_text(debt, encoding="utf-8")

          backup_path = root / "backend/routes/backupRoutes.js"
          backup = backup_path.read_text(encoding="utf-8")

          backup_import_anchor = 'const { isOriginalSystemAdministrator } = require("../security/systemAdminIdentity");\n'
          backup_import_block = backup_import_anchor + 'const { validateRequest } = require("../middleware/requestValidationMiddleware");\nconst {\n  validateBackupDryRunRequest,\n  validateBackupRestoreRequest,\n} = require("../validation/requestValidators");\n'
          if 'validateBackupRestoreRequest' not in backup:
              if backup_import_anchor not in backup:
                  raise SystemExit("Backup import anchor not found")
              backup = backup.replace(backup_import_anchor, backup_import_block, 1)

          dry_anchor = '''  requireAuth,
            requireOriginalSystemAdministrator,
            async (req, res) => {'''
          dry_replacement = '''  requireAuth,
            requireOriginalSystemAdministrator,
            validateRequest(validateBackupDryRunRequest),
            async (req, res) => {'''
          if dry_anchor not in backup:
              raise SystemExit("Backup dry-run route anchor not found")
          backup = backup.replace(dry_anchor, dry_replacement, 1)
          backup = backup.replace(
              '      const backup = req.body?.backup || req.body;\n',
              '      const backup = req.validated.backup;\n',
              1,
          )

          restore_signature = 'router.post("/restore", requireAuth, requireOriginalSystemAdministrator, async (req, res) => {'
          restore_replacement = '''router.post(
            "/restore",
            requireAuth,
            requireOriginalSystemAdministrator,
            validateRequest(validateBackupRestoreRequest),
            async (req, res) => {'''
          if restore_signature not in backup:
              raise SystemExit("Backup restore route signature not found")
          backup = backup.replace(restore_signature, restore_replacement, 1)

          restore_body = '    const branchId = getBranchId(req);\n    const payload = req.body;\n    const confirmation = payload?.confirmation || payload?.restore_confirmation;\n    const backup = payload?.backup || payload;\n'
          restore_body_replacement = '    const branchId = getBranchId(req);\n    const { backup, confirmation } = req.validated;\n'
          if restore_body not in backup:
              raise SystemExit("Backup restore body anchor not found")
          backup = backup.replace(restore_body, restore_body_replacement, 1)

          if 'validateRequest(validateBackupRestoreRequest)' not in backup:
              raise SystemExit("Backup validator integration failed")

          backup_path.write_text(backup, encoding="utf-8")
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run focused validation verification
        working-directory: backend
        run: |
          node --check middleware/requestValidationMiddleware.js
          node --check validation/requestValidators.js
          node --check routes/debtRoutes.js
          node --check routes/backupRoutes.js
          node --test tests/requestValidation.test.js

      - name: Run complete backend verification
        working-directory: backend
        run: npm run syntax-check && npm test

      - name: Commit verified route integration
        shell: bash
        run: |
          rm -f .github/workflows/finalize-critical-request-validation.yml
          rm -f .github/workflows/finalize-critical-request-validation-v2.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate critical request validation"
          git push origin HEAD:agent/critical-request-validation
