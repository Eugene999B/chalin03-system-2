name: Phase 1 Runtime Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase1-runtime-finance-hardening
    paths:
      - "backend/routes/expenseReversalRoutes.js"
      - "backend/middleware/sparePartsBranchContextMiddleware.js"
      - "backend/services/dailyClosingSecurityService.js"
      - "backend/services/independentApproverService.js"
      - "backend/tests/phase1RuntimeAcceptance.js"
      - "database/schema.sql"
      - "database/migrations/20260718_release3fc3_mobile_id_expense_funding.sql"
      - "database/migrations/20260725_phase1_financial_control_hardening.sql"
      - "database/migrations/20260725_phase1_financial_control_hardening_verify.sql"
      - ".github/workflows/phase1-runtime-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: phase1-runtime-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-acceptance:
    name: Disposable MySQL transaction and store-boundary acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: chalin03_ci_root
          MYSQL_DATABASE: chalin03_phase1_acceptance
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pchalin03_ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for disposable MySQL
        env:
          MYSQL_PWD: chalin03_ci_root
        run: |
          for attempt in {1..30}; do
            if mysqladmin --protocol=tcp -h 127.0.0.1 -P 3306 -u root ping --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "Disposable MySQL did not become ready." >&2
          exit 1

      - name: Build disposable database and apply migrations
        env:
          MYSQL_PWD: chalin03_ci_root
        run: |
          set -o pipefail
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root chalin03_phase1_acceptance < database/schema.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root chalin03_phase1_acceptance < database/migrations/20260718_release3fc3_mobile_id_expense_funding.sql
          mysql --protocol=tcp -h 127.0.0.1 -P 3306 -u root chalin03_phase1_acceptance < database/migrations/20260725_phase1_financial_control_hardening.sql

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Execute real Phase 1 transaction acceptance
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 5051
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: chalin03_ci_root
          DB_NAME: chalin03_phase1_acceptance
          DB_SSL: "false"
          JWT_SECRET: phase1_runtime_acceptance_only_not_a_production_secret_1234567890
          SMS_ENABLED: "false"
          SMS_PROVIDER: mock
          SYSTEM_ADMIN_USER_ID: 999999
          SYSTEM_ADMIN_USERNAME: no_ci_system_admin
        run: |
          set -o pipefail
          node tests/phase1RuntimeAcceptance.js 2>&1 | tee phase1-runtime-acceptance.log

      - name: Run read-only migration verification after acceptance
        env:
          MYSQL_PWD: chalin03_ci_root
        run: |
          set -o pipefail
          mysql --table --protocol=tcp -h 127.0.0.1 -P 3306 -u root chalin03_phase1_acceptance < database/migrations/20260725_phase1_financial_control_hardening_verify.sql | tee backend/phase1-migration-verify.log
          grep -Eq "invalid_void_rows[[:space:]]*\|[[:space:]]*0" backend/phase1-migration-verify.log
          grep -Eq "invalid_reversal_rows[[:space:]]*\|[[:space:]]*0" backend/phase1-migration-verify.log

      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-runtime-acceptance-evidence
          path: |
            backend/phase1-runtime-acceptance.log
            backend/phase1-runtime-acceptance-evidence.json
            backend/phase1-migration-verify.log
          if-no-files-found: warn
          retention-days: 7
