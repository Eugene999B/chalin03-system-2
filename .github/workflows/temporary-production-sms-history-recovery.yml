name: Temporary production SMS history recovery

on:
  push:
    paths:
      - ".github/workflows/temporary-production-sms-history-recovery.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production

      - name: Verify known-good production baseline
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "402d9141d2a31d1fbb819864004994824f4ef500"

      - name: Apply only the SMS history display fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("frontend/src/pages/EquipmentSalesReportsPage.jsx")
          text = path.read_text()
          changes = [
              (
                  '<tr><th>Created</th><th>Type</th><th>Agreement / Receipt</th><th>Recipient</th><th>Status</th><th>Evidence</th></tr>',
                  '<tr><th>Created</th><th>Type</th><th>Agreement / Receipt</th><th>Recipient</th><th>Status</th><th>Message</th><th>Delivery note</th></tr>',
              ),
              (
                  '<td>{row.last_error || row.message_preview}</td>',
                  '<td>{row.message_preview || "Message not available"}</td>\n                      <td>{row.last_error || "—"}</td>',
              ),
              (
                  '<tr><td colSpan="6">No Finance SMS evidence yet.</td></tr>',
                  '<tr><td colSpan="7">No Finance SMS evidence yet.</td></tr>',
              ),
          ]
          for old, new in changes:
              if old not in text:
                  raise SystemExit(f"Expected source text not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify narrow change only
        shell: bash
        run: |
          git diff -- frontend/src/pages/EquipmentSalesReportsPage.jsx
          test "$(git diff --numstat -- frontend/src/pages/EquipmentSalesReportsPage.jsx | awk '{print $1":"$2}')" = "4:3"
          git diff --check

      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/temporary-production-sms-history-recovery.yml

      - name: Commit exact narrow fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/EquipmentSalesReportsPage.jsx .github/workflows/temporary-production-sms-history-recovery.yml
          git commit -m "fix(finance): preserve original production UI and show SMS message"
          git push origin HEAD:production
