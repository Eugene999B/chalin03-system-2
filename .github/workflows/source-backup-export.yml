name: Chalin 03 Source Backup Export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    name: Export verified production source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out production base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Create sanitized source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          EXPORT_DIR="Chalin03_Source_2026-07-19_${SHORT_SHA}"
          ZIP_NAME="${EXPORT_DIR}.zip"

          mkdir -p "$EXPORT_DIR"
          git archive HEAD | tar -x -C "$EXPORT_DIR"

          find "$EXPORT_DIR" -type d \( -name node_modules -o -name dist -o -name .git \) -prune -exec rm -rf {} +
          find "$EXPORT_DIR" -type f \( -name '.env' -o -name '.env.*' \) ! -name '.env.example' -delete

          cat > "$EXPORT_DIR/SOURCE_BACKUP_MANIFEST.txt" <<EOF
          Chalin 03 Company Limited Production Source Backup
          Repository: Eugene999B/chalin03-system-2
          Production commit: $(git rev-parse HEAD)
          Export date: 2026-07-19
          Contents: tracked frontend, backend, database, workflows, tests, package files and documentation.
          Excluded: live environment files, secrets, node_modules, build output, logs and production database records.
          Restore rule: inspect and test in an isolated environment before any deployment. Never import an old database over production.
          EOF

          zip -r "$ZIP_NAME" "$EXPORT_DIR" >/dev/null
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"

          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload source backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: chalin03-production-source-backup
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.ZIP_NAME }}.sha256
          if-no-files-found: error
          retention-days: 7
