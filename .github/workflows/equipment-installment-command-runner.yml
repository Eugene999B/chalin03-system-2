name: Temporary Equipment Installment Command Runner

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/equipment-installment-command-centre'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply guarded installment command package
        run: |
          test -f scripts/apply_equipment_installment_command.py
          python3 scripts/apply_equipment_installment_command.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Commit verified generated source
        run: |
          if git diff --quiet; then
            echo "Installment command package already applied."
            exit 0
          fi

          git config user.name "Chalin 03 Verification Bot"
          git config user.email "actions@users.noreply.github.com"
          git add backend frontend docs
          git commit -m "feat: add equipment installment command centre"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
