name: Finance dependency lockfile patch
on:
  push:
    branches: [fix/finance-hire-roster-accounts-20261027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Regenerate backend lockfile with patched transitive body-parser
        working-directory: backend
        run: |
          npm pkg set overrides.body-parser=1.20.9
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --ignore-scripts --no-audit
          npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: finance-patched-backend-dependencies
          path: |
            backend/package.json
            backend/package-lock.json
          if-no-files-found: error
