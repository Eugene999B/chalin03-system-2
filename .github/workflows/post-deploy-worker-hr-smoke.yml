name: Post-deploy Worker HR Smoke Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Verify live API, schema and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for healthy API and database readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            health_code=$(curl -sS -o health.json -w '%{http_code}' https://api.chalin03.com/api/health || true)
            readiness_code=$(curl -sS -o readiness.json -w '%{http_code}' https://api.chalin03.com/api/readiness || true)
            echo "Attempt ${attempt}: health=${health_code}, readiness=${readiness_code}"
            cat health.json 2>/dev/null || true
            echo
            cat readiness.json 2>/dev/null || true
            echo
            if [ "$health_code" = "200" ] && [ "$readiness_code" = "200" ]; then
              node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("health.json","utf8")); const r=JSON.parse(fs.readFileSync("readiness.json","utf8")); if(h.status!=="success" || r.status!=="success" || r.ready!==true) process.exit(1);'
              exit 0
            fi
            sleep 10
          done
          echo "API did not become ready in time."
          exit 1

      - name: Verify protected Worker HR route is registered
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o hr-route.json -w '%{http_code}' https://api.chalin03.com/api/release2-final/workers-expanded/1/hr-letter-options || true)
          cat hr-route.json || true
          echo
          echo "Worker HR route returned HTTP ${code}"
          case "$code" in
            401|403) exit 0 ;;
            *) echo "Expected authentication protection, not ${code}."; exit 1 ;;
          esac

      - name: Verify Cloudflare frontend contains Worker HR release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            curl -fsS -H 'Cache-Control: no-cache' "https://chalin03.com/?worker-hr-smoke=${attempt}" -o index.html || true
            asset=$(grep -oE '/assets/index-[^" ]+\.js' index.html | head -n 1 || true)
            echo "Attempt ${attempt}: asset=${asset:-missing}"
            if [ -n "$asset" ]; then
              curl -fsS -H 'Cache-Control: no-cache' "https://chalin03.com${asset}" -o app.js || true
              if grep -Fq 'Letters & HR Correspondence' app.js && grep -Fq 'Save Draft Letter' app.js; then
                echo "Worker HR frontend bundle is live."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Worker HR frontend bundle did not become visible in time."
          exit 1
