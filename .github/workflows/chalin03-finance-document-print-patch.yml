name: Apply Chalin 03 Finance Document Print Fix

on:
  push:
    branches:
      - production

permissions:
  contents: write

jobs:
  patch-production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: production

      - name: Patch document issue actions
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx")
          text = path.read_text(encoding="utf-8")
          print_block = '''        {definition.formats.includes("print") ? (\n          <button type="button" disabled={!canManage || !availability.available || Boolean(working)} onClick={() => onIssue(definition.code, "print")}>\n            {working === `${definition.code}:print` ? "Preparing…" : "Print"}\n          </button>\n        ) : null}\n'''

          if 'onIssue(definition.code, "print")' not in text:
              pattern = r'(        \{definition\.formats\.includes\("thermal"\) \? \([\s\S]*?        \) : null\}\n)'
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit("Could not locate the thermal document action block; refusing to modify production.")
              text = text[:match.end()] + print_block + text[match.end():]
          else:
              print("Print action already present; no duplicate inserted.")

          if text.count('onIssue(definition.code, "print")') != 1:
              raise SystemExit("Print action count is not exactly one; refusing to commit.")
          path.write_text(text, encoding="utf-8")
      - name: Verify patch landed exactly once
        run: |
          test "$(grep -c 'definition.formats.includes(\"print\")' frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx)" -eq 1
          test "$(grep -c 'onIssue(definition.code, \"print\")' frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx)" -eq 1

      - name: Remove temporary workflow and commit fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chalin03-finance-document-print-patch.yml
          git add frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx .github/workflows/chalin03-finance-document-print-patch.yml
          git commit -m "fix: restore printable Chalin 03 finance documents"
          git push origin HEAD:production
