name: Frontend Router v8 Migration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/src/**
      - frontend/scripts/**
      - .github/workflows/frontend-router-v8-migration.yml
  push:
    branches:
      - agent/phase-0-production-safety
    paths:
      - .github/workflows/frontend-router-v8-migration.yml

permissions:
  contents: write

jobs:
  migrate-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-production-safety
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply the reviewed React Router and lint migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('frontend')
          changed = []
          for path in (root / 'src').rglob('*'):
              if path.suffix not in {'.js', '.jsx', '.mjs', '.ts', '.tsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('"react-router-dom"', '"react-router"')
              updated = updated.replace("'react-router-dom'", "'react-router'")
              updated = updated.replace(
                  '    let preservedNewerSession = false;',
                  '    let preservedNewerSession;'
              )
              updated = updated.replace(
                  '    user: activeUser,\n    workspaceCode: activeWorkspaceCode,',
                  '    workspaceCode: activeWorkspaceCode,'
              ) if path.name == 'LoginPageGroupOperations.jsx' else updated
              updated = updated.replace(
                  '  const passwordNameRef = useRef(\n'
                  '    `chalin03-entry-${Date.now()}-${Math.random().toString(36).slice(2)}`\n'
                  '  );',
                  '  const [passwordFieldName] = useState(\n'
                  '    () => `chalin03-entry-${Date.now()}-${Math.random().toString(36).slice(2)}`\n'
                  '  );'
              )
              updated = updated.replace(
                  'name={passwordNameRef.current}',
                  'name={passwordFieldName}'
              )
              updated = updated.replace(
                  '  } catch {\n    body = {};\n  }',
                  '  } catch {\n    // Keep the default empty response body.\n  }'
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          dependencies = package.setdefault('dependencies', {})
          dependencies.pop('react-router-dom', None)
          dependencies['react-router'] = '8.3.0'
          dependencies['react'] = '^19.2.7'
          dependencies['react-dom'] = '^19.2.7'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          print(f'Updated {len(changed)} frontend source files.')
          for name in changed:
              print(name)
          PY
      - name: Install and generate the exact dependency lock
        working-directory: frontend
        run: npm install --ignore-scripts
      - name: Verify the resolved router and production audit
        working-directory: frontend
        run: |
          npm ls react-router | tee router-v8-tree.log
          npm audit --omit=dev --audit-level=high | tee router-v8-audit.log
      - id: source_tests
        name: Run frontend source and permission tests
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm test 2>&1 | tee router-v8-test.log
      - id: lint_check
        name: Enforce frontend lint
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee router-v8-lint.log
      - id: build_check
        name: Build the production frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee router-v8-build.log
      - name: Preserve migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-router-v8-visible-evidence
          path: |
            frontend/package.json
            frontend/package-lock.json
            frontend/src
            frontend/router-v8-*.log
          if-no-files-found: error
          retention-days: 3
      - name: Commit the verified migration
        if: steps.source_tests.conclusion == 'success' && steps.lint_check.conclusion == 'success' && steps.build_check.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json frontend/src
          if git diff --cached --quiet; then
            echo 'No React Router migration changes remain to commit.'
            exit 0
          fi
          git commit -m 'Migrate frontend to patched React Router 8.3.0'
          git push origin HEAD:agent/phase-0-production-safety
      - name: Enforce all migration checks
        if: always()
        shell: bash
        env:
          TEST_RESULT: ${{ steps.source_tests.conclusion }}
          LINT_RESULT: ${{ steps.lint_check.conclusion }}
          BUILD_RESULT: ${{ steps.build_check.conclusion }}
        run: |
          set -euo pipefail
          printf 'test=%s lint=%s build=%s\n' "$TEST_RESULT" "$LINT_RESULT" "$BUILD_RESULT"
          [ "$TEST_RESULT" = "success" ]
          [ "$LINT_RESULT" = "success" ]
          [ "$BUILD_RESULT" = "success" ]
