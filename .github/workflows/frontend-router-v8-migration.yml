name: Frontend Router v8 Migration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/src/**
      - .github/workflows/frontend-router-v8-migration.yml
  push:
    branches:
      - agent/phase-0-production-safety
    paths:
      - .github/workflows/frontend-router-v8-migration.yml

permissions:
  contents: read

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Replace the removed react-router-dom package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('frontend')
          changed = []
          for path in (root / 'src').rglob('*'):
              if path.suffix not in {'.js', '.jsx', '.mjs', '.ts', '.tsx'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('"react-router-dom"', '"react-router"')
              updated = updated.replace("'react-router-dom'", "'react-router'")
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          dependencies = package.setdefault('dependencies', {})
          dependencies.pop('react-router-dom', None)
          dependencies['react-router'] = '8.3.0'
          dependencies['react'] = '^19.2.7'
          dependencies['react-dom'] = '^19.2.7'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          print(f'Updated {len(changed)} frontend source files.')
          for name in changed:
              print(name)
          PY
      - name: Install and generate the exact dependency lock
        working-directory: frontend
        run: npm install --ignore-scripts
      - name: Verify the resolved router and production audit
        working-directory: frontend
        run: |
          npm ls react-router | tee router-v8-tree.log
          npm audit --omit=dev --audit-level=high | tee router-v8-audit.log
      - id: source_tests
        name: Run frontend source and permission tests
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm test 2>&1 | tee router-v8-test.log
      - id: lint
        name: Enforce frontend lint
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee router-v8-lint.log
      - id: build
        name: Build the production frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm run build 2>&1 | tee router-v8-build.log
      - name: Preserve the migration and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-verified-router-v8-migration
          path: |
            frontend/package.json
            frontend/package-lock.json
            frontend/src
            frontend/router-v8-*.log
          if-no-files-found: error
          retention-days: 3
      - name: Enforce all migration checks
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.source_tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          test "$TEST_OUTCOME" = "success"
          test "$LINT_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
