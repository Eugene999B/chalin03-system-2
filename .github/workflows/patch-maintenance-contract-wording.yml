name: Patch Maintenance Reset Contract Wording

on:
  push:
    branches:
      - agent/post-phase1-full-system-audit
    paths:
      - ".github/workflows/patch-maintenance-contract-wording.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-phase1-full-system-audit
          fetch-depth: 0
      - name: Remove SQL keywords from explanatory response text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/generate_post_phase1_maintenance_reset_fix.py')
          source = path.read_text()
          old = '          "Only transactional DELETE statements were used. No TRUNCATE, ALTER TABLE or AUTO_INCREMENT reset was executed.",'
          new = '          "Only transaction-compatible DELETE statements were used. No implicit-commit schema operation or sequence reset was executed.",'
          if source.count(old) != 1:
              raise SystemExit(f'Expected one response-note line, found {source.count(old)}.')
          path.write_text(source.replace(old, new, 1))
          PY
          python3 -m py_compile .github/scripts/generate_post_phase1_maintenance_reset_fix.py
          git config user.name "chalin03-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scripts/generate_post_phase1_maintenance_reset_fix.py
          git rm -f .github/workflows/maintenance-focused-diagnostic.yml
          git rm -f .github/workflows/patch-maintenance-contract-wording.yml
          git commit -m "Keep maintenance SQL contract focused on executable code"
          git push origin HEAD:agent/post-phase1-full-system-audit
