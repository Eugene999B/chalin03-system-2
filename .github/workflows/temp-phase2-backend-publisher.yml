name: Temporary Phase 2 Backend Publisher

on:
  pull_request:
    branches:
      - feature/equipment-finance-phase1-integrity-verification-20260807

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payroll-financial-foundation-phase2-20260810
          fetch-depth: 0
      - name: Publish tested backend and database foundation
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/phase2-backend.patch
          git apply --check /tmp/phase2-backend.patch
          git apply /tmp/phase2-backend.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend database
          git commit -m "Build payroll financial foundation"
          git push origin HEAD:feature/payroll-financial-foundation-phase2-20260810
