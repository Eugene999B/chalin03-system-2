name: Temporary Phase 2 Backend Publisher

on:
  pull_request:
    branches:
      - feature/equipment-finance-phase1-integrity-verification-20260807

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payroll-financial-foundation-phase2-20260810
          fetch-depth: 0
      - name: Verify and publish tested backend foundation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '52d9db7bca058d785df6a4c1b724542eeb0eeebb51d147953ecff844fd72b786' '.phase2-publisher/part00' | sha256sum -c -
          printf '%s  %s\n' 'e4d3aca76b539a4948ce21b7bdf2b19f79dc1d243590403fee3a1e72355607c8' '.phase2-publisher/part01' | sha256sum -c -
          printf '%s  %s\n' '1761101badf4531fcdb0316d7b3c47e2cabaa456f9dcfc42d4b05914d825db83' '.phase2-publisher/part02' | sha256sum -c -
          printf '%s  %s\n' 'cabfa2180b5910fa067a9c61a3aa27053c06d7b5a3f9667931a92ef8af801dfa' '.phase2-publisher/part03' | sha256sum -c -
          printf '%s  %s\n' 'e154db99f0e24700a1806bf6b036a3bc2b5247f5e46f2d7ddb9347c01a771684' '.phase2-publisher/part04' | sha256sum -c -
          cat .phase2-publisher/part00 .phase2-publisher/part01 .phase2-publisher/part02 .phase2-publisher/part03 .phase2-publisher/part04 > /tmp/phase2-backend.patch.gz.b64
          printf '%s  %s\n' '8c830f1328c075baf12fe36711f2dcadaa8f2fac0b95da4a497cfc07ff32851f' '/tmp/phase2-backend.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/phase2-backend.patch.gz.b64 | gzip -d > /tmp/phase2-backend.patch
          printf '%s  %s\n' 'b1d7015e723287393b1e141b2079ba73414e0d9b4983517206c23393b0850e28' '/tmp/phase2-backend.patch' | sha256sum -c -
          git apply --check /tmp/phase2-backend.patch
          git apply /tmp/phase2-backend.patch
          git rm .phase2-publisher/part00 .phase2-publisher/part01 .phase2-publisher/part02 .phase2-publisher/part03 .phase2-publisher/part04
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend database
          git commit -m 'Build payroll financial foundation'
          git push origin HEAD:feature/payroll-financial-foundation-phase2-20260810
