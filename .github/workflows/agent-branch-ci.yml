name: Agent Branch CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/**'

permissions:
  contents: write

jobs:
  normalize-fixer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Normalize and restore
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('frontend/src/styles/equipmentFinancePhaseOne.css')
          text = path.read_text()
          path.write_text(re.sub(r'@media \(max-width:(\d+)px\)', r'@media (max-width: \1px)', text))
          PY
          git fetch origin production --depth=1
          git checkout origin/production -- .github/workflows/agent-branch-ci.yml .github/workflows/equipment-finance-phase6-browser.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/styles/equipmentFinancePhaseOne.css .github/workflows/agent-branch-ci.yml .github/workflows/equipment-finance-phase6-browser.yml
          git commit -m "fix: preserve Finance CSS contract formatting"
          git push origin HEAD:${GITHUB_REF_NAME}
