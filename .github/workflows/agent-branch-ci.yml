name: Agent Branch CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/**'

permissions:
  contents: read

concurrency:
  group: agent-branch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax, migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run syntax-check
      - working-directory: backend
        run: npm run migration-safety -- --base origin/production
      - working-directory: backend
        run: npm test

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run build

  dependencies:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  full-history-secret-scan:
    name: Gitleaks complete Git history
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete history with reviewed fingerprints
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . \
            --redact \
            --exit-code 1 \
            --log-level error

  codeql:
    name: CodeQL JavaScript security-extended analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - id: analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: codeql-results
      - name: Enforce reviewed SARIF policy
        run: node backend/scripts/verifyVersionThreeCodeqlSarif.js codeql-results/javascript.sarif
