name: Agent Branch CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/**'

permissions:
  contents: write

concurrency:
  group: agent-branch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend syntax, migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npm run syntax-check
      - working-directory: backend
        run: npm run migration-safety
      - working-directory: backend
        run: npm test

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Normalize Finance CSS contract formatting and restore workflow files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          css = Path('frontend/src/styles/equipmentFinancePhaseOne.css')
          text = css.read_text()
          normalized = re.sub(r'@media \(max-width:(\d+)px\)', r'@media (max-width: \1px)', text)
