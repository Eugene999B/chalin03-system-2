name: Apply Version 3 API Security Hardening

on:
  push:
    branches:
      - agent/version-3-final-audit
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]' && (github.ref == 'refs/heads/agent/version-3-final-audit' || github.head_ref == 'agent/version-3-final-audit')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/version-3-final-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Apply guarded API hardening
        shell: python
        run: |
          from pathlib import Path

          def replace(path_name, old, new):
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one match in {path_name}: {old[:120]}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "backend/server.js",
              'const cors = require("cors");\n',
              'const cors = require("cors");\nconst rateLimit = require("express-rate-limit");\n',
          )

          replace(
              "backend/server.js",
              '''const allowedOrigins = [
  "http://localhost:5173",
  "http://localhost:3000",
  "https://chalin03.com",
  "https://www.chalin03.com",
  process.env.FRONTEND_URL,
  process.env.FRONTEND_URL_ALT,
]
  .filter(Boolean)
  .map((origin) => String(origin).trim())
  .filter((origin, index, array) => array.indexOf(origin) === index);

app.use(requestContext);''',
              '''const allowedOrigins = [
  "http://localhost:5173",
  "http://localhost:3000",
  "https://chalin03.com",
  "https://www.chalin03.com",
  process.env.FRONTEND_URL,
  process.env.FRONTEND_URL_ALT,
]
  .filter(Boolean)
  .map((origin) => String(origin).trim())
  .filter((origin, index, array) => array.indexOf(origin) === index);

const generalApiLimiter = rateLimit({
  windowMs:
    Math.max(1, Number(process.env.API_RATE_LIMIT_WINDOW_MINUTES) || 15) *
    60 *
    1000,
  max: Math.max(100, Number(process.env.API_RATE_LIMIT_MAX) || 1500),
  standardHeaders: true,
  legacyHeaders: false,
  skip: (req) => req.path === "/health",
  message: {
    status: "error",
    code: "API_RATE_LIMITED",
    message: "Too many API requests. Please wait briefly and try again.",
  },
});

app.use(requestContext);''',
          )

          replace(
              "backend/server.js",
              '''app.use(
  cors({
    origin(origin, callback) {
      if (!origin) {
        return callback(null, true);
      }

      if (allowedOrigins.includes(origin)) {
        return callback(null, true);
      }

      return callback(new Error(`Not allowed by CORS: ${origin}`));
    },
    credentials: true,
  })
);

const bodyLimit = process.env.API_BODY_LIMIT || "10mb";''',
              '''app.use(
  cors({
    origin(origin, callback) {
      if (!origin) {
        return callback(null, true);
      }

      if (allowedOrigins.includes(origin)) {
        return callback(null, true);
      }

      return callback(new Error(`Not allowed by CORS: ${origin}`));
    },
    credentials: true,
  })
);

// A generous global ceiling protects ordinary database and reporting routes
// from denial-of-service abuse. Login and sensitive administration retain
// their tighter dedicated limiters below.
app.use("/api", generalApiLimiter);

const bodyLimit = process.env.API_BODY_LIMIT || "10mb";''',
          )

          replace(
              "backend/middleware/authMiddleware.js",
              '''    req.user = {
      ...decoded,
      primary_workspace_code: state.primary_workspace_code || null,
      category_assignment_status: state.category_assignment_status || null,
      category_conflict_reason: state.category_conflict_reason || null,
      is_original_system_administrator: isOriginalSystemAdministrator({ ...decoded, ...state }),
      token_version: currentTokenVersion,
      session_id: sessionState.session.session_id,
    };''',
              '''    req.user = {
      ...decoded,
      // Security-sensitive identity and permission fields always come from
      // current server-side state after JWT verification, never from stale
      // token claims alone.
      id: state.id,
      username: state.username,
      role: state.role,
      workspace_code: categoryAccess.workspaceCode,
      workspace_role: categoryAccess.workspaceRole || state.role,
      primary_workspace_code: state.primary_workspace_code || null,
      category_assignment_status: state.category_assignment_status || null,
      category_conflict_reason: state.category_conflict_reason || null,
      is_original_system_administrator: isOriginalSystemAdministrator({ ...decoded, ...state }),
      token_version: currentTokenVersion,
      session_id: sessionState.session.session_id,
    };''',
          )

          Path("backend/tests/versionThreeApiHardening.test.js").write_text(
              '''const assert = require("node:assert/strict");
const fs = require("node:fs");
const path = require("node:path");
const test = require("node:test");

const root = path.resolve(__dirname, "..");
const serverSource = fs.readFileSync(path.join(root, "server.js"), "utf8");
const authSource = fs.readFileSync(
  path.join(root, "middleware/authMiddleware.js"),
  "utf8"
);

test("Version Three applies a broad API rate ceiling before route handlers", () => {
  assert.match(serverSource, /require\("express-rate-limit"\)/);
  assert.match(serverSource, /const generalApiLimiter = rateLimit\(/);
  assert.match(serverSource, /app\.use\("\/api", generalApiLimiter\)/);
  assert.match(serverSource, /API_RATE_LIMIT_MAX/);
  assert.match(serverSource, /skip: \(req\) => req\.path === "\/health"/);
});

test("authenticated identity fields are refreshed from server-side state", () => {
  assert.match(authSource, /const decoded = jwt\.verify/);
  assert.match(authSource, /id: state\.id/);
  assert.match(authSource, /username: state\.username/);
  assert.match(authSource, /role: state\.role/);
  assert.match(authSource, /workspace_code: categoryAccess\.workspaceCode/);
  assert.match(
    authSource,
    /workspace_role: categoryAccess\.workspaceRole \|\| state\.role/
  );
});
''',
              encoding="utf-8",
          )

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify backend syntax and full tests
        working-directory: backend
        run: npm run syntax-check && npm test

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js backend/middleware/authMiddleware.js backend/tests/versionThreeApiHardening.test.js
          git commit -m "security: harden API rate limits and authenticated identity state"
          git push origin HEAD:agent/version-3-final-audit
