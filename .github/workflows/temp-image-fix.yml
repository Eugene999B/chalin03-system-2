name: Temporary equipment image presentation fix

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/fleet-assets-zero'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fleet-assets-zero
          fetch-depth: 0
      - name: Import image presentation override
        shell: python
        run: |
          from pathlib import Path
          path = Path('frontend/src/pages/EquipmentCataloguePage.jsx')
          text = path.read_text(encoding='utf-8')
          marker = 'import "../styles/equipmentCatalogue.css";'
          addition = marker + '\nimport "../styles/equipmentCatalogueImageFix.css";'
          if text.count(marker) != 1:
              raise SystemExit(f'expected stylesheet import exactly once, found {text.count(marker)}')
          if 'equipmentCatalogueImageFix.css' in text:
              raise SystemExit('image fix stylesheet is already imported')
          path.write_text(text.replace(marker, addition), encoding='utf-8')
      - name: Validate frontend syntax
        run: |
          node --check frontend/src/pages/EquipmentCataloguePage.jsx
      - name: Remove helper and commit only image fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-image-fix.yml
          git add frontend/src/pages/EquipmentCataloguePage.jsx frontend/src/styles/equipmentCatalogueImageFix.css
          git diff --cached --check
          git commit -m 'fix: show full excavator pictures without cropping'
          git push origin HEAD:fix/fleet-assets-zero
