name: Temporary equipment image presentation fix
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/excavator-photo-display'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/excavator-photo-display
          fetch-depth: 0
      - name: Import image presentation override
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/pages/EquipmentCataloguePage.jsx')
          t = p.read_text(encoding='utf-8')
          marker = 'import "../styles/equipmentCatalogue.css";'
          addition = marker + '\nimport "../styles/equipmentCatalogueImageFix.css";'
          if t.count(marker) != 1 or 'equipmentCatalogueImageFix.css' in t:
              raise SystemExit('unexpected stylesheet import state')
          p.write_text(t.replace(marker, addition), encoding='utf-8')
      - name: Syntax check
        run: node --check frontend/src/pages/EquipmentCataloguePage.jsx
      - name: Remove helper and commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-image-fix.yml
          git add frontend/src/pages/EquipmentCataloguePage.jsx frontend/src/styles/equipmentCatalogueImageFix.css
          git diff --cached --check
          git commit -m 'fix: show full excavator pictures without cropping'
          git push origin HEAD:fix/excavator-photo-display
