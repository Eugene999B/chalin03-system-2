name: Prepare local homepage photography

on:
  push:
    branches:
      - fix/public-homepage-local-optimized-images-20261116
    paths:
      - .github/workflows/prepare-homepage-photos.yml

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch and locally optimize existing licensed photographs
        run: python frontend/scripts/cache_public_homepage_photos.py
      - name: Validate optimized assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          base = Path("frontend/public/images/home/v1")
          names = [
              "hero-desktop.webp", "hero-mobile.webp",
              "excavators.webp", "parts.webp", "hire.webp",
          ]
          for name in names:
              file = base / name
              assert file.exists() and file.stat().st_size > 10_000, f"Missing image: {file}"
              with Image.open(file) as image:
                  assert image.format == "WEBP", f"Invalid image format {file}"
              print(file, file.stat().st_size, "bytes")
          PY
      - name: Commit static image files on development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/images/home/v1/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets(public): serve lightweight homepage photos from Cloudflare Pages"
          git push origin "HEAD:$GITHUB_REF_NAME"
