name: Temporary Serialized Return Integration

on:
  push:
    branches:
      - feature/inventory-loss-prevention-traceability
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: serialized-return-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    if: ${{ github.event_name == 'push' || github.head_ref == 'feature/inventory-loss-prevention-traceability' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-loss-prevention-traceability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply serialized return integration
        run: python .github/serialized-return-integration/patch.py
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Verify backend and migration safety
        working-directory: backend
        run: |
          set -euo pipefail
          npm run syntax-check
          npm test
          git fetch origin main --no-tags
          npm run migration-safety -- --base origin/main --head HEAD --repo-root "$GITHUB_WORKSPACE"
      - name: Publish verified serialized return integration
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/returnRoutes.js backend/routes/operationalApprovalRoutes.js
          git diff --cached --check
          git commit -m "Wire serialized return quarantine and refund approval"
          git push origin HEAD:feature/inventory-loss-prevention-traceability
