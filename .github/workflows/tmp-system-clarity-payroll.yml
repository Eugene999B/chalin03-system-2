name: Temporary System Clarity Payroll Patch

on:
  push:
    branches:
      - feature/system-clarity-payroll-simplification-20260810
    paths:
      - .github/workflows/tmp-system-clarity-payroll.yml
      - .github/tmp-system-clarity/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-system-clarity-payroll.yml
      - .github/tmp-system-clarity/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/system-clarity-payroll-simplification-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply deterministic system-clarity patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/tmp-system-clarity/patch_backend.py
          python .github/tmp-system-clarity/patch_worker_page.py
          python .github/tmp-system-clarity/patch_worker_panel.py
          python .github/tmp-system-clarity/patch_processing_page.py
          python - <<'PY'
          from pathlib import Path

          worker_test = Path("frontend/scripts/payrollWorkerProfilePhaseThreeTests.mjs")
          text = worker_test.read_text()
          old = 'assert.equal(postCalls.length, 4, "worker payroll panel should expose exactly salary create/submit/approve plus payslip issue");'
          new = 'assert.equal(postCalls.length, 5, "worker payroll panel should expose exactly salary create/auto-submit/manual-submit/approve plus payslip issue");'
          if text.count(old) != 1:
              raise SystemExit("salary mutation guard changed unexpectedly")
          worker_test.write_text(text.replace(old, new, 1))

          processing_test = Path("frontend/scripts/payrollProcessingPhaseFourTests.mjs")
          text = processing_test.read_text()
          old = 'assert.match(page, /Correction Approvals/);'
          new = 'assert.match(page, /Corrections/);'
          if text.count(old) != 1:
              raise SystemExit("payroll corrections label guard changed unexpectedly")
          processing_test.write_text(text.replace(old, new, 1))
          PY
          rm -rf .github/tmp-system-clarity
          rm -f .github/workflows/tmp-system-clarity-payroll.yml

      - name: Verify targeted backend contracts
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          npm ci
          node --test tests/payrollWorkerOnboardingSimplification20260810.test.js
          node --check routes/workerProfileExpansionRoutes.js
          node --check services/payrollProcessingService.js

      - name: Verify targeted frontend contracts and build
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          node scripts/payrollWorkerProfilePhaseThreeTests.mjs
          node scripts/payrollProcessingPhaseFourTests.mjs
          npm run lint
          npm run build

      - name: Publish verified feature changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            backend/routes/workerProfileExpansionRoutes.js \
            backend/services/payrollProcessingService.js \
            backend/tests/payrollWorkerOnboardingSimplification20260810.test.js \
            frontend/src/pages/ExpandedWorkerProfilePage.jsx \
            frontend/src/components/WorkerPayrollPanel.jsx \
            frontend/src/styles/workerPayrollPanel.css \
            frontend/src/pages/PayrollProcessingCentrePage.jsx \
            frontend/scripts/payrollWorkerProfilePhaseThreeTests.mjs \
            frontend/scripts/payrollProcessingPhaseFourTests.mjs \
            .github/tmp-system-clarity \
            .github/workflows/tmp-system-clarity-payroll.yml
          git diff --cached --check
          git commit -m "Simplify worker salary onboarding and monthly payroll"
          git push origin HEAD:feature/system-clarity-payroll-simplification-20260810
