name: Apply Version 3 Final Fixes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/version-3-final-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/version-3-final-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Apply guarded release fixes
        run: python tools/apply_version3_final_fixes.py

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify backend syntax
        working-directory: backend
        run: npm run syntax-check 2>&1 | tee ../version3-backend-syntax.log

      - name: Run backend tests
        working-directory: backend
        run: npm test 2>&1 | tee ../version3-backend-tests.log

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend source tests
        working-directory: frontend
        run: npm test 2>&1 | tee ../version3-frontend-tests.log

      - name: Enforce full frontend lint
        working-directory: frontend
        run: npm run lint 2>&1 | tee ../version3-frontend-lint.log

      - name: Build production frontend
        working-directory: frontend
        run: npm run build 2>&1 | tee ../version3-frontend-build.log

      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-3-fixer-verification
          path: version3-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No release fixes were necessary."
            exit 0
          fi
          git commit -m "fix: complete Version Three release audit findings"
          git push origin HEAD:agent/version-3-final-audit
