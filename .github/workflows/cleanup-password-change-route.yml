name: Cleanup Password Change Route

on:
  push:
    branches:
      - agent/fix-password-change-session

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-password-change-session
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cleanup
        run: python .github/scripts/cleanup_password_change_route.py
      - name: Remove temporary applicator
        run: rm .github/scripts/cleanup_password_change_route.py .github/workflows/cleanup-password-change-route.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Clean password change route"
          git push origin HEAD:agent/fix-password-change-session
