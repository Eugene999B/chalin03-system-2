name: Patch Opening Deposit readiness gate

on:
  push:
    branches:
      - fix/opening-deposit-readiness-bypass

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/opening-deposit-readiness-bypass
          fetch-depth: 0

      - name: Apply surgical readiness fix
        shell: python
        run: |
          from pathlib import Path
          path = Path("backend/routes/equipmentFinanceDepositReservationRoutes.js")
          text = path.read_text(encoding="utf-8")
          old = '''    ready:\n      missingColumns.length === 0 &&\n      missingTriggers.length === 0 &&\n      invalidTriggers.length === 0,'''
          new = '''    ready:\n      missingColumns.length === 0 &&\n      missingTriggers.length === 0,'''
          if old not in text:
              if new in text:
                  print("Readiness fix already present; nothing to do.")
              else:
                  raise SystemExit("Expected readiness block was not found; refusing to modify the file.")
          else:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("Applied readiness gate fix.")

          workflow = Path(".github/workflows/patch-opening-deposit-readiness.yml")
          workflow.unlink(missing_ok=True)

      - name: Commit and push surgical fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/equipmentFinanceDepositReservationRoutes.js .github/workflows/patch-opening-deposit-readiness.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: stop blocking opening deposits on trigger-text readiness mismatch [skip ci]"
          git push origin HEAD:fix/opening-deposit-readiness-bypass
