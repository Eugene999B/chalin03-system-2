name: CHALIN ONE one-shot source fix

on:
  push:
    branches:
      - chalin-one

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact public-content source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          public_path = Path('backend/services/publicContentService.js')
          source = public_path.read_text()
          old = '''function safeJson(value, fallback = null) {
            if (value === undefined || value === null || value === "") return fallback;
            if (typeof value === "object") return value;

            try {
              return JSON.parse(value);
            } catch {
              return fallback;
            }
          }'''
          new = '''function safeJson(value, fallback = null) {
            if (value === undefined || value === null || value === "") return fallback;
            if (typeof value === "object") return value;

            try {
              return JSON.parse(value);
            } catch {
              // mysql2 parses JSON columns by default. A JSON scalar string therefore
              // arrives here already decoded, while raw JSON text still parses above.
              return typeof value === "string" ? value : fallback;
            }
          }'''
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one public safeJson implementation')
          public_path.write_text(source.replace(old, new, 1))

          portfolio_path = Path('backend/services/contentStudioPortfolioPublishWorkflow.js')
          source = portfolio_path.read_text()
          old = '    snapshot.publish_at = snapshot.publish_at || new Date();'
          new = '''    // Immediate publication is represented by status + published_at.
              // Keep publish_at NULL unless an explicit non-future timestamp was supplied.
              snapshot.publish_at = snapshot.publish_at || null;'''
          if source.count(old) != 1:
              raise SystemExit('Expected exactly one portfolio immediate publish assignment')
          portfolio_path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit exact source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/services/publicContentService.js backend/services/contentStudioPortfolioPublishWorkflow.js
          git diff --cached --check
          git commit -m "Fix public JSON scalars and portfolio publish timing"
          git push origin HEAD:chalin-one
