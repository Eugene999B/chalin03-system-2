name: Apply Post-Phase-1 Immutability Fix

on:
  workflow_dispatch:
  push:
    branches:
      - agent/post-phase1-full-system-audit
    paths:
      - ".github/workflows/apply-post-phase1-immutability-fix.yml"

permissions:
  contents: write

concurrency:
  group: apply-post-phase1-immutability-fix
  cancel-in-progress: false

jobs:
  apply-fix:
    name: Preserve audit and expense evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/post-phase1-full-system-audit
          fetch-depth: 0

      - name: Apply exact fail-closed source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          backend_path = Path("backend/routes/auditSignoffRoutes.js")
          frontend_path = Path("frontend/src/pages/AuditSignoffHistoryPage.jsx")
          expense_path = Path("backend/routes/expenseRoutes.js")
          test_path = Path("backend/tests/auditSignoffExpenseImmutability.test.js")

          backend = backend_path.read_text(encoding="utf-8")
          frontend = frontend_path.read_text(encoding="utf-8")
          expense = expense_path.read_text(encoding="utf-8")

          old_role_message = "Only admin or auditor can delete audit sign-offs."
          new_role_message = "Only admin or auditor can request protected audit sign-off actions."
          if backend.count(old_role_message) != 1:
              raise SystemExit("Expected audit-signoff role message was not found exactly once.")
          backend = backend.replace(old_role_message, new_role_message, 1)

          delete_route_pattern = re.compile(
              r'router\.delete\("/:id", requireAuth, requireAdmin, async \(req, res\) => \{[\s\S]*?\n\}\);\n\nmodule\.exports = router;',
              re.M,
          )
          immutable_route = '''router.delete("/:id", requireAuth, requireAdmin, async (req, res) => {
  const branchId = getBranchId(req);
  const id = Number(req.params.id);

  if (!Number.isInteger(id) || id <= 0) {
    return res
      .status(400)
      .json({ status: "error", message: "Invalid sign-off ID." });
  }

  await safeLogActivity(
    pool,
    getUserId(req),
    branchId,
    "BLOCK_DELETE_AUDIT_SIGNOFF",
    `Blocked physical deletion request for audit sign-off ID ${id}. Audit sign-offs are permanent compliance evidence and must be corrected through review, unlock and re-approval.`,
    getClientIp(req)
  );

  return res.status(409).json({
    status: "error",
    code: "AUDIT_SIGNOFF_IMMUTABLE",
    message:
      "Audit sign-offs are permanent compliance evidence and cannot be deleted. Create or update the corrected sign-off through the controlled review, unlock and re-approval process.",
  });
});

module.exports = router;'''
          backend, backend_replacements = delete_route_pattern.subn(
              immutable_route, backend, count=1
          )
          if backend_replacements != 1:
              raise SystemExit("Audit-signoff physical DELETE route was not replaced exactly once.")

          delete_function_pattern = re.compile(
              r'\n  async function deleteSignoff\(signoff\) \{[\s\S]*?\n  \}\n\n  return \(',
              re.M,
          )
          frontend, function_replacements = delete_function_pattern.subn(
              "\n  return (", frontend, count=1
          )
          if function_replacements != 1:
              raise SystemExit("Audit archive delete function was not removed exactly once.")

          copy_replacements = {
              "Audit sign-off history, approval certificates, CSV exports and\n             delete actions are filtered to this selected store only.":
                  "Audit sign-off history, approval certificates and CSV exports are\n             filtered to this selected store. Sign-off records are permanent\n             compliance evidence and cannot be deleted.",
              "Each record below can be printed as a certificate, downloaded as a\n               Word file, or deleted by authorized management.":
                  "Each record below can be printed or downloaded and remains permanent\n               compliance evidence. Corrections must use the controlled review, unlock\n               and re-approval process.",
          }
          for old, new in copy_replacements.items():
              if frontend.count(old) != 1:
                  raise SystemExit(f"Expected frontend copy block was not found exactly once: {old[:50]}")
              frontend = frontend.replace(old, new, 1)

          delete_button_pattern = re.compile(
              r'\n\s*<button\n\s*type="button"\n\s*style=\{styles\.deleteButton\}\n\s*onClick=\{\(\) => deleteSignoff\(item\)\}\n\s*>\n\s*Delete\n\s*</button>',
              re.M,
          )
          immutable_badge = '''

                    <span
                      style={{
                        display: "inline-flex",
                        alignItems: "center",
                        borderRadius: "999px",
                        padding: "10px 13px",
                        background: "#ecfdf5",
                        border: "1px solid #86efac",
                        color: "#166534",
                        fontWeight: "900",
                        fontSize: "12px",
                      }}
                    >
                      Permanent evidence
                    </span>'''
          frontend, button_replacements = delete_button_pattern.subn(
              immutable_badge, frontend, count=1
          )
          if button_replacements != 1:
              raise SystemExit("Audit archive Delete button was not replaced exactly once.")

          expense_delete_pattern = re.compile(
              r'\n// DELETE /api/expenses/:id[\s\S]*?\n\);\n\nmodule\.exports = router;',
              re.M,
          )
          expense, expense_replacements = expense_delete_pattern.subn(
              "\n\nmodule.exports = router;", expense, count=1
          )
          if expense_replacements != 1:
              raise SystemExit("Legacy physical expense DELETE route was not removed exactly once.")

          test_source = r'''const assert = require("node:assert/strict");
const fs = require("node:fs");
const path = require("node:path");
const test = require("node:test");

const backendRoot = path.join(__dirname, "..");
const repositoryRoot = path.join(backendRoot, "..");

function read(relativePath) {
  return fs.readFileSync(path.join(repositoryRoot, relativePath), "utf8");
}

test("audit sign-offs remain immutable compliance evidence", () => {
  const routeSource = read("backend/routes/auditSignoffRoutes.js");
  const archiveSource = read("frontend/src/pages/AuditSignoffHistoryPage.jsx");

  assert.doesNotMatch(routeSource, /DELETE\s+FROM\s+audit_signoffs/i);
  assert.match(routeSource, /AUDIT_SIGNOFF_IMMUTABLE/);
  assert.match(routeSource, /BLOCK_DELETE_AUDIT_SIGNOFF/);
  assert.match(routeSource, /permanent compliance evidence/i);

  assert.doesNotMatch(archiveSource, /deleteSignoff/);
  assert.doesNotMatch(
    archiveSource,
    /axiosClient\.delete\(\s*`\/audit-signoffs\//
  );
  assert.doesNotMatch(
    archiveSource,
    /onClick=\{\(\) => deleteSignoff\(item\)\}/
  );
  assert.match(archiveSource, /Permanent evidence/);
  assert.match(archiveSource, /controlled review, unlock/);
});

test("legacy expense deletion cannot bypass the Phase 1 void ledger", () => {
  const expenseRouteSource = read("backend/routes/expenseRoutes.js");
  const reversalRouteSource = read("backend/routes/expenseReversalRoutes.js");

  assert.doesNotMatch(expenseRouteSource, /DELETE\s+FROM\s+expenses/i);
  assert.doesNotMatch(expenseRouteSource, /DELETE_EXPENSE/);
  assert.match(reversalRouteSource, /EXPENSE_VOIDED/);
  assert.match(reversalRouteSource, /is_reversal/);
  assert.match(reversalRouteSource, /reversal_of_expense_id/);
  assert.match(reversalRouteSource, /INDEPENDENT_APPROVER_REQUIRED/);
});
'''

          backend_path.write_text(backend, encoding="utf-8")
          frontend_path.write_text(frontend, encoding="utf-8")
          expense_path.write_text(expense, encoding="utf-8")
          test_path.write_text(test_source, encoding="utf-8")
          PY

      - name: Verify focused source contracts and backend syntax
        run: |
          node --check backend/routes/auditSignoffRoutes.js
          node --check backend/routes/expenseRoutes.js
          node --test backend/tests/auditSignoffExpenseImmutability.test.js

      - name: Install backend dependencies and run complete backend tests
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Install frontend dependencies and build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npx eslint src/pages/AuditSignoffHistoryPage.jsx
          npm run build

      - name: Commit verified corrections to isolated branch
        run: |
          if git diff --quiet; then
            echo "No source changes were produced." >&2
            exit 1
          fi

          git config user.name "chalin03-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            backend/routes/auditSignoffRoutes.js \
            backend/routes/expenseRoutes.js \
            backend/tests/auditSignoffExpenseImmutability.test.js \
            frontend/src/pages/AuditSignoffHistoryPage.jsx
          git commit -m "Preserve audit and expense evidence"
          git fetch origin agent/post-phase1-full-system-audit
          git rebase origin/agent/post-phase1-full-system-audit
          git push origin HEAD:agent/post-phase1-full-system-audit
