name: Chalin 03 surgical debt and excavator fix

on:
  push:
    branches:
      - fix/debt-identity-excavator-media-v2

permissions:
  contents: write

jobs:
  surgical-fix:
    if: ${{ !contains(github.event.head_commit.message, '[chalin03 auto-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply surgical fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}")
              p.write_text(s.replace(old, new))

          # ---------------- Debt identity safety ----------------
          debt = Path("backend/routes/debtRoutes.js")
          s = debt.read_text()

          s = s.replace(
              "COALESCE(NULLIF(c.name, ''), NULLIF(d.customer_name, ''), NULLIF(s.customer_name, ''), 'Unnamed Customer') AS customer_name,",
              "COALESCE(NULLIF(c.name, ''), NULLIF(d.customer_name, ''), NULLIF(s.customer_name, ''), 'Unnamed Customer') AS customer_name,"
          )

          replacements = [
              (
                  "COALESCE(s.customer_id, d.customer_id) AS effective_customer_id",
                  "COALESCE(d.customer_id, s.customer_id) AS effective_customer_id",
              ),
              (
                  "c.id = COALESCE(s.customer_id, d.customer_id)",
                  "c.id = COALESCE(d.customer_id, s.customer_id)",
              ),
              (
                  "CONCAT('customer-', COALESCE(s.customer_id, d.customer_id)) AS customer_key,",
                  "CONCAT('customer-', COALESCE(d.customer_id, s.customer_id)) AS customer_key,",
              ),
              (
                  "COALESCE(s.customer_id, d.customer_id) AS customer_id,",
                  "COALESCE(d.customer_id, s.customer_id) AS customer_id,",
              ),
              (
                  "AND COALESCE(s.customer_id, d.customer_id) IS NOT NULL",
                  "AND COALESCE(d.customer_id, s.customer_id) IS NOT NULL",
              ),
              (
                  "GROUP BY COALESCE(s.customer_id, d.customer_id)",
                  "GROUP BY COALESCE(d.customer_id, s.customer_id)",
              ),
              (
                  "AND COALESCE(s.customer_id, d.customer_id) = ?",
                  "AND COALESCE(d.customer_id, s.customer_id) = ?",
              ),
              (
                  "COALESCE(NULLIF(s.customer_name, ''), NULLIF(c.name, ''), NULLIF(d.customer_name, ''), 'Unnamed Customer') AS current_customer_name,",
                  "COALESCE(NULLIF(c.name, ''), NULLIF(d.customer_name, ''), NULLIF(s.customer_name, ''), 'Unnamed Customer') AS current_customer_name,",
              ),
              (
                  "COALESCE(NULLIF(s.customer_phone, ''), NULLIF(c.phone, ''), NULLIF(d.customer_phone, '')) AS current_customer_phone,",
                  "COALESCE(NULLIF(c.phone, ''), NULLIF(d.customer_phone, ''), NULLIF(s.customer_phone, '')) AS current_customer_phone,",
              ),
              (
                  "COALESCE(s.customer_id, d.customer_id) AS effective_customer_id",
                  "COALESCE(d.customer_id, s.customer_id) AS effective_customer_id",
              ),
          ]
          for old, new in replacements:
              s = s.replace(old, new)

          # Debt legacy rows must prefer the debt snapshot over a stale sale snapshot.
          s = s.replace(
              "COALESCE(NULLIF(s.customer_name, ''), NULLIF(d.customer_name, ''), 'Legacy Customer') AS customer_name,",
              "COALESCE(NULLIF(d.customer_name, ''), NULLIF(s.customer_name, ''), 'Legacy Customer') AS customer_name,",
          )
          s = s.replace(
              "COALESCE(NULLIF(s.customer_phone, ''), NULLIF(d.customer_phone, '')) AS customer_phone,",
              "COALESCE(NULLIF(d.customer_phone, ''), NULLIF(s.customer_phone, '')) AS customer_phone,",
          )

          # Single-debt payment endpoint: customer profile first, then debt snapshot, then sale snapshot.
          s = s.replace(
              "LEFT JOIN customers c ON c.id = COALESCE(s.customer_id, d.customer_id) AND c.branch_id = d.branch_id",
              "LEFT JOIN customers c ON c.id = COALESCE(d.customer_id, s.customer_id) AND c.branch_id = d.branch_id",
          )
          s = s.replace(
              "COALESCE(NULLIF(s.customer_name, ''), NULLIF(c.name, ''), NULLIF(d.customer_name, ''), 'Unnamed Customer') AS current_customer_name,",
              "COALESCE(NULLIF(c.name, ''), NULLIF(d.customer_name, ''), NULLIF(s.customer_name, ''), 'Unnamed Customer') AS current_customer_name,",
          )
          s = s.replace(
              "COALESCE(NULLIF(s.customer_phone, ''), NULLIF(c.phone, ''), NULLIF(d.customer_phone, '')) AS current_customer_phone",
              "COALESCE(NULLIF(c.phone, ''), NULLIF(d.customer_phone, ''), NULLIF(s.customer_phone, '')) AS current_customer_phone",
          )
          debt.write_text(s)

          # Make the startup repair safe: customer_id is authoritative for identity;
          # do not overwrite debt snapshots from a possibly stale sales snapshot.
          startup = Path("backend/scripts/runDebtCustomerIdentityReconciliationStartup.js")
          startup.write_text(r'''require("dotenv").config();

const { pool } = require("../config/db");

const PLACEHOLDER_NAMES = new Set([
  "CASH CUSTOMER",
  "CASH SALE",
  "WALK-IN CUSTOMER",
  "WALK IN CUSTOMER",
  "WALKIN CUSTOMER",
  "CUSTOMER",
  "UNNAMED CUSTOMER",
]);

function normalize(value) {
  return String(value ?? "")
    .trim()
    .replace(/\s+/g, " ")
    .toUpperCase();
}

function meaningfulSnapshot(value) {
  const normalized = normalize(value);
  return normalized && !PLACEHOLDER_NAMES.has(normalized) ? String(value).trim() : null;
}

async function main() {
  const connection = await pool.getConnection();

  try {
    await connection.beginTransaction();

    const [tableRows] = await connection.query(
      `SELECT TABLE_NAME
       FROM information_schema.TABLES
       WHERE TABLE_SCHEMA = DATABASE()
         AND TABLE_NAME IN ('sales', 'customers', 'debts')`
    );

    const tables = new Set(tableRows.map((row) => row.TABLE_NAME));
    if (!["sales", "customers", "debts"].every((table) => tables.has(table))) {
      await connection.rollback();
      console.log("Debt customer identity reconciliation skipped: required tables are not present.");
      return;
    }

    // Repair only deterministic identity conflicts where the debt snapshot names a unique
    // real customer while the linked IDs currently point at a placeholder customer.
    const [candidateRows] = await connection.query(
      `SELECT
         d.id AS debt_id,
         d.branch_id,
         d.sale_id,
         d.customer_id AS debt_customer_id,
         s.customer_id AS sale_customer_id,
         d.customer_name AS debt_customer_name,
         d.customer_phone AS debt_customer_phone,
         s.customer_name AS sale_customer_name,
         s.customer_phone AS sale_customer_phone
       FROM debts d
       LEFT JOIN sales s
         ON s.id = d.sale_id
        AND s.branch_id = d.branch_id
       WHERE COALESCE(d.customer_id, s.customer_id) IS NOT NULL
       FOR UPDATE`
    );

    let repairedDebtLinks = 0;
    let synchronizedSales = 0;
    let synchronizedDebtSnapshots = 0;

    for (const row of candidateRows) {
      const debtName = meaningfulSnapshot(row.debt_customer_name);
      const saleName = meaningfulSnapshot(row.sale_customer_name);
      const debtPhone = String(row.debt_customer_phone || "").trim();
      const salePhone = String(row.sale_customer_phone || "").trim();

      const [[debtCustomer]] = row.debt_customer_id
        ? await connection.query(
            `SELECT id, name, phone
             FROM customers
             WHERE id = ? AND branch_id = ?
             LIMIT 1`,
            [row.debt_customer_id, row.branch_id]
          )
        : [[null]];
      const [[saleCustomer]] = row.sale_customer_id
        ? await connection.query(
            `SELECT id, name, phone
             FROM customers
             WHERE id = ? AND branch_id = ?
             LIMIT 1`,
            [row.sale_customer_id, row.branch_id]
          )
        : [[null]];

      const debtPlaceholder = normalize(debtCustomer?.name) && PLACEHOLDER_NAMES.has(normalize(debtCustomer.name));
      const salePlaceholder = normalize(saleCustomer?.name) && PLACEHOLDER_NAMES.has(normalize(saleCustomer.name));
      const snapshotName = debtName || saleName;
      const snapshotPhone = debtPhone || salePhone;

      if (!snapshotName) {
        // No reliable identity snapshot remains; preserve IDs and financial evidence.
        continue;
      }

      // Find a unique branch-local customer by exact normalized name, optionally reinforced by phone.
      const [matches] = await connection.query(
        `SELECT id, name, phone
         FROM customers
         WHERE branch_id = ?
           AND UPPER(TRIM(name)) = ?
           AND UPPER(TRIM(name)) NOT IN ('CASH CUSTOMER','CASH SALE','WALK-IN CUSTOMER','WALK IN CUSTOMER','WALKIN CUSTOMER','CUSTOMER','UNNAMED CUSTOMER')
         ORDER BY id ASC`,
        [row.branch_id, normalize(snapshotName)]
      );

      let canonical = null;
      if (matches.length === 1) {
        canonical = matches[0];
      } else if (snapshotPhone) {
        const [phoneMatches] = await connection.query(
          `SELECT id, name, phone
           FROM customers
           WHERE branch_id = ?
             AND UPPER(TRIM(phone)) = UPPER(TRIM(?))
             AND UPPER(TRIM(name)) NOT IN ('CASH CUSTOMER','CASH SALE','WALK-IN CUSTOMER','WALK IN CUSTOMER','WALKIN CUSTOMER','CUSTOMER','UNNAMED CUSTOMER')
           ORDER BY id ASC`,
          [row.branch_id, snapshotPhone]
        );
        if (phoneMatches.length === 1) canonical = phoneMatches[0];
      }

      if (!canonical) continue;

      const hasConflictingPlaceholderLink =
        (debtPlaceholder && Number(row.debt_customer_id) !== Number(canonical.id)) ||
        (salePlaceholder && Number(row.sale_customer_id) !== Number(canonical.id));
      const hasSplitIdentity =
        row.debt_customer_id && row.sale_customer_id && Number(row.debt_customer_id) !== Number(row.sale_customer_id);

      if (hasConflictingPlaceholderLink || hasSplitIdentity) {
        if (Number(row.debt_customer_id || 0) !== Number(canonical.id)) {
          await connection.query(
            `UPDATE debts SET customer_id = ? WHERE id = ? AND branch_id = ?`,
            [canonical.id, row.debt_id, row.branch_id]
          );
          repairedDebtLinks += 1;
        }
        if (row.sale_id && Number(row.sale_customer_id || 0) !== Number(canonical.id)) {
          await connection.query(
            `UPDATE sales SET customer_id = ? WHERE id = ? AND branch_id = ?`,
            [canonical.id, row.sale_id, row.branch_id]
          );
          synchronizedSales += 1;
        }
      }

      // Once the canonical link is known, refresh display snapshots from the canonical customer.
      await connection.query(
        `UPDATE debts
         SET customer_name = ?, customer_phone = ?
         WHERE id = ? AND branch_id = ?`,
        [canonical.name, canonical.phone || null, row.debt_id, row.branch_id]
      );
      synchronizedDebtSnapshots += 1;
      if (row.sale_id) {
        await connection.query(
          `UPDATE sales
           SET customer_name = ?, customer_phone = ?
           WHERE id = ? AND branch_id = ?`,
          [canonical.name, canonical.phone || null, row.sale_id, row.branch_id]
        );
        synchronizedSales += 1;
      }
    }

    await connection.commit();
    console.log(
      `Debt customer identity reconciliation completed: repaired ${repairedDebtLinks} debt link(s), synchronized ${synchronizedDebtSnapshots} debt snapshot(s), synchronized ${synchronizedSales} sale link/snapshot update(s).`
    );
  } catch (error) {
    try {
      await connection.rollback();
    } catch (rollbackError) {
      console.error("Debt customer identity reconciliation rollback failed:", rollbackError);
    }
    console.error("Debt customer identity reconciliation failed:", error);
    throw error;
  } finally {
    connection.release();
    await pool.end();
  }
}

main().catch(() => process.exit(1));
