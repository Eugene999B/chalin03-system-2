          s = s.replace('const ALLOWED_TYPES = new Set(["image/jpeg", "image/png", "image/webp"]);', 'const ALLOWED_TYPES = new Set(["image/jpeg", "image/png", "image/webp"]);')
          s = s.replace(
              '  if (!ALLOWED_TYPES.has(String(file.type || "").toLowerCase())) {\n    throw new Error("Use a JPEG, PNG or WebP picture.");\n  }',
