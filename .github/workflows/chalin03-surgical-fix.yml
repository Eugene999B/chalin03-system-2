          )
          old = '''  const match = String(dataUrl || "").match(\n    /^data:(image\\/(?:jpeg|png|webp));base64,([A-Za-z0-9+/=]+)$/i\n  );\n\n  if (!match) {\n    const error = new Error("The protected equipment picture is invalid.");\n    error.code = "INVALID_EQUIPMENT_PHOTO";\n    throw error;\n  }\n\n  const mimeType = match[1].toLowerCase();\n  if (!ALLOWED_PHOTO_MIME_TYPES.has(mimeType)) {\n    const error = new Error("Use a JPEG, PNG or WebP equipment picture.");\n    error.code = "INVALID_EQUIPMENT_PHOTO_TYPE";\n    throw error;\n  }\n\n  const buffer = Buffer.from(match[2], "base64");\n  if (!buffer.length) {\n    const error = new Error("The protected equipment picture is empty.");\n    error.code = "EMPTY_EQUIPMENT_PHOTO";\n    throw error;\n  }\n  if (buffer.length > MAX_PROTECTED_PHOTO_BYTES) {\n    const error = new Error(\n      "The protected equipment picture is too large. Choose it again so Chalin can compress it."\n    );\n    error.code = "EQUIPMENT_PHOTO_TOO_LARGE";\n    throw error;\n  }\n\n  const normalizedDataUrl = `data:${mimeType};base64,${buffer.toString("base64")}`;\n  if (Buffer.byteLength(normalizedDataUrl, "utf8") > 64000) {\n    const error = new Error("The protected equipment picture exceeds safe storage size.");\n    error.code = "EQUIPMENT_PHOTO_STORAGE_LIMIT";\n    throw error;\n  }\n\n  return {\n    buffer,\n    mimeType,\n    dataUrl: normalizedDataUrl,\n    checksum: crypto.createHash("sha256").update(buffer).digest("hex"),\n  };'''
          new = '''  const match = String(dataUrl || "").match(\n    /^data:(image\\/[^;]+);base64,([A-Za-z0-9+/=]+)$/i\n  );\n\n  if (!match) {\n    const error = new Error("The protected equipment picture is invalid.");\n    error.code = "INVALID_EQUIPMENT_PHOTO";\n    throw error;\n  }\n\n  const sourceMimeType = match[1].toLowerCase();\n  if (!sourceMimeType.startsWith("image/")) {\n    const error = new Error("Choose a supported image picture.");\n    error.code = "INVALID_EQUIPMENT_PHOTO_TYPE";\n    throw error;\n  }\n\n  const sourceBuffer = Buffer.from(match[2], "base64");\n  if (!sourceBuffer.length) {\n    const error = new Error("The protected equipment picture is empty.");\n    error.code = "EMPTY_EQUIPMENT_PHOTO";\n    throw error;\n  }\n  if (sourceBuffer.length > 25 * 1024 * 1024) {\n    const error = new Error(\n      "The original equipment picture is larger than 25 MB. Choose a smaller picture."\n    );\n    error.code = "EQUIPMENT_PHOTO_TOO_LARGE";\n    throw error;\n  }\n\n  const sharp = require("sharp");\n  let bestBuffer = null;\n  let bestWidth = null;\n  let bestHeight = null;\n  const input = sharp(sourceBuffer, { failOn: "none" }).rotate().flatten({ background: "#ffffff" });\n  for (const width of [1800, 1600, 1400, 1200, 1000, 840, 720, 640]) {\n    for (const quality of [86, 78, 70, 62, 54, 46, 38]) {\n      const candidate = await input\n        .clone()\n        .resize({ width, height: width, fit: "inside", withoutEnlargement: true })\n        .jpeg({ quality, mozjpeg: true })\n        .toBuffer({ resolveWithObject: true });\n      bestBuffer = candidate.data;\n      bestWidth = candidate.info.width;\n      bestHeight = candidate.info.height;\n      if (bestBuffer.length <= MAX_PROTECTED_PHOTO_BYTES) break;\n    }\n    if (bestBuffer && bestBuffer.length <= MAX_PROTECTED_PHOTO_BYTES) break;\n  }\n\n  if (!bestBuffer || bestBuffer.length > MAX_PROTECTED_PHOTO_BYTES) {\n    const error = new Error("The equipment picture could not be compressed safely.");\n    error.code = "EQUIPMENT_PHOTO_STORAGE_LIMIT";\n    throw error;\n  }\n\n  const normalizedDataUrl = `data:image/jpeg;base64,${bestBuffer.toString("base64")}`;\n  if (Buffer.byteLength(normalizedDataUrl, "utf8") > 300000) {\n    const error = new Error("The protected equipment picture exceeds safe storage size.");\n    error.code = "EQUIPMENT_PHOTO_STORAGE_LIMIT";\n    throw error;\n  }\n\n  return {\n    buffer: bestBuffer,\n    mimeType: "image/jpeg",\n    dataUrl: normalizedDataUrl,\n    width: bestWidth,\n    height: bestHeight,\n    checksum: crypto.createHash("sha256").update(bestBuffer).digest("hex"),\n  };'''
