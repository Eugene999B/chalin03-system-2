          # Make the override unambiguous even with stale stylesheet ordering.
          fixcss = Path("frontend/src/styles/equipmentCatalogueImageFix.css")
          fixcss.write_text('''\n/* Canonical equipment media presentation: full machine first, details underneath. */\n.equipment-catalogue .equipment-card__image {\n  aspect-ratio: 16 / 10;\n  min-height: 220px;\n}\n\n.equipment-catalogue .equipment-card__image img,\n.equipment-catalogue .equipment-detail__cover img,\n.equipment-catalogue .equipment-detail__gallery article img {\n  object-fit: contain !important;\n  object-position: center !important;\n}\n\n.equipment-catalogue .equipment-card__image img {\n  width: 100%;\n  height: 100%;\n  padding: 12px;\n  background: #071d35;\n}\n\n.equipment-catalogue .equipment-detail__cover {\n  display: grid !important;\n  grid-template-columns: 1fr !important;\n  grid-template-rows: auto auto !important;\n  min-height: 0 !important;\n}\n\n.equipment-catalogue .equipment-detail__cover img {\n  width: 100% !important;\n  height: clamp(300px, 48vh, 560px) !important;\n  min-height: 300px !important;\n  padding: 18px !important;\n  background: #071d35 !important;\n}\n\n.equipment-catalogue .equipment-detail__cover > div {\n  width: 100%;\n  padding: 20px 24px 24px;\n}\n\n.equipment-catalogue .equipment-detail__gallery > div {\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n}\n\n.equipment-catalogue .equipment-detail__gallery article {\n  display: grid;\n  grid-template-columns: 1fr !important;\n  min-height: 0 !important;\n}\n\n.equipment-catalogue .equipment-detail__gallery article img,\n.equipment-catalogue .equipment-detail__gallery article > span {\n  width: 100% !important;\n  height: 160px !important;\n  min-height: 160px !important;\n  padding: 8px;\n  background: #071d35;\n}\n\n.equipment-catalogue .equipment-detail__gallery article > div {\n  padding: 10px 12px 14px;\n}\n''')

          secure = Path("frontend/src/styles/equipmentSecureUpload.css")
          s = secure.read_text().replace("  object-fit: cover;", "  object-fit: contain;")
          secure.write_text(s)

          # Keep contract tests aligned with the corrected identity and larger secure image target.
          testfile = Path("backend/tests/sparePartsDebtDeskContract.test.js")
          s = testfile.read_text()
          s = s.replace(
              "/COALESCE\\(NULLIF\\(s\\.customer_name, ''\\), NULLIF\\(c\\.name, ''\\), NULLIF\\(d\\.customer_name, ''\\)/",
              "/COALESCE\\(NULLIF\\(c\\.name, ''\\), NULLIF\\(d\\.customer_name, ''\\), NULLIF\\(s\\.customer_name, ''\\)/"
          )
          testfile.write_text(s)

          equip_test = Path("backend/tests/equipmentSalesFoundationContract.test.js")
          s = equip_test.read_text()
          s = s.replace("MAX_PROTECTED_PHOTO_BYTES = 44 \\* 1024", "MAX_PROTECTED_PHOTO_BYTES = 192 \\* 1024")
          equip_test.write_text(s)

          print("Surgical fixes applied.")

      - name: Backend tests
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "chalin03-bot"
          git config user.email "chalin03-bot@users.noreply.github.com"
          git add backend frontend
          git rm .github/workflows/chalin03-surgical-fix.yml
          git commit -m "[chalin03 auto-fix] debt identity and excavator media fixes"
          git push origin HEAD:${{ github.ref_name }}
