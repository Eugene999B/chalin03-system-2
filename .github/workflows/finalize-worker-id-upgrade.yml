name: Finalize Worker ID Upgrade

on:
  push:
    branches:
      - agent/release-3f-d2-worker-id-card
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out worker ID branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-3f-d2-worker-id-card
          fetch-depth: 0

      - name: Apply review fixes
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          service_path = Path('backend/services/workerIdentityService.js')
          service = service_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'  const nextNumber = Number\(sequenceRows\[0\]\?\.last_number \|\| 0\) \+ 1;'
              r'[\s\S]*?'
              r'  const employeeNumber = formatEmployeeNumber\(\n'
              r'    settings\.employeePrefix,\n'
              r'    workspace,\n'
              r'    nextNumber\n'
              r'  \);'
          )
          replacement = '''  let nextNumber = Number(sequenceRows[0]?.last_number || 0) + 1;
          let employeeNumber = "";
          let identityAllocated = false;

          for (let attempt = 0; attempt < 100000; attempt += 1) {
            const candidate = formatEmployeeNumber(
              settings.employeePrefix,
              workspace,
              nextNumber
            );
            const [existingRows] = await connection.query(
              `SELECT id
               FROM worker_profiles
               WHERE employee_number = ?
               LIMIT 1`,
              [candidate]
            );

            if (!existingRows.length) {
              employeeNumber = candidate;
              identityAllocated = true;
              break;
            }

            nextNumber += 1;
          }

          if (!identityAllocated) {
            const error = new Error(
              "A unique employee number could not be allocated safely."
            );
            error.code = "WORKER_ID_SEQUENCE_EXHAUSTED";
            throw error;
          }

          await connection.query(
            `UPDATE worker_identity_sequences
             SET last_number = ?
             WHERE workspace_code = ?`,
            [nextNumber, workspace]
          );'''
          service, count = pattern.subn(replacement, service, count=1)
          if count != 1:
              raise RuntimeError('Could not harden employee number allocation.')
          service_path.write_text(service, encoding='utf-8')

          routes_path = Path('backend/routes/workerProfileExpansionRoutes.js')
          routes = routes_path.read_text(encoding='utf-8')
          old_issue_source = 'payload.employment_start_date || new Date()'
          if old_issue_source not in routes:
              raise RuntimeError('Could not locate worker card issue date source.')
          routes = routes.replace(old_issue_source, 'new Date()', 1)
          routes_path.write_text(routes, encoding='utf-8')

          worker_path = Path('frontend/src/pages/ExpandedWorkerProfilePage.jsx')
          worker = worker_path.read_text(encoding='utf-8')
          for field_line in (
              '  ["id_card_issue_date", "ID card issue date", "date"],\n',
              '  ["id_card_expiry_date", "ID card expiry date", "date"],\n',
              '  ["id_card_serial", "ID card serial / reference"],\n',
          ):
              worker = worker.replace(field_line, '', 1)

          heading = '          <h2>Create Worker Profile</h2>'
          heading_start = worker.index(heading)
          full_name_line = '["full_name", "Full legal name"],'
          full_name_start = worker.index(full_name_line, heading_start)
          full_name_end = worker.index('\n', full_name_start) + 1
          clean_create_start = '''          <h2>Create Worker Profile</h2>

          <form
            className="expanded-worker-form-grid"
            onSubmit={createWorker}
          >
            <Notice type="info">
              Employee number, card serial, issue date and expiry date are generated automatically from Business & ID Settings.
            </Notice>

            {[
              ["full_name", "Full legal name"],
'''
          worker = worker[:heading_start] + clean_create_start + worker[full_name_end:]
          worker_path.write_text(worker, encoding='utf-8')

          settings_path = Path('backend/routes/settingsRoutes.js')
          settings = settings_path.read_text(encoding='utf-8')
          settings = re.sub(
              r'\n\s+receipt_footer = \?,\n\s+receipt_prefix = \?,\n\s+worker_id_card_validity_months = \?,\n\s+worker_employee_number_prefix = \?',
              '\n           receipt_footer = ?,\n           receipt_prefix = ?,\n           worker_id_card_validity_months = ?,\n           worker_employee_number_prefix = ?',
              settings,
              count=1,
          )
          settings_path.write_text(settings, encoding='utf-8')

          verification_path = Path('.github/workflows/chalin03-verification.yml')
          verification = verification_path.read_text(encoding='utf-8')
          if 'src/pages/UsersSettingsPage.jsx' not in verification:
              verification = verification.replace(
                  '            src/pages/SystemOperationsPage.jsx',
                  '            src/pages/SystemOperationsPage.jsx \\\n            src/pages/UsersSettingsPage.jsx \\\n            src/pages/ExpandedWorkerProfilePage.jsx',
                  1,
              )
          verification = verification.replace(
              'Lint Release 3F-D frontend files',
              'Lint protected release frontend files',
              1,
          )
          verification_path.write_text(verification, encoding='utf-8')

          test_path = Path('backend/tests/release3fD2WorkerIdentityCard.test.js')
          tests = test_path.read_text(encoding='utf-8')
          if 'skips matching legacy employee numbers' not in tests:
              tests += '''\n
test("Release 3F-D2 skips matching legacy employee numbers and issues cards today", () => {
  const service = read("backend/services/workerIdentityService.js");
  const routes = read("backend/routes/workerProfileExpansionRoutes.js");
  assert.match(service, /FROM worker_profiles[\\s\\S]*WHERE employee_number = \\?/);
  assert.match(service, /identityAllocated/);
  assert.match(routes, /allocateWorkerIdentity\\(\\s*connection,\\s*workspaceCode,\\s*new Date\\(\\)/);
});
'''
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Remove one-time finalizer
        run: rm -f .github/workflows/finalize-worker-id-upgrade.yml

      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden worker identity generation and card settings"
          git push origin HEAD:agent/release-3f-d2-worker-id-card
