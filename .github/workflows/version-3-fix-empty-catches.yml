name: Fix Version 3 Empty Catch Lint

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/version-3-final-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/version-3-final-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply guarded empty-catch correction
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "frontend/src/pages/DailyClosingPage.jsx": [
                  (
                      'try { expected = JSON.parse(revision.expected_snapshot_json || "{}"); } catch {}',
                      'try { expected = JSON.parse(revision.expected_snapshot_json || "{}"); } catch { /* Keep empty fallback for invalid historical JSON. */ }',
                  ),
                  (
                      'try { countedSnapshot = JSON.parse(revision.counted_snapshot_json || "{}"); } catch {}',
                      'try { countedSnapshot = JSON.parse(revision.counted_snapshot_json || "{}"); } catch { /* Keep empty fallback for invalid historical JSON. */ }',
                  ),
              ],
              "frontend/src/pages/SalesHistoryPage.jsx": [
                  (
                      'try { before = JSON.parse(change.before_snapshot_json || "{}"); } catch {}',
                      'try { before = JSON.parse(change.before_snapshot_json || "{}"); } catch { /* Keep empty fallback for invalid historical JSON. */ }',
                  ),
                  (
                      'try { after = JSON.parse(change.after_snapshot_json || "{}"); } catch {}',
                      'try { after = JSON.parse(change.after_snapshot_json || "{}"); } catch { /* Keep empty fallback for invalid historical JSON. */ }',
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f"Expected exactly one match in {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend tests, lint and build
        working-directory: frontend
        run: npm test && npm run lint && npm run build

      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/DailyClosingPage.jsx frontend/src/pages/SalesHistoryPage.jsx
          git commit -m "fix: document invalid historical JSON fallbacks"
          git push origin HEAD:agent/version-3-final-audit
