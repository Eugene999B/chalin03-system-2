name: Finalize Customer Statement and Debt Printing

on:
  push:
    branches:
      - agent/customer-statement-debt-printing

permissions:
  contents: write

jobs:
  finalize:
    name: Assemble and verify customer reporting update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: agent/customer-statement-debt-printing
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Assemble route and integrate pages
        shell: bash
        run: |
          cat \
            backend/routes/.customerDebtReportRoutes.part1 \
            backend/routes/.customerDebtReportRoutes.part2 \
            backend/routes/.customerDebtReportRoutes.part3 \
            > backend/routes/customerDebtReportRoutes.js

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              source = file_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:80]!r}")
              file_path.write_text(source.replace(old, new, 1))

          replace_once(
              "backend/server.js",
              'const customerStatementRoutes = require("./routes/customerStatementRoutes");\n',
              'const customerStatementRoutes = require("./routes/customerStatementRoutes");\nconst customerDebtReportRoutes = require("./routes/customerDebtReportRoutes");\n',
          )
          replace_once(
              "backend/server.js",
              '      "/api/customer-statements",\n',
              '      "/api/customer-statements",\n      "/api/customer-debt-reports",\n',
          )
          replace_once(
              "backend/server.js",
              'app.use("/api/customer-statements", requireAuth, sparePartsBoundary, customerStatementRoutes);\n',
              'app.use("/api/customer-statements", requireAuth, sparePartsBoundary, customerStatementRoutes);\napp.use(\n  "/api/customer-debt-reports",\n  requireAuth,\n  sparePartsBoundary,\n  customerDebtReportRoutes\n);\n',
          )

          replace_once(
              "frontend/src/pages/CustomerStatementPage.jsx",
              'import { useAuth } from "../context/AuthContext";\n',
              'import { useAuth } from "../context/AuthContext";\nimport CustomerDebtPrintPanel from "../components/CustomerDebtPrintPanel";\n',
          )
          replace_once(
              "frontend/src/pages/CustomerStatementPage.jsx",
              '      const response = await axiosClient.get("/customer-statements", {\n',
              '      const response = await axiosClient.get("/customer-debt-reports/statement", {\n',
          )
          replace_once(
              "frontend/src/pages/CustomerStatementPage.jsx",
              '      {error && <div className="error-box">{error}</div>}\n',
              '      <CustomerDebtPrintPanel\n        currentStoreCode={currentStoreCode}\n        preferredCustomer={statement?.customer || null}\n      />\n\n      {error && <div className="error-box">{error}</div>}\n',
          )
          replace_once(
              "frontend/src/pages/CustomerStatementPage.jsx",
              '                            <th>Receipt</th>\n                            <th>Store</th>\n                            <th>Total</th>\n',
              '                            <th>Receipt</th>\n                            <th>Store</th>\n                            <th>Items Bought</th>\n                            <th>Total</th>\n',
          )
          replace_once(
              "frontend/src/pages/CustomerStatementPage.jsx",
              '                                <td>{getRecordStoreCode(sale)}</td>\n                                <td>{voided ? "VOIDED" : formatMoney(sale.total)}</td>\n',
              '''                                <td>{getRecordStoreCode(sale)}</td>\n                                <td>\n                                  {sale.items?.length ? (\n                                    <div\n                                      style={{\n                                        display: "grid",\n                                        gap: "5px",\n                                        minWidth: "220px",\n                                      }}\n                                    >\n                                      {sale.items.map((item) => (\n                                        <div key={item.id}>\n                                          <strong>\n                                            {item.product_name || "Item"} × {Number(item.quantity || 0)}\n                                          </strong>\n                                          <br />\n                                          <small>\n                                            {formatMoney(item.unit_price)} each • {formatMoney(item.line_total)}\n                                          </small>\n                                        </div>\n                                      ))}\n                                    </div>\n                                  ) : (\n                                    "-"\n                                  )}\n                                </td>\n                                <td>{voided ? "VOIDED" : formatMoney(sale.total)}</td>\n''',
          )

          replace_once(
              "frontend/src/pages/DebtsPage.jsx",
              'import AuditUnlockRequestBox from "../components/AuditUnlockRequestBox";\n',
              'import AuditUnlockRequestBox from "../components/AuditUnlockRequestBox";\nimport CustomerDebtPrintPanel from "../components/CustomerDebtPrintPanel";\n',
          )
          replace_once(
              "frontend/src/pages/DebtsPage.jsx",
              '      {message && <div className="success-box">{message}</div>}\n',
              '      <CustomerDebtPrintPanel\n        currentStoreCode={currentStoreCode}\n        preferredCustomer={selectedDebt}\n      />\n\n      {message && <div className="success-box">{message}</div>}\n',
          )
          PY

          rm -f \
            backend/routes/.customerDebtReportRoutes.part1 \
            backend/routes/.customerDebtReportRoutes.part2 \
            backend/routes/.customerDebtReportRoutes.part3 \
            .github/workflows/temp-finalize-customer-reports.yml

          git diff --check
          node --check backend/routes/customerDebtReportRoutes.js
          node --check backend/server.js
          node --test backend/tests/customerDebtReports.test.js

      - name: Commit completed feature
        run: |
          git add -A
          git commit -m "feat: add customer statement and debt printing"
          git push origin HEAD:agent/customer-statement-debt-printing
