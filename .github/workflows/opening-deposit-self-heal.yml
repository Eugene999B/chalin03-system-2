name: Opening Deposit Self-Heal Patch Runner

on:
  push:
    branches:
      - 'agent/opening-deposit-self-heal-20260826'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reset-safe Opening Deposit foundation patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          route = Path('backend/routes/equipmentFinanceDepositReservationRoutes.js')
          text = route.read_text()
          old = '''router.get("/readiness", requirePermission("fleet.assets.view"), async (_req, res) => {
  try {
    const readiness = await schemaStatus(pool);
    return res.status(readiness.ready ? 200 : 503).json({
      status: readiness.ready ? "success" : "error",
      code: readiness.ready ? undefined : "EQUIPMENT_FINANCE_DEPOSIT_SCHEMA_REQUIRED",
      message: readiness.ready
        ? "Finance deposit and reservation controls are ready."
        : "The Opening Deposit payment controls are not installed on the production database.",
      readiness,
    });
  } catch (error) {
    return sendError(res, error, "Could not check Finance deposit readiness.");
  }
});'''
          new = '''router.get("/readiness", requirePermission("fleet.assets.view"), async (_req, res) => {
  try {
    // Readiness is also the self-healing boundary: after a reset, repair the
    // approved Opening Deposit foundation before exposing the page or data.
    const readiness = await assertSchemaReady(pool);
    return res.status(200).json({
      status: "success",
      message: "Finance deposit and reservation controls are ready.",
      readiness,
    });
  } catch (error) {
    return sendError(res, error, "Could not check Finance deposit readiness.");
  }
});'''
          if old not in text:
              raise SystemExit('Expected readiness route block was not found')
          route.write_text(text.replace(old, new, 1))

          base = Path('database/migrations/20260803_equipment_finance_phase4_deposit_reservation_integrity.sql')
          full = base.read_text()

          # The repair runner already expects these two canonical files. Restore
          # them from the approved Phase 4 definition so resets can be repaired.
          Path('database/migrations/20260825_equipment_finance_opening_deposit_trigger_fix.sql').write_text(full)

          match = re.search(
              r'(DROP TRIGGER IF EXISTS trg_equipment_finance_reservation_gate_before_insert.*?END \$\$\n)',
              full,
              re.S,
          )
          if not match:
              raise SystemExit('Canonical reservation trigger block was not found')
          reservation = match.group(1)
          reservation = reservation.replace(
              'IF v_deposit_received < v_deposit_required THEN',
              'IF v_deposit_received + 0.01 < v_deposit_required THEN',
              1,
          )
          Path('database/migrations/20260825_equipment_finance_opening_deposit_reservation_gate_fix.sql').write_text(
              '-- Canonical reset-safe reservation-gate refinement.\n-- Replaces only the reservation gate and preserves all other Phase 4 controls.\n\nDELIMITER $$\n\n' + reservation + '\nDELIMITER ;\n'
          )
          PY

          node --check backend/routes/equipmentFinanceDepositReservationRoutes.js
          node --test backend/tests/equipmentFinanceOpeningDepositResetSafe.test.js

      - name: Add readiness self-heal regression contract
        shell: bash
        run: |
          set -euo pipefail
          cat > backend/tests/equipmentFinanceOpeningDepositReadinessSelfHeal.test.js <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";

          const root = process.cwd();
          const route = fs.readFileSync(path.join(root, "backend/routes/equipmentFinanceDepositReservationRoutes.js"), "utf8");
          const repair = fs.readFileSync(path.join(root, "backend/scripts/runEquipmentFinanceOpeningDepositFoundationRepair.js"), "utf8");

          test("Opening Deposit readiness self-heals reset-invalid foundations", () => {
            assert.match(route, /router\.get\("\/readiness"/);
            assert.match(route, /const readiness = await assertSchemaReady\(pool\)/);
            assert.match(route, /runEquipmentFinanceOpeningDepositFoundationRepair\(\)/);
            assert.match(repair, /20260825_equipment_finance_opening_deposit_trigger_fix\.sql/);
            assert.match(repair, /20260825_equipment_finance_opening_deposit_reservation_gate_fix\.sql/);
            assert.ok(fs.existsSync(path.join(root, "database/migrations/20260825_equipment_finance_opening_deposit_trigger_fix.sql")));
            assert.ok(fs.existsSync(path.join(root, "database/migrations/20260825_equipment_finance_opening_deposit_reservation_gate_fix.sql")));
          });
          EOF
          node --test backend/tests/equipmentFinanceOpeningDepositReadinessSelfHeal.test.js

      - name: Commit application patch and remove patch runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/routes/equipmentFinanceDepositReservationRoutes.js \
            backend/tests/equipmentFinanceOpeningDepositReadinessSelfHeal.test.js \
            database/migrations/20260825_equipment_finance_opening_deposit_trigger_fix.sql \
            database/migrations/20260825_equipment_finance_opening_deposit_reservation_gate_fix.sql
          git rm -f .github/workflows/opening-deposit-self-heal.yml
          git commit -m 'fix(finance): make Opening Deposit readiness self-healing'
          git push origin HEAD
