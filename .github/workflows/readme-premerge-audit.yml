name: README Pre-Merge Exhaustive Audit

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: readme-premerge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/ai-agent-first-run-readme'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: agent/ai-agent-first-run-readme
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Correct and audit README operating instructions
        shell: python
        run: |
          from pathlib import Path
          import glob
          import json
          import re
          import subprocess

          root = Path.cwd()
          path = root / "README.md"
          text = path.read_text(encoding="utf-8")

          old_clone = """git clone https://github.com/Eugene999B/chalin03-system-2.git chalin03-system
          git switch main
          git pull --ff-only origin main"""
          new_clone = """git clone https://github.com/Eugene999B/chalin03-system-2.git chalin03-system
          cd /d C:\\Users\\DDK\\Desktop\\chalin03-system
          git switch main
          git pull --ff-only origin main"""
          if old_clone in text:
              text = text.replace(old_clone, new_clone, 1)
          elif new_clone not in text:
              raise SystemExit("Windows clone instructions are not in the expected safe form.")

          old_workflow_row = "| Security release audit | `.github/workflows/version-3-final-audit.yml` |"
          new_workflow_rows = old_workflow_row + "\n| Live production smoke verification | `.github/workflows/version-3-production-smoke.yml` |"
          if "| Live production smoke verification |" not in text:
              if old_workflow_row not in text:
                  raise SystemExit("Could not locate the workflow source-of-truth table.")
              text = text.replace(old_workflow_row, new_workflow_rows, 1)

          old_tree = """│       ├── chalin03-verification.yml
          │       └── version-3-final-audit.yml"""
          new_tree = """│       ├── chalin03-verification.yml
          │       ├── version-3-final-audit.yml
          │       └── version-3-production-smoke.yml"""
          if old_tree in text:
              text = text.replace(old_tree, new_tree, 1)
          elif new_tree not in text:
              raise SystemExit("Could not locate the workflow repository tree.")

          old_gate = """Before merge, both permanent workflows must be green:

          - **Chalin 03 Verification**
          - **Version 3 Final Security Audit**"""
          new_gate = """Before merge, all permanent workflows must be green:

          - **Chalin 03 Verification**
          - **Version 3 Final Security Audit**
          - **Version 3 Production Smoke**"""
          if old_gate in text:
              text = text.replace(old_gate, new_gate, 1)
          elif new_gate not in text:
              raise SystemExit("Could not locate the required CI gate list.")

          env_reference = "Use `backend/.env.example` as the complete variable reference. Never put real values in README, screenshots, issues, chat logs or commits."
          db_account_note = (
              "`DB_USER` and `DB_PASSWORD` must identify an existing local MySQL account. "
              "The example `chalin03_user` is not created automatically; create it locally or use another existing local account. "
              "Never reuse Railway production credentials on a development computer."
          )
          if db_account_note not in text:
              if env_reference not in text:
                  raise SystemExit("Could not locate the local environment guidance.")
              text = text.replace(env_reference, db_account_note + "\n\n" + env_reference, 1)

          path.write_text(text, encoding="utf-8")

          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/main...HEAD"],
                  text=True,
              ).splitlines()
          )
          allowed = {"README.md", ".github/workflows/readme-premerge-audit.yml"}
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f"Unexpected files in documentation PR: {sorted(unexpected)}")

          section_numbers = [
              int(value)
              for value in re.findall(r"^## (\d+)\. ", text, flags=re.MULTILINE)
          ]
          expected_sections = list(range(1, 29))
          if section_numbers != expected_sections:
              raise SystemExit(
                  f"README numbered sections are incomplete or unordered: {section_numbers}"
              )

          if text.count("```") % 2 != 0:
              raise SystemExit("README has an unclosed fenced code block.")

          prefixes = ("backend/", "frontend/", "database/", ".github/")
          referenced = set()
          for token in re.findall(r"`([^`\n]+)`", text):
              token = token.strip().rstrip(".,;:")
              if not token.startswith(prefixes):
                  continue
              if " " in token or "→" in token:
                  continue
              referenced.add(token)

          missing = []
          for token in sorted(referenced):
              if any(mark in token for mark in "*?["):
                  if not glob.glob(str(root / token)):
                      missing.append(token)
              elif not (root / token).exists():
                  missing.append(token)
          if missing:
              raise SystemExit(f"README references missing repository paths: {missing}")

          required_paths = [
              "backend/server.js",
              "backend/middleware/authMiddleware.js",
              "backend/security/permissionCatalog.js",
              "backend/services/categoryIsolationService.js",
              "backend/services/permissionOverrideService.js",
              "backend/services/accountSessionService.js",
              "backend/security/systemAdminIdentity.js",
              "backend/routes/backupRoutes.js",
              "frontend/src/App.jsx",
              "frontend/src/api/axiosClient.js",
              "frontend/src/context/AuthContext.jsx",
              "frontend/src/context/WorkspaceContext.jsx",
              "frontend/src/security/permissionRules.js",
              "frontend/public/_headers",
              "frontend/public/sw.js",
              "database/schema.sql",
              "database/schema_verify.sql",
              ".github/workflows/chalin03-verification.yml",
              ".github/workflows/version-3-final-audit.yml",
              ".github/workflows/version-3-production-smoke.yml",
          ]
          absent = [item for item in required_paths if not (root / item).exists()]
          if absent:
              raise SystemExit(f"Canonical README paths are absent: {absent}")

          backend_package = json.loads((root / "backend/package.json").read_text())
          frontend_package = json.loads((root / "frontend/package.json").read_text())
          for script in ("start", "dev", "create-admin", "syntax-check", "test"):
              if script not in backend_package.get("scripts", {}):
                  raise SystemExit(f"README expects missing backend script: {script}")
          for script in ("dev", "build", "lint", "test", "preview"):
              if script not in frontend_package.get("scripts", {}):
                  raise SystemExit(f"README expects missing frontend script: {script}")

          if backend_package.get("version") != "3.0.0":
              raise SystemExit("Backend package version is not 3.0.0.")
          if frontend_package.get("version") != "3.0.0":
              raise SystemExit("Frontend package version is not 3.0.0.")
          if "Version Three · v3.0.0" not in text:
              raise SystemExit("README release identity is missing.")

          backend_version = (root / "backend/config/version.js").read_text()
          frontend_version = (root / "frontend/src/config/appVersion.js").read_text()
          if 'APP_VERSION = "3.0.0"' not in backend_version:
              raise SystemExit("Backend canonical version is inconsistent.")
          if 'APP_VERSION = "3.0.0"' not in frontend_version:
              raise SystemExit("Frontend canonical version is inconsistent.")

          secret_patterns = [
              r"-----BEGIN (?:RSA|EC|OPENSSH) PRIVATE KEY-----",
              r"AKIA[0-9A-Z]{16}",
              r"AIza[0-9A-Za-z_-]{30,}",
              r"sk-[A-Za-z0-9]{20,}",
          ]
          for pattern in secret_patterns:
              if re.search(pattern, text):
                  raise SystemExit(f"Secret-shaped value detected in README: {pattern}")

          for pattern in (r"(?im)^\s*DROP\s+TABLE", r"(?im)^\s*TRUNCATE\b", r"(?im)^\s*DELETE\s+FROM"):
              if re.search(pattern, text):
                  raise SystemExit(f"Destructive SQL instruction found in README: {pattern}")

          if new_clone not in text:
              raise SystemExit("Clone instructions fail to enter the repository.")
          if text.count("Version 3 Production Smoke") < 1:
              raise SystemExit("Production smoke workflow is missing from required checks.")
          if "version-3-production-smoke.yml" not in text:
              raise SystemExit("Production smoke workflow path is missing from README.")

          print(f"README audit passed with {len(referenced)} validated repository references.")

      - name: Verify repository whitespace and documentation-only scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat origin/main...HEAD

      - name: Install and verify backend
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Install and verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Verify public production endpoints remain healthy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://api.chalin03.com/api/health | grep -q '"version":"3.0.0"'
          curl --fail --silent --show-error --location https://chalin03.com/login > /dev/null
          git ls-remote --exit-code https://github.com/Eugene999B/chalin03-system-2.git HEAD > /dev/null

      - name: Commit verified README corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README required no correction."
            exit 0
          fi
          git commit -m "docs: correct and validate AI agent operating instructions"
          git push origin HEAD:agent/ai-agent-first-run-readme
