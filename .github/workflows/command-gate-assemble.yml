name: Apply Command Gate Integration

on:
  push:
    branches:
      - agent/chalin-command-gate
    paths:
      - '.commandgate/integrate_frontend.py'
      - '.github/workflows/command-gate-assemble.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.commandgate/integrate_frontend.py'
      - '.github/workflows/command-gate-assemble.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/chalin-command-gate
          fetch-depth: 1

      - name: Apply deterministic integration
        run: python .commandgate/integrate_frontend.py

      - name: Validate patch shape
        run: |
          set -euo pipefail
          git diff --check
          test -f frontend/scripts/commandGateReleaseTests.mjs
          grep -q 'establishSession' frontend/src/context/AuthContext.jsx
          grep -q 'LastWorkTracker' frontend/src/App.jsx
          test "$(grep -c 'path="device-access"' frontend/src/App.jsx)" -eq 3
          test "$(grep -c 'path="emergency-operations"' frontend/src/App.jsx)" -eq 3

      - name: Commit integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "Chalin 03 Release Agent"
          git config user.email "actions@users.noreply.github.com"
          git add \
            frontend/src/App.jsx \
            frontend/src/context/AuthContext.jsx \
            frontend/src/components/LastWorkTracker.jsx \
            frontend/src/components/Layout.jsx \
            frontend/src/layouts/MiningLayout.jsx \
            frontend/src/layouts/EquipmentHireLayout.jsx \
            frontend/scripts/commandGateReleaseTests.mjs \
            frontend/package.json
          if git diff --cached --quiet; then
            echo "Command Gate integration is already current."
            exit 0
          fi
          git commit -m "Integrate Command Gate frontend"
          git push origin HEAD:agent/chalin-command-gate
