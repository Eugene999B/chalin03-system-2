name: Assemble Chalin Command Gate

on:
  push:
    branches:
      - agent/chalin-command-gate
    paths:
      - '.commandgate/**'
      - '.github/workflows/command-gate-assemble.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.commandgate/**'
      - '.github/workflows/command-gate-assemble.yml'

permissions:
  contents: write

concurrency:
  group: command-gate-assemble-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Quietly checkout implementation branch
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch agent/chalin-command-gate \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Decode and verify package
        run: |
          set -euo pipefail
          python .commandgate/assemble.py
          echo "Package files:"
          cat /tmp/chalin-command-gate-files.txt

      - name: Apply package and remove staging files
        run: |
          set -euo pipefail
          tar -xf /tmp/chalin-command-gate.tar -C .
          rm -rf .commandgate
          rm -f .github/workflows/command-gate-assemble.yml

      - name: Commit assembled implementation
        run: |
          set -euo pipefail
          git config user.name "Chalin 03 Release Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No assembled changes to commit."
            exit 0
          fi
          git commit -m "Build Chalin Command Gate"
          git push origin HEAD:agent/chalin-command-gate
