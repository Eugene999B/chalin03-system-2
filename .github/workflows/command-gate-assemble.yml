name: Assemble Chalin Command Gate

on:
  push:
    branches:
      - agent/chalin-command-gate
    paths:
      - '.commandgate/**'
      - '.github/workflows/command-gate-assemble.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.commandgate/**'
      - '.github/workflows/command-gate-assemble.yml'

permissions:
  contents: write

concurrency:
  group: command-gate-assemble-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/chalin-command-gate
          fetch-depth: 1
          show-progress: false

      - name: Decode and verify package
        run: |
          set -euo pipefail
          python .commandgate/assemble.py
          echo "Package files:"
          cat /tmp/chalin-command-gate-files.txt

      - name: Apply package and remove staging files
        run: |
          set -euo pipefail
          tar -xzf /tmp/chalin-command-gate.tar.gz -C .
          rm -rf .commandgate
          rm -f .github/workflows/command-gate-assemble.yml

      - name: Commit assembled implementation
        run: |
          set -euo pipefail
          git config user.name "Chalin 03 Release Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No assembled changes to commit."
            exit 0
          fi
          git commit -m "Build Chalin Command Gate"
          git push origin HEAD:agent/chalin-command-gate
