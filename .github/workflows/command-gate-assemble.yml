name: Assemble Chalin Command Gate

on:
  push:
    branches:
      - agent/chalin-command-gate
    paths:
      - '.commandgate/chunk*.txt'
      - '.commandgate/assemble.py'
      - '.github/workflows/command-gate-assemble.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.commandgate/chunk*.txt'
      - '.commandgate/assemble.py'
      - '.github/workflows/command-gate-assemble.yml'

permissions:
  contents: write

concurrency:
  group: command-gate-assemble-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Quietly checkout implementation branch
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch agent/chalin-command-gate \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Decode, verify or recover package
        id: decode
        run: |
          set +e
          python .commandgate/assemble.py
          status=$?
          set -e
          if [ "$status" -eq 42 ]; then
            echo "recovered=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo "recovered=false" >> "$GITHUB_OUTPUT"
          echo "Package files:"
          cat /tmp/chalin-command-gate-files.txt

      - name: Commit recovered implementation script
        if: steps.decode.outputs.recovered == 'true'
        run: |
          set -euo pipefail
          git config user.name "Chalin 03 Release Agent"
          git config user.email "actions@users.noreply.github.com"
          git add .commandgate/recovered_apply_command_gate.py.partial .commandgate/recovery-info.txt
          if git diff --cached --quiet; then
            echo "Recovered script is already committed."
            exit 0
          fi
          git commit -m "Recover interrupted Command Gate script"
          git push origin HEAD:agent/chalin-command-gate

      - name: Apply package and remove staging files
        if: steps.decode.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          tar -xf /tmp/chalin-command-gate.tar -C .
          rm -rf .commandgate
          rm -f .github/workflows/command-gate-assemble.yml

      - name: Commit assembled implementation
        if: steps.decode.outputs.recovered != 'true'
        run: |
          set -euo pipefail
          git config user.name "Chalin 03 Release Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No assembled changes to commit."
            exit 0
          fi
          git commit -m "Build Chalin Command Gate"
          git push origin HEAD:agent/chalin-command-gate
