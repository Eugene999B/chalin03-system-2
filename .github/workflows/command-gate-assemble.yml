name: Assemble Chalin Command Gate

on:
  push:
    branches:
      - agent/chalin-command-gate
    paths:
      - '.commandgate/integrate_frontend.py'
      - '.github/workflows/command-gate-assemble.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.commandgate/integrate_frontend.py'
      - '.github/workflows/command-gate-assemble.yml'

permissions:
  contents: write

concurrency:
  group: command-gate-assemble-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integrate-frontend:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Quietly checkout implementation branch
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch agent/chalin-command-gate \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Integrate Command Gate frontend
        run: |
          set -euo pipefail
          python .commandgate/integrate_frontend.py

      - name: Verify Command Gate frontend
        run: |
          set -euo pipefail
          npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
          npm --prefix frontend test
          npm --prefix frontend run build

      - name: Commit frontend integration
        run: |
          set -euo pipefail
          git config user.name "Chalin 03 Release Agent"
          git config user.email "actions@users.noreply.github.com"
          git add \
            frontend/src/App.jsx \
            frontend/src/context/AuthContext.jsx \
            frontend/src/components/LastWorkTracker.jsx \
            frontend/src/components/Layout.jsx \
            frontend/src/layouts/MiningLayout.jsx \
            frontend/src/layouts/EquipmentHireLayout.jsx \
            frontend/scripts/commandGateReleaseTests.mjs \
            frontend/package.json
          if git diff --cached --quiet; then
            echo "Frontend integration is already current."
            exit 0
          fi
          git commit -m "Integrate Command Gate frontend"
          git push origin HEAD:agent/chalin-command-gate
