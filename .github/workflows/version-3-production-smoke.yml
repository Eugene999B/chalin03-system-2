name: Version 3 Production Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - production

permissions:
  contents: read

concurrency:
  group: version-3-production-smoke
  cancel-in-progress: false

jobs:
  live-production:
    name: Post-deployment API and Cloudflare checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the approved production release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-output
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location \
              --dump-header smoke-output/api-health.headers \
              --output smoke-output/api-health.json \
              https://api.chalin03.com/api/health; then
              if jq -e '
                .status == "success" and
                .service == "Chalin 03 Group Operations Platform" and
                .version == "3.0.0" and
                .deployment.provider == "railway" and
                .deployment.commit_sha == env.GITHUB_SHA
              ' smoke-output/api-health.json >/dev/null; then
                echo "Production API is ready after attempt ${attempt}."
                exit 0
              fi
            fi
            sleep 15
          done
          echo 'Production API did not become ready with the expected release.' >&2
          exit 1

      - name: Verify live API readiness, security and authentication gates
        shell: bash
        run: |
          set -euo pipefail
          grep -qi '^strict-transport-security:' smoke-output/api-health.headers
          grep -qi '^content-security-policy:' smoke-output/api-health.headers
          grep -qi '^cache-control: no-store' smoke-output/api-health.headers
          grep -qi '^x-content-type-options: nosniff' smoke-output/api-health.headers

          curl --fail --silent --show-error --location \
            --dump-header smoke-output/api-readiness.headers \
            --output smoke-output/api-readiness.json \
            https://api.chalin03.com/api/readiness

          jq -e '
            .status == "success" and
            .ready == true and
            .version == "3.0.0" and
            .deployment.provider == "railway" and
            .deployment.commit_sha == env.GITHUB_SHA and
            .checks.database == "ready" and
            .checks.schema == "ready" and
            .checks.configuration == "ready"
          ' smoke-output/api-readiness.json

          protected_status="$(curl --silent --show-error \
            --dump-header smoke-output/protected.headers \
            --output smoke-output/protected.json \
            --write-out '%{http_code}' \
            https://api.chalin03.com/api/products)"
          test "$protected_status" = "401"
          grep -qiE '^ratelimit-(policy|limit):' smoke-output/protected.headers

      - name: Verify live login bundle, service worker and manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --dump-header smoke-output/login.headers \
            --output smoke-output/login.html \
            https://chalin03.com/login

          grep -qi '^strict-transport-security: max-age=31536000' smoke-output/login.headers
          grep -qi '^x-frame-options: DENY' smoke-output/login.headers
          grep -qi '^x-content-type-options: nosniff' smoke-output/login.headers
          grep -qi '^x-robots-tag:.*noindex' smoke-output/login.headers

          bundle_path="$(grep -oE 'src="/assets/[^" ]+\.js"' smoke-output/login.html | head -n 1 | cut -d'"' -f2)"
          test -n "$bundle_path"
          curl --fail --silent --show-error --location \
            --output smoke-output/application-bundle.js \
            "https://chalin03.com${bundle_path}"
          grep -q 'Version Three' smoke-output/application-bundle.js
          grep -q '3.0.0' smoke-output/application-bundle.js

          curl --fail --silent --show-error --location \
            --output smoke-output/service-worker.js \
            https://chalin03.com/sw.js
          grep -qE 'const CACHE_NAME = "chalin03-[^"]+"' smoke-output/service-worker.js
          grep -q 'url.origin !== self.location.origin' smoke-output/service-worker.js
          grep -q 'url.pathname.startsWith("/api")' smoke-output/service-worker.js
          grep -q '/site.webmanifest' smoke-output/service-worker.js

          curl --fail --silent --show-error --location \
            --output smoke-output/site.webmanifest \
            https://chalin03.com/site.webmanifest
          jq -e '
            .name == "Chalin 03 Group Operations Platform" and
            .short_name == "Chalin 03" and
            (.icons | length) >= 2
          ' smoke-output/site.webmanifest

      - name: Preserve live smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-3-live-production-smoke
          path: smoke-output
          if-no-files-found: error
          retention-days: 14
