name: One-time discount audit dependency remediation
on:
  push:
    branches:
      - feature/discount-audit-download-713
    paths:
      - .github/workflows/discount-audit-dependency-remediation.yml
permissions:
  contents: write
jobs:
  generate-safe-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve and audit backend dependencies
        working-directory: backend
        run: |
          npm ci
          npm audit fix
          npm audit --omit=dev --audit-level=high
      - name: Resolve and audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit fix
          npm audit --omit=dev --audit-level=high
      - name: Verify packages after remediation
        run: |
          (cd backend && npm run syntax-check && npm test)
          (cd frontend && npm test && npm run lint && npm run build)
      - name: Upload remediated lockfile artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discount-audit-remediated-lockfiles
          path: |
            backend/package.json
            backend/package-lock.json
            frontend/package.json
            frontend/package-lock.json
          retention-days: 2
      - name: Commit dependency security patches to feature branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency file changes were necessary."
          else
            git commit -m "Fix vulnerable production npm dependencies for discount audit release"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
