name: Correct Maintenance Service Assertion

on:
  push:
    branches:
      - agent/post-phase1-full-system-audit
    paths:
      - ".github/workflows/patch-maintenance-service-assertion.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-phase1-full-system-audit
          fetch-depth: 0
      - name: Correct focused contract owner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/generate_post_phase1_maintenance_reset_fix.py')
          source = path.read_text()
          old = '  assert.match(route, /PRODUCTION_BUSINESS_DATA_CLEAR_PERMANENTLY_BLOCKED/);'
          new = '  assert.match(service, /PRODUCTION_BUSINESS_DATA_CLEAR_PERMANENTLY_BLOCKED/);'
          if source.count(old) != 1:
              raise SystemExit(f'Expected one route ownership assertion, found {source.count(old)}.')
          path.write_text(source.replace(old, new, 1))
          PY
          python3 -m py_compile .github/scripts/generate_post_phase1_maintenance_reset_fix.py
          git config user.name "chalin03-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scripts/generate_post_phase1_maintenance_reset_fix.py
          git rm -f .github/workflows/patch-maintenance-service-assertion.yml
          git commit -m "Verify production reset block at service boundary"
          git push origin HEAD:agent/post-phase1-full-system-audit
