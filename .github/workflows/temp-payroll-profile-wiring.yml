name: Temporary Payroll Profile Wiring

on:
  pull_request:
    branches:
      - feature/payroll-financial-foundation-phase2-20260810

permissions:
  contents: write

jobs:
  wire:
    if: github.event.pull_request.head.ref == 'feature/payroll-worker-profile-phase3-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payroll-worker-profile-phase3-20260810
          fetch-depth: 1
      - name: Wire salary tab without rewriting worker profile
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/pages/ExpandedWorkerProfilePage.jsx')
          text = path.read_text()

          import_marker = 'import WorkerHrLettersPanel from "../components/WorkerHrLettersPanel";\n'
          payroll_import = 'import WorkerPayrollPanel from "../components/WorkerPayrollPanel";\n'
          if payroll_import not in text:
              if text.count(import_marker) != 1:
                  raise SystemExit('Worker payroll import marker moved')
              text = text.replace(import_marker, import_marker + payroll_import)

          permission_marker = '''  const canDeactivate = auth.hasPermission(\n    "workers.deactivate"\n  );\n'''
          permission_block = permission_marker + '''\n  const canPayrollView = auth.hasPermission(\n    "payroll.view"\n  );\n'''
          if 'const canPayrollView = auth.hasPermission' not in text:
              if text.count(permission_marker) != 1:
                  raise SystemExit('Worker payroll permission marker moved')
              text = text.replace(permission_marker, permission_block)

          nav_marker = '''                {tabItems.map(([key, label]) => (\n'''
          nav_replacement = '''                {[\n                  ...tabItems,\n                  ...(canPayrollView ? [["payroll", "Salary & Payroll"]] : []),\n                ].map(([key, label]) => (\n'''
          if '...(canPayrollView ? [["payroll", "Salary & Payroll"]]' not in text:
              if text.count(nav_marker) != 1:
                  raise SystemExit('Worker payroll tab marker moved')
              text = text.replace(nav_marker, nav_replacement)

          personal_marker = '''              {activeTab === "personal" ? (\n'''
          payroll_panel = '''              {activeTab === "payroll" && canPayrollView ? (\n                <WorkerPayrollPanel\n                  workerId={selectedId}\n                  worker={selectedProfile}\n                  workspaceLabel={activeWorkspaceLabel}\n                />\n              ) : null}\n\n'''
          if 'activeTab === "payroll" && canPayrollView' not in text:
              if text.count(personal_marker) != 1:
                  raise SystemExit('Worker payroll panel insertion marker moved')
              text = text.replace(personal_marker, payroll_panel + personal_marker)

          path.write_text(text)
          PY

          node frontend/scripts/payrollWorkerProfilePhaseThreeTests.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/src/pages/ExpandedWorkerProfilePage.jsx
          if git diff --cached --quiet; then
            echo 'Worker payroll profile is already wired.'
            exit 0
          fi
          git commit -m 'Wire Salary and Payroll into worker profiles'
          git push origin HEAD:feature/payroll-worker-profile-phase3-20260810
