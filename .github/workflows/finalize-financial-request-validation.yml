name: Finalize Financial Request Validation

on:
  push:
    branches:
      - agent/financial-request-validation
    paths:
      - .github/workflows/finalize-financial-request-validation.yml

permissions:
  contents: write

concurrency:
  group: finalize-financial-request-validation
  cancel-in-progress: false

jobs:
  finalize:
    name: Apply and verify financial validation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: agent/financial-request-validation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Integrate centralized validators into financial routes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          sale = root / "backend/routes/saleRoutes.js"
          replace_once(
              sale,
              'const { sendInstallmentEventSms } = require("../services/installmentReminderService");\n',
              'const { sendInstallmentEventSms } = require("../services/installmentReminderService");\n'
              'const { validateRequest } = require("../middleware/requestValidationMiddleware");\n'
              'const { validateSaleCreateRequest } = require("../validation/financialRequestValidators");\n',
              "sale imports",
          )
          replace_once(
              sale,
              'router.post("/", requireAuth, async (req, res) => {',
              'router.post("/", requireAuth, validateRequest(validateSaleCreateRequest), async (req, res) => {',
              "sale middleware",
          )
          replace_once(
              sale,
              '''    const {
                customer_name,
                customer_phone,
                customer_location,
                payment_type,
                amount_tendered,
                amount_paid,
                discount_amount,
                payment_allocations,
                installment_plan,
                items,
              } = req.body;
          ''',
              '''    const {
                customer_name,
                customer_phone,
                customer_location,
                payment_type,
                amount_tendered,
                amount_paid,
                discount_amount,
                payment_allocations,
                installment_plan,
                items,
              } = req.validated.body;
          ''',
              "sale sanitized body",
          )

          returns = root / "backend/routes/returnRoutes.js"
          replace_once(
              returns,
              'const { markClosingStale } = require("../services/dailyClosingSecurityService");\n',
              'const { markClosingStale } = require("../services/dailyClosingSecurityService");\n'
              'const { validateRequest } = require("../middleware/requestValidationMiddleware");\n'
              'const { validateReturnCreateRequest } = require("../validation/financialRequestValidators");\n',
              "return imports",
          )
          replace_once(
              returns,
              '  requireRole("admin", "manager"),\n  async (req, res) => {\n    const connection = await pool.getConnection();',
              '  requireRole("admin", "manager"),\n  validateRequest(validateReturnCreateRequest),\n  async (req, res) => {\n    const connection = await pool.getConnection();',
              "return middleware",
          )
          replace_once(
              returns,
              '''      const {
                sale_id,
                product_id,
                quantity,
                reason,
                return_type,
                refund_amount,
                refund_method,
                refund_reference,
                approver_username,
                approver_password,
              } = req.body;
          ''',
              '''      const {
                sale_id,
                product_id,
                quantity,
                reason,
                return_type,
                refund_amount,
                refund_method,
                refund_reference,
                approver_username,
                approver_password,
              } = req.validated.body;
          ''',
              "return sanitized body",
          )

          purchases = root / "backend/routes/purchaseRoutes.js"
          replace_once(
              purchases,
              'const { writeAuditEvent } = require("../services/auditTrailService");\n',
              'const { writeAuditEvent } = require("../services/auditTrailService");\n'
              'const { validateRequest } = require("../middleware/requestValidationMiddleware");\n'
              'const { validatePurchasePaymentRequest } = require("../validation/financialRequestValidators");\n',
              "purchase imports",
          )
          replace_once(
              purchases,
              '  requireRole("admin", "manager"),\n  async (req, res) => {\n    const connection = await pool.getConnection();\n\n    try {\n      const branchId = getBranchId(req);\n      const { id } = req.params;\n      const { amount, payment_method, notes } = req.body;',
              '  requireRole("admin", "manager"),\n  validateRequest(validatePurchasePaymentRequest),\n  async (req, res) => {\n    const connection = await pool.getConnection();\n\n    try {\n      const branchId = getBranchId(req);\n      const { id } = req.validated.params;\n      const { amount, payment_method, notes } = req.validated.body;',
              "purchase payment integration",
          )

          installments = root / "backend/routes/installmentRoutes.js"
          replace_once(
              installments,
              '''const {
                runInstallmentReminderSync,
                sendInstallmentEventSms,
              } = require("../services/installmentReminderService");
          ''',
              '''const {
                runInstallmentReminderSync,
                sendInstallmentEventSms,
              } = require("../services/installmentReminderService");
          const { validateRequest } = require("../middleware/requestValidationMiddleware");
          const { validateInstallmentPaymentRequest } = require("../validation/financialRequestValidators");
          ''',
              "installment imports",
          )
          replace_once(
              installments,
              '  requirePermission("installments.collect"),\n  async (req, res) => {\n    const branchId = requireBranch(req, res);\n    const agreementId = positiveInteger(req.params.agreementId);\n    const amount = money(req.body?.amount);\n    const method = paymentMethod(req.body?.payment_method);',
              '  requirePermission("installments.collect"),\n  validateRequest(validateInstallmentPaymentRequest),\n  async (req, res) => {\n    const branchId = requireBranch(req, res);\n    const { agreementId } = req.validated.params;\n    const {\n      amount,\n      payment_method: method,\n      payment_reference: paymentReference,\n      notes: paymentNotes,\n      send_sms: sendSms,\n    } = req.validated.body;',
              "installment payment integration",
          )
          replace_once(
              installments,
              '          cleanText(req.body?.payment_reference, 150),\n          cleanText(req.body?.notes, 500),',
              '          paymentReference,\n          paymentNotes,',
              "installment sanitized text",
          )
          replace_once(
              installments,
              '      if (req.body?.send_sms !== false) {',
              '      if (sendSms) {',
              "installment sanitized sms flag",
          )
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run focused financial validation checks
        working-directory: backend
        run: |
          node --check validation/financialRequestValidators.js
          node --check routes/saleRoutes.js
          node --check routes/returnRoutes.js
          node --check routes/purchaseRoutes.js
          node --check routes/installmentRoutes.js
          node --test tests/financialRequestValidation.test.js

      - name: Run complete backend verification
        working-directory: backend
        run: npm run syntax-check && npm test

      - name: Check final source diff
        run: |
          git diff --check
          git status --short

      - name: Remove temporary finalizer and commit verified source
        shell: bash
        run: |
          rm .github/workflows/finalize-financial-request-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: validate critical financial requests"
          git push origin HEAD:agent/financial-request-validation
