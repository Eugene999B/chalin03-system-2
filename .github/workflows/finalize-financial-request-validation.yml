name: Finalize Financial Request Validation

on:
  push:
    branches:
      - agent/financial-request-validation
    paths:
      - .github/workflows/finalize-financial-request-validation.yml

permissions:
  contents: write

concurrency:
  group: finalize-financial-request-validation
  cancel-in-progress: false

jobs:
  finalize:
    name: Apply and verify financial validation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: agent/financial-request-validation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Integrate centralized validators into financial routes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def update_section(path, start_marker, end_marker, changes, label):
              text = path.read_text(encoding="utf-8")
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{label}: start marker not found")
              end = text.find(end_marker, start + len(start_marker)) if end_marker else len(text)
              if end < 0:
                  raise SystemExit(f"{label}: end marker not found")
              section = text[start:end]
              for old, new, change_label in changes:
                  section = replace_once(section, old, new, f"{label} / {change_label}")
              path.write_text(text[:start] + section + text[end:], encoding="utf-8")

          sale = root / "backend/routes/saleRoutes.js"
          sale_text = sale.read_text(encoding="utf-8")
          sale_text = replace_once(
              sale_text,
              'const { sendInstallmentEventSms } = require("../services/installmentReminderService");\n',
              'const { sendInstallmentEventSms } = require("../services/installmentReminderService");\n'
              'const { validateRequest } = require("../middleware/requestValidationMiddleware");\n'
              'const { validateSaleCreateRequest } = require("../validation/financialRequestValidators");\n',
              "sale imports",
          )
          sale.write_text(sale_text, encoding="utf-8")
          update_section(
              sale,
              "// POST /api/sales",
              "// GET /api/sales",
              [
                  (
                      'router.post("/", requireAuth, async (req, res) => {',
                      'router.post("/", requireAuth, validateRequest(validateSaleCreateRequest), async (req, res) => {',
                      "middleware",
                  ),
                  (
                      '} = req.body;',
                      '} = req.validated.body;',
                      "sanitized body",
                  ),
              ],
              "sale create route",
          )

          returns = root / "backend/routes/returnRoutes.js"
          return_text = returns.read_text(encoding="utf-8")
          return_text = replace_once(
              return_text,
              'const { markClosingStale } = require("../services/dailyClosingSecurityService");\n',
              'const { markClosingStale } = require("../services/dailyClosingSecurityService");\n'
              'const { validateRequest } = require("../middleware/requestValidationMiddleware");\n'
              'const { validateReturnCreateRequest } = require("../validation/financialRequestValidators");\n',
              "return imports",
          )
          returns.write_text(return_text, encoding="utf-8")
          update_section(
              returns,
              "// POST /api/returns",
              "module.exports = router;",
              [
                  (
                      '  requireRole("admin", "manager"),\n  async (req, res) => {',
                      '  requireRole("admin", "manager"),\n  validateRequest(validateReturnCreateRequest),\n  async (req, res) => {',
                      "middleware",
                  ),
                  (
                      '} = req.body;',
                      '} = req.validated.body;',
                      "sanitized body",
                  ),
              ],
              "return create route",
          )

          purchases = root / "backend/routes/purchaseRoutes.js"
          purchase_text = purchases.read_text(encoding="utf-8")
          purchase_text = replace_once(
              purchase_text,
              'const { writeAuditEvent } = require("../services/auditTrailService");\n',
              'const { writeAuditEvent } = require("../services/auditTrailService");\n'
              'const { validateRequest } = require("../middleware/requestValidationMiddleware");\n'
              'const { validatePurchasePaymentRequest } = require("../validation/financialRequestValidators");\n',
              "purchase imports",
          )
          purchases.write_text(purchase_text, encoding="utf-8")
          update_section(
              purchases,
              "// PATCH /api/purchases/:id/pay",
              "// POST /api/purchases",
              [
                  (
                      '  requireRole("admin", "manager"),\n  async (req, res) => {',
                      '  requireRole("admin", "manager"),\n  validateRequest(validatePurchasePaymentRequest),\n  async (req, res) => {',
                      "middleware",
                  ),
                  (
                      '      const { id } = req.params;\n      const { amount, payment_method, notes } = req.body;',
                      '      const { id } = req.validated.params;\n      const { amount, payment_method, notes } = req.validated.body;',
                      "sanitized request",
                  ),
              ],
              "purchase payment route",
          )

          installments = root / "backend/routes/installmentRoutes.js"
          installment_text = installments.read_text(encoding="utf-8")
          installment_text = replace_once(
              installment_text,
              'const {\n  runInstallmentReminderSync,\n  sendInstallmentEventSms,\n} = require("../services/installmentReminderService");\n',
              'const {\n  runInstallmentReminderSync,\n  sendInstallmentEventSms,\n} = require("../services/installmentReminderService");\n'
              'const { validateRequest } = require("../middleware/requestValidationMiddleware");\n'
              'const { validateInstallmentPaymentRequest } = require("../validation/financialRequestValidators");\n',
              "installment imports",
          )
          installments.write_text(installment_text, encoding="utf-8")
          update_section(
              installments,
              'router.post(\n  "/agreements/:agreementId/payments",',
              'router.post(\n  "/agreements/:agreementId/payments/:paymentId/void",',
              [
                  (
                      '  requirePermission("installments.collect"),\n  async (req, res) => {\n    const branchId = requireBranch(req, res);\n    const agreementId = positiveInteger(req.params.agreementId);\n    const amount = money(req.body?.amount);\n    const method = paymentMethod(req.body?.payment_method);',
                      '  requirePermission("installments.collect"),\n  validateRequest(validateInstallmentPaymentRequest),\n  async (req, res) => {\n    const branchId = requireBranch(req, res);\n    const { agreementId } = req.validated.params;\n    const {\n      amount,\n      payment_method: method,\n      payment_reference: paymentReference,\n      notes: paymentNotes,\n      send_sms: sendSms,\n    } = req.validated.body;',
                      "middleware and sanitized request",
                  ),
                  (
                      '          cleanText(req.body?.payment_reference, 150),\n          cleanText(req.body?.notes, 500),',
                      '          paymentReference,\n          paymentNotes,',
                      "sanitized reference and notes",
                  ),
                  (
                      '      if (req.body?.send_sms !== false) {',
                      '      if (sendSms) {',
                      "sanitized sms flag",
                  ),
              ],
              "installment collection route",
          )
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run focused financial validation checks
        working-directory: backend
        run: |
          node --check validation/financialRequestValidators.js
          node --check routes/saleRoutes.js
          node --check routes/returnRoutes.js
          node --check routes/purchaseRoutes.js
          node --check routes/installmentRoutes.js
          node --test tests/financialRequestValidation.test.js

      - name: Run complete backend verification
        working-directory: backend
        run: npm run syntax-check && npm test

      - name: Check final source diff
        run: |
          git diff --check
          git status --short

      - name: Remove temporary finalizer and commit verified source
        shell: bash
        run: |
          rm .github/workflows/finalize-financial-request-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: validate critical financial requests"
          git push origin HEAD:agent/financial-request-validation
