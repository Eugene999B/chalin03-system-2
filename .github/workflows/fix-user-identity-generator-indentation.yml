name: Correct User Identity Generator Indentation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/fix-user-identity-generator-indentation.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-phase1-full-system-audit
          fetch-depth: 0
      - name: Shift the restored frontend statements into main
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/generate_post_phase1_user_identity_fix.py')
          lines = path.read_text().splitlines(keepends=True)

          state_index = next(
              (index for index, line in enumerate(lines)
               if 'const [deletingUserId, setDeletingUserId]' in line),
              None,
          )
          staff_label_index = next(
              (index for index, line in enumerate(lines)
               if '"Staff-user section description",' in line),
              None,
          )
          if state_index is None or staff_label_index is None:
              raise SystemExit('Could not find the unique state/staff markers.')

          second_call_start = next(
              (
                  index
                  for index in range(state_index + 1, staff_label_index)
                  if lines[index].startswith('frontend_source = replace_pattern(')
              ),
              None,
          )
          if second_call_start is None:
              raise SystemExit('Could not find the first outdented frontend statement.')

          staff_call_start = staff_label_index
          while (
              staff_call_start >= 0
              and lines[staff_call_start].strip()
              != 'frontend_source = replace_pattern('
          ):
              staff_call_start -= 1
          if staff_call_start <= second_call_start:
              raise SystemExit('Could not resolve the staff-description boundary.')

          for index in range(second_call_start, staff_call_start):
              if lines[index].strip():
                  lines[index] = '    ' + lines[index]

          path.write_text(''.join(lines))
          PY

          python3 -m py_compile .github/scripts/generate_post_phase1_user_identity_fix.py
          git config user.name "chalin03-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scripts/generate_post_phase1_user_identity_fix.py
          git rm .github/workflows/fix-user-identity-generator-indentation.yml
          git commit -m "Correct secure-offboarding generator indentation"
          git push origin HEAD:agent/post-phase1-full-system-audit
