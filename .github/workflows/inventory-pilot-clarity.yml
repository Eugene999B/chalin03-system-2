name: Temporary Inventory Pilot Clarity Gate

on:
  push:
    branches:
      - feature/inventory-loss-prevention-traceability
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: inventory-pilot-clarity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: ${{ github.event_name == 'push' || github.head_ref == 'feature/inventory-loss-prevention-traceability' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-loss-prevention-traceability
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply pilot clarity fixes
        run: python .github/inventory-pilot-clarity/patch.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm test
          npm run lint
          npm run build
          git diff --check

      - name: Publish verified clarity fixes
        run: |
          git config user.name "chalin03-feature-gate"
          git config user.email "actions@users.noreply.github.com"
          git add \
            frontend/src/pages/InventoryTraceabilitySetupPage.jsx \
            frontend/src/styles/inventoryTraceabilityHub.css \
            frontend/scripts/inventoryTraceabilityFoundationTests.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Align inventory traceability release wording and hub"
          git push origin HEAD:feature/inventory-loss-prevention-traceability
