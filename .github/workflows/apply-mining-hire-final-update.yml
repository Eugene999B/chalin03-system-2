name: Verify Mining and Hire Final Update

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'agent/mining-hire-final-update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mining-hire-final-update
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check backend server syntax
        run: node --check backend/server.js
      - name: Check notification scheduler syntax
        run: node --check backend/services/notificationSchedulerService.js
      - name: Test notification scheduler
        run: node --test backend/tests/notificationSchedulerService.test.js
      - name: Test Mining and Hire acceptance contract
        run: node --test backend/tests/miningHireFinalAcceptance.test.js
      - name: Test route-level frontend completion
        run: node frontend/scripts/workspaceFinalCompletionTests.mjs
