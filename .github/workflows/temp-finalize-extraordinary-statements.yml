name: Finalize Extraordinary Customer Statements and Sidebar

on:
  push:
    branches:
      - agent/extraordinary-customer-statements-sidebar

permissions:
  contents: write

jobs:
  finalize:
    name: Assemble, integrate and verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
        with:
          ref: agent/extraordinary-customer-statements-sidebar
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Assemble readable source files
        shell: bash
        run: |
          set -euo pipefail

          cat \
            .release-parts/customerStatementWorkspaceRoutes.part01 \
            .release-parts/customerStatementWorkspaceRoutes.part02 \
            .release-parts/customerStatementWorkspaceRoutes.part03 \
            .release-parts/customerStatementWorkspaceRoutes.part04 \
            .release-parts/customerStatementWorkspaceRoutes.part05 \
            .release-parts/customerStatementWorkspaceRoutes.part06 \
            .release-parts/customerStatementWorkspaceRoutes.part07 \
            .release-parts/customerStatementWorkspaceRoutes.part08 \
            > backend/routes/customerStatementWorkspaceRoutes.js

          cat \
            .release-parts/CustomerStatementWorkspacePage.part1 \
            .release-parts/CustomerStatementWorkspacePage.part2 \
            .release-parts/CustomerStatementWorkspacePage.part3 \
            .release-parts/CustomerStatementWorkspacePage.part4 \
            > frontend/src/pages/CustomerStatementWorkspacePage.jsx

      - name: Integrate route, sidebar and debt export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file_path = Path(path)
              source = file_path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}: {old[:100]!r}")
              file_path.write_text(source.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              file_path = Path(path)
              source = file_path.read_text()
              start_index = source.find(start)
              if start_index < 0:
                  raise SystemExit(f"Start marker missing in {path}: {start!r}")
              end_index = source.find(end, start_index + len(start))
              if end_index < 0:
                  raise SystemExit(f"End marker missing in {path}: {end!r}")
              file_path.write_text(source[:start_index] + replacement + source[end_index:])

          replace_once(
              "backend/server.js",
              'const customerDebtReportRoutes = require("./routes/customerDebtReportRoutes");\n',
              'const customerDebtReportRoutes = require("./routes/customerDebtReportRoutes");\nconst customerStatementWorkspaceRoutes = require("./routes/customerStatementWorkspaceRoutes");\n',
          )
          replace_once(
              "backend/server.js",
              '      "/api/customer-debt-reports",\n',
              '      "/api/customer-debt-reports",\n      "/api/customer-statement-workspace",\n',
          )
          replace_once(
              "backend/server.js",
              '''app.use(\n  "/api/customer-debt-reports",\n  requireAuth,\n  sparePartsBoundary,\n  customerDebtReportRoutes\n);\n''',
              '''app.use(\n  "/api/customer-debt-reports",\n  requireAuth,\n  sparePartsBoundary,\n  customerDebtReportRoutes\n);\napp.use(\n  "/api/customer-statement-workspace",\n  requireAuth,\n  sparePartsBoundary,\n  customerStatementWorkspaceRoutes\n);\n''',
          )

          replace_once(
              "frontend/src/components/Layout.jsx",
              '''import InstallAppButton from "./InstallAppButton";\nimport { useEffect, useMemo, useState } from "react";\nimport { NavLink, Outlet, useNavigate } from "react-router-dom";\nimport { useAuth } from "../context/AuthContext";\n''',
              '''import { useEffect, useMemo, useState } from "react";\nimport { Outlet, useNavigate } from "react-router-dom";\nimport CompactSidebarNavigation from "./CompactSidebarNavigation";\nimport SidebarAccountMenu from "./SidebarAccountMenu";\nimport "../styles/sidebarPolish.css";\nimport { useAuth } from "../context/AuthContext";\n''',
          )

          replace_between(
              "frontend/src/components/Layout.jsx",
              '        <div className="premium-sidebar-tools">\n',
              '\n        <div className="premium-nav-scroll">\n',
              '''        <div className="premium-sidebar-tools">\n          <div className="premium-store-card premium-store-card-compact">\n            <label>{currentStoreCode}</label>\n            <div style={{ minWidth: 0 }}>\n              <h3>{currentStoreName}</h3>\n              <p>{storeAccessLabel}</p>\n            </div>\n          </div>\n        </div>\n''',
          )

          replace_between(
              "frontend/src/components/Layout.jsx",
              '        <div className="premium-nav-scroll">\n',
              '\n        <div className="premium-user-panel">\n',
              '''        <div className="premium-nav-scroll">\n          <CompactSidebarNavigation\n            sections={navigationSections}\n            onNavigate={closeMobileMenu}\n          />\n        </div>\n''',
          )

          replace_between(
              "frontend/src/components/Layout.jsx",
              '        <div className="premium-user-panel">\n',
              '\n      </aside>\n',
              '''        <div className="premium-user-panel">\n          <SidebarAccountMenu\n            displayName={displayName}\n            userInitials={userInitials}\n            role={user?.role}\n            currentStoreCode={currentStoreCode}\n            currentStoreName={currentStoreName}\n            storeAccessLabel={storeAccessLabel}\n            onChangePassword={goToChangePassword}\n            onLogout={handleLogout}\n          />\n        </div>\n''',
          )

          replace_once(
              "frontend/src/pages/DebtsPage.jsx",
              '''      <CustomerDebtPrintPanel\n        currentStoreCode={currentStoreCode}\n        preferredCustomer={selectedDebt}\n      />\n''',
              '''      <CustomerDebtPrintPanel\n        currentStoreCode={currentStoreCode}\n        preferredCustomer={selectedDebt}\n        reportType="debt"\n      />\n''',
          )
          PY

      - name: Remove temporary staging files
        run: |
          rm -rf .release-parts
          rm -f .github/workflows/temp-finalize-extraordinary-statements.yml

      - name: Verify assembled release
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check backend/routes/customerStatementWorkspaceRoutes.js
          node --check backend/server.js
          node --test backend/tests/customerStatementWorkspace.test.js
          test ! -e .release-parts
          test ! -e .github/workflows/temp-finalize-extraordinary-statements.yml

      - name: Commit and push completed release
        run: |
          git add -A
          git commit -m "feat: redesign customer statements and compact sidebar"
          git push origin HEAD:agent/extraordinary-customer-statements-sidebar
