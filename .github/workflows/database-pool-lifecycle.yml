name: Verify database pool lifecycle
on:
  push:
    branches: [production, codex/railway-runtime-costs]
    paths:
      - backend/config/db.js
      - backend/tests/database-idle-pool.test.js
      - .github/workflows/database-pool-lifecycle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:9.7.1
        env:
          MYSQL_ROOT_PASSWORD: ci-pool-only
          MYSQL_DATABASE: pool_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-pool-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run syntax-check
      - name: Run candidate backend suite
        continue-on-error: true
        run: node --test --test-reporter=tap tests/*.test.js > /tmp/candidate.tap
      - name: Run the same suite with the unchanged production pool
        continue-on-error: true
        run: |
          git show f8c86d722d9b2ddb7776622ed7a7390b78d4916d:backend/config/db.js > config/db.js
          node --test --test-reporter=tap tests/*.test.js > /tmp/baseline.tap
      - name: Restore candidate and reject any new test failures
        run: |
          git restore -- config/db.js
          node <<'NODE'
          const fs = require("node:fs");
          const assert = require("node:assert/strict");
          const failures = file => {
            const text = fs.readFileSync(file, "utf8");
            assert.match(text, /# tests \d+/, "Test runner must complete");
            return [...text.matchAll(/^\s*not ok \d+ - (.+)$/gm)].map(match => match[1]).sort();
          };
          const before = failures("/tmp/baseline.tap");
          const after = failures("/tmp/candidate.tap");
          assert.deepEqual(after, before, "The pool change must introduce no new backend failures");
          if (before.length) console.log("::warning::" + before.length + " existing backend test failures are unchanged; see artifacts.");
          NODE
      - name: Preserve baseline and candidate test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool-backend-comparison
          path: /tmp/*.tap
      - name: Verify production idle eviction and reconnection
        env:
          NODE_ENV: production
          RUN_POOL_COST_TEST: "1"
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: ci-pool-only
          DB_NAME: pool_test
          DB_CONNECTION_LIMIT: "5"
          DB_IDLE_TIMEOUT_MS: "60000"
          DB_SSL: "false"
        run: node --test tests/database-idle-pool.test.js
