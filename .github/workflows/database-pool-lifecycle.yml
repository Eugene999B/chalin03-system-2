name: Verify database pool lifecycle
on:
  push:
    branches: [production, codex/railway-runtime-costs, codex/chalin03-reliability]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'database/**'
      - .github/workflows/database-pool-lifecycle.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:9.7.1
        env:
          MYSQL_ROOT_PASSWORD: ci-pool-only
          MYSQL_DATABASE: pool_test
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-pool-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run syntax-check
      - name: Run strict backend suite
        run: npm test
      - name: Verify production idle eviction and reconnection
        env:
          NODE_ENV: production
          RUN_POOL_COST_TEST: "1"
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: ci-pool-only
          DB_NAME: pool_test
          DB_CONNECTION_LIMIT: "5"
          DB_IDLE_TIMEOUT_MS: "60000"
          DB_SSL: "false"
        run: node --test tests/database-idle-pool.test.js
      - name: Exercise additive storage migration twice on isolated fixtures
        env:
          RUN_STORAGE_MIGRATION_TEST: "1"
        run: node --test tests/object-storage-migration-integration.test.js
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run every frontend test script
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const scripts = JSON.parse(readFileSync('package.json', 'utf8')).scripts.test.split(' && ');
          let failed = 0;
          for (const command of scripts) {
            const [bin, ...args] = command.split(' ');
            const result = spawnSync(bin, args, { encoding: 'utf8' });
            if (result.status !== 0) {
              failed++;
              console.log('::group::FAILED ' + command);
              console.log(result.stdout, result.stderr);
              console.log('::endgroup::');
            } else console.log('PASS ' + command);
          }
          process.exitCode = failed ? 1 : 0;
          NODE
      - run: npm run lint
        if: always()
      - run: npm run build
        if: always()
      - name: Verify Pages HTTP routing with the built site
        if: always()
        run: |
          npx --yes wrangler@4 pages dev dist --port 8799 > /tmp/pages.log 2>&1 &
          trap 'cat /tmp/pages.log' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8799/ > /dev/null; then break; fi
            sleep 2
          done
          for route in /login /owner-recovery /equipment-installment-finance/applications /mining/reports; do
            curl -fsS "http://localhost:8799$route" | grep 'id="root"'
          done
          test "$(curl -s -o /tmp/missing-asset -w '%{http_code}' http://localhost:8799/assets/does-not-exist.js)" = "404"
          ! grep -q 'id="root"' /tmp/missing-asset
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-verified-build
          path: frontend/dist
