name: Apply Worker ID Upgrade

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/release-3f-d2-worker-id-card

permissions:
  contents: write

jobs:
  apply-upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-3f-d2-worker-id-card
          fetch-depth: 0

      - name: Normalize one-time patch markers
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          script_path = Path('.github/scripts/apply_worker_id_upgrade.py')
          text = script_path.read_text(encoding='utf-8')
          text = text.replace("MIGRATION = r'''-- CHALIN 03 RELEASE 3F-D2", 'MIGRATION = r"""-- CHALIN 03 RELEASE 3F-D2', 1)
          text = text.replace("\n'''\n\nTEST = r'''const test", "\n\"\"\"\n\nTEST = r'''const test", 1)
          script_path.write_text(text, encoding='utf-8')

          settings_path = Path('backend/routes/settingsRoutes.js')
          settings = settings_path.read_text(encoding='utf-8')
          settings, count = re.subn(
              r'\n\s+receipt_footer = \?,\n\s+receipt_prefix = \?',
              '\n            receipt_footer = ?,\n            receipt_prefix = ?',
              settings,
              count=1,
          )
          if count != 1:
              raise RuntimeError('Could not normalize the settings SQL marker.')
          settings_path.write_text(settings, encoding='utf-8')

          worker_path = Path('frontend/src/pages/ExpandedWorkerProfilePage.jsx')
          worker = worker_path.read_text(encoding='utf-8')
          worker, count = re.subn(
              r'\n\s+>\n\s+Print ID Card\n\s+</button>',
              '\n                        >\n                          Print ID Card\n                        </button>',
              worker,
              count=1,
          )
          if count != 1:
              raise RuntimeError('Could not normalize the worker ID action marker.')
          worker_path.write_text(worker, encoding='utf-8')
          PY

      - name: Apply Release 3F-D2 patch
        run: |
          set -o pipefail
          python .github/scripts/apply_worker_id_upgrade.py 2>&1 | tee worker-id-patch.log

      - name: Preserve patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-id-patch-log
          path: worker-id-patch.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Remove one-time patch files
        run: |
          rm -f .github/scripts/apply_worker_id_upgrade.py
          rm -f .github/workflows/apply-worker-id-upgrade.yml
          rm -f worker-id-patch.log

      - name: Commit upgraded worker identity package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: upgrade worker identity cards"
          git push origin HEAD:agent/release-3f-d2-worker-id-card
