name: Payroll Payslip Phase 5 Integration Helper

on:
  push:
    branches:
      - feature/payroll-professional-payslips-phase5-20260810
    paths:
      - .github/workflows/payroll-payslip-phase5-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/payroll-professional-payslips-phase5-20260810
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Apply deterministic server and reversal integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          server = Path('backend/server.js')
          text = server.read_text()

          old = 'const payrollFoundationRoutes = require("./routes/payrollFoundationRoutes");\nconst payrollProcessingRoutes = require("./routes/payrollProcessingRoutes");\n'
          new = old + 'const payrollPayslipRoutes = require("./routes/payrollPayslipRoutes");\nconst payrollPayslipVerificationRoutes = require("./routes/payrollPayslipVerificationRoutes");\n'
          if text.count(old) != 1:
              raise SystemExit('server payroll route import marker changed')
          text = text.replace(old, new, 1)

          old = '''const generalApiLimiter = rateLimit({
            windowMs:
              Math.max(1, Number(process.env.API_RATE_LIMIT_WINDOW_MINUTES) || 15) *
              60 *
              1000,
            max: Math.max(100, Number(process.env.API_RATE_LIMIT_MAX) || 1500),
            standardHeaders: true,
            legacyHeaders: false,
            skip: (req) => req.path === "/health",
            message: {
              status: "error",
              code: "API_RATE_LIMITED",
              message: "Too many API requests. Please wait briefly and try again.",
            },
          });
'''
          new = old + '''
          const publicVerificationLimiter = rateLimit({
            windowMs: Math.max(1, Number(process.env.VERIFICATION_RATE_LIMIT_WINDOW_MINUTES) || 15) * 60 * 1000,
            max: Math.max(20, Number(process.env.VERIFICATION_RATE_LIMIT_MAX) || 120),
            standardHeaders: true,
            legacyHeaders: false,
            message: {
              status: "error",
              code: "VERIFICATION_RATE_LIMITED",
              message: "Too many verification requests. Please wait briefly and try again.",
            },
          });
'''
          if text.count(old) != 1:
              raise SystemExit('server general limiter marker changed')
          text = text.replace(old, new, 1)

          old = 'app.use(safeErrorResponseMiddleware);\n\napp.get("/", (req, res) => {\n'
          new = 'app.use(safeErrorResponseMiddleware);\n\napp.use("/api/verification", publicVerificationLimiter, payrollPayslipVerificationRoutes);\n\napp.get("/", (req, res) => {\n'
          if text.count(old) != 1:
              raise SystemExit('server public route mount marker changed')
          text = text.replace(old, new, 1)

          old = 'app.use("/api/payroll", requireAuth, payrollBoundary, payrollFoundationRoutes);\napp.use("/api/payroll", requireAuth, payrollBoundary, payrollProcessingRoutes);\n'
          new = old + 'app.use("/api/payroll", requireAuth, payrollBoundary, payrollPayslipRoutes);\n'
          if text.count(old) != 1:
              raise SystemExit('server protected payroll mount marker changed')
          text = text.replace(old, new, 1)
          server.write_text(text)

          processing = Path('backend/services/payrollProcessingService.js')
          text = processing.read_text()
          old = '''    await connection.query("UPDATE payroll_salary_payments SET payment_status = 'reversed' WHERE id = ?", [request.payment_id]);
            await connection.query(
              `UPDATE payroll_adjustment_requests
'''
          new = '''    await connection.query("UPDATE payroll_salary_payments SET payment_status = 'reversed' WHERE id = ?", [request.payment_id]);
            await connection.query(
              `UPDATE payroll_payslips
               SET issue_status = 'revoked', revoked_by = ?, revoked_at = CURRENT_TIMESTAMP,
                   revocation_reason = ?
               WHERE payroll_entry_id = ? AND issue_status = 'current'`,
              [actorId, `Automatically revoked after approved salary payment reversal ${request.id}.`, request.payroll_entry_id]
            );
            await connection.query(
              `UPDATE payroll_adjustment_requests
'''
          if text.count(old) != 1:
              raise SystemExit('approved reversal marker changed')
          text = text.replace(old, new, 1)
          processing.write_text(text)
          PY
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Syntax check
        working-directory: backend
        run: npm run syntax-check
      - name: Remove helper and commit product integration
        shell: bash
        run: |
          rm .github/workflows/payroll-payslip-phase5-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js backend/services/payrollProcessingService.js .github/workflows/payroll-payslip-phase5-integrate.yml
          git commit -m "Integrate professional payroll payslips"
          git push origin HEAD:feature/payroll-professional-payslips-phase5-20260810
