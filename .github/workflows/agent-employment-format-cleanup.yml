name: Clean employment release formatting

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  clean-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/standalone-employment-documents-signature

      - name: Clean link guard formatting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/routes/standaloneHrDocumentRoutes.js')
          source = path.read_text()
          old = '''    if (!["issued", "acknowledged"].includes(document.status)) {
            return res.status(409).json({
              status: "error",
              message: "Approve and issue the document before linking it to a worker profile.",
            });
          }'''
          new = '''    if (!["issued", "acknowledged"].includes(document.status)) {
              return res.status(409).json({
                status: "error",
                message: "Approve and issue the document before linking it to a worker profile.",
              });
            }'''
          if old not in source:
              raise SystemExit('Expected link guard formatting block not found.')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Commit formatting cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/standaloneHrDocumentRoutes.js
          git commit -m "Clean standalone employment link guard formatting"
          git push origin HEAD
