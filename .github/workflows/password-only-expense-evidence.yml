name: Password-Only Login and Expense Evidence

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "backend/routes/passkeyRoutes.js"
      - "backend/routes/biometricRoutes.js"
      - "backend/routes/accountingIntelligenceRoutes.js"
      - "backend/services/expenseFundingEvidenceService.js"
      - "backend/tests/bankBiometricLoginContract.test.js"
      - "backend/tests/passkeyRouteContract.test.js"
      - "backend/tests/webPasskeyRetirementExpenseEvidence.test.js"
      - "frontend/src/utils/biometricAccess.js"
      - "frontend/src/pages/ChangePasswordPage.jsx"
      - "frontend/src/components/AdvancedAccountingExpenseFundingEvidence.jsx"
      - "frontend/src/main.jsx"
      - "frontend/scripts/commandGateReleaseTests.mjs"
      - "frontend/scripts/expenseFundingEvidenceTests.mjs"
      - "frontend/package.json"
      - ".github/workflows/password-only-expense-evidence.yml"

permissions:
  contents: read

concurrency:
  group: password-only-expense-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Focused backend security and accounting tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Check changed backend syntax
        run: |
          node --check routes/passkeyRoutes.js
          node --check routes/biometricRoutes.js
          node --check routes/accountingIntelligenceRoutes.js
          node --check services/expenseFundingEvidenceService.js
      - name: Run focused contracts
        run: >-
          node --test
          tests/bankBiometricLoginContract.test.js
          tests/passkeyRouteContract.test.js
          tests/webPasskeyRetirementExpenseEvidence.test.js
          tests/release3FC3MobileIdExpenseFunding.test.js

  frontend:
    name: Focused frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run focused source contracts
        run: |
          node scripts/commandGateReleaseTests.mjs
          node scripts/expenseFundingEvidenceTests.mjs
      - name: Lint changed frontend files
        run: >-
          npx eslint
          src/utils/biometricAccess.js
          src/pages/ChangePasswordPage.jsx
          src/components/AdvancedAccountingExpenseFundingEvidence.jsx
          src/main.jsx
      - name: Build production frontend
        run: npm run build
