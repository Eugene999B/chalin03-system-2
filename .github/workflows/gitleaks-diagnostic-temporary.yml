name: Temporary Gitleaks Diagnostic

on:
  push:
    branches:
      - 'agent/opening-deposit-production-gate-20260826'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks metadata-only diagnostic
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . \
            --redact \
            --exit-code 0 \
            --report-format json \
            --report-path /repo/gitleaks-diagnostic.json \
            --log-level info
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('gitleaks-diagnostic.json', 'utf8'));
          const safe = report.map(({RuleID, Description, File, Commit, StartLine, EndLine, Author, Date}) => ({RuleID, Description, File, Commit, StartLine, EndLine, Author, Date}));
          console.log(JSON.stringify({count: safe.length, findings: safe}, null, 2));
          NODE
