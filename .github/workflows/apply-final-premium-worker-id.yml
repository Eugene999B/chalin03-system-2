name: Apply Final Premium Worker ID

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-premium-worker-id:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/final-premium-worker-id'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out premium worker ID branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-premium-worker-id
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Update backend dependency lock
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts

      - name: Apply verified wiring and worker form changes
        run: python .github/scripts/apply_final_premium_worker_id.py

      - name: Install and test backend
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Install, test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npx eslint src/pages/ExpandedWorkerProfilePage.jsx
          npm run build

      - name: Commit verified premium worker ID wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/package.json \
            backend/package-lock.json \
            backend/routes/workerPrintRoutes.js \
            backend/server.js \
            frontend/src/pages/ExpandedWorkerProfilePage.jsx
          git commit -m "feat: activate approved premium worker ID and QR verification"
          git push origin HEAD:agent/final-premium-worker-id
