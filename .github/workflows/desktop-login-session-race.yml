name: Desktop Login Session Race Hotfix

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/src/api/axiosClient.js"
      - "frontend/scripts/desktopSessionRaceHotfixTests.mjs"
      - ".github/workflows/desktop-login-session-race.yml"

permissions:
  contents: read

concurrency:
  group: desktop-login-session-race-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate desktop login session preservation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run desktop session race contract
        run: node scripts/desktopSessionRaceHotfixTests.mjs
      - name: Lint axios client
        run: npx eslint src/api/axiosClient.js
      - name: Build production frontend
        run: npm run build
