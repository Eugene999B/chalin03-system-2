name: Patch Maintenance Generator Whitespace Matching

on:
  push:
    branches:
      - agent/post-phase1-full-system-audit
    paths:
      - ".github/workflows/patch-maintenance-generator-whitespace.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-phase1-full-system-audit
          fetch-depth: 0
      - name: Add unique whitespace-tolerant fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/generate_post_phase1_maintenance_reset_fix.py')
          lines = path.read_text().splitlines()

          starts = [i for i, line in enumerate(lines) if line.startswith('def replace_exact(')]
          ends = [i for i, line in enumerate(lines) if line.startswith('def replace_pattern(')]
          if len(starts) != 1 or len(ends) != 1 or ends[0] <= starts[0]:
              raise SystemExit('Could not resolve generator helper boundaries uniquely.')

          replacement = [
              'def replace_exact(source: str, old: str, new: str, label: str) -> str:',
              '    exact_count = source.count(old)',
              '    if exact_count == 1:',
              '        return source.replace(old, new, 1)',
              '    if exact_count > 1:',
              '        raise SystemExit(f"{label} was found {exact_count} times instead of once.")',
              '',
              '    tokens = old.split()',
              '    if not tokens:',
              '        raise SystemExit(f"{label} has an empty source pattern.")',
              '    pattern = re.compile(r"\\s+".join(re.escape(token) for token in tokens), re.M)',
              '    matches = list(pattern.finditer(source))',
              '    if len(matches) != 1:',
              '        raise SystemExit(',
              '            f"{label} matched {len(matches)} whitespace-normalized blocks instead of once."',
              '        )',
              '    match = matches[0]',
              '    return source[: match.start()] + new + source[match.end() :]',
              '',
              '',
          ]

          path.write_text('\n'.join(lines[:starts[0]] + replacement + lines[ends[0]:]) + '\n')
          PY
          python3 -m py_compile .github/scripts/generate_post_phase1_maintenance_reset_fix.py
          git config user.name "chalin03-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scripts/generate_post_phase1_maintenance_reset_fix.py
          git rm -f .github/workflows/maintenance-generator-diagnostic.yml
          git rm -f .github/workflows/patch-maintenance-generator-whitespace.yml
          git commit -m "Make maintenance generator multiline matching robust"
          git push origin HEAD:agent/post-phase1-full-system-audit
