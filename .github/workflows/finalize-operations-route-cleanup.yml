name: Finalize Operations Route Cleanup

on:
  push:
    branches:
      - agent/operations-request-validation
    paths:
      - .github/workflows/finalize-operations-route-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operations-request-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Clean sanitized route handlers
        run: |
          python3 <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          expense = Path("backend/routes/expenseRoutes.js")
          source = expense.read_text()
          old_expense = "\n".join([
              "      const {",
              "    category,",
              "    description,",
              "    amount: cleanAmount,",
              "    payment_method: paymentMethod,",
              "    funding_source: fundingSource,",
              "    affects_daily_closing: affectsDailyClosing,",
              "    closing_treatment_note: closingTreatmentNote,",
              "    expense_date: expenseDate,",
              "  } = req.validated.body;",
              "",
              "      if (!category || !expenseDate || req.body.amount === undefined || req.body.amount === null) {",
          ])
          new_expense = "\n".join([
              "      const {",
              "        category,",
              "        description,",
              "        amount: cleanAmount,",
              "        payment_method: paymentMethod,",
              "        funding_source: fundingSource,",
              "        affects_daily_closing: affectsDailyClosing,",
              "        closing_treatment_note: closingTreatmentNote,",
              "        expense_date: expenseDate,",
              "      } = req.validated.body;",
              "",
              "      if (!category || !expenseDate || cleanAmount === undefined || cleanAmount === null) {",
          ])
          expense.write_text(one(source, old_expense, new_expense, "expense cleanup"))

          transfer = Path("backend/routes/stockTransferRoutes.js")
          source = transfer.read_text()
          old_transfer = "\n".join([
              "    const {",
              "    from_branch_id: fromBranchId,",
              "    to_branch_id: toBranchId,",
              "    request_note: requestNote,",
              "    items,",
              "  } = req.validated.body;",
          ])
          new_transfer = "\n".join([
              "    const {",
              "      from_branch_id: fromBranchId,",
              "      to_branch_id: toBranchId,",
              "      request_note: requestNote,",
              "      items,",
              "    } = req.validated.body;",
          ])
          transfer.write_text(one(source, old_transfer, new_transfer, "transfer cleanup"))
          PY
      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          node --check routes/expenseRoutes.js
          node --check routes/stockTransferRoutes.js
          node --test tests/operationsRequestValidation.test.js
          npm run syntax-check
          npm test
      - name: Publish verified cleanup
        run: |
          rm .github/workflows/finalize-operations-route-cleanup.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/expenseRoutes.js backend/routes/stockTransferRoutes.js .github/workflows/finalize-operations-route-cleanup.yml
          git commit -m "clean operations validation route handlers"
          git push origin HEAD:agent/operations-request-validation
