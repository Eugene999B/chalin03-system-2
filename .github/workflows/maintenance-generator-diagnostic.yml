name: Maintenance Reset Generator Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/maintenance-generator-diagnostic.yml"
      - ".github/scripts/generate_post_phase1_maintenance_reset_fix.py"
      - "backend/routes/maintenanceRoutes.js"
      - "frontend/src/pages/MaintenancePage.jsx"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Run maintenance reset generator
        shell: bash
        run: |
          set +e
          python3 .github/scripts/generate_post_phase1_maintenance_reset_fix.py > /tmp/generator.log 2>&1
          code=$?
          tail -n 8 /tmp/generator.log
          exit "$code"
