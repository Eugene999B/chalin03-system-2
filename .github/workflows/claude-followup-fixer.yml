name: Claude Follow-Up Hardening Fixer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.head_ref == 'agent/claude-followup-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent/claude-followup-hardening
          fetch-depth: 0

      - name: Apply exact reviewed hardening changes
        run: |
          if [ ! -f .github/scripts/apply_claude_followup_hardening.py ]; then
            echo "Hardening changes were already applied."
            touch .fixer-already-applied
            exit 0
          fi
          python3 .github/scripts/apply_claude_followup_hardening.py
          node --check backend/routes/release2FinalRoutes.js
          node --check backend/routes/dailyClosingRoutes.js
          node --check backend/tests/claudeFollowupHardening.test.js
          git diff --check
          git status --short

      - name: Commit exact hardening changes
        run: |
          if [ -f .fixer-already-applied ]; then
            exit 0
          fi
          git config user.name "chalin03-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/scripts/apply_claude_followup_hardening.py
          git add backend/routes/release2FinalRoutes.js
          git add backend/routes/dailyClosingRoutes.js
          git add backend/tests/claudeFollowupHardening.test.js
          git add docs/RELEASE_2026-07-25_PHASE1_POST_PHASE1.md
          git diff --cached --name-only
          git diff --cached --quiet -- backend/routes/release2FinalRoutes.js && exit 1 || true
          git diff --cached --quiet -- backend/routes/dailyClosingRoutes.js && exit 1 || true
          git diff --cached --quiet -- backend/tests/claudeFollowupHardening.test.js && exit 1 || true
          git diff --cached --quiet -- docs/RELEASE_2026-07-25_PHASE1_POST_PHASE1.md && exit 1 || true
          git commit -m "Harden Owner login and Daily Closing correction evidence"
          git push origin HEAD:agent/claude-followup-hardening
