name: Temporary debt identity and photo repair

on:
  push:
    branches:
      - fix/debt-identity-photo-final

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/debt-identity-photo-final
          fetch-depth: 0

      - name: Patch canonical debt identity and photo presentation
        shell: python
        run: |
          from pathlib import Path

          debt = Path('backend/routes/debtRoutes.js')
          text = debt.read_text(encoding='utf-8')

          old = """    COALESCE(NULLIF(s.customer_name, ''), NULLIF(c.name, ''), NULLIF(d.customer_name, ''), 'Unnamed Customer') AS customer_name,\n    COALESCE(NULLIF(s.customer_phone, ''), NULLIF(c.phone, ''), NULLIF(d.customer_phone, '')) AS customer_phone,"""
          new = """    COALESCE(NULLIF(c.name, ''), NULLIF(d.customer_name, ''), NULLIF(s.customer_name, ''), 'Unnamed Customer') AS customer_name,\n    COALESCE(NULLIF(c.phone, ''), NULLIF(d.customer_phone, ''), NULLIF(s.customer_phone, '')) AS customer_phone,"""
          if text.count(old) != 1:
              raise SystemExit(f'currentIdentitySelect pattern count={text.count(old)}')
          text = text.replace(old, new)

          old = """       COALESCE(\n         MAX(CASE\n           WHEN NULLIF(s.customer_name, '') IS NOT NULL\n            AND TRIM(s.customer_name) <> TRIM(COALESCE(d.customer_name, ''))\n           THEN s.customer_name\n         END),\n         MAX(NULLIF(c.name, '')),\n         MAX(NULLIF(s.customer_name, '')),\n         MAX(NULLIF(d.customer_name, '')),\n         'Unnamed Customer'\n       ) AS customer_name,\n       COALESCE(\n         MAX(CASE\n           WHEN NULLIF(s.customer_phone, '') IS NOT NULL\n            AND TRIM(s.customer_phone) <> TRIM(COALESCE(d.customer_phone, ''))\n           THEN s.customer_phone\n         END),\n         MAX(NULLIF(c.phone, '')),\n         MAX(NULLIF(s.customer_phone, '')),\n         MAX(NULLIF(d.customer_phone, ''))\n       ) AS customer_phone,"""
          new = """       COALESCE(\n         MAX(NULLIF(c.name, '')),\n         MAX(NULLIF(d.customer_name, '')),\n         MAX(NULLIF(s.customer_name, '')),\n         'Unnamed Customer'\n       ) AS customer_name,\n       COALESCE(\n         MAX(NULLIF(c.phone, '')),\n         MAX(NULLIF(d.customer_phone, '')),\n         MAX(NULLIF(s.customer_phone, ''))\n       ) AS customer_phone,"""
          if text.count(old) != 1:
              raise SystemExit(f'loadDebtDeskAccounts identity pattern count={text.count(old)}')
          debt.write_text(text.replace(old, new), encoding='utf-8')

          image = Path('frontend/src/styles/equipmentCatalogueImageFix.css')
          image.write_text("""\n/* Equipment catalogue: always show the complete machine photo. */\n.equipment-catalogue .equipment-card__image img,\n.equipment-catalogue .equipment-detail__cover img,\n.equipment-catalogue .equipment-detail__gallery article img {\n  object-fit: contain;\n  object-position: center;\n}\n\n.equipment-catalogue .equipment-card__image img {\n  padding: 10px;\n  background: #eef3f7;\n}\n\n.equipment-catalogue .equipment-detail__cover {\n  grid-template-columns: 1fr;\n}\n\n.equipment-catalogue .equipment-detail__cover img {\n  width: 100%;\n  height: clamp(320px, 52vh, 620px);\n  min-height: 320px;\n  padding: 18px;\n  background: #071d35;\n}\n\n.equipment-catalogue .equipment-detail__cover > div {\n  padding: 22px 24px 26px;\n}\n\n.equipment-catalogue .equipment-detail__gallery article img {\n  padding: 4px;\n  background: #eef3f7;\n}\n""", encoding='utf-8')

          if 'equipmentCatalogueImageFix.css' not in Path('frontend/src/pages/EquipmentCataloguePage.jsx').read_text(encoding='utf-8'):
              raise SystemExit('image fix stylesheet is not imported')

      - name: Validate syntax
        run: |
          node --check backend/routes/debtRoutes.js

      - name: Remove temporary repair job and branch seed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temporary-debt-photo-repair.yml
          git rm .github/temporary-repair-note.txt
          git add backend/routes/debtRoutes.js frontend/src/styles/equipmentCatalogueImageFix.css
          git diff --cached --check
          git commit -m 'fix: preserve canonical debt identities and fully display equipment photos'
          git push origin HEAD:fix/debt-identity-photo-final
