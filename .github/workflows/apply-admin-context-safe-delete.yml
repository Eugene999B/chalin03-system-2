name: Apply Admin Context Safe Delete

on:
  push:
    branches:
      - agent/admin-context-safe-delete

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip apply]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/admin-context-safe-delete
          fetch-depth: 0

      - name: Apply reviewed source transformations
        run: python3 .github/scripts/apply_admin_context_safe_delete.py

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify backend syntax
        working-directory: backend
        run: npm run syntax-check

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Commit verified implementation
        run: |
          git config user.name "Chalin 03 Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            backend/routes/miningRoutes.js \
            backend/routes/workspaceAdminRoutes.js \
            backend/services/workspaceContextDeletionService.js \
            backend/tests/workspaceContextSafeDelete.test.js \
            frontend/src/pages/MiningOperationsPage.jsx \
            frontend/src/pages/WorkspaceAdministrationPage.jsx \
            frontend/src/styles/mining.css
          git diff --cached --exit-code && {
            echo "Expected implementation changes were not staged."
            exit 1
          } || true
          git commit -m "Add safe administrator deletion for Mining and Hire contexts [skip apply]"
          git push origin HEAD:agent/admin-context-safe-delete
