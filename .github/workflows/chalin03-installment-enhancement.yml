name: Chalin03 Installment Enhancement

'on':
  push:
    branches:
      - fix/installment-finance-enhancement

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Apply isolated Installment Finance patch
        run: python tools/apply_installment_finance_enhancement.py
      - name: Normalize regression test paths for backend working directory
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/tests/equipmentFinanceInstallmentEnhancements.test.js')
          s = p.read_text()
          s = s.replace('fs.readFileSync("backend/routes/equipmentFinanceIndependentRoutes.js", "utf8")', 'fs.readFileSync("routes/equipmentFinanceIndependentRoutes.js", "utf8")')
          s = s.replace('fs.readFileSync("backend/routes/equipmentFinanceCustomerPhotoCaptureRoutes.js", "utf8")', 'fs.readFileSync("routes/equipmentFinanceCustomerPhotoCaptureRoutes.js", "utf8")')
          s = s.replace('fs.readFileSync("frontend/src/components/EquipmentFinanceCustomerPhotoPanel.jsx", "utf8")', 'fs.readFileSync("../frontend/src/components/EquipmentFinanceCustomerPhotoPanel.jsx", "utf8")')
          s = s.replace('fs.readFileSync("frontend/src/App.jsx", "utf8")', 'fs.readFileSync("../frontend/src/App.jsx", "utf8")')
          s = s.replace('fs.readFileSync("frontend/src/layouts/InstallmentFinanceLayout.jsx", "utf8")', 'fs.readFileSync("../frontend/src/layouts/InstallmentFinanceLayout.jsx", "utf8")')
          p.write_text(s)
          PY
      - name: Validate backend
        working-directory: backend
        run: |
          npm ci
          node --check routes/equipmentFinanceCustomerPhotoCaptureRoutes.js
          node --check routes/equipmentFinanceIndependentRoutes.js
          node tests/equipmentFinanceInstallmentEnhancements.test.js
      - name: Validate frontend production build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit validated feature and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/utils/equipmentFinanceCustomerPhoto.js frontend/src/components/EquipmentFinanceCustomerPhotoPanel.jsx frontend/src/pages/EquipmentFinanceSmsHistoryPage.jsx frontend/src/App.jsx frontend/src/layouts/InstallmentFinanceLayout.jsx backend/routes/equipmentFinanceCustomerPhotoCaptureRoutes.js backend/routes/equipmentFinanceIndependentRoutes.js backend/tests/equipmentFinanceInstallmentEnhancements.test.js tools/apply_installment_finance_enhancement.py .github/workflows/chalin03-installment-enhancement.yml
          git commit -m 'feat: improve installment customer photo sms history and equipment status'
          git rm .github/workflows/chalin03-installment-enhancement.yml tools/apply_installment_finance_enhancement.py
          git commit -m 'chore: remove one-off installment enhancement tooling'
          git push origin HEAD:fix/installment-finance-enhancement
