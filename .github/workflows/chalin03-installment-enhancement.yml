name: Chalin03 Installment Enhancement

on:
  push:
    branches: [fix/installment-finance-enhancement]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch installment-only Finance features
        shell: python
        run: |
          from pathlib import Path

          p = Path('frontend/src/utils/equipmentFinanceCustomerPhoto.js')
          s = p.read_text()
          if 'const PASSPORT_RATIO = 35 / 45;' not in s:
              s = s.replace('const MAX_DIMENSION = 1280;\n', 'const MAX_DIMENSION = 1400;\nconst PASSPORT_RATIO = 35 / 45;\nconst PASSPORT_HEIGHT = 900;\n', 1)
          old = '''  const width = Math.max(1, Math.round(image.naturalWidth * scale));\n  const height = Math.max(1, Math.round(image.naturalHeight * scale));\n  const canvas = document.createElement("canvas");\n  canvas.width = width;\n  canvas.height = height;'''
          new = '''  const scaledWidth = Math.max(1, Math.round(image.naturalWidth * scale));\n  const scaledHeight = Math.max(1, Math.round(image.naturalHeight * scale));\n  const targetWidth = Math.round(PASSPORT_HEIGHT * PASSPORT_RATIO);\n  const targetHeight = PASSPORT_HEIGHT;\n  const sourceRatio = scaledWidth / scaledHeight;\n  const cropWidth = sourceRatio > PASSPORT_RATIO ? Math.round(scaledHeight * PASSPORT_RATIO) : scaledWidth;\n  const cropHeight = sourceRatio > PASSPORT_RATIO ? scaledHeight : Math.round(scaledWidth / PASSPORT_RATIO);\n  const cropX = Math.max(0, Math.round((scaledWidth - cropWidth) / 2));\n  const cropY = Math.max(0, Math.round((scaledHeight - cropHeight) / 2));\n  const canvas = document.createElement("canvas");\n  canvas.width = targetWidth;\n  canvas.height = targetHeight;'''
          if old not in s: raise SystemExit('passport photo sizing block not found')
          s = s.replace(old, new, 1)
          s = s.replace('  context.drawImage(image, 0, 0, width, height);', '  context.drawImage(image, cropX / scale, cropY / scale, cropWidth / scale, cropHeight / scale, 0, 0, targetWidth, targetHeight);', 1)
          s = s.replace('    width,\n    height,\n', '    width: targetWidth,\n    height: targetHeight,\n', 1)
          s = s.replace('    compressed: true,\n', '    compressed: true,\n    passport_crop: true,\n    passport_ratio: "35:45",\n', 1)
          p.write_text(s)

          p = Path('backend/routes/equipmentFinanceCustomerPhotoCaptureRoutes.js')
          s = p.read_text()
          if 'const sharp = require("sharp");' not in s:
              s = s.replace('const express = require("express");\n', 'const express = require("express");\nconst sharp = require("sharp");\n', 1)
          marker = 'function successfulCreation(res, payload) {'
          fn = '''async function normalizeCustomerPassportPhoto(photo) {\n  const source = Buffer.from(photo.content_base64, "base64");\n  const metadata = await sharp(source, { failOn: "error" }).metadata();\n  const width = Number(metadata.width || 0);\n  const height = Number(metadata.height || 0);\n  if (!width || !height) {\n    const error = new Error("The customer picture is unreadable.");\n    error.statusCode = 400;\n    error.code = "FINANCE_CUSTOMER_PHOTO_UNREADABLE";\n    throw error;\n  }\n  const ratio = 35 / 45;\n  let cropWidth = width;\n  let cropHeight = Math.round(width / ratio);\n  if (cropHeight > height) { cropHeight = height; cropWidth = Math.round(height * ratio); }\n  const left = Math.max(0, Math.floor((width - cropWidth) / 2));\n  const top = Math.max(0, Math.floor((height - cropHeight) / 2));\n  const output = await sharp(source, { failOn: "error" })\n    .rotate()\n    .extract({ left, top, width: cropWidth, height: cropHeight })\n    .resize(700, 900, { fit: "cover", position: "centre" })\n    .jpeg({ quality: 84, mozjpeg: true, chromaSubsampling: "4:2:0" })\n    .toBuffer();\n  if (output.length > MAX_CUSTOMER_PHOTO_BYTES) {\n    const error = new Error("The normalized customer passport picture is too large.");\n    error.statusCode = 413;\n    error.code = "FINANCE_CUSTOMER_PHOTO_TOO_LARGE";\n    throw error;\n  }\n  return { ...photo, mime_type: "image/jpeg", file_name: "customer-passport-photo.jpg", content_base64: output.toString("base64"), file_size_bytes: output.length, width: 700, height: 900, passport_normalized: true };\n}\n\n'''
          if 'normalizeCustomerPassportPhoto' not in s:
              s = s.replace(marker, fn + marker, 1)
          s = s.replace('  (req, res, next) => {\n    let photo;', '  async (req, res, next) => {\n    let photo;', 1)
          s = s.replace('    if (!photo) return next();\n\n    const body = { ...(req.body || {}) };', '    if (!photo) return next();\n    photo = await normalizeCustomerPassportPhoto(photo);\n\n    const body = { ...(req.body || {}) };', 1)
          p.write_text(s)

          p = Path('backend/services/equipmentFinanceProfessionalService.js')
          s = p.read_text()
          old = '  if (machine.sale_status !== "available") missing.push("available sale status");'
          new = '  if (!["available", "installment_active"].includes(machine.sale_status)) missing.push("available sale status");'
          if old not in s: raise SystemExit('machine readiness source not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('backend/routes/equipmentFinanceIndependentRoutes.js')
          s = p.read_text()
          if '  "/sms-history",' not in s:
              marker = 'router.get(\n  "/finance-customers",'
              route = '''router.get(\n  "/sms-history",\n  requirePermission("fleet.assets.view"),\n  async (req, res, next) => {\n    try {\n      const limit = Math.min(Math.max(Number(req.query.limit || 100), 1), 200);\n      const page = Math.max(Number(req.query.page || 1), 1);\n      const offset = (page - 1) * limit;\n      const [countRows] = await pool.query(`SELECT COUNT(*) AS total_count FROM sms_log WHERE source_reference LIKE 'equipment-finance:%'`);\n      const [logs] = await pool.query(`SELECT sl.id, sl.recipient_phone, sl.message, sl.sms_type, sl.status, sl.provider, sl.provider_message_id, sl.provider_status, sl.status_reason, sl.segment_count, sl.estimated_credits, sl.sent_at, sl.submitted_at, sl.delivery_confirmed_at, sl.last_status_at, sl.source_reference, sl.created_at, u.full_name AS sent_by_name, u.username AS sent_by_username FROM sms_log sl LEFT JOIN users u ON u.id = sl.sent_by WHERE sl.source_reference LIKE 'equipment-finance:%' ORDER BY sl.id DESC LIMIT ? OFFSET ?`, [limit, offset]);\n      return res.json({ status: "success", page, limit, total_count: Number(countRows[0]?.total_count || 0), logs });\n    } catch (error) { return next(error); }\n  }\n);\n\n'''
              if marker not in s: raise SystemExit('finance customer route marker not found')
              s = s.replace(marker, route + marker, 1)
          p.write_text(s)

          Path('frontend/src/pages/EquipmentFinanceSmsHistoryPage.jsx').write_text('''import { useEffect, useState } from "react";\nimport axiosClient from "../api/axiosClient";\n\nexport default function EquipmentFinanceSmsHistoryPage() {\n  const [logs, setLogs] = useState([]);\n  const [error, setError] = useState("");\n  const [loading, setLoading] = useState(true);\n  async function load() {\n    setLoading(true); setError("");\n    try { const r = await axiosClient.get("/equipment-catalogue/sales/sms-history", { params: { limit: 200 } }); setLogs(Array.isArray(r.data?.logs) ? r.data.logs : []); }\n    catch (e) { setError(e?.response?.data?.message || "Could not load Installment SMS history."); }\n    finally { setLoading(false); }\n  }\n  useEffect(() => { load(); }, []);\n  return <main style={{ padding: 24, maxWidth: 1400, margin: "0 auto" }}>\n    <div style={{ display: "flex", justifyContent: "space-between", gap: 16, alignItems: "center", marginBottom: 20 }}><div><p style={{ margin: 0, color: "#66736b" }}>Equipment Installment Finance</p><h1 style={{ margin: "6px 0 0" }}>SMS History</h1><p style={{ margin: "8px 0 0", color: "#647169" }}>Installment Finance SMS attempts and delivery status.</p></div><button type="button" onClick={load} disabled={loading}>{loading ? "Refreshing…" : "Refresh"}</button></div>\n    {error ? <div role="alert" style={{ marginBottom: 16, padding: 14, borderRadius: 12, background: "#fff1f0", color: "#9c2d25" }}>{error}</div> : null}\n    <div style={{ overflowX: "auto", border: "1px solid #d9e2dc", borderRadius: 14 }}><table style={{ width: "100%", minWidth: 980, borderCollapse: "collapse" }}><thead><tr>{["Date / Time","Phone","Type","Message","Status","Provider","Sent By"].map((h) => <th key={h} style={{ textAlign: "left", padding: 12, background: "#f5f8f6", borderBottom: "1px solid #d9e2dc" }}>{h}</th>)}</tr></thead><tbody>{logs.map((log) => <tr key={log.id}><td style={{ padding: 12, verticalAlign: "top" }}>{new Date(log.submitted_at || log.created_at).toLocaleString("en-GB", { timeZone: "Africa/Accra" })}</td><td style={{ padding: 12, verticalAlign: "top" }}>{log.recipient_phone || "—"}</td><td style={{ padding: 12, verticalAlign: "top" }}>{log.sms_type || "Finance"}</td><td style={{ padding: 12, verticalAlign: "top", maxWidth: 420, whiteSpace: "pre-wrap" }}>{log.message}</td><td style={{ padding: 12, verticalAlign: "top", fontWeight: 700 }}>{log.status || "Unknown"}</td><td style={{ padding: 12, verticalAlign: "top" }}>{log.provider || "—"}</td><td style={{ padding: 12, verticalAlign: "top" }}>{log.sent_by_name || log.sent_by_username || "System"}</td></tr>)}</tbody></table>{!loading && logs.length === 0 ? <div style={{ padding: 28, textAlign: "center", color: "#6b766f" }}>No Installment Finance SMS has been recorded yet.</div> : null}</div>\n  </main>;\n}\n''')

          p = Path('frontend/src/App.jsx')
          s = p.read_text()
          if 'EquipmentFinanceSmsHistoryPage' not in s:
              import_marker = 'import EquipmentFinanceExcavatorsPage'
              if import_marker not in s: raise SystemExit('App import marker not found')
              s = s.replace(import_marker, 'import EquipmentFinanceSmsHistoryPage from "./pages/EquipmentFinanceSmsHistoryPage";\n' + import_marker, 1)
              route_marker = 'path="/equipment-installment-finance/applications"'
              if route_marker not in s: raise SystemExit('App installment route marker not found')
              s = s.replace(route_marker, 'path="/equipment-installment-finance/sms-history" element={<EquipmentFinanceSmsHistoryPage />} />\n          ' + route_marker, 1)
          p.write_text(s)

          for file_name in [
              'backend/services/equipmentFinancePhaseSixService.js',
              'backend/services/equipmentFinanceProfessionalReminderService.js',
              'backend/services/equipmentFinanceOperationalPolishService.js',
          ]:
              p = Path(file_name)
              if not p.exists(): continue
              text = p.read_text().replace('sourceReference: messageKey', 'sourceReference: `equipment-finance:${messageKey}`')
              p.write_text(text)

          Path('backend/tests/equipmentFinanceInstallmentEnhancements.test.js').write_text('''const assert = require("assert");\nconst fs = require("fs");\nconst professional = fs.readFileSync("backend/services/equipmentFinanceProfessionalService.js", "utf8");\nconst lifecycle = fs.readFileSync("backend/routes/equipmentFinanceIndependentRoutes.js", "utf8");\nconst photo = fs.readFileSync("backend/routes/equipmentFinanceCustomerPhotoCaptureRoutes.js", "utf8");\nassert.match(professional, /\\[\\"available\\", \\"installment_active\\"\\]\\.includes\\(machine\\.sale_status\\)/);\nassert.match(lifecycle, /\\/sms-history/);\nassert.match(lifecycle, /source_reference LIKE 'equipment-finance:%'/);\nassert.match(photo, /sharp/);\nassert.match(photo, /resize\\(700, 900/);\nconsole.log("Installment Finance enhancement regression checks passed.");\n''')

      - name: Syntax and regression checks
        run: |
          node --check backend/routes/equipmentFinanceCustomerPhotoCaptureRoutes.js
          node --check backend/routes/equipmentFinanceIndependentRoutes.js
          node --check backend/services/equipmentFinanceProfessionalService.js
          node --check backend/services/equipmentFinancePhaseSixService.js
          node --check backend/services/equipmentFinanceProfessionalReminderService.js
          node --check backend/services/equipmentFinanceOperationalPolishService.js
          node --check backend/tests/equipmentFinanceInstallmentEnhancements.test.js
          node backend/tests/equipmentFinanceInstallmentEnhancements.test.js

      - name: Commit feature patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/utils/equipmentFinanceCustomerPhoto.js frontend/src/pages/EquipmentFinanceSmsHistoryPage.jsx frontend/src/App.jsx backend/routes/equipmentFinanceCustomerPhotoCaptureRoutes.js backend/services/equipmentFinanceProfessionalService.js backend/routes/equipmentFinanceIndependentRoutes.js backend/services/equipmentFinancePhaseSixService.js backend/services/equipmentFinanceProfessionalReminderService.js backend/services/equipmentFinanceOperationalPolishService.js backend/tests/equipmentFinanceInstallmentEnhancements.test.js .github/workflows/chalin03-installment-enhancement.yml
          git commit -m 'feat: improve installment customer identity sms history and equipment status'
          git rm .github/workflows/chalin03-installment-enhancement.yml
          git commit -m 'chore: remove one-off installment enhancement workflow'
          git push origin HEAD:fix/installment-finance-enhancement
