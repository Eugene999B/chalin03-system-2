name: Apply Simple Maintenance Matcher Patch

on:
  push:
    branches:
      - agent/post-phase1-full-system-audit
    paths:
      - ".github/workflows/patch-maintenance-generator-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-phase1-full-system-audit
          fetch-depth: 0
      - name: Patch one generator block and clean helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/generate_post_phase1_maintenance_reset_fix.py')
          lines = path.read_text().splitlines()
          labels = [i for i, line in enumerate(lines) if '"Maintenance page heading",' in line]
          if len(labels) != 1:
              raise SystemExit(f'Expected one heading label, found {len(labels)}.')

          start = labels[0]
          while start >= 0 and lines[start].strip() != 'frontend = replace_exact(':
              start -= 1
          if start < 0:
              raise SystemExit('Heading replacement start not found.')

          end = labels[0] + 1
          while end < len(lines) and lines[end].strip() != ')':
              end += 1
          if end >= len(lines):
              raise SystemExit('Heading replacement end not found.')
          end += 1

          replacement = [
              '    frontend = replace_pattern(',
              '        frontend,',
              '        re.compile(',
              "            r'<h1>System Maintenance</h1>\\s*<p>\\s*Clear test data safely before the business starts real operation\\.\\s*</p>',",
              '            re.M,',
              '        ),',
              "        '''<h1>Non-Production Test Reset</h1>",
              '            <p>',
              '              Transactionally clear disposable test data outside production only.',
              "            </p>''',",
              '        "Maintenance page heading",',
              '    )',
          ]

          path.write_text('\n'.join(lines[:start] + replacement + lines[end:]) + '\n')
          PY
          python3 -m py_compile .github/scripts/generate_post_phase1_maintenance_reset_fix.py
          git config user.name "chalin03-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scripts/generate_post_phase1_maintenance_reset_fix.py
          git rm -f .github/workflows/maintenance-generator-diagnostic.yml
          git rm -f .github/workflows/patch-maintenance-generator.yml
          git rm -f .github/workflows/patch-maintenance-generator-v2.yml
          git commit -m "Make maintenance heading matcher whitespace safe"
          git push origin HEAD:agent/post-phase1-full-system-audit
