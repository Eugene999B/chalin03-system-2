name: Temporary Full-History Secret Assessment

on:
  push:
    branches:
      - agent/security-history-migration-guards
    paths:
      - .github/workflows/temporary-full-history-secret-assessment.yml
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  assess-history:
    name: Private redacted Git history scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan all Git history without printing findings
        id: gitleaks
        shell: bash
        run: |
          set +e
          mkdir -p scan-output
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . \
            --redact \
            --report-format json \
            --report-path /repo/scan-output/gitleaks-report.json \
            --exit-code 1 \
            --log-level error \
            > scan-output/gitleaks-console.log 2>&1
          status=$?
          set -e

          if [ -s scan-output/gitleaks-report.json ]; then
            count="$(jq 'length' scan-output/gitleaks-report.json)"
          else
            count=0
            printf '[]\n' > scan-output/gitleaks-report.json
          fi

          printf 'finding_count=%s\n' "$count" >> "$GITHUB_OUTPUT"
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf 'Gitleaks completed. Redacted finding count: %s\n' "$count" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private redacted assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-full-history-secret-assessment
          path: scan-output
          if-no-files-found: error
          retention-days: 7

      - name: Record assessment result
        shell: bash
        run: |
          count='${{ steps.gitleaks.outputs.finding_count }}'
          exit_code='${{ steps.gitleaks.outputs.exit_code }}'
          if [ "$exit_code" != "0" ]; then
            echo "Full-history assessment detected ${count} redacted candidate finding(s). Review the private artifact before enabling the permanent blocking gate." >&2
            exit 1
          fi
          echo 'No candidate secrets were detected in Git history.'
