name: One-time Deposit Candidates Source Repair

on:
  push:
    branches: [production]
    paths:
      - .github/workflows/one-time-deposit-candidates-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: !contains(github.event.head_commit.message, '[one-time-deposit-candidates-repair]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0

      - name: Patch the exact backend gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          middleware = Path('backend/middleware/equipmentCatalogueIntegrityMiddleware.js')
          text = middleware.read_text()
          old = '''async function enforceEquipmentCatalogueWriteIntegrity(req, res, next) {
  try {
    await ensureFoundationOnce();
  } catch (error) {
    console.error("Equipment Sales foundation preparation failed:", error);
    return res.status(503).json({
      status: "error",
      code: "EQUIPMENT_SALES_FOUNDATION_STARTUP_FAILED",
      message:
        "Equipment Sales could not be prepared safely. Existing Hire and Spare Parts operations remain available.",
    });
  }

  if (isEquipmentSalesRequest(req)) {
    return dispatchEquipmentSalesRouter(req, res, next);
  }
'''
          new = '''async function enforceEquipmentCatalogueWriteIntegrity(req, res, next) {
  const requestPath = String(req.path || "");
  const originalUrl = String(req.originalUrl || req.url || "");
  const isDepositReservationRequest =
    /^\\/sales\\/deposit-reservations(?:\\/|$)/.test(requestPath) ||
    /\\/api\\/equipment-catalogue\\/sales\\/deposit-reservations(?:\\/|$)/.test(originalUrl) ||
    /\\/sales\\/deposit-reservations(?:\\/|$)/.test(originalUrl);

  // Finance Deposit/Reservation is independently protected by its Finance
  // router. Do not make it depend on the broader Equipment Sales foundation.
  if (isDepositReservationRequest) {
    return dispatchEquipmentSalesRouter(req, res, next);
  }

  try {
    await ensureFoundationOnce();
  } catch (error) {
    console.error("Equipment Sales foundation preparation failed:", error);
    return res.status(503).json({
      status: "error",
      code: "EQUIPMENT_SALES_FOUNDATION_STARTUP_FAILED",
      message:
        "Equipment Sales could not be prepared safely. Existing Hire and Spare Parts operations remain available.",
    });
  }

  if (isEquipmentSalesRequest(req)) {
    return dispatchEquipmentSalesRouter(req, res, next);
  }
'''
          if text.count(old) != 1:
              raise SystemExit('Expected equipment catalogue middleware block was not found exactly once.')
          middleware.write_text(text.replace(old, new, 1))

          candidates = Path('backend/routes/equipmentFinanceOpeningDepositCandidateCompatibilityRoutes.js')
          text = candidates.read_text()
          old_use = '''router.use("/deposit-reservations", async (req, _res, next) => {
  try {
    await ensureDepositFoundationReady();
    return next();
  } catch (error) {
    return next(error);
  }
});

'''
          if text.count(old_use) != 1:
              raise SystemExit('Expected candidate compatibility foundation middleware was not found exactly once.')
          text = text.replace(old_use, '', 1)

          old_check = '''      const controls = await controlFoundationStatus(connection);
      if (!controls.ready) {
        throw new CandidateCompatibilityError(
          503,
          "Finance deposit controls are incomplete.",
          "EQUIPMENT_FINANCE_DEPOSIT_FOUNDATION_REQUIRED",
          controls
        );
      }

      const candidates = await listCandidates(connection);
'''
          new_check = '''      const candidates = await listCandidates(connection);
'''
          if text.count(old_check) != 1:
              raise SystemExit('Expected candidate GET readiness block was not found exactly once.')
          candidates.write_text(text.replace(old_check, new_check, 1))

          print('Source repair applied successfully.')
          PY

      - name: Verify source repair
        shell: bash
        run: |
          grep -n "isDepositReservationRequest" backend/middleware/equipmentCatalogueIntegrityMiddleware.js
          ! grep -n 'router.use("/deposit-reservations", async' backend/routes/equipmentFinanceOpeningDepositCandidateCompatibilityRoutes.js

      - name: Commit repair and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-deposit-candidates-repair.yml
          git add backend/middleware/equipmentCatalogueIntegrityMiddleware.js backend/routes/equipmentFinanceOpeningDepositCandidateCompatibilityRoutes.js .github/workflows/one-time-deposit-candidates-repair.yml
          git commit -m "fix(finance): remove duplicate deposit candidates foundation gates [one-time-deposit-candidates-repair]"
          git push origin HEAD:production
