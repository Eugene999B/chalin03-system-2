name: Phase 0 README Sync

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase0-readme-sync.yml

permissions:
  contents: write

jobs:
  sync-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-0-production-safety
          fetch-depth: 0

      - name: Synchronize production and dependency documentation
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'README.md';
          let text = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              '| Production branch | `main` |',
              '| Production deployment branch | `production` |'
            ],
            [
              '`main` deploys automatically. Never merge an unverified change into `main`.',
              '`main` is the reviewed release-candidate branch. Only `production` may trigger the live Railway and Cloudflare deployments. Never promote an unverified change to `production`.'
            ],
            [
              'Before a release task, verify current `main`, open pull requests, workflow status, Railway deployment and Cloudflare deployment instead of trusting an old hash in documentation.',
              'Before a release task, verify current `main`, the `production` promotion pull request, workflow status, Railway deployment and Cloudflare deployment instead of trusting an old hash in documentation.'
            ],
            [
              '- React Router 7',
              '- React Router 8'
            ],
            [
              '- ExcelJS',
              '- ExcelJS-compatible maintained workbook package through `backend/services/excelJsCompat.js`'
            ]
          ];

          for (const [from, to] of replacements) {
            if (!text.includes(from)) {
              throw new Error(`README synchronization target not found: ${from}`);
            }
            text = text.replace(from, to);
          }
          fs.writeFileSync(path, text);
          NODE

      - name: Commit synchronized README
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --check
          git commit -m 'Synchronize Phase 0 production documentation'
          git push origin HEAD:agent/phase-0-production-safety
