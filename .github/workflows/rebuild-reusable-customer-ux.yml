name: Rebuild reusable customer UX

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  rebuild-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply bounded customer UX redesign
        id: patch
        shell: bash
        run: |
          python scripts/rebuildReusableCustomerUx.py | tee /tmp/reusable-customer-ux-result
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/tests/customerReuseContract.test.js")
          source = path.read_text(encoding="utf-8")
          replacements = {
              "assert.match(source, /Find Existing Customer/);":
                  "assert.match(source, /Returning Customer Search/);",
              "assert.match(source, /Use New Customer Instead/);":
                  "assert.match(source, /Clear & Enter New Customer/);",
          }

          for old, new in replacements.items():
              if old in source:
                  source = source.replace(old, new, 1)
              elif new not in source:
                  raise SystemExit(f"Expected customer-search contract assertion was not found: {old}")

          path.write_text(source, encoding="utf-8")
          PY
          if grep -q '^changed=true$' /tmp/reusable-customer-ux-result; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify backend syntax and tests
        if: steps.patch.outputs.changed == 'true'
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Verify frontend tests, lint and production build
        if: steps.patch.outputs.changed == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Commit verified customer UX
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "Chalin 03 Release Automation"
          git config user.email "actions@users.noreply.github.com"
          if [ -f docs/.reusable-customer-ux-trigger ]; then
            git rm docs/.reusable-customer-ux-trigger
          fi
          git add \
            frontend/src/pages/NewSalePage.jsx \
            frontend/src/index.css \
            frontend/public/sw.js \
            backend/tests/customerReuseContract.test.js
          git diff --cached --check
          git commit -m "Redesign reusable customer search for desktop and mobile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
