name: Rebuild reusable customer UX

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  rebuild-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Move lookup below customer fields and add responsive states
        id: patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page_path = Path('frontend/src/pages/NewSalePage.jsx')
          css_path = Path('frontend/src/index.css')
          test_path = Path('backend/tests/customerReuseContract.test.js')

          page = page_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')
          changed = False

          if 'Returning Customer Search' not in page:
              old_start = '              <label>Find Existing Customer</label>'
              name_anchor = '              <label>Customer Name</label>'
              payment_anchor = '              <label>Payment Type</label>'

              start = page.find(old_start)
              end = page.find(name_anchor, start)
              if start == -1 or end == -1:
                  raise SystemExit('Existing lookup block could not be located safely.')
              page = page[:start] + page[end:]

              if page.count(payment_anchor) != 1:
                  raise SystemExit(f'Expected one Payment Type anchor, found {page.count(payment_anchor)}.')

              lookup = '''              <div className="returning-customer-card">
                <div className="returning-customer-header">
                  <div>
                    <p className="returning-customer-eyebrow">Returning Customer Search</p>
                    <strong>Search saved customers</strong>
                    <small>
                      Type at least 2 letters or digits. Select a result to fill the customer details above.
                    </small>
                  </div>

                  {selectedCustomer ? (
                    <button
                      type="button"
                      className="secondary-button returning-customer-clear"
                      onClick={useNewCustomer}
                    >
                      Clear & Enter New Customer
                    </button>
                  ) : null}
                </div>

                <label htmlFor="existing-customer-search">Search Existing Customer</label>
                <input
                  id="existing-customer-search"
                  value={customerSearch}
                  onChange={(event) => {
                    setCustomerSearch(event.target.value);
                    setSelectedCustomer(null);
                    setSelectedCustomerId("");
                  }}
                  placeholder="Search by name, phone or location"
                  autoComplete="off"
                />

                <div className="returning-customer-status" role="status" aria-live="polite">
                  {loadingCustomers ? "Searching saved customers…" : null}
                  {!loadingCustomers && customerSearch.trim().length > 0 && customerSearch.trim().length < 2
                    ? "Enter at least 2 letters or digits."
                    : null}
                  {!loadingCustomers &&
                  !selectedCustomer &&
                  customerSearch.trim().length >= 2 &&
                  customerMatches.length === 0
                    ? `No saved customer found for “${customerSearch.trim()}”. You can continue with the details above as a new customer.`
                    : null}
                </div>

                {customerMatches.length > 0 ? (
                  <div
                    className="returning-customer-results"
                    role="listbox"
                    aria-label="Saved customer matches"
                  >
                    {customerMatches.map((customer) => (
                      <button
                        key={customer.id}
                        type="button"
                        className="returning-customer-result"
                        onClick={() => selectSavedCustomer(customer)}
                        role="option"
                        aria-selected={String(selectedCustomerId) === String(customer.id)}
                      >
                        <strong>{customer.name}</strong>
                        <span>
                          {customer.phone || "No phone"}
                          {customer.location ? ` · ${customer.location}` : ""}
                        </span>
                        <small>
                          {Number(customer.purchase_count || 0)} previous purchase(s) · {formatCustomerHistoryDate(customer.last_purchase_at)}
                        </small>
                      </button>
                    ))}
                  </div>
                ) : null}

                {selectedCustomer ? (
                  <div className="returning-customer-selected">
                    <strong>Saved customer selected: {selectedCustomer.name}</strong>
                    <span>
                      Name, phone and location were copied into the customer fields above. Confirm or correct them before completing the sale.
                    </span>
                    <small>
                      {Number(selectedCustomer.purchase_count || 0)} previous purchase(s) · Total recorded GHS {formatMoney(selectedCustomer.total_spent)} · Outstanding GHS {formatMoney(selectedCustomer.outstanding_balance)}
                    </small>
                  </div>
                ) : null}
              </div>

'''
              page = page.replace(payment_anchor, lookup + payment_anchor, 1)
              page_path.write_text(page, encoding='utf-8')
              changed = True

          css_marker = '/* Returning customer search: desktop and mobile */'
          if css_marker not in css:
              css += '''

/* Returning customer search: desktop and mobile */
.returning-customer-card {
  margin: 16px 0;
  padding: 14px;
  border: 1px solid #cbd5e1;
  border-radius: 14px;
  background: #f8fafc;
}

.returning-customer-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.returning-customer-header > div {
  display: grid;
  gap: 3px;
  min-width: 0;
}

.returning-customer-header strong {
  color: #0f172a;
}

.returning-customer-header small,
.returning-customer-status {
  color: #64748b;
  line-height: 1.45;
}

.returning-customer-eyebrow {
  margin: 0;
  color: #9a6700;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.returning-customer-clear {
  flex: 0 0 auto;
}

.returning-customer-status {
  min-height: 1.25rem;
  margin-top: 6px;
  font-size: 0.75rem;
}

.returning-customer-results {
  display: grid;
  gap: 8px;
  max-height: 260px;
  margin-top: 8px;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.returning-customer-result {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid #d8dee8;
  border-radius: 11px;
  background: #ffffff;
  color: #0f172a;
  cursor: pointer;
  text-align: left;
}

.returning-customer-result:hover,
.returning-customer-result:focus-visible {
  border-color: #b38b00;
  outline: 2px solid rgba(179, 139, 0, 0.18);
  outline-offset: 1px;
}

.returning-customer-result strong,
.returning-customer-result span,
.returning-customer-result small,
.returning-customer-selected strong,
.returning-customer-selected span,
.returning-customer-selected small {
  display: block;
}

.returning-customer-result span {
  margin-top: 3px;
  color: #475569;
  font-size: 0.78rem;
}

.returning-customer-result small {
  margin-top: 3px;
  color: #64748b;
  font-size: 0.7rem;
}

.returning-customer-selected {
  display: grid;
  gap: 5px;
  margin-top: 10px;
  padding: 12px;
  border: 1px solid #a7d7c5;
  border-radius: 12px;
  background: #effaf5;
  color: #334155;
}

.returning-customer-selected strong {
  color: #0f5132;
}

.returning-customer-selected span,
.returning-customer-selected small {
  line-height: 1.45;
}

@media (max-width: 720px) {
  .returning-customer-card {
    margin: 14px 0;
    padding: 12px;
  }

  .returning-customer-header {
    align-items: stretch;
    flex-direction: column;
  }

  .returning-customer-clear {
    width: 100%;
  }

  .returning-customer-results {
    max-height: 220px;
  }

  .returning-customer-result {
    min-height: 64px;
    padding: 12px;
  }
}
'''
              css_path.write_text(css, encoding='utf-8')
              changed = True

          test_marker = 'returning customer search appears below reusable identity fields'
          if test_marker not in tests:
              tests += '''

test("returning customer search appears below reusable identity fields", () => {
  const source = read("frontend", "src", "pages", "NewSalePage.jsx");
  const nameIndex = source.indexOf("<label>Customer Name</label>");
  const locationIndex = source.indexOf("<label>Customer Location</label>");
  const searchIndex = source.indexOf("Returning Customer Search");
  const paymentIndex = source.indexOf("<label>Payment Type</label>");

  assert.ok(nameIndex >= 0, "Customer Name field must exist");
  assert.ok(locationIndex > nameIndex, "Customer Location must follow Customer Name");
  assert.ok(searchIndex > locationIndex, "Returning Customer Search must sit below customer identity fields");
  assert.ok(paymentIndex > searchIndex, "Payment controls must follow the returning-customer lookup");
  assert.match(source, /No saved customer found/);
  assert.match(source, /role="listbox"/);
  assert.match(source, /Clear & Enter New Customer/);
});
'''
              test_path.write_text(tests, encoding='utf-8')
              changed = True

          Path('/tmp/reusable-customer-ux-changed').write_text(
              'true' if changed else 'false', encoding='utf-8'
          )
          PY
          echo "changed=$(cat /tmp/reusable-customer-ux-changed)" >> "$GITHUB_OUTPUT"

      - name: Verify backend syntax and tests
        if: steps.patch.outputs.changed == 'true'
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Verify frontend tests, lint and production build
        if: steps.patch.outputs.changed == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Commit verified customer UX
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "Chalin 03 Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/NewSalePage.jsx frontend/src/index.css backend/tests/customerReuseContract.test.js
          git diff --cached --check
          git commit -m "Redesign reusable customer search for desktop and mobile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
