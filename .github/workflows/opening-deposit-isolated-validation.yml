name: Isolated Opening Deposit Validation

on:
  push:
    branches:
      - fix/opening-deposit-from-production-20260825

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check changed runner syntax
        run: node --check backend/scripts/runEquipmentFinanceOpeningDepositFoundationRepair.js
      - name: Run focused Opening Deposit test
        run: node --test backend/tests/equipmentFinanceOpeningDepositReservationGateFix.test.js
      - name: Run existing Finance deposit contract test
        run: node --test backend/tests/equipmentFinanceDepositReservationContract.test.js
