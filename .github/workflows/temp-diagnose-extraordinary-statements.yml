name: Diagnose Extraordinary Statements Finalizer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    name: Capture finalizer exception
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/extraordinary-customer-statements-sidebar
          fetch-depth: 0

      - name: Run finalizer and capture exception
        id: finalizer
        shell: bash
        run: |
          set +e
          mkdir -p diagnostic-output
          python3 scripts/finalizeExtraordinaryStatements.py > diagnostic-output/finalizer.log 2>&1
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          cat diagnostic-output/finalizer.log
          exit 0

      - name: Record source state
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostic-output
          {
            echo "Finalizer exit: ${{ steps.finalizer.outputs.exit_code }}"
            echo
            echo "Git status:"
            git status --short || true
            echo
            echo "Relevant paths:"
            find .release-parts -maxdepth 2 -type f 2>/dev/null | sort || true
            find scripts -maxdepth 2 -type f 2>/dev/null | sort || true
            find .github/workflows -maxdepth 1 -type f 2>/dev/null | sort || true
          } > diagnostic-output/state.txt

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extraordinary-statements-finalizer-diagnostic
          path: diagnostic-output
          if-no-files-found: error
          retention-days: 2

      - name: Fail after evidence upload
        if: always()
        shell: bash
        run: test "${{ steps.finalizer.outputs.exit_code }}" = "0"
