name: Equipment Finance Signature UI

on:
  pull_request:
    branches: [main, production]
    paths:
      - "frontend/src/layouts/InstallmentFinanceLayout.jsx"
      - "frontend/src/styles/equipmentFinanceSignatureShell.css"
      - "frontend/src/styles/equipmentFinanceSignaturePolish.css"
      - "frontend/src/styles/equipmentFinanceSimplifiedWorkspace.css"
      - "frontend/src/styles/equipmentFinanceThreePageRouteSignature.css"
      - "frontend/scripts/equipmentFinanceSimplifiedWorkspaceTests.mjs"
      - "frontend/scripts/equipmentFinanceThreePageSignatureTests.mjs"
      - "frontend/e2e/equipmentFinanceSignatureUi.spec.js"
      - "frontend/e2e/equipmentFinanceThreePageSignature.spec.js"
      - ".github/workflows/equipment-finance-signature-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signature-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run isolated signature UI source contracts
        run: node scripts/equipmentFinanceSimplifiedWorkspaceTests.mjs && node scripts/equipmentFinanceThreePageSignatureTests.mjs

      - name: Build production frontend
        run: npm run build

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prove desktop and mobile Installment signature UI
        run: npx playwright test e2e/equipmentFinanceSignatureUi.spec.js e2e/equipmentFinanceThreePageSignature.spec.js

      - name: Upload signature UI browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-finance-signature-ui-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
