name: Temporary Inventory Traceability UI Wiring

on:
  push:
    branches:
      - feature/inventory-loss-prevention-traceability

permissions:
  contents: write

concurrency:
  group: tmp-inventory-traceability-ui-wire
  cancel-in-progress: false

jobs:
  wire-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-loss-prevention-traceability
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply deterministic UI wiring
        run: |
          set -euo pipefail
          python .github/tmp-inventory-traceability-wire/patch.py
          rm -rf .github/tmp-inventory-traceability-wire
          rm -f .github/workflows/tmp-inventory-traceability-wire.yml

      - name: Verify frontend regression suite
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Publish verified UI wiring
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire inventory traceability workspace"
          git push origin HEAD:feature/inventory-loss-prevention-traceability
