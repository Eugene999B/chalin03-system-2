name: Repair Finance payment history pool import

on:
  push:
    branches: [production]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'Eugene999B'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production
          fetch-depth: 0
      - name: Fix import and remove patch workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/services/equipmentFinancePaymentHistoryService.js')
          s = p.read_text()
          if 'const pool = require("../config/db");' in s:
              s = s.replace('const pool = require("../config/db");', 'const { pool } = require("../config/db");', 1)
              p.write_text(s)
          w = Path('.github/workflows/fix-payment-history-pool-import.yml')
          if w.exists(): w.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/services/equipmentFinancePaymentHistoryService.js .github/workflows/fix-payment-history-pool-import.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: correct Finance payment history DB pool import'
          git push origin production
