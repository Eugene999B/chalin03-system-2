name: CHALIN03 Licensed Product Reference Photos
on:
  pull_request:
    paths:
      - 'frontend/scripts/discoverOpenverseProductPhotos.mjs'
      - '.github/workflows/chalin03-openverse-real-photo-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-licensed-photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find different real openly licensed product photos per Main Store SKU (research only)
        working-directory: frontend
        run: |
          set -o pipefail
          node scripts/discoverOpenverseProductPhotos.mjs | tee "$RUNNER_TEMP/openverse-candidates.log"
      - name: Archive photo sources, photographer and license data for staff review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chalin03-openverse-licensed-real-photo-candidates
          path: ${{ runner.temp }}/openverse-candidates.log
          if-no-files-found: warn
          retention-days: 14
