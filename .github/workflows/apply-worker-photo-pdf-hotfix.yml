name: Apply Worker Photo PDF Hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/hotfix-worker-photo-pdfs'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/hotfix-worker-photo-pdfs
          fetch-depth: 0

      - name: Install PDF image converter
        working-directory: backend
        run: npm install sharp --save

      - name: Apply worker photo PDF fix
        run: python .github/scripts/apply_worker_photo_pdf_hotfix.py

      - name: Verify backend hotfix
        working-directory: backend
        run: |
          npm run syntax-check
          npm test

      - name: Commit verified hotfix
        run: |
          rm -f .github/scripts/apply_worker_photo_pdf_hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json backend/services/pdfImageService.js backend/routes/workerPrintRoutes.js backend/tests/workerPdfPhotoRendering.test.js .github/scripts/apply_worker_photo_pdf_hotfix.py
          git commit -m "fix: render worker photos in generated PDFs"
          git push origin HEAD:agent/hotfix-worker-photo-pdfs
