name: Executive Reporting Studio Browser QA

on:
  pull_request:
    branches: [main, production]
    paths:
      - "frontend/src/components/ExecutiveReportingStudio.*"
      - "frontend/src/pages/ReportsPage.jsx"
      - "frontend/src/pages/AuditAccountingPage.jsx"
      - "frontend/src/pages/AdvancedAccountingIntelligencePage.jsx"
      - "frontend/src/pages/ExportsPage.*"
      - "frontend/e2e/managementReportingStudio.spec.js"
      - ".github/workflows/executive-reporting-studio-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reporting-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify reporting source contracts
        run: node scripts/managementReportingStudioDesignTests.mjs
      - name: Verify production build
        run: npm run build
      - name: Prepare Chromium browser test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Real desktop and mobile presentation tests
        run: npx playwright test e2e/managementReportingStudio.spec.js
      - name: Preserve visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-reporting-studio-screenshots
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
