name: Temporary Traceability Receiving and Checkout Core

on:
  push:
    branches:
      - feature/inventory-loss-prevention-traceability

permissions:
  contents: write

concurrency:
  group: tmp-traceability-core-wire
  cancel-in-progress: false

jobs:
  wire-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-loss-prevention-traceability
          fetch-depth: 1

      - name: Apply receiving and checkout wiring
        run: |
          set -euo pipefail
          python .github/tmp-traceability-core-wire/patch.py
          rm -rf .github/tmp-traceability-core-wire
          rm -f .github/workflows/tmp-traceability-core-wire.yml

      - name: Publish deterministic core wiring
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire serialized receiving and checkout traceability core"
          git push origin HEAD:feature/inventory-loss-prevention-traceability
