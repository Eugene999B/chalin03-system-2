name: Document share notification gate patch
on:
  push:
    paths: [.chalin-document-share-patch]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/installment-notification-controls-final
          fetch-depth: 0
      - name: Patch document-share sender
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('backend/services/equipmentFinanceOperationalPolishService.js')
          text=p.read_text()
          text,n=re.subn(r'(const \{ sendSmsAlertToPhone \} = require\("\.\/smsAlertService"\);\n)',lambda m:m.group(1)+'const { isNotificationEnabled } = require("./equipmentFinanceNotificationPolicyService");\n',text,count=1)
          if n!=1: raise SystemExit(f'import insertion expected 1 match, found {n}')
          text,n=re.subn(r'(async function shareMessage\(\{ channel, recipient, message, userId, sourceReference \}\) \{\n)(  if \(channel === "sms"\) \{)',lambda m:m.group(1)+'  if (!(await isNotificationEnabled("document_share"))) return { status: "skipped", skipped: true, reason: "notification_category_disabled" };\n'+m.group(2),text,count=1)
          if n!=1: raise SystemExit(f'shareMessage gate expected 1 match, found {n}')
          p.write_text(text)
          q=Path('.github/workflows/_document_share_notification_patch.yml')
          q.unlink(); Path('.chalin-document-share-patch').unlink()
      - name: Syntax check and contract test
        working-directory: backend
        run: |
          node --check services/equipmentFinanceOperationalPolishService.js
          node --check services/equipmentFinanceNotificationPolicyService.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend .github/workflows/_document_share_notification_patch.yml .chalin-document-share-patch
          git commit -m "fix: honor document share notification control"
          git push origin HEAD:feat/installment-notification-controls-final
