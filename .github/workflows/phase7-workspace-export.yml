name: Phase 7 Workspace Export

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase7-workspace-export.yml

permissions:
  contents: read

jobs:
  export-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 7 branch
        uses: actions/checkout@v4

      - name: Package repository workspace
        shell: bash
        run: |
          tar --exclude=.git -czf phase7-workspace.tar.gz .

      - name: Upload workspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase7-workspace
          path: phase7-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
