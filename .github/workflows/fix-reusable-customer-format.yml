name: Fix reusable customer formatting

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Restore bounded function indentation
        id: format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/pages/NewSalePage.jsx')
          source = path.read_text(encoding='utf-8')
          old = "\n".join([
              '  function useNewCustomer() {',
              '  setSelectedCustomerId("");',
              '  setSelectedCustomer(null);',
              '  setCustomerSearch("");',
              '  setCustomerMatches([]);',
              '  setCustomerName("");',
              '  setCustomerPhone("");',
              '  setCustomerLocation("");',
              '  setMessage("Enter the new customer\'s details. The system will save them after the sale.");',
              '}',
              '',
              'function formatCustomerHistoryDate(value) {',
          ])
          new = "\n".join([
              '  function useNewCustomer() {',
              '    setSelectedCustomerId("");',
              '    setSelectedCustomer(null);',
              '    setCustomerSearch("");',
              '    setCustomerMatches([]);',
              '    setCustomerName("");',
              '    setCustomerPhone("");',
              '    setCustomerLocation("");',
              '    setMessage("Enter the new customer\'s details. The system will save them after the sale.");',
              '  }',
              '',
              '  function formatCustomerHistoryDate(value) {',
          ])
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected one bounded formatting block, found {count}.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify backend tests
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Verify frontend tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit formatting correction
        shell: bash
        run: |
          git config user.name "Chalin 03 Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/pages/NewSalePage.jsx
          git diff --cached --check
          git commit -m "Polish reusable customer source formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
