name: User Identity Generator Diagnostics

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/user-identity-generator-diagnostics.yml"
      - ".github/scripts/generate_post_phase1_user_identity_fix.py"
  push:
    branches:
      - agent/post-phase1-full-system-audit
    paths:
      - ".github/workflows/user-identity-generator-diagnostics.yml"
      - ".github/scripts/generate_post_phase1_user_identity_fix.py"

permissions:
  contents: read

jobs:
  diagnose:
    name: Count secure-offboarding source matches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Count every expected source boundary
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re

          route = pathlib.Path('backend/routes/userRoutes.js').read_text()
          frontend = pathlib.Path('frontend/src/pages/UsersSettingsPage.jsx').read_text()
          checks = {
            'route_import': route.count('''const {
            resetAccountBySystemAdministrator,
          } = require("../services/accountRecoveryService");'''),
            'dangerous_helpers': len(re.findall(r'async function setUserReferenceToNull\([\s\S]*?\nfunction normalizeUserRow\(user\) \{', route, re.M)),
            'route_tail': len(re.findall(r'// PATCH /api/users/:id/toggle-status[\s\S]*?\nmodule\.exports = router;', route, re.M)),
            'state': frontend.count('const [deletingUserId, setDeletingUserId] = useState("");'),
            'current_capability': len(re.findall(r'function canCurrentUserDeleteAccounts\(\)\s*\{\s*return isOriginalSystemAdministrator\(currentUser\);\s*\}', frontend)),
            'user_capability': len(re.findall(r'function canDeleteThisUser\(user\)\s*\{[\s\S]*?\n  \}', frontend)),
            'delete_function': len(re.findall(r'async function deleteUserAccount\(user\)\s*\{[\s\S]*?\n  \}\n\n  async function resetUserPassword', frontend, re.M)),
            'warning_banner': len(re.findall(r'\{canCurrentUserDeleteAccounts\(\) && \([\s\S]*?\n      \)\}', frontend, re.M)),
            'staff_description_exact': frontend.count('''              Review account status, store access, reset passwords, disable staff
               accounts and protect the original system administrator.'''),
            'staff_description_flexible': len(re.findall(r'Review account status, store access, reset passwords, disable staff\s+accounts and protect the original system administrator\.', frontend)),
            'delete_button': len(re.findall(r'\{canDeleteThisUser\(user\) && \([\s\S]*?\n                              \)\}', frontend, re.M)),
          }
          pathlib.Path('user-identity-generator-diagnostics.json').write_text(json.dumps(checks, indent=2) + '\n')
          print(json.dumps(checks, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: user-identity-generator-diagnostics
          path: user-identity-generator-diagnostics.json
          retention-days: 7
