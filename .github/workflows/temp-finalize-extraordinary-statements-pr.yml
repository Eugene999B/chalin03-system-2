name: Finalize Extraordinary Statements PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    name: Assemble and verify clean feature commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/extraordinary-customer-statements-sidebar
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Assemble and integrate readable source
        run: python3 scripts/finalizeExtraordinaryStatements.py

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check backend/routes/customerStatementWorkspaceRoutes.js
          node --check backend/server.js
          node --test backend/tests/customerStatementWorkspace.test.js
          test ! -e .release-parts
          test ! -e scripts/finalizeExtraordinaryStatements.py
          test ! -e .github/workflows/temp-finalize-extraordinary-statements.yml
          test ! -e .github/workflows/temp-finalize-extraordinary-statements-pr.yml

      - name: Commit and push clean release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign customer statements and compact sidebar"
          git push origin HEAD:agent/extraordinary-customer-statements-sidebar
