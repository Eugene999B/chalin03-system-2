name: Installment notification safety patch
on:
  push:
    paths: [.chalin-notification-safety-patch]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/installment-notification-controls-final
          fetch-depth: 0
      - name: Apply safety patch
        shell: python
        run: |
          from pathlib import Path
          import re

          policy = Path('backend/services/equipmentFinanceNotificationPolicyService.js')
          policy.write_text('''const { pool } = require("../config/db");

const TABLE = "equipment_finance_notification_settings";
const CATEGORIES = Object.freeze([
  "equipment_created",
  "customer_created",
  "application_approved",
  "agreement",
  "deposit",
  "payment",
  "reminders",
  "settlement_ownership",
  "document_share",
]);
const LABELS = Object.freeze({
  equipment_created: "Equipment & machine created",
  customer_created: "Customer & account created",
  application_approved: "Credit applications approved",
  agreement: "Agreements activated",
  deposit: "Deposits & reservations",
  payment: "Payments & collections",
  reminders: "Due, overdue & arrears reminders",
  settlement_ownership: "Settlement & ownership readiness",
  document_share: "Document shares",
});
const DEFAULTS = Object.freeze(Object.fromEntries(CATEGORIES.map((key) => [key, true])));

function parseBoolean(value) {
  if ([true, 1, "1", "true", "yes", "on", "enabled"].includes(value)) return true;
  if ([false, 0, "0", "false", "no", "off", "disabled"].includes(value)) return false;
  return null;
}

async function getNotificationPolicy(connection = pool) {
  const [rows] = await connection.query(`SELECT * FROM ${TABLE} WHERE id = 1 LIMIT 1`);
  const row = rows[0];
  return Object.fromEntries(
    CATEGORIES.map((key) => [key, row ? Boolean(Number(row[key])) : DEFAULTS[key]])
  );
}

async function updateNotificationPolicy(input = {}, connection = pool) {
  const current = await getNotificationPolicy(connection);
  const next = { ...current };
  const changed = [];
  for (const key of CATEGORIES) {
    if (input[key] === undefined) continue;
    const value = parseBoolean(input[key]);
    if (value === null) {
      const error = new Error(`${LABELS[key]} setting must be true or false.`);
      error.statusCode = 400;
      error.code = "INVALID_NOTIFICATION_CONTROL";
      throw error;
    }
    next[key] = value;
    if (next[key] !== current[key]) changed.push(key);
  }
  if (!changed.length) return { changed: false, changed_categories: [], controls: current };
  const assignment = CATEGORIES.map((key) => `\\`${key}\\` = ?`).join(", ");
  await connection.query(
    `UPDATE ${TABLE} SET ${assignment}, updated_at = NOW() WHERE id = 1`,
    CATEGORIES.map((key) => (next[key] ? 1 : 0))
  );
  return { changed: true, changed_categories: changed, controls: next };
}

async function isNotificationEnabled(category, connection = pool) {
  if (!CATEGORIES.includes(String(category))) return true;
  try {
    const controls = await getNotificationPolicy(connection);
    return controls[category] === true;
  } catch (error) {
    console.warn(`Installment notification policy unavailable; blocking ${category}:`, error.message);
    return false;
  }
}

module.exports = {
  CATEGORIES,
  DEFAULTS,
  LABELS,
  getNotificationPolicy,
  isNotificationEnabled,
  updateNotificationPolicy,
};
''')

p = Path('backend/services/equipmentFinanceProfessionalService.js')
t = p.read_text()
old = 'updateNotificationPolicy(notificationInput)'
if old not in t:
    raise SystemExit('professional service updateNotificationPolicy call not found')
t = t.replace(old, 'updateNotificationPolicy(notificationInput, connection)', 1)
p.write_text(t)

w = Path('backend/services/equipmentFinanceBossAlertDeliveryBootstrap.js')
t = w.read_text()
old = 'if (/agreement.*(activat|creat)|agreement\\.activat/.test(text)) return "agreement";'
new = old + '\n  if (/settlement|ownership.*(ready|transfer)|ownership_ready/.test(text)) return "settlement_ownership";'
if old not in t:
    raise SystemExit('boss alert event mapping anchor not found')
t = t.replace(old, new, 1)
t = t.replace('settlement_ownership: "settlement_ownership",', 'settlement_ownership: "settlement_ownership",', 1) if 'settlement_ownership: "settlement_ownership"' in t else t
t = t.replace('agreement: "agreement", deposit: "deposit" }[kind]', 'agreement: "agreement", deposit: "deposit", settlement_ownership: "settlement_ownership" }[kind]', 1)
p.write_text(t)

sql = Path('database/migrations/20260904_equipment_finance_notification_controls.sql')
sql.write_text('''CREATE TABLE IF NOT EXISTS equipment_finance_notification_settings (\n    id TINYINT UNSIGNED NOT NULL PRIMARY KEY,\n    equipment_created TINYINT(1) NOT NULL DEFAULT 1,\n    customer_created TINYINT(1) NOT NULL DEFAULT 1,\n    application_approved TINYINT(1) NOT NULL DEFAULT 1,\n    agreement TINYINT(1) NOT NULL DEFAULT 1,\n    deposit TINYINT(1) NOT NULL DEFAULT 1,\n    payment TINYINT(1) NOT NULL DEFAULT 1,\n    reminders TINYINT(1) NOT NULL DEFAULT 1,\n    settlement_ownership TINYINT(1) NOT NULL DEFAULT 1,\n    document_share TINYINT(1) NOT NULL DEFAULT 1,\n    created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n    CONSTRAINT chk_equipment_finance_notification_singleton CHECK (id = 1)\n);\n\nINSERT INTO equipment_finance_notification_settings (id)\nVALUES (1)\nON DUPLICATE KEY UPDATE id = VALUES(id);\n''')

script = Path('backend/scripts/runEquipmentFinanceNotificationPolicyMigration.js')
script.write_text('''const mysql = require("mysql2/promise");\nrequire("dotenv").config();\n\nconst MIGRATION_RECORD = "20260904_equipment_finance_notification_controls";\nconst MIGRATION_LOCK = "chalin03:equipment-finance:notification-controls";\n\nfunction truthy(value) {\n  return ["1", "true", "yes", "on"].includes(String(value || "").trim().toLowerCase());\n}\n\nfunction requiredEnv(primary, fallback) {\n  const value = process.env[primary] || process.env[fallback];\n  if (!String(value || "").trim()) throw new Error(`Missing required database variable ${primary}${fallback ? ` or ${fallback}` : ""}.`);\n  return value;\n}\n\nfunction sslConfig() {\n  if (String(process.env.DB_SSL || "").trim().toLowerCase() !== "true") return undefined;\n  const encodedCa = String(process.env.DB_SSL_CA_BASE64 || "").trim();\n  if (encodedCa) return { ca: Buffer.from(encodedCa, "base64").toString("utf8"), rejectUnauthorized: true };\n  return { rejectUnauthorized: !["0", "false", "no", "off"].includes(String(process.env.DB_SSL_REJECT_UNAUTHORIZED || "true").trim().toLowerCase()) };\n}\n\nfunction connectionOptions() {\n  return {\n    host: requiredEnv("DB_HOST", "MYSQLHOST"),\n    port: Number(process.env.DB_PORT || process.env.MYSQLPORT || 3306),\n    user: requiredEnv("DB_USER", "MYSQLUSER"),\n    password: requiredEnv("DB_PASSWORD", "MYSQLPASSWORD"),\n    database: requiredEnv("DB_NAME", "MYSQLDATABASE"),\n    ssl: sslConfig(),\n    connectTimeout: Number(process.env.DB_CONNECT_TIMEOUT_MS || 15000),\n    multipleStatements: false,\n    timezone: "Z",\n  };\n}\n\nasync function verifyDatabaseIdentity(connection) {\n  const [[row]] = await connection.query("SELECT DATABASE() AS database_name");\n  const databaseName = String(row?.database_name || "").trim();\n  const expected = String(process.env.CHALIN03_EXPECTED_DATABASE || "").trim();\n  if (!databaseName || !expected || databaseName !== expected) {\n    throw new Error(`Production database identity check failed: connected=${databaseName || "none"} expected=${expected || "unset"}.`);\n  }\n  return databaseName;\n}\n\nasync function run() {\n  if (String(process.env.NODE_ENV || "").trim().toLowerCase() !== "production") throw new Error("Equipment Installment notification migration requires NODE_ENV=production.");\n  if (!truthy(process.env.CHALIN03_EQUIPMENT_FINANCE_MIGRATIONS_ENABLED)) throw new Error("Equipment Finance production migrations are not enabled.");\n  if (!truthy(process.env.CHALIN03_SIGNED_BACKUP_CONFIRMED)) throw new Error("Signed production backup confirmation is required.");\n\n  const connection = await mysql.createConnection(connectionOptions());\n  let locked = false;\n  try {\n    const databaseName = await verifyDatabaseIdentity(connection);\n    const [[lockRow]] = await connection.query("SELECT GET_LOCK(?, 30) AS acquired", [MIGRATION_LOCK]);\n    locked = Number(lockRow?.acquired || 0) === 1;\n    if (!locked) throw new Error("Could not acquire Equipment Installment notification migration lock.");\n\n    await connection.query(`CREATE TABLE IF NOT EXISTS equipment_finance_notification_settings (\n      id TINYINT UNSIGNED NOT NULL PRIMARY KEY,\n      equipment_created TINYINT(1) NOT NULL DEFAULT 1,\n      customer_created TINYINT(1) NOT NULL DEFAULT 1,\n      application_approved TINYINT(1) NOT NULL DEFAULT 1,\n      agreement TINYINT(1) NOT NULL DEFAULT 1,\n      deposit TINYINT(1) NOT NULL DEFAULT 1,\n      payment TINYINT(1) NOT NULL DEFAULT 1,\n      reminders TINYINT(1) NOT NULL DEFAULT 1,\n      settlement_ownership TINYINT(1) NOT NULL DEFAULT 1,\n      document_share TINYINT(1) NOT NULL DEFAULT 1,\n      created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n      updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,\n      CONSTRAINT chk_equipment_finance_notification_singleton CHECK (id = 1)\n    )`);\n    await connection.query("INSERT INTO equipment_finance_notification_settings (id) VALUES (1) ON DUPLICATE KEY UPDATE id = id");\n    await connection.query(\n      "INSERT INTO schema_migrations (migration_name, applied_at) VALUES (?, CURRENT_TIMESTAMP) ON DUPLICATE KEY UPDATE migration_name = VALUES(migration_name)",\n      [MIGRATION_RECORD]\n    );\n    const [rows] = await connection.query("SELECT * FROM equipment_finance_notification_settings WHERE id = 1 LIMIT 1");\n    if (rows.length !== 1) throw new Error("Notification settings row verification failed.");\n    console.log(JSON.stringify({ verified: true, database_name: databaseName, migration: MIGRATION_RECORD }));\n  } finally {\n    if (locked) await connection.query("SELECT RELEASE_LOCK(?)", [MIGRATION_LOCK]).catch(() => {});\n    await connection.end();\n  }\n}\n\nif (require.main === module) run().catch((error) => { console.error("Equipment Installment notification migration failed:"); console.error(error.message); process.exit(1); });\n\nmodule.exports = { MIGRATION_LOCK, MIGRATION_RECORD, run };\n''')

idx = Path('frontend/index.html')
t = idx.read_text()
if 'Chalin 03 Group Operations Platform' not in t:
    t = t.replace('<title>Chalin 03 Secure Staff Login</title>', '<title>Chalin 03 Group Operations Platform — Secure Staff Login</title>', 1)
    idx.write_text(t)

# Remove this one-shot workflow and marker after applying the patch.
Path('.github/workflows/_notification_safety_patch.yml').unlink()
Path('.chalin-notification-safety-patch').unlink()
'''
      - name: Validate
        working-directory: backend
        run: |
          node --check services/equipmentFinanceNotificationPolicyService.js
          node --check services/equipmentFinanceProfessionalService.js
          node --check services/equipmentFinanceBossAlertDeliveryBootstrap.js
          node --check services/equipmentFinanceProfessionalReminderService.js
          node --check services/equipmentFinanceOperationalPolishService.js
          node --check scripts/runEquipmentFinanceNotificationPolicyMigration.js
          node --test tests/equipmentFinanceNotificationControlsContract.test.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          git rm .github/workflows/_notification_safety_patch.yml .chalin-notification-safety-patch || true
          git commit -m "fix: harden installment notification controls"
          git push origin HEAD:feat/installment-notification-controls-final
