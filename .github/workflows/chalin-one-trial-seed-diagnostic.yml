name: CHALIN ONE Trial Seed Diagnostic

on:
  push:
    branches:
      - chalin-one
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-trial-seed-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read live staging trial-seed status
        shell: bash
        run: |
          set -euo pipefail
          URL="https://chalin03-system-2-staging.up.railway.app/api/health"
          for attempt in $(seq 1 36); do
            BODY="$(curl --fail --silent --show-error --max-time 15 "$URL" || true)"
            if [ -n "$BODY" ]; then
              printf '%s' "$BODY" > /tmp/chalin-one-health.json
              STATUS="$(node -e 'const fs=require("fs");const p="/tmp/chalin-one-health.json";try{const j=JSON.parse(fs.readFileSync(p,"utf8"));process.stdout.write(String(j.chalin_one_trial_seed?.status||"missing"));}catch{process.stdout.write("invalid_json");}')"
              echo "Attempt ${attempt}: trial seed status=${STATUS}"
              node - <<'NODE'
          const fs = require("fs");
          const body = JSON.parse(fs.readFileSync("/tmp/chalin-one-health.json", "utf8"));
          console.log(JSON.stringify({
            deployment: body.deployment || null,
            trial_seed: body.chalin_one_trial_seed || null,
          }, null, 2));
          NODE
              if [ "$STATUS" = "verified" ]; then
                exit 0
              fi
              if [ "$STATUS" = "failed" ]; then
                echo "Live CHALIN ONE full-trial seed reported failure." >&2
                exit 1
              fi
            fi
            sleep 5
          done
          echo "Live CHALIN ONE trial-seed status did not become verified or failed within the diagnostic window." >&2
          exit 1
