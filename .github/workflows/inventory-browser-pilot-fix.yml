name: Temporary Inventory Browser Pilot Fix

on:
  push:
    branches:
      - feature/inventory-loss-prevention-traceability
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: inventory-browser-pilot-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: ${{ github.event_name == 'push' || github.head_ref == 'feature/inventory-loss-prevention-traceability' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-loss-prevention-traceability
          fetch-depth: 0

      - name: Apply pilot and Returns UX fixes
        working-directory: .
        run: python .github/inventory-browser-pilot-fix/patch.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend source, lint and build
        run: |
          npm test
          npm run lint
          npm run build
          git diff --check

      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify inventory browser pilot
        run: npx playwright test e2e/inventoryLossPreventionPilot.spec.js --project=chromium

      - name: Publish verified pilot and Returns UX fixes
        working-directory: .
        run: |
          git config user.name "chalin03-feature-gate"
          git config user.email "actions@users.noreply.github.com"
          git add \
            frontend/e2e/inventoryLossPreventionPilot.spec.js \
            frontend/src/pages/ReturnsPage.jsx \
            frontend/scripts/inventorySerializedReturnsTests.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Preserve serialized return confirmation through refresh"
          git push origin HEAD:feature/inventory-loss-prevention-traceability
