name: Low Stock Export Hotfix

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "backend/package.json"
      - "backend/services/exportWorkbookSafetyBootstrap.js"
      - "backend/tests/exportWorkbookAndServiceWorkerSafety.test.js"
      - "frontend/public/sw.js"
      - ".github/workflows/low-stock-export-hotfix.yml"

permissions:
  contents: read

concurrency:
  group: low-stock-export-hotfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate export and service-worker safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check workbook bootstrap syntax
        working-directory: backend
        run: node --check services/exportWorkbookSafetyBootstrap.js

      - name: Run export and service-worker regression tests
        working-directory: backend
        run: node --test tests/exportWorkbookAndServiceWorkerSafety.test.js

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check service-worker syntax
        working-directory: frontend
        run: node --check public/sw.js

      - name: Build production frontend
        working-directory: frontend
        run: npm run build
