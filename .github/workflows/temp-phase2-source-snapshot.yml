name: Apply Payroll Phase 2 Patch

on:
  push:
    branches:
      - feature/payroll-financial-foundation-phase2-20260810

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply verified payroll foundation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip
          encoded = Path('.github/payroll-phase2.patch.gz.b64').read_text().strip()
          Path('/tmp/payroll-phase2.patch').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          git apply --index /tmp/payroll-phase2.patch
          git rm .github/payroll-phase2.patch.gz.b64 .github/workflows/temp-phase2-source-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build payroll financial foundation Phase 2'
          git push origin HEAD:feature/payroll-financial-foundation-phase2-20260810
