name: Apply Password Change Fix

on:
  push:
    branches:
      - agent/fix-password-change-session

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-password-change-session
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fix
        run: python .github/scripts/apply_password_change_fix.py
      - name: Remove temporary applicator
        run: rm .github/scripts/apply_password_change_fix.py .github/workflows/apply-password-change-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fix password change session handling"
          git push origin HEAD:agent/fix-password-change-session
