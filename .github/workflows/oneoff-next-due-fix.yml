name: One-off Finance next due fix

on:
  push:
    branches: [fix/finance-next-date-source]
    paths:
      - '.github/workflows/oneoff-next-due-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/finance-next-date-source
          fetch-depth: 0

      - name: Patch next due source and verify prerequisite fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          service = Path('backend/services/equipmentFinanceProfessionalService.js').read_text()
          if 'installment_active' not in service or 'workflow_status_label' not in service:
              raise SystemExit('Excavator installment status source fix is not present on the branch')

          route = Path('backend/routes/equipmentFinanceIndependentRoutes.js').read_text()
          if '"/phase-one/bootstrap"' not in route:
              raise SystemExit('Excavator bootstrap source fix is not present on the branch')

          lifecycle_path = Path('backend/routes/equipmentFinanceFinalLifecycleRoutes.js')
          lifecycle = lifecycle_path.read_text()
          pattern = re.compile(r'agreement\.next_due_date,\s*agreement\.final_due_date,', re.MULTILINE)
          replacement = '''(SELECT MIN(schedule.due_date)\n       FROM equipment_installment_schedule schedule\n      WHERE schedule.agreement_id = agreement.id\n        AND schedule.schedule_status NOT IN ('paid','cancelled','waived','rescheduled')\n        AND schedule.due_date >= CURRENT_DATE) AS next_due_date,\n      agreement.final_due_date,'''
          lifecycle, count = pattern.subn(replacement, lifecycle, count=1)
          if count != 1:
              raise SystemExit('Finance lifecycle next_due_date source was not found exactly once')
          lifecycle_path.write_text(lifecycle)

      - name: Commit fix and remove runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/equipmentFinanceFinalLifecycleRoutes.js .github/workflows/oneoff-next-due-fix.yml
          git commit -m "fix: calculate Finance next payment from future schedule"
          git rm .github/workflows/oneoff-next-due-fix.yml
          git commit -m "remove one-off next due runner"
          git push origin HEAD:fix/finance-next-date-source
