name: Opening Deposit Isolated Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/database/migrations/20260825_equipment_finance_opening_deposit_trigger_fix.sql"
      - "backend/tests/equipmentFinanceOpeningDepositTriggerFix.test.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opening-deposit-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check migration syntax helpers
        working-directory: backend
        run: node --check scripts/runEquipmentFinanceOpeningDepositFoundationRepair.js
      - name: Run Opening Deposit trigger regression test
        working-directory: backend
        run: node --test tests/equipmentFinanceOpeningDepositTriggerFix.test.js
