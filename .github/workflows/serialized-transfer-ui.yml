name: Temporary Serialized Transfer UI Integration

on:
  push:
    branches:
      - feature/inventory-loss-prevention-traceability
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: serialized-transfer-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-and-verify:
    if: ${{ github.event_name == 'push' || github.head_ref == 'feature/inventory-loss-prevention-traceability' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inventory-loss-prevention-traceability
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply serialized transfer UI integration
        run: python .github/serialized-transfer-ui/patch.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm test
          npm run lint
          npm run build
          git diff --check

      - name: Publish verified serialized transfer UI integration
        run: |
          git config user.name "chalin03-feature-gate"
          git config user.email "actions@users.noreply.github.com"
          git add \
            frontend/src/pages/StockTransfersPage.jsx \
            frontend/src/components/InventoryTransferIdentityPanel.jsx \
            frontend/package.json
          git diff --cached --quiet && exit 0
          git commit -m "Add exact-ID serialized stock transfer controls"
          git push origin HEAD:feature/inventory-loss-prevention-traceability
