name: Payroll Worker Profile Phase 3

on:
  push:
    branches:
      - feature/payroll-worker-profile-phase3-20260810
  pull_request:
    branches:
      - feature/payroll-financial-foundation-phase2-20260810

permissions:
  contents: read

concurrency:
  group: payroll-worker-profile-phase3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend syntax and regression
        working-directory: backend
        run: |
          npm run syntax-check
          npm test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend source tests and build
        working-directory: frontend
        run: |
          npm test
          npm run build
