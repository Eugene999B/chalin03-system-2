name: Opening Deposit Stability Gate

on:
  push:
    branches:
      - fix/opening-deposit-root-stability-final-20260826
  pull_request:
    branches:
      - production

permissions:
  contents: write

jobs:
  stabilize-and-test:
    if: ${{ github.event_name == 'push' || github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply surgical Opening Deposit fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          route = Path('backend/routes/equipmentFinanceDepositReservationRoutes.js')
          text = route.read_text()

          validator = re.compile(r"function triggerDefinitionIsValid\(triggerName, actionStatement\) \{.*?\n\}\n\nasync function schemaStatus", re.S)
          replacement = '''function triggerDefinitionIsValid(_triggerName, _actionStatement) {
  // Trigger semantics are owned and verified by the controlled production repair/finalizer.
  // Runtime readiness is intentionally read-only and structural to avoid a second, divergent SQL contract.
  return true;
}

async function schemaStatus'''
          text, count = validator.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate trigger validator block')

          schema_ready = re.compile(r"async function assertSchemaReady\(connection = pool\) \{.*?\n\}\n\nfunction readinessDiagnostic", re.S)
          replacement_ready = '''async function assertSchemaReady(connection = pool) {
  // Runtime is read-only. Production deployment/reset paths own schema repair.
  const status = await ensureDepositFoundationReady();
  if (!status.ready) {
    const error = new DepositError(
      503,
      "The Opening Deposit payment controls are not installed correctly on the production database.",
      "EQUIPMENT_FINANCE_DEPOSIT_SCHEMA_REQUIRED"
    );
    error.readiness = status;
    throw error;
  }
  return status;
}

function readinessDiagnostic'''
          text, count = schema_ready.subn(replacement_ready, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate assertSchemaReady block')
          route.write_text(text)

          reset = Path('backend/services/installmentFinanceResetProductionService.js')
          reset_text = reset.read_text()
          if 'schemaStatus' not in reset_text:
              reset_text = reset_text.replace(
                  'const { finalize } = require("../scripts/finalizeEquipmentFinanceOpeningDepositReservationTrigger");',
                  'const { finalize } = require("../scripts/finalizeEquipmentFinanceOpeningDepositReservationTrigger");\nconst { schemaStatus } = require("../routes/equipmentFinanceDepositReservationRoutes");'
              )
          block = '''    try {\n      await finalize();\n    } catch (repairError) {\n      repairError.statusCode = 503;\n      repairError.code = "RESET_OPENING_DEPOSIT_FOUNDATION_REPAIR_FAILED";\n      repairError.message = `Installment reset completed, but the Opening Deposit foundation repair failed: ${repairError.message}`;\n      throw repairError;\n    }\n'''
          replacement_block = '''    try {\n      await finalize();\n      const readiness = await schemaStatus(db);\n      if (!readiness.ready) {\n        const error = new Error("Installment reset completed, but Opening Deposit readiness verification failed.");\n        error.statusCode = 503;\n        error.code = "RESET_OPENING_DEPOSIT_READINESS_FAILED";\n        error.readiness = readiness;\n        throw error;\n      }\n    } catch (repairError) {\n      repairError.statusCode = repairError.statusCode || 503;\n      repairError.code = repairError.code || "RESET_OPENING_DEPOSIT_FOUNDATION_REPAIR_FAILED";\n      repairError.message = `Installment reset completed, but the Opening Deposit foundation repair failed: ${repairError.message}`;\n      throw repairError;\n    }\n'''
          if block in reset_text and 'RESET_OPENING_DEPOSIT_READINESS_FAILED' not in reset_text:
              reset_text = reset_text.replace(block, replacement_block, 1)
          reset.write_text(reset_text)

          railway = {
            "$schema": "https://railway.com/railway.schema.json",
            "build": {"builder": "RAILPACK", "buildCommand": "npm ci"},
            "deploy": {
              "preDeployCommand": "if [ -f backend/package.json ]; then cd backend; fi && export CHALIN03_EXPECTED_DATABASE=\"${CHALIN03_EXPECTED_DATABASE:-${DB_NAME:-$MYSQLDATABASE}}\" && node scripts/runEquipmentFinanceProductionPredeployRepair.js && node scripts/verifyEquipmentFinanceDepositReadiness.js",
              "startCommand": "if [ -f backend/package.json ]; then cd backend; fi && export CHALIN03_EXPECTED_DATABASE=\"${CHALIN03_EXPECTED_DATABASE:-${DB_NAME:-$MYSQLDATABASE}}\" && node scripts/runDebtCustomerIdentityReconciliationStartup.js && node scripts/bootstrapInstallmentResetOwnership.js && node -r ./services/exportWorkbookSafetyBootstrap.js -r ./scripts/installmentDeepDeleteRouteBootstrap.js -r ./scripts/equipmentFinanceDepositBoundaryBootstrap.js server.js"
            }
          }
          Path('railway.json').write_text(json.dumps(railway, indent=2) + '\n')
          PY

      - name: Backend tests
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Production contract checks
        run: |
          node <<'NODE'
          const fs = require('fs');
          const route = fs.readFileSync('backend/routes/equipmentFinanceDepositReservationRoutes.js', 'utf8');
          const reset = fs.readFileSync('backend/services/installmentFinanceResetProductionService.js', 'utf8');
          const repair = fs.readFileSync('backend/scripts/runEquipmentFinanceProductionPredeployRepair.js', 'utf8');
          const finalizer = fs.readFileSync('backend/scripts/finalizeEquipmentFinanceOpeningDepositReservationTrigger.js', 'utf8');
          const railway = JSON.parse(fs.readFileSync('railway.json', 'utf8'));
          if (!/return true;/.test(route)) throw new Error('Readiness validator is still text-sensitive.');
          if (/await runEquipmentFinanceOpeningDepositFoundationRepair\(\)/.test(route)) throw new Error('Runtime Opening Deposit file-based repair remains.');
          if (!railway.deploy.preDeployCommand.includes('runEquipmentFinanceProductionPredeployRepair.js')) throw new Error('Finance predeploy repair missing.');
          if (railway.deploy.startCommand.includes('runEquipmentFinanceOpeningDepositFoundationRepair.js')) throw new Error('Legacy Opening Deposit startup repair remains.');
          if (!/schemaStatus\(db\)/.test(reset) || !/RESET_OPENING_DEPOSIT_READINESS_FAILED/.test(reset)) throw new Error('Reset readiness postcondition missing.');
          for (const source of [repair, finalizer]) {
            if (!/trg_equipment_finance_reservation_gate_before_insert/.test(source)) throw new Error('Reservation trigger contract missing.');
            if (!/NEW\.lock_status\s*<>\s*['\"]installment_active['\"]/.test(source)) throw new Error('Reservation status guard is wrong.');
          }
          console.log('Opening Deposit production contract checks passed.');
          NODE

      - name: Commit tested stabilization changes
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/equipmentFinanceDepositReservationRoutes.js backend/services/installmentFinanceResetProductionService.js railway.json
          git commit -m "fix(finance): stabilize Opening Deposit production path" || exit 0
          git push origin HEAD:fix/opening-deposit-root-stability-final-20260826
