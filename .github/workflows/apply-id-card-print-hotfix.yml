name: Apply CR80 Staff Card Print Hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/hotfix-id-card-print-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out print hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/hotfix-id-card-print-layout
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply exact CR80 route
        run: python .github/scripts/apply_id_card_print_hotfix.py

      - name: Verify artwork, page count and backend
        working-directory: backend
        run: |
          npm run syntax-check
          npm test

      - name: Commit verified print hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/routes/workerPrintRoutes.js \
            backend/services/workerCardArtworkService.js \
            backend/tests/workerCardPrintLayout.test.js
          git commit -m "fix: generate exact two-page CR80 staff cards"
          git push origin HEAD:agent/hotfix-id-card-print-layout
