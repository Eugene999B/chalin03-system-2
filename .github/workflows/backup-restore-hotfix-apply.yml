name: Backup Restore Hotfix Applicator

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/backup-restore-hotfix-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply exact Backup and Restore transport fix
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          page = Path('frontend/src/pages/BackupPage.jsx')
          text = page.read_text()

          marker = 'const RESTORE_CONFIRMATION_TEXT = "RESTORE_FULL_SYSTEM_BACKUP";\n'
          addition = '''const RESTORE_CONFIRMATION_TEXT = "RESTORE_FULL_SYSTEM_BACKUP";\nconst PRODUCTION_BACKUP_API_ROOT = "https://api.chalin03.com/api/backups";\nconst BACKUP_DOWNLOAD_TIMEOUT_MS = 300000;\nconst BACKUP_VALIDATE_TIMEOUT_MS = 180000;\nconst BACKUP_RESTORE_TIMEOUT_MS = 600000;\n\nfunction isOfficialProductionHost() {\n  if (typeof window === "undefined") return false;\n  const hostname = String(window.location?.hostname || "").trim().toLowerCase();\n  return hostname === "chalin03.com" || hostname === "www.chalin03.com";\n}\n\nfunction backupRequestUrl(pathname) {\n  const suffix = String(pathname || "").startsWith("/")\n    ? String(pathname || "")\n    : `/${String(pathname || "")}`;\n  return isOfficialProductionHost()\n    ? `${PRODUCTION_BACKUP_API_ROOT}${suffix}`\n    : `/backups${suffix}`;\n}\n'''
          if text.count(marker) != 1:
              raise SystemExit('BackupPage constant marker changed')
          text = text.replace(marker, addition, 1)

          old = '''      const response = await axiosClient.get("/backups/download", {\n        responseType: "blob",\n        headers: protectedHeaders,\n      });'''
          new = '''      const response = await axiosClient.get(backupRequestUrl("/download"), {\n        responseType: "blob",\n        headers: protectedHeaders,\n        timeout: BACKUP_DOWNLOAD_TIMEOUT_MS,\n      });'''
          if text.count(old) != 1:
              raise SystemExit('BackupPage download marker changed')
          text = text.replace(old, new, 1)

          old = '''    const response = await axiosClient.post(\n      "/backups/restore/dry-run",\n      { backup },\n      { headers: protectedHeaders }\n    );'''
          new = '''    const response = await axiosClient.post(\n      backupRequestUrl("/restore/dry-run"),\n      { backup },\n      {\n        headers: protectedHeaders,\n        timeout: BACKUP_VALIDATE_TIMEOUT_MS,\n      }\n    );'''
          if text.count(old) != 1:
              raise SystemExit('BackupPage dry-run marker changed')
          text = text.replace(old, new, 1)

          old = '''      const response = await axiosClient.post(\n        "/backups/restore",\n        {\n          confirmation: RESTORE_CONFIRMATION_TEXT,\n          backup: validation.backup,\n        },\n        { headers: protectedHeaders }\n      );'''
          new = '''      const response = await axiosClient.post(\n        backupRequestUrl("/restore"),\n        {\n          confirmation: RESTORE_CONFIRMATION_TEXT,\n          backup: validation.backup,\n        },\n        {\n          headers: protectedHeaders,\n          timeout: BACKUP_RESTORE_TIMEOUT_MS,\n        }\n      );'''
          if text.count(old) != 1:
              raise SystemExit('BackupPage restore marker changed')
          text = text.replace(old, new, 1)
          page.write_text(text)

          package = Path('frontend/package.json')
          data = json.loads(package.read_text())
          command = 'node scripts/backupRestoreDirectApiTests.mjs'
          if command not in data['scripts']['test']:
              data['scripts']['test'] += f' && {command}'
          package.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Backup and Restore regression contract
        working-directory: frontend
        run: node scripts/backupRestoreDirectApiTests.mjs
      - name: Run complete frontend regression
        working-directory: frontend
        run: npm test
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Remove helper and publish hotfix
        shell: bash
        run: |
          rm .github/workflows/backup-restore-hotfix-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/BackupPage.jsx frontend/package.json frontend/scripts/backupRestoreDirectApiTests.mjs .github/workflows/backup-restore-hotfix-apply.yml
          git commit -m "Fix production Backup and Restore transport"
          git push origin HEAD:main

