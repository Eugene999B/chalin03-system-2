name: Release 3.1 Audit Route Patch

on:
  push:
    branches:
      - agent/release-31-audit-schema-safety-staging
    paths:
      - .github/scripts/release31_patch_audit_routes.py
      - .github/workflows/release31-audit-route-patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release31-audit-route-patch
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-31-audit-schema-safety-staging
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply audit route patch
        run: python .github/scripts/release31_patch_audit_routes.py

      - name: Check JavaScript syntax
        run: |
          node --check backend/routes/auditSignoffRoutes.js
          node --check backend/routes/auditUnlockRequestRoutes.js
          node --check backend/services/auditSchemaReadinessService.js
          node --check backend/tests/release31AuditSchemaSafety.test.js
          node --check backend/tests/release31RuntimeDdlBoundary.test.js
          node --check backend/tests/release31ControlledMigration.test.js

      - name: Run Release 3.1 audit safety tests
        run: |
          node --test \
            backend/tests/release31AuditSchemaSafety.test.js \
            backend/tests/release31RuntimeDdlBoundary.test.js \
            backend/tests/release31ControlledMigration.test.js

      - name: Check patch quality
        run: git diff --check

      - name: Commit verified route changes
        run: |
          if git diff --quiet -- backend/routes/auditSignoffRoutes.js backend/routes/auditUnlockRequestRoutes.js; then
            echo "Audit routes already satisfy the Release 3.1 contract."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/auditSignoffRoutes.js backend/routes/auditUnlockRequestRoutes.js
          git commit -m "Remove audit runtime schema mutations"
          git push origin HEAD:agent/release-31-audit-schema-safety-staging
