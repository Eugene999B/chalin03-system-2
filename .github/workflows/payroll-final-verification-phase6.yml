name: Payroll Final Verification Phase 6

on:
  push:
    branches:
      - feature/payroll-final-verification-phase6-20260810
  pull_request:
    branches:
      - feature/payroll-professional-payslips-phase5-20260810

permissions:
  contents: read

concurrency:
  group: payroll-final-verification-phase6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend syntax
        working-directory: backend
        run: npm run syntax-check
      - name: Payroll final verification contracts
        working-directory: backend
        run: node --test tests/payrollFinalVerificationPhaseSix20260810.test.js
      - name: Complete backend regression
        working-directory: backend
        run: npm test
      - name: Additive migration safety
        working-directory: backend
        shell: bash
        run: |
          git fetch origin feature/payroll-professional-payslips-phase5-20260810 --depth=1
          base_sha="$(git merge-base HEAD origin/feature/payroll-professional-payslips-phase5-20260810)"
          node scripts/verifyMigrationSafety.js --repo-root .. --base "$base_sha" --head HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Payroll responsive and permission contracts
        working-directory: frontend
        run: node scripts/payrollFinalVerificationPhaseSixTests.mjs
      - name: Complete frontend source tests
        working-directory: frontend
        run: npm test
      - name: Production frontend build
        working-directory: frontend
        run: npm run build
