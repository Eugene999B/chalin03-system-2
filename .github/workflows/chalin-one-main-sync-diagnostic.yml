name: CHALIN ONE Main Sync Builder

on:
  push:
    branches:
      - integration/chalin-one-main-sync-20260812

permissions:
  contents: write

jobs:
  merge-current-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact current-main staging merge
        shell: bash
        env:
          EXPECTED_MAIN_SHA: 751f31856c1257314bf4f418bdce0d3cffc51024
        run: |
          set -euo pipefail
          git config user.name "CHALIN ONE Staging Integrator"
          git config user.email "chalin-one-staging-integrator@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          test "$merge_status" -eq 1

          git diff --name-only --diff-filter=U | sort > actual-conflicts.txt
          cat > expected-conflicts.txt <<'EOF'
          backend/security/permissionCatalog.js
          backend/server.js
          backend/tests/equipmentFinancePremiumDocumentDesign.test.js
          frontend/functions/api/[[path]].js
          frontend/package.json
          frontend/vite.config.js
          EOF
          sort -o expected-conflicts.txt expected-conflicts.txt
          diff -u expected-conflicts.txt actual-conflicts.txt

          python <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_conflicts(path, resolver):
              target = Path(path)
              text = target.read_text()
              pattern = re.compile(r"<<<<<<< HEAD\n(.*?)=======\n(.*?)>>>>>>> origin/main\n?", re.S)
              index = 0
              while True:
                  match = pattern.search(text)
                  if not match:
                      break
                  index += 1
                  replacement = resolver(match.group(1), match.group(2), index)
                  text = text[:match.start()] + replacement + text[match.end():]
              if "<<<<<<<" in text or ">>>>>>>" in text:
                  raise SystemExit(f"Unresolved conflict marker in {path}")
              target.write_text(text)

          replace_conflicts(
              "backend/security/permissionCatalog.js",
              lambda ours, theirs, index: (
                  "  ...CONTENT_STUDIO_PERMISSIONS,\n  ...PAYROLL_PERMISSIONS,\n"
                  if index == 1
                  else "  CONTENT_STUDIO_PERMISSIONS,\n  PAYROLL_PERMISSIONS,\n"
              ),
          )

          replace_conflicts(
              "backend/server.js",
              lambda ours, theirs, index: (
                  '      "/api/public/content",\n'
                  '      "/api/content-studio",\n'
                  '      "/api/payroll",\n'
              ),
          )

          replace_conflicts(
              "backend/tests/equipmentFinancePremiumDocumentDesign.test.js",
              lambda ours, theirs, index: theirs,
          )

          package_path = Path("frontend/package.json")
          package_text = package_path.read_text()
          match = re.search(
              r'<<<<<<< HEAD\n\s*"test":\s*"([^"]*)",\n=======\n\s*"test":\s*"([^"]*)",\n>>>>>>> origin/main',
              package_text,
          )
          if not match:
              raise SystemExit("Frontend test-script conflict was not found")
          commands = []
          for chain in (match.group(1), match.group(2)):
              for command in [item.strip() for item in chain.split("&&") if item.strip()]:
                  if command not in commands:
                      commands.append(command)
          replacement = '    "test": "' + " && ".join(commands) + '",'
          package_text = package_text[:match.start()] + replacement + package_text[match.end():]
          json.loads(package_text)
          package_path.write_text(package_text)

          replace_conflicts(
              "frontend/vite.config.js",
              lambda ours, theirs, index: (
                  '''function isCloudflarePagesBuild(environment = process.env) {\n  return (\n    String(environment.CF_PAGES || "").trim() === "1" ||\n    Boolean(String(environment.CF_PAGES_URL || "").trim())\n  );\n}\n\nfunction isChalinOneCloudflareStagingBuild(environment = process.env) {\n  const branch = String(\n    environment.CF_PAGES_BRANCH || environment.CHALIN_ONE_STAGING_BRANCH || ""\n  )\n    .trim()\n    .toLowerCase();\n  return isCloudflarePagesBuild(environment) && branch === "chalin-one";\n}\n\n// Current production and CHALIN ONE staging both use a branch-owned\n// Cloudflare Pages Function as the browser same-origin /api gateway.\nif (isCloudflarePagesBuild()) {\n'''
                  if index == 1
                  else '''export {\n  isChalinOneCloudflareStagingBuild,\n  isCloudflarePagesBuild,\n  resolveBuildId,\n};\n'''
              ),
          )
          PY

          git checkout --theirs -- 'frontend/functions/api/[[path]].js'
          python <<'PY'
          from pathlib import Path

          path = Path("frontend/functions/api/[[path]].js")
          text = path.read_text()
          text = text.replace(
              'const UPSTREAM_API_ORIGIN = "https://api.chalin03.com";\n',
              'const UPSTREAM_API_ORIGIN = "https://api.chalin03.com";\n'
              'const STAGING_UPSTREAM_API_ORIGIN = "https://chalin03-system-2-staging.up.railway.app";\n'
              'const STAGING_PAGES_HOST = "chalin-one-staging-preview.pages.dev";\n',
              1,
          )
          text = text.replace(
              'function upstreamUrlFor(requestUrl) {\n  const incoming = new URL(requestUrl);\n  const upstream = new URL(UPSTREAM_API_ORIGIN);',
              'function isApprovedStagingHost(hostname) {\n'
              '  const host = String(hostname || "").trim().toLowerCase();\n'
              '  return host === STAGING_PAGES_HOST || host.endsWith(`.${STAGING_PAGES_HOST}`);\n'
              '}\n\n'
              'function upstreamUrlFor(requestUrl) {\n'
              '  const incoming = new URL(requestUrl);\n'
              '  const upstream = new URL(\n'
              '    isApprovedStagingHost(incoming.hostname)\n'
              '      ? STAGING_UPSTREAM_API_ORIGIN\n'
              '      : UPSTREAM_API_ORIGIN\n'
              '  );',
              1,
          )
          text = text.replace(
              '  // The Pages Function makes a fresh public request to api.chalin03.com.\n'
              '  // Never forward loop-budget, client-IP or first-hop Cloudflare metadata.\n'
              '  headers.set("X-Chalin03-Same-Origin-Proxy", "cloudflare-pages-v2");',
              '  const hostname = new URL(request.url).hostname;\n'
              '  if (isApprovedStagingHost(hostname)) {\n'
              '    headers.delete("origin");\n'
              '    headers.delete("referer");\n'
              '    headers.set("X-Chalin-One-Staging-Gateway", "cloudflare-pages-v2");\n'
              '  }\n'
              '  headers.set("X-Chalin03-Same-Origin-Proxy", "cloudflare-pages-v2");',
              1,
          )
          text = text.replace(
              '  headers.set("X-Chalin03-API-Path", "same-origin-pages-proxy-v2");\n  headers.set("Cache-Control", "no-store, max-age=0");',
              '  headers.set("X-Chalin03-API-Path", "same-origin-pages-proxy-v2");\n'
              '  headers.set("X-Chalin-One-API-Path", "same-origin-pages-gateway-v2");\n'
              '  headers.set("Cache-Control", "no-store, max-age=0");',
              1,
          )
          text = text.replace(
              '    "X-Chalin03-API-Path": "same-origin-pages-proxy-v2",\n',
              '    "X-Chalin03-API-Path": "same-origin-pages-proxy-v2",\n'
              '    "X-Chalin-One-API-Path": "same-origin-pages-gateway-v2",\n',
              1,
          )
          text = text.replace(
              'export async function onRequest({ request }) {\n  const incoming = new URL(request.url);',
              'export async function onRequest({ request }) {\n'
              '  const incoming = new URL(request.url);\n'
              '  const host = String(incoming.hostname || "").toLowerCase();\n'
              '  if (host.endsWith(".pages.dev") && !isApprovedStagingHost(host)) {\n'
              '    return jsonError(403, "API_PROXY_HOST_BLOCKED", "This Pages API gateway is not approved for CHALIN ONE staging.");\n'
              '  }',
              1,
          )
          text = text.replace(
              '    console.error("Chalin 03 same-origin API proxy failed", {\n'
              '      path: incoming.pathname,\n'
              '      method: request.method,\n'
              '      diagnostic,',
              '    console.error("Chalin 03 same-origin API proxy failed", {\n'
              '      path: incoming.pathname,\n'
              '      method: request.method,\n'
              '      staging: isApprovedStagingHost(incoming.hostname),\n'
              '      diagnostic,',
              1,
          )
          text = text.replace(
              '  CLOUDFLARE_HOP_REQUEST_HEADERS,\n  NO_BODY_METHODS,\n  UPSTREAM_API_ORIGIN,',
              '  CLOUDFLARE_HOP_REQUEST_HEADERS,\n'
              '  NO_BODY_METHODS,\n'
              '  STAGING_PAGES_HOST,\n'
              '  STAGING_UPSTREAM_API_ORIGIN,\n'
              '  UPSTREAM_API_ORIGIN,',
              1,
          )
          text = text.replace(
              '  classifyFetchFailure,\n  responseHeadersFor,',
              '  classifyFetchFailure,\n  isApprovedStagingHost,\n  responseHeadersFor,',
              1,
          )
          if "<<<<<<<" in text or ">>>>>>>" in text:
              raise SystemExit("Proxy conflict markers remain")
          path.write_text(text)
          PY

          git add \
            backend/security/permissionCatalog.js \
            backend/server.js \
            backend/tests/equipmentFinancePremiumDocumentDesign.test.js \
            'frontend/functions/api/[[path]].js' \
            frontend/package.json \
            frontend/vite.config.js

          test -z "$(git diff --name-only --diff-filter=U)"
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!package-lock.json'

          node --check backend/security/permissionCatalog.js
          node --check backend/server.js
          node --check backend/tests/equipmentFinancePremiumDocumentDesign.test.js
          node --check 'frontend/functions/api/[[path]].js'
          node --check frontend/vite.config.js
          node -e "JSON.parse(require('fs').readFileSync('frontend/package.json','utf8'))"

          git rm .github/workflows/chalin-one-main-sync-diagnostic.yml
          rm -f actual-conflicts.txt expected-conflicts.txt
          git commit -m "Merge current main operational updates into CHALIN ONE staging integration"
          git push origin HEAD:integration/chalin-one-main-sync-20260812
