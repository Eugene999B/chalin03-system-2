name: CHALIN ONE Inventory Pilot Builder

on:
  push:
    branches:
      - integration/chalin-one-inventory-pilot-20260812

permissions:
  contents: write

jobs:
  build-pilot-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact Inventory Traceability staging merge
        shell: bash
        env:
          INVENTORY_SHA: 40f03d32f71ecb1fa57ab4de1adc16b7455f480a
        run: |
          set -euo pipefail
          git config user.name "CHALIN ONE Inventory Integrator"
          git config user.email "chalin-one-inventory-integrator@users.noreply.github.com"
          git fetch origin feature/inventory-loss-prevention-traceability
          test "$(git rev-parse origin/feature/inventory-loss-prevention-traceability)" = "$INVENTORY_SHA"

          set +e
          git merge --no-commit --no-ff "$INVENTORY_SHA"
          merge_status=$?
          set -e
          test "$merge_status" -eq 1

          git diff --name-only --diff-filter=U | sort > actual-conflicts.txt
          cat > expected-conflicts.txt <<'EOF'
          backend/package.json
          frontend/package.json
          EOF
          sort -o expected-conflicts.txt expected-conflicts.txt
          diff -u expected-conflicts.txt actual-conflicts.txt

          git checkout --ours backend/package.json frontend/package.json
          python <<'PY'
          from pathlib import Path
          import json
          import os
          import subprocess

          inventory_sha = os.environ["INVENTORY_SHA"]

          def load_json(path):
              return json.loads(Path(path).read_text())

          def load_inventory_json(path):
              raw = subprocess.check_output(
                  ["git", "show", f"{inventory_sha}:{path}"],
                  text=True,
              )
              return json.loads(raw)

          backend_path = "backend/package.json"
          backend = load_json(backend_path)
          backend_inventory = load_inventory_json(backend_path)
          inventory_migration_key = "migrate:inventory-loss-prevention:production"
          inventory_migration_value = backend_inventory["scripts"][inventory_migration_key]
          backend["scripts"][inventory_migration_key] = inventory_migration_value
          Path(backend_path).write_text(json.dumps(backend, indent=2) + "\n")

          frontend_path = "frontend/package.json"
          frontend = load_json(frontend_path)
          frontend_inventory = load_inventory_json(frontend_path)
          commands = [
              item.strip()
              for item in frontend["scripts"]["test"].split("&&")
              if item.strip()
          ]
          inventory_commands = [
              item.strip()
              for item in frontend_inventory["scripts"]["test"].split("&&")
              if item.strip()
          ]
          for command in inventory_commands:
              if command not in commands:
                  commands.append(command)
          frontend["scripts"]["test"] = " && ".join(commands)
          Path(frontend_path).write_text(json.dumps(frontend, indent=2) + "\n")
          PY

          git add backend/package.json frontend/package.json
          test -z "$(git diff --name-only --diff-filter=U)"
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!package-lock.json'

          node -e "const p=require('./backend/package.json'); if(!p.scripts['migrate:inventory-loss-prevention:production']) process.exit(1);"
          node -e "const p=require('./frontend/package.json'); for (const s of ['inventoryTraceabilityFoundationTests.mjs','inventorySerializedReturnsTests.mjs','inventorySerializedTransferTests.mjs']) if(!p.scripts.test.includes(s)) process.exit(1);"
          node --check backend/server.js

          git rm .github/workflows/chalin-one-inventory-pilot-diagnostic.yml
          rm -f actual-conflicts.txt expected-conflicts.txt
          git commit -m "Merge Inventory Traceability into CHALIN ONE staging pilot"
          git push origin HEAD:integration/chalin-one-inventory-pilot-20260812
