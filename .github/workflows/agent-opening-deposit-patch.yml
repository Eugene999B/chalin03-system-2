name: Opening Deposit reset-safe patcher
on:
  push:
    branches:
      - agent/opening-deposit-patch-runner-20260826
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch target branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin fix/opening-deposit-reset-safe-20260826:refs/remotes/origin/fix/opening-deposit-reset-safe-20260826
          git checkout fix/opening-deposit-reset-safe-20260826
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/routes/equipmentFinanceDepositReservationRoutes.js')
          s = p.read_text()
          old_ready = '''  return {\n    ready:\n      missingColumns.length === 0 &&\n      missingTriggers.length === 0,\n    missing_columns: missingColumns,\n'''
          new_ready = '''  return {\n    ready:\n      missingColumns.length === 0 &&\n      missingTriggers.length === 0 &&\n      invalidTriggers.length === 0,\n    missing_columns: missingColumns,\n'''
          if old_ready not in s:
              raise SystemExit('schema readiness block not found')
          s = s.replace(old_ready, new_ready, 1)
          old_assert = '''async function assertSchemaReady(connection = pool) {\n  const status = await ensureDepositFoundationReady();\n  if (!status.ready) {\n    const error = new DepositError(\n      503,\n      \"The Opening Deposit payment controls are not installed correctly on the production database.\",\n      \"EQUIPMENT_FINANCE_DEPOSIT_SCHEMA_REQUIRED\"\n    );\n    error.readiness = status;\n    throw error;\n  }\n  return status;\n}\n'''
          new_assert = '''async function assertSchemaReady(connection = pool) {\n  let status = await ensureDepositFoundationReady();\n  if (!status.ready || status.invalid_triggers?.length) {\n    try {\n      await runEquipmentFinanceOpeningDepositFoundationRepair();\n    } catch (repairError) {\n      const error = new DepositError(\n        503,\n        \"The Opening Deposit payment controls require a production database repair before a payment can be recorded.\",\n        \"EQUIPMENT_FINANCE_DEPOSIT_REPAIR_FAILED\"\n      );\n      error.readiness = status;\n      error.diagnostic = {\n        repair_error: cleanText(repairError.message, 500),\n        backend_revision:\n          process.env.RAILWAY_GIT_COMMIT_SHA ||\n          process.env.RAILWAY_GIT_COMMIT_SHA_SHORT ||\n          process.env.RAILWAY_GIT_COMMIT ||\n          \"unknown\",\n      };\n      throw error;\n    }\n    status = await ensureDepositFoundationReady();\n  }\n  if (!status.ready || status.invalid_triggers?.length) {\n    const error = new DepositError(\n      503,\n      \"The Opening Deposit payment controls are not installed correctly on the production database.\",\n      \"EQUIPMENT_FINANCE_DEPOSIT_SCHEMA_REQUIRED\"\n    );\n    error.readiness = status;\n    throw error;\n  }\n  return status;\n}\n'''
          if old_assert not in s:
              raise SystemExit('assertSchemaReady block not found')
          s = s.replace(old_assert, new_assert, 1)
          old_tx = '''      const result = await withTransaction(async (connection) => {\n'''
          new_tx = '''      // Repair/reset-proof the Opening Deposit foundation before opening the payment transaction.\n      await assertSchemaReady(pool);\n\n      const result = await withTransaction(async (connection) => {\n'''
          if old_tx not in s:
              raise SystemExit('transaction marker not found')
          s = s.replace(old_tx, new_tx, 1)
          p.write_text(s)

          test = Path('backend/tests/equipmentFinanceOpeningDepositResetSafe.test.js')
          test.write_text('''import test from \"node:test\";\nimport assert from \"node:assert/strict\";\nimport fs from \"node:fs\";\nimport path from \"node:path\";\n\nconst route = fs.readFileSync(path.resolve(process.cwd(), \"routes/equipmentFinanceDepositReservationRoutes.js\"), \"utf8\");\n\ntest(\"Opening Deposit payment path is reset-safe\", () => {\n  assert.match(route, /invalidTriggers\\.length === 0/);\n  assert.match(route, /runEquipmentFinanceOpeningDepositFoundationRepair\\(\\)/);\n  assert.match(route, /Repair\\/reset-proof the Opening Deposit foundation/);\n  assert.match(route, /await assertSchemaReady\\(pool\\)/);\n});\n''')
          test.write_text(test.read_text().replace('Repair\\/reset-proof','Repair\\/reset-proof'))
          PY
          node --check backend/routes/equipmentFinanceDepositReservationRoutes.js
          node --test backend/tests/equipmentFinanceOpeningDepositResetSafe.test.js
          rm -f .github/workflows/agent-opening-deposit-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/equipmentFinanceDepositReservationRoutes.js backend/tests/equipmentFinanceOpeningDepositResetSafe.test.js .github/workflows/agent-opening-deposit-patch.yml
          git commit -m "fix(finance): make Opening Deposit payment reset-safe"
          git push origin fix/opening-deposit-reset-safe-20260826