name: Run auditor period patch on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'hotfix/auditor-reporting-period-banner-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/auditor-reporting-period-banner-20260802
          fetch-depth: 0

      - name: Complete Daily Closings and PDF period coverage
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          route_path = Path('backend/routes/exportRoutes.js')
          test_path = Path('backend/tests/auditorReportingPeriodBanner.test.js')
          source = route_path.read_text(encoding='utf-8')

          old_period = '''      const firstDate = closings.length
                ? formatDate(closings[0].closing_date)
                : from || "-";
              const lastDate = closings.length
                ? formatDate(closings[closings.length - 1].closing_date)
                : to || "-";
              const periodLabel =
                firstDate === lastDate ? firstDate : `${firstDate} to ${lastDate}`;
          '''
          new_period = '''      const dailyPeriod = getDateRangeMeta(
                closings.length ? closings[0].closing_date : from,
                closings.length ? closings[closings.length - 1].closing_date : to,
                []
              );
              const periodLabel = dailyPeriod.periodLabel;
              const periodBanner = dailyPeriod.periodBanner;
          '''
          if old_period not in source:
              raise SystemExit('Daily closing period calculation marker not found')
          source = source.replace(old_period, new_period, 1)

          old_summary = '''      summarySheet.getCell("A4").value = `Period: ${periodLabel}`;
              summarySheet.getCell("A4").font = {
                bold: true,
                color: { argb: "FF235789" },
              };
              summarySheet.getCell("A4").alignment = { horizontal: "center" };
          '''
          new_summary = '''      summarySheet.getCell("A4").value = periodBanner;
              summarySheet.getCell("A4").font = {
                bold: true,
                size: 12,
                color: { argb: "FF071529" },
              };
              summarySheet.getCell("A4").fill = {
                type: "pattern",
                pattern: "solid",
                fgColor: { argb: "FFE6B91E" },
              };
              summarySheet.getCell("A4").alignment = {
                horizontal: "center",
                vertical: "middle",
                wrapText: true,
              };
              summarySheet.getCell("A4").border = {
                top: { style: "medium", color: { argb: "FF071529" } },
                bottom: { style: "medium", color: { argb: "FF071529" } },
              };
              summarySheet.getRow(4).height = 28;
          '''
          if old_summary not in source:
              raise SystemExit('Daily closing summary period marker not found')
          source = source.replace(old_summary, new_summary, 1)

          pattern = re.compile(
              r'''(?P<sheet>\w+Sheet)\.mergeCells\("A2:(?P<last>[A-Z]+)2"\);\n'''
              r'''\s*(?P=sheet)\.getCell\("A2"\)\.value = `\$\{branchCode\} - \$\{branchName\} \| \$\{periodLabel\}`;\n'''
              r'''\s*(?P=sheet)\.getCell\("A2"\)\.alignment = \{ horizontal: "center" \};\n'''
              r'''\s*(?P=sheet)\.getCell\("A2"\)\.font = \{ bold: true \};'''
          )

          def add_banner(match):
              sheet = match.group('sheet')
              last = match.group('last')
              return f'''{sheet}.mergeCells("A2:{last}2");
              {sheet}.getCell("A2").value = `${{branchCode}} - ${{branchName}}`;
              {sheet}.getCell("A2").alignment = {{ horizontal: "center" }};
              {sheet}.getCell("A2").font = {{ bold: true }};
              {sheet}.mergeCells("A3:{last}3");
              {sheet}.getCell("A3").value = periodBanner;
              {sheet}.getCell("A3").font = {{
                bold: true,
                size: 11,
                color: {{ argb: "FF071529" }},
              }};
              {sheet}.getCell("A3").fill = {{
                type: "pattern",
                pattern: "solid",
                fgColor: {{ argb: "FFE6B91E" }},
              }};
              {sheet}.getCell("A3").alignment = {{
                horizontal: "center",
                vertical: "middle",
                wrapText: true,
              }};
              {sheet}.getRow(3).height = 25;'''

          source, banner_count = pattern.subn(add_banner, source)
          if banner_count < 3:
              raise SystemExit(f'Expected at least 3 Daily Closings detail banners, found {banner_count}')

          old_print = '''        sheet.headerFooter.oddFooter =
                  `Chalin 03 Daily Closings | &D &T | Page &P of &N`;
          '''
          new_print = '''        sheet.headerFooter.oddHeader = `&C&B${periodBanner}`;
                sheet.headerFooter.oddFooter =
                  `Chalin 03 Daily Closings | &D &T | Page &P of &N`;
          '''
          if old_print not in source:
              raise SystemExit('Daily closing print header marker not found')
          source = source.replace(old_print, new_print, 1)

          old_footer = '''      `Chalin 03 | ${pdfSafeText(meta.branch.code)} | ${pdfSafeText(
                meta.reportTitle
              )} | Page ${pageIndex + 1} of ${pageRange.count}`,
          '''
          new_footer = '''      `Chalin 03 | ${pdfSafeText(meta.branch.code)} | ${pdfSafeText(
                meta.reportTitle
              )} | ${pdfSafeText(meta.periodLabel)} | Page ${pageIndex + 1} of ${pageRange.count}`,
          '''
          if old_footer not in source:
              raise SystemExit('PDF footer marker not found')
          source = source.replace(old_footer, new_footer, 1)
          route_path.write_text(source, encoding='utf-8')

          tests = test_path.read_text(encoding='utf-8')
          if 'daily closing custom worksheets also show' not in tests:
              tests += '''
          test("daily closing custom worksheets also show the vivid reporting period", () => {
            assert.match(source, /const dailyPeriod = getDateRangeMeta/);
            assert.match(source, /summarySheet\.getCell\("A4"\)\.value = periodBanner/);
            assert.match(source, /getCell\("A3"\)\.value = periodBanner/);
            assert.match(source, /sheet\.headerFooter\.oddHeader = `&C&B\$\{periodBanner\}`/);
          });

          test("PDF footers repeat the reporting period", () => {
            assert.match(source, /pdfSafeText\(meta\.periodLabel\).*Page/s);
          });
          '''
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate completed export hotfix
        run: |
          node --check backend/routes/exportRoutes.js
          node --test backend/tests/auditorReportingPeriodBanner.test.js

      - name: Commit permanent files and remove temporary files
        run: |
          git config user.name "Chalin 03 Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/run-auditor-period-patch-on-pr.yml
          git rm .github/workflows/finalize-auditor-period-on-pr.yml
          git rm .github/workflows/finalize-auditor-period-hotfix.yml
          git rm .github/auditor-finalize-trigger.txt
          git add backend/routes/exportRoutes.js backend/tests/auditorReportingPeriodBanner.test.js
          git commit -m "Complete reporting-period coverage for auditor exports [final-auditor-period-patched]"
          git push origin HEAD:hotfix/auditor-reporting-period-banner-20260802
