name: Desktop Auth Context Race Hotfix

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "frontend/src/context/AuthContext.jsx"
      - "frontend/src/main.jsx"
      - "frontend/public/sw.js"
      - "frontend/scripts/desktopAuthContextRaceTests.mjs"
      - ".github/workflows/desktop-auth-context-race.yml"

permissions:
  contents: read

concurrency:
  group: desktop-auth-context-race-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate desktop auth context session preservation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run desktop auth context contract
        run: node scripts/desktopAuthContextRaceTests.mjs
      - name: Lint changed frontend files
        run: npx eslint src/context/AuthContext.jsx src/main.jsx
      - name: Build production frontend
        run: npm run build
