name: Diagnose Operations Validation Anchors

on:
  push:
    branches:
      - agent/operations-request-validation
    paths:
      - .github/workflows/finalize-operations-request-validation.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operations-request-validation
          fetch-depth: 0

      - name: Inspect route anchors
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          lines = []

          def add(label, value):
              lines.append(f"{label}: {value}")

          purchase = Path("backend/routes/purchaseRoutes.js").read_text()
          p_start = purchase.find("// POST /api/purchases")
          p_block = purchase[p_start:] if p_start >= 0 else ""
          add("purchase marker", p_start)
          add("purchase audit import", purchase.count('const { writeAuditEvent } = require("../services/auditTrailService");'))
          add("purchase validateRequest imports", purchase.count('const { validateRequest } = require("../middleware/requestValidationMiddleware");'))
          add("purchase middleware anchor", p_block.count('  requireRole("admin", "manager"),\n  async (req, res) => {'))
          add("purchase body anchor", p_block.count('      } = req.body;'))

          expense = Path("backend/routes/expenseRoutes.js").read_text()
          e_start = expense.find("// POST /api/expenses")
          e_block = expense[e_start:] if e_start >= 0 else ""
          add("expense marker", e_start)
          add("expense import anchor", expense.count('const { markClosingStale } = require("../services/dailyClosingSecurityService");'))
          add("expense middleware anchor", e_block.count('  requireRole("admin", "manager"),\n  async (req, res) => {'))
          add("expense body start", e_block.find('      const category = cleanText(req.body.category);'))
          add("expense body end", e_block.find('\n\n      if (!category'))

          product = Path("backend/routes/productRoutes.js").read_text()
          pr_start = product.find("// PATCH /api/products/:id/stock-adjustment")
          pr_end = product.find("// DELETE /api/products/:id", pr_start)
          pr_block = product[pr_start:pr_end] if pr_start >= 0 and pr_end >= 0 else ""
          add("product marker", pr_start)
          add("product end marker", pr_end)
          add("product import anchor", product.count('const { writeAuditEvent } = require("../services/auditTrailService");'))
          add("product middleware anchor", pr_block.count('  requireRole("admin", "manager"),\n  async (req, res) => {'))
          add("product params anchor", pr_block.count('      const { id } = req.params;'))
          add("product body anchor", pr_block.count('      } = req.body;'))

          transfer = Path("backend/routes/stockTransferRoutes.js").read_text()
          add("transfer auth import", transfer.count('const { requireAuth } = require("../middleware/authMiddleware");'))
          t_start = transfer.find('router.post(\n  "/",')
          t_end = transfer.find('\nrouter.post(\n  "/:id/approve",', t_start)
          t_block = transfer[t_start:t_end] if t_start >= 0 and t_end >= 0 else ""
          add("transfer create marker", t_start)
          add("transfer approve boundary", t_end)
          add("transfer create middleware", t_block.count('router.post(\n  "/",\n  asyncHandler(async (req, res) => {'))
          add("transfer create body start", t_block.find('    const fromBranchId = toPositiveInt(req.body.from_branch_id);'))
          add("transfer create body end", t_block.find('\n\n    if (!fromBranchId'))

          action_notes = {
              "approve": ("approval_note", "approvalNote"),
              "reject": ("reject_note", "rejectNote"),
              "dispatch": ("dispatch_note", "dispatchNote"),
              "receive": ("receive_note", "receiveNote"),
              "cancel": ("cancel_note", "cancelNote"),
          }
          for action, (note_key, variable) in action_notes.items():
              marker = f'router.post(\n  "/:id/{action}",'
              start = transfer.find(marker)
              end = transfer.find('\nrouter.', start + len(marker))
              if end < 0:
                  end = len(transfer)
              block = transfer[start:end] if start >= 0 else ""
              add(f"{action} marker", start)
              add(f"{action} middleware", block.count(f'router.post(\n  "/:id/{action}",\n  asyncHandler(async (req, res) => {{'))
              add(f"{action} params", block.count('    const transferId = toPositiveInt(req.params.id);'))
              add(f"{action} note", block.count(f'    const {variable} = cleanText(req.body.{note_key} || req.body.note);'))

          Path(".github/operations-anchor-diagnostics.txt").write_text("\n".join(lines) + "\n")
          PY

      - name: Publish diagnostics and remove workflow
        run: |
          rm .github/workflows/finalize-operations-request-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/operations-anchor-diagnostics.txt .github/workflows/finalize-operations-request-validation.yml
          git commit -m "diagnose operations validation anchors"
          git push origin HEAD:agent/operations-request-validation
