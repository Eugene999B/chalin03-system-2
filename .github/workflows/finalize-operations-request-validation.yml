name: Diagnose Exact Operations Route Patterns

on:
  push:
    branches:
      - agent/operations-request-validation
    paths:
      - .github/workflows/finalize-operations-request-validation.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operations-request-validation
          fetch-depth: 0

      - name: Record exact pattern counts
        run: |
          python3 <<'PY'
          from pathlib import Path

          out = []
          def add(label, value): out.append(f"{label}: {value}")
          def block(source, start_marker, end_marker=None):
              start = source.find(start_marker)
              end = source.find(end_marker, start + len(start_marker)) if end_marker and start >= 0 else len(source)
              add(f"start {start_marker!r}", start)
              if end_marker: add(f"end {end_marker!r}", end)
              return source[start:end] if start >= 0 and end >= 0 else ""

          purchase = Path("backend/routes/purchaseRoutes.js").read_text()
          add("purchase validator import", purchase.count('const { validatePurchasePaymentRequest } = require("../validation/financialRequestValidators");\n'))
          p = block(purchase, "// POST /api/purchases\nrouter.post(")
          add("purchase middleware exact", p.count('  requireRole("admin", "manager"),\n  async (req, res) => {'))
          add("purchase body exact", p.count('      } = req.body;'))

          expense = Path("backend/routes/expenseRoutes.js").read_text()
          add("expense import exact", expense.count('const { markClosingStale } = require("../services/dailyClosingSecurityService");\n'))
          e = block(expense, "// POST /api/expenses\nrouter.post(", "// DELETE /api/expenses/:id")
          add("expense middleware exact", e.count('  requireRole("admin", "manager"),\n  async (req, res) => {'))
          add("expense body start exact", e.count('      const category = cleanText(req.body.category);'))
          add("expense body end exact", e.count('\n\n      if (!category'))

          product = Path("backend/routes/productRoutes.js").read_text()
          add("product import exact", product.count('const { writeAuditEvent } = require("../services/auditTrailService");\n'))
          pr = block(product, "// PATCH /api/products/:id/stock-adjustment\nrouter.patch(", "// DELETE /api/products/:id")
          add("product middleware exact", pr.count('  requireRole("admin", "manager"),\n  async (req, res) => {'))
          add("product params exact", pr.count('      const { id } = req.params;'))
          add("product body exact", pr.count('      } = req.body;'))

          transfer = Path("backend/routes/stockTransferRoutes.js").read_text()
          add("transfer import exact", transfer.count('const { requireAuth } = require("../middleware/authMiddleware");\n'))
          t = block(transfer, 'router.post(\n  "/",', '\nrouter.post(\n  "/:id/approve",')
          add("transfer create middleware exact", t.count('router.post(\n  "/",\n  asyncHandler(async (req, res) => {'))
          add("transfer create body start exact", t.count('    const fromBranchId = toPositiveInt(req.body.from_branch_id);'))
          add("transfer create body end exact", t.count('\n\n    if (!fromBranchId'))

          for action, note_key, variable in [
              ("approve", "approval_note", "approvalNote"),
              ("reject", "reject_note", "rejectNote"),
              ("dispatch", "dispatch_note", "dispatchNote"),
              ("receive", "receive_note", "receiveNote"),
              ("cancel", "cancel_note", "cancelNote"),
          ]:
              a = block(transfer, f'router.post(\n  "/:id/{action}",', '\nrouter.')
              add(f"{action} middleware exact", a.count(f'router.post(\n  "/:id/{action}",\n  asyncHandler(async (req, res) => {{'))
              add(f"{action} params exact", a.count('    const transferId = toPositiveInt(req.params.id);'))
              add(f"{action} note exact", a.count(f'    const {variable} = cleanText(req.body.{note_key} || req.body.note);'))

          Path(".github/operations-exact-patterns.txt").write_text("\n".join(out) + "\n")
          PY

      - name: Publish exact pattern report
        run: |
          rm .github/workflows/finalize-operations-request-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/operations-exact-patterns.txt .github/workflows/finalize-operations-request-validation.yml
          git commit -m "diagnose exact operations route patterns"
          git push origin HEAD:agent/operations-request-validation
