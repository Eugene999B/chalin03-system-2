name: Finalize Operations Request Validation

on:
  push:
    branches:
      - agent/operations-request-validation
    paths:
      - .github/workflows/finalize-operations-request-validation.yml

permissions:
  contents: write

concurrency:
  group: finalize-operations-request-validation
  cancel-in-progress: false

jobs:
  finalize:
    name: Apply and verify operations validation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: agent/operations-request-validation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Integrate centralized validators into operations routes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def patch_section(path, marker, transform):
              source = path.read_text()
              index = source.find(marker)
              if index < 0:
                  raise SystemExit(f"{path}: marker not found: {marker}")
              prefix = source[:index]
              section = source[index:]
              updated = transform(section)
              if updated == section:
                  raise SystemExit(f"{path}: section was not changed")
              path.write_text(prefix + updated)

          purchase = Path("backend/routes/purchaseRoutes.js")
          purchase_source = purchase.read_text()
          purchase_source = replace_once(
              purchase_source,
              'const { writeAuditEvent } = require("../services/auditTrailService");\n',
              'const { writeAuditEvent } = require("../services/auditTrailService");\n'
              'const { validateRequest } = require("../middleware/requestValidationMiddleware");\n'
              'const { validatePurchaseCreateRequest } = require("../validation/operationsRequestValidators");\n',
              "purchase imports",
          )
          purchase.write_text(purchase_source)

          def patch_purchase(section):
              section = replace_once(
                  section,
                  '  requireRole("admin", "manager"),\n  async (req, res) => {',
                  '  requireRole("admin", "manager"),\n  validateRequest(validatePurchaseCreateRequest),\n  async (req, res) => {',
                  "purchase middleware",
              )
              return replace_once(
                  section,
                  '      } = req.body;',
                  '      } = req.validated.body;',
                  "purchase sanitized body",
              )

          patch_section(purchase, "// POST /api/purchases", patch_purchase)

          expense = Path("backend/routes/expenseRoutes.js")
          expense_source = expense.read_text()
          expense_source = replace_once(
              expense_source,
              'const { markClosingStale } = require("../services/dailyClosingSecurityService");\n',
              'const { markClosingStale } = require("../services/dailyClosingSecurityService");\n'
              'const { validateRequest } = require("../middleware/requestValidationMiddleware");\n'
              'const { validateExpenseCreateRequest } = require("../validation/operationsRequestValidators");\n',
              "expense imports",
          )
          expense.write_text(expense_source)

          def patch_expense(section):
              section = replace_once(
                  section,
                  '  requireRole("admin", "manager"),\n  async (req, res) => {',
                  '  requireRole("admin", "manager"),\n  validateRequest(validateExpenseCreateRequest),\n  async (req, res) => {',
                  "expense middleware",
              )
              old = '''      const category = cleanText(req.body.category);
              const description = cleanText(req.body.description);
              const expenseDate = cleanText(req.body.expense_date);
              const paymentMethod = cleanText(req.body.payment_method || "cash").toLowerCase();
              const fundingSource = cleanText(req.body.funding_source).toLowerCase();
              const affectsDailyClosing = parseRequiredBoolean(
                req.body.affects_daily_closing
              );
              const closingTreatmentNote = cleanText(
                req.body.closing_treatment_note
              ).slice(0, 500);
              const cleanAmount = Number(req.body.amount);'''
              new = '''      const {
                category,
                description,
                amount: cleanAmount,
                payment_method: paymentMethod,
                funding_source: fundingSource,
                affects_daily_closing: affectsDailyClosing,
                closing_treatment_note: closingTreatmentNote,
                expense_date: expenseDate,
              } = req.validated.body;'''
              return replace_once(section, old, new, "expense sanitized body")

          patch_section(expense, "// POST /api/expenses", patch_expense)

          product = Path("backend/routes/productRoutes.js")
          product_source = product.read_text()
          product_source = replace_once(
              product_source,
              'const { writeAuditEvent } = require("../services/auditTrailService");\n',
              'const { writeAuditEvent } = require("../services/auditTrailService");\n'
              'const { validateRequest } = require("../middleware/requestValidationMiddleware");\n'
              'const { validateStockAdjustmentRequest } = require("../validation/operationsRequestValidators");\n',
              "product imports",
          )
          product.write_text(product_source)

          def patch_product(section):
              section = replace_once(
                  section,
                  '  requireRole("admin", "manager"),\n  async (req, res) => {',
                  '  requireRole("admin", "manager"),\n  validateRequest(validateStockAdjustmentRequest),\n  async (req, res) => {',
                  "stock adjustment middleware",
              )
              section = replace_once(
                  section,
                  '      const { id } = req.params;',
                  '      const { id } = req.validated.params;',
                  "stock adjustment sanitized params",
              )
              return replace_once(
                  section,
                  '      } = req.body;',
                  '      } = req.validated.body;',
                  "stock adjustment sanitized body",
              )

          patch_section(product, "// PATCH /api/products/:id/stock-adjustment", patch_product)

          transfer = Path("backend/routes/stockTransferRoutes.js")
          transfer_source = transfer.read_text()
          transfer_source = replace_once(
              transfer_source,
              'const { requireAuth } = require("../middleware/authMiddleware");\n',
              'const { requireAuth } = require("../middleware/authMiddleware");\n'
              'const { validateRequest } = require("../middleware/requestValidationMiddleware");\n'
              'const {\n'
              '  validateStockTransferActionRequest,\n'
              '  validateStockTransferCreateRequest,\n'
              '} = require("../validation/operationsRequestValidators");\n',
              "transfer imports",
          )
          transfer.write_text(transfer_source)

          def patch_transfer_create(section):
              section = replace_once(
                  section,
                  'router.post(\n  "/",\n  asyncHandler(async (req, res) => {',
                  'router.post(\n  "/",\n  validateRequest(validateStockTransferCreateRequest),\n  asyncHandler(async (req, res) => {',
                  "transfer create middleware",
              )
              old = '''    const fromBranchId = toPositiveInt(req.body.from_branch_id);
              const toBranchId = toPositiveInt(req.body.to_branch_id);
              const requestNote = cleanText(req.body.request_note || req.body.note);
              const items = normalizeTransferItems(req.body.items);'''
              new = '''    const {
                from_branch_id: fromBranchId,
                to_branch_id: toBranchId,
                request_note: requestNote,
                items,
              } = req.validated.body;'''
              return replace_once(section, old, new, "transfer create sanitized body")

          patch_section(transfer, 'router.post(\n  "/",', patch_transfer_create)

          actions = {
              "approve": "approval_note",
              "reject": "reject_note",
              "dispatch": "dispatch_note",
              "receive": "receive_note",
              "cancel": "cancel_note",
          }

          for action, note_key in actions.items():
              source = transfer.read_text()
              marker = f'router.post(\n  "/:id/{action}",'
              index = source.find(marker)
              if index < 0:
                  raise SystemExit(f"transfer {action}: route marker not found")
              next_index = source.find("\nrouter.", index + len(marker))
              if next_index < 0:
                  next_index = len(source)
              prefix = source[:index]
              section = source[index:next_index]
              suffix = source[next_index:]
              section = replace_once(
                  section,
                  f'router.post(\n  "/:id/{action}",\n  asyncHandler(async (req, res) => {{',
                  f'router.post(\n  "/:id/{action}",\n  validateRequest(validateStockTransferActionRequest("{action}")),\n  asyncHandler(async (req, res) => {{',
                  f"transfer {action} middleware",
              )
              section = replace_once(
                  section,
                  '    const transferId = toPositiveInt(req.params.id);',
                  '    const { id: transferId } = req.validated.params;',
                  f"transfer {action} sanitized params",
              )
              section = replace_once(
                  section,
                  f'    const {"" if False else ""}{action if False else ""}{""}\n' if False else f'    const {note_key.replace("_note", "Note") if False else "__never__"};',
                  '__never__',
                  f"transfer {action} impossible placeholder",
              ) if False else section
              old_note_names = {
                  "approval_note": "approvalNote",
                  "reject_note": "rejectNote",
                  "dispatch_note": "dispatchNote",
                  "receive_note": "receiveNote",
                  "cancel_note": "cancelNote",
              }
              variable = old_note_names[note_key]
              section = replace_once(
                  section,
                  f'    const {variable} = cleanText(req.body.{note_key} || req.body.note);',
                  f'    const {{ {note_key}: {variable} }} = req.validated.body;',
                  f"transfer {action} sanitized note",
              )
              transfer.write_text(prefix + section + suffix)

          print("Operations routes integrated with centralized validation.")
          PY

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run focused operations validation checks
        working-directory: backend
        run: |
          node --check validation/operationsRequestValidators.js
          node --check tests/operationsRequestValidation.test.js
          node --check routes/purchaseRoutes.js
          node --check routes/expenseRoutes.js
          node --check routes/productRoutes.js
          node --check routes/stockTransferRoutes.js
          node --test tests/operationsRequestValidation.test.js

      - name: Run complete backend verification
        working-directory: backend
        run: npm run syntax-check && npm test

      - name: Check final source diff
        run: |
          git status --short
          git diff --check
          test -n "$(git status --short)"

      - name: Remove temporary finalizer and commit verified source
        shell: bash
        run: |
          rm .github/workflows/finalize-operations-request-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/routes/purchaseRoutes.js \
                  backend/routes/expenseRoutes.js \
                  backend/routes/productRoutes.js \
                  backend/routes/stockTransferRoutes.js \
                  backend/validation/operationsRequestValidators.js \
                  backend/tests/operationsRequestValidation.test.js \
                  .github/workflows/finalize-operations-request-validation.yml
          git commit -m "validate purchases expenses stock and transfers"
          git push origin HEAD:agent/operations-request-validation
