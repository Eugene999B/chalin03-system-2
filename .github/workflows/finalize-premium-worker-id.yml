name: Finalize Premium Worker ID

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  finalize-and-preview:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'agent/final-premium-worker-id'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out premium worker ID branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-premium-worker-id
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Apply final privacy and employee-number improvements
        run: python .github/scripts/finalize_premium_worker_id.py

      - name: Install and test backend
        working-directory: backend
        run: |
          npm ci
          npm run syntax-check
          npm test

      - name: Install, test, lint and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npx eslint src/pages/ExpandedWorkerProfilePage.jsx
          npm run build

      - name: Render actual PDF previews
        run: node .github/scripts/render_premium_worker_id_preview.js

      - name: Upload actual PDF previews
        uses: actions/upload-artifact@v4
        with:
          name: approved-premium-worker-id-preview
          path: premium-worker-id-preview
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified final improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/routes/workerCardVerificationRoutes.js \
            backend/tests/workerCardPrintLayout.test.js \
            frontend/src/pages/ExpandedWorkerProfilePage.jsx
          git commit -m "fix: finalize premium worker ID privacy and employee number display"
          git push origin HEAD:agent/final-premium-worker-id
