name: Equipment Finance Phase 6 Browser

on:
  pull_request:
    branches: [main, production]
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase6-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Apply customer portrait and Finance UI patch
        working-directory: .
        shell: bash
        env:
          PATCH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          phase1 = Path('backend/routes/equipmentFinancePhaseOneRoutes.js')
          text = phase1.read_text()

          helper = r'''
function normalizeProfilePhoto(value) {
  const photo = String(value ?? "").trim();
  if (!photo) return null;
  if (!/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(photo) || photo.length > 180000) {
    throw new PhaseOneError(400, "Choose a customer photo again. The image must be a valid compressed portrait.", "INVALID_CUSTOMER_PROFILE_PHOTO");
  }
  return photo;
}
'''
          if 'function normalizeProfilePhoto(value)' not in text:
              text = text.replace('function normalizeKyc(body = {}, customer = {}) {', helper + '\nfunction normalizeKyc(body = {}, customer = {}) {', 1)
          text = text.replace('risk_notes: nullableText(body.risk_notes, 3000),\n    is_active:', 'risk_notes: nullableText(body.risk_notes, 3000),\n    profile_photo_data_url: normalizeProfilePhoto(body.profile_photo_data_url),\n    is_active:', 1)

          old_insert = '''INSERT INTO hire_customers (
       customer_code, customer_name, customer_type, phone, whatsapp_phone,
       email, address, contact_person, payment_terms_days, credit_limit,
       risk_notes, is_active, created_by, updated_by
     ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, 0, 0, ?, ?, ?, ?)'''
          new_insert = '''INSERT INTO hire_customers (
       customer_code, customer_name, customer_type, phone, whatsapp_phone,
       email, address, contact_person, payment_terms_days, credit_limit,
       risk_notes, profile_photo_data_url, is_active, created_by, updated_by
     ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, 0, 0, ?, ?, ?, ?, ?)'''
          if old_insert not in text: raise SystemExit('createCustomer INSERT block not found')
          text = text.replace(old_insert, new_insert, 1)
          text = text.replace('''      customer.risk_notes,
      customer.is_active,
      actorId,
      actorId,''', '''      customer.risk_notes,
      customer.profile_photo_data_url,
      customer.is_active,
      actorId,
      actorId,''', 1)

          text = text.replace('`SELECT customer.*,\n            (SELECT COUNT(*) FROM equipment_credit_applications application', '`SELECT customer.id, customer.customer_code, customer.customer_name, customer.customer_type,\n            customer.phone, customer.whatsapp_phone, customer.email, customer.address,\n            customer.contact_person, customer.payment_terms_days, customer.credit_limit, customer.risk_notes,\n            CASE WHEN customer.profile_photo_data_url IS NULL OR CHAR_LENGTH(customer.profile_photo_data_url) = 0 THEN 0 ELSE 1 END AS profile_photo_present,\n            customer.is_active, customer.created_by, customer.updated_by, customer.created_at, customer.updated_at,\n            (SELECT COUNT(*) FROM equipment_credit_applications application', 1)
          text = text.replace('finance_agreement_count: Number(row.finance_agreement_count || 0),\n    outstanding_balance:', 'finance_agreement_count: Number(row.finance_agreement_count || 0),\n    profile_photo_present: Boolean(row.profile_photo_present),\n    outstanding_balance:', 1)

          old_update = '''               email = ?, address = ?, contact_person = ?, risk_notes = ?,
               is_active = ?, updated_by = ?'''
          new_update = '''               email = ?, address = ?, contact_person = ?, risk_notes = ?,
               profile_photo_data_url = ?, is_active = ?, updated_by = ?'''
          if old_update not in text: raise SystemExit('customer update SET block not found')
          text = text.replace(old_update, new_update, 1)
          marker = '''            customer.contact_person,
            customer.risk_notes,
            customer.is_active,
            userId(req),'''
          replacement = '''            customer.contact_person,
            customer.risk_notes,
            customer.profile_photo_data_url,
            customer.is_active,
            userId(req),'''
          if marker not in text: raise SystemExit('customer update parameter block not found')
          text = text.replace(marker, replacement, 1)

          photo_routes = r'''
router.get(
  "/phase-one/customers/:customerId/photo",
  requirePermission("fleet.assets.view"),
  async (req, res) => {
    try {
      const customerId = positiveId(req.params.customerId);
      if (!customerId) return res.status(400).json({ status: "error", code: "INVALID_CUSTOMER_ID", message: "Choose a valid customer." });
      const [rows] = await pool.query("SELECT profile_photo_data_url FROM hire_customers WHERE id = ? AND is_active = TRUE LIMIT 1", [customerId]);
      if (!rows.length) return res.status(404).json({ status: "error", code: "FINANCE_CUSTOMER_NOT_FOUND", message: "Finance customer was not found." });
      return res.json({ status: "success", exists: Boolean(rows[0].profile_photo_data_url), photo: rows[0].profile_photo_data_url || null });
    } catch (error) {
      if (error?.code === "ER_BAD_FIELD_ERROR") return res.status(503).json({ status: "error", code: "CUSTOMER_PROFILE_PHOTO_MIGRATION_REQUIRED", message: "Customer photo storage is awaiting its approved database migration." });
      return sendError(res, error, "Could not load the customer photo.");
    }
  }
);

router.delete(
  "/phase-one/customers/:customerId/photo",
  requirePermission("fleet.assets.manage"),
  async (req, res) => {
    try {
      const customerId = positiveId(req.params.customerId);
      if (!customerId) return res.status(400).json({ status: "error", code: "INVALID_CUSTOMER_ID", message: "Choose a valid customer." });
      await pool.query("UPDATE hire_customers SET profile_photo_data_url = NULL, updated_by = ? WHERE id = ?", [userId(req), customerId]);
      return res.json({ status: "success", message: "Customer photo removed." });
    } catch (error) {
      if (error?.code === "ER_BAD_FIELD_ERROR") return res.status(503).json({ status: "error", code: "CUSTOMER_PROFILE_PHOTO_MIGRATION_REQUIRED", message: "Customer photo storage is awaiting its approved database migration." });
      return sendError(res, error, "Could not remove the customer photo.");
    }
  }
);
'''
          if '"/phase-one/customers/:customerId/photo"' not in text:
              text = text.replace('router.get(\n  "/phase-one/customers",', photo_routes + '\nrouter.get(\n  "/phase-one/customers",', 1)
          phase1.write_text(text)

          professional = Path('backend/services/equipmentFinanceProfessionalService.js')
          ptext = professional.read_text()
          if 'customer.profile_photo_data_url AS customer_profile_photo_data_url' not in ptext:
              ptext = ptext.replace('customer.address AS customer_address,\n       asset.asset_code,', 'customer.address AS customer_address,\n       customer.profile_photo_data_url AS customer_profile_photo_data_url,\n       asset.asset_code,', 1)
          pdf_anchor = '''      doc.font("Helvetica-Bold").fontSize(12).text("Parties and machine");
      let y = doc.y + 7;
      pdfField(doc, "Buyer", agreement.kyc_customer_name || agreement.customer_name_snapshot, 45, y);
      pdfField(doc, "Phone", agreement.kyc_customer_phone || agreement.customer_phone_snapshot, 305, y);'''
          pdf_replacement = '''      doc.font("Helvetica-Bold").fontSize(12).text("Parties and machine");
      let y = doc.y + 7;
      const customerPortrait = dataImageBuffer(agreement.customer_profile_photo_data_url);
      if (customerPortrait) {
        doc.roundedRect(45, y, 58, 75, 5).lineWidth(1).strokeColor("#d7e1d9").stroke();
        doc.image(customerPortrait, 49, y + 4, { fit: [50, 67], align: "center", valign: "center" });
        pdfField(doc, "Buyer", agreement.kyc_customer_name || agreement.customer_name_snapshot, 115, y + 4, 180);
        pdfField(doc, "Phone", agreement.kyc_customer_phone || agreement.customer_phone_snapshot, 305, y + 4, 180);
        y += 18;
      } else {
        pdfField(doc, "Buyer", agreement.kyc_customer_name || agreement.customer_name_snapshot, 45, y);
        pdfField(doc, "Phone", agreement.kyc_customer_phone || agreement.customer_phone_snapshot, 305, y);
      }'''
          if pdf_anchor not in ptext: raise SystemExit('Agreement PDF customer section not found')
          ptext = ptext.replace(pdf_anchor, pdf_replacement, 1)
          professional.write_text(ptext)

          customer_page = Path('frontend/src/pages/EquipmentFinanceCustomerCentrePage.jsx')
          customer_page.write_text('''import { useCallback, useEffect, useMemo, useState } from "react";
import { Link } from "react-router";
import axiosClient from "../api/axiosClient";
import { useAuth } from "../context/AuthContext";
import InstallmentEntityDeleteDialog from "../components/InstallmentEntityDeleteDialog";
import CustomerPortrait, { CustomerPortraitPicker } from "../components/CustomerPortrait";
import "../styles/equipmentFinancePhaseOne.css";
import "../styles/equipmentFinanceSimplifiedWorkspace.css";

const API = "/equipment-catalogue/sales/phase-one/customers";
const EMPTY_CUSTOMER = { customer_name: "", customer_type: "individual", phone: "", whatsapp_phone: "", email: "", address: "", contact_person: "", risk_notes: "", profile_photo_data_url: "", is_active: true };
function money(value) { return `GHS ${Number(value || 0).toLocaleString("en-GH", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`; }
function errorMessage(error, fallback) { return error?.response?.data?.message || error?.message || fallback; }
function Field({ title, children, wide = false }) { return <label className={`finance-simple__field ${wide ? "is-wide" : ""}`}><span>{title}</span>{children}</label>; }

export default function EquipmentFinanceCustomerCentrePage() {
  const { effectivePermissions = [], user } = useAuth();
  const role = String(user?.role || "").toLowerCase();
  const canManage = effectivePermissions.includes("fleet.assets.manage") || ["admin", "administrator", "manager", "system_administrator", "super_admin"].includes(role);
  const isOriginalAdmin = Boolean(user?.is_original_system_administrator);
  const [customers, setCustomers] = useState([]), [search, setSearch] = useState(""), [loading, setLoading] = useState(true), [saving, setSaving] = useState(false), [problem, setProblem] = useState(""), [notice, setNotice] = useState(""), [selectedCustomer, setSelectedCustomer] = useState(null), [deleteTarget, setDeleteTarget] = useState(null), [editing, setEditing] = useState(null), [form, setForm] = useState(EMPTY_CUSTOMER), [confirmDuplicate, setConfirmDuplicate] = useState(false), [photoProblem, setPhotoProblem] = useState("");
  const load = useCallback(async () => { setLoading(true); setProblem(""); try { const response = await axiosClient.get(API); setCustomers(response.data?.customers || []); } catch (error) { setProblem(errorMessage(error, "Could not load Finance customers.")); } finally { setLoading(false); } }, []);
  useEffect(() => { load(); }, [load]);
  const visibleCustomers = useMemo(() => { const term = search.trim().toLowerCase(); if (!term) return customers; return customers.filter((customer) => [customer.customer_name, customer.customer_code, customer.phone, customer.whatsapp_phone, customer.email].filter(Boolean).some((value) => String(value).toLowerCase().includes(term))); }, [customers, search]);
  function setValue(field, value) { setForm((current) => ({ ...current, [field]: value })); }
  function openCreate() { setSelectedCustomer(null); setEditing({ id: null }); setForm({ ...EMPTY_CUSTOMER }); setConfirmDuplicate(false); setPhotoProblem(""); setProblem(""); }
  async function openEdit(customer) { setSelectedCustomer(null); setEditing(customer); setConfirmDuplicate(false); setPhotoProblem(""); setProblem(""); setForm({ ...EMPTY_CUSTOMER, customer_name: customer.customer_name || "", customer_type: customer.customer_type || "individual", phone: customer.phone || "", whatsapp_phone: customer.whatsapp_phone || "", email: customer.email || "", address: customer.address || "", contact_person: customer.contact_person || "", risk_notes: customer.risk_notes || "", is_active: Boolean(customer.is_active) }); try { const response = await axiosClient.get(`${API}/${customer.id}/photo`); setValue("profile_photo_data_url", response.data?.photo || ""); } catch (error) { if (error?.response?.status !== 503) setPhotoProblem(errorMessage(error, "The customer photo could not be loaded.")); } }
  async function save(event) { event.preventDefault(); setSaving(true); setProblem(""); setNotice(""); try { const response = editing?.id ? await axiosClient.put(`${API}/${editing.id}`, { ...form, confirm_duplicate: confirmDuplicate }) : await axiosClient.post(API, { ...form, confirm_duplicate: confirmDuplicate }); setEditing(null); setNotice(response.data?.message || "Finance customer saved."); await load(); } catch (error) { const duplicates = error?.response?.data?.duplicates || []; setProblem(duplicates.length ? `${errorMessage(error, "A similar customer exists.")} Similar: ${duplicates.map((item) => `${item.customer_name} (${item.phone || "no phone"})`).join(", ")}` : errorMessage(error, "Could not save the Finance customer.")); } finally { setSaving(false); } }
  const totalOutstanding = customers.reduce((sum, customer) => sum + Number(customer.outstanding_balance || 0), 0);
  return <main className="finance-simple finance-simplified finance-customer-centre">
    <header className="finance-simple__hero"><div><p>Customer identity & portfolio</p><h1>Finance Customer Centre</h1><span>One clean reusable customer profile. Photo optional; when supplied, it is automatically cropped and compressed into a passport portrait.</span></div><div className="finance-simple__hero-actions"><Link className="finance-simple__button" to="/equipment-installment-finance/applications?stage=start">Start New Installment</Link>{canManage ? <button className="is-primary" type="button" onClick={openCreate}>+ Add Customer</button> : null}</div></header>
    {problem ? <div className="finance-simple__notice is-error" role="alert">{problem}</div> : null}{notice ? <div className="finance-simple__notice" role="status">{notice}</div> : null}
    <section className="finance-simple__metrics"><article className="finance-simple__metric"><span>Active customers</span><strong>{customers.length}</strong></article><article className="finance-simple__metric"><span>Credit applications</span><strong>{customers.reduce((sum, item) => sum + Number(item.finance_application_count || 0), 0)}</strong></article><article className="finance-simple__metric"><span>Installment agreements</span><strong>{customers.reduce((sum, item) => sum + Number(item.finance_agreement_count || 0), 0)}</strong></article><article className="finance-simple__metric"><span>Outstanding portfolio</span><strong>{money(totalOutstanding)}</strong></article></section>
    <section className="finance-simple__section customer-centre__register"><div className="finance-simple__toolbar"><div><p className="finance-simple__eyebrow">Customer register</p><h2>{visibleCustomers.length} customer(s)</h2></div><input aria-label="Search Finance customer register" value={search} onChange={(event) => setSearch(event.target.value)} placeholder="Search name, phone, code or email" autoComplete="off" /></div>{loading ? <div className="finance-simple__empty">Loading customers…</div> : null}{!loading && !visibleCustomers.length ? <div className="finance-simple__empty">No matching customers. Add a customer to begin.</div> : null}<div className="customer-centre__grid">{visibleCustomers.map((customer) => <article className="customer-centre__card" key={customer.id}><div className="customer-centre__card-main"><CustomerPortrait customerId={customer.id} name={customer.customer_name} size="medium" /><div><span className="finance-simple__pill">{customer.customer_code}</span><h3>{customer.customer_name}</h3><p>{customer.phone || "No phone recorded"}</p><small>{String(customer.customer_type || "individual").replaceAll("_", " ")}</small></div></div><div className="customer-centre__balance"><span>Outstanding</span><strong>{money(customer.outstanding_balance)}</strong><small>{customer.finance_agreement_count || 0} agreement(s)</small></div><div className="customer-centre__actions"><button className="is-primary" type="button" onClick={() => setSelectedCustomer(customer)}>View profile</button><Link className="finance-simple__button" to={`/equipment-installment-finance/applications?stage=start&customer=${customer.id}`}>Start installment</Link>{canManage ? <button type="button" onClick={() => openEdit(customer)}>Edit</button> : null}{isOriginalAdmin ? <button className="is-danger" type="button" onClick={() => setDeleteTarget(customer)}>Delete</button> : null}</div></article>)}</div></section>
    {selectedCustomer ? <div className="finance-simple__dialog-backdrop customer-centre__backdrop" role="presentation" onMouseDown={() => setSelectedCustomer(null)}><section className="customer-centre__profile-dialog" role="dialog" aria-modal="true" onMouseDown={(event) => event.stopPropagation()}><div className="customer-centre__profile-head"><CustomerPortrait customerId={selectedCustomer.id} name={selectedCustomer.customer_name} size="large" /><div><p className="finance-simple__eyebrow">Customer profile</p><h2>{selectedCustomer.customer_name}</h2><span>{selectedCustomer.customer_code} · {selectedCustomer.customer_type || "individual"}</span></div><button type="button" onClick={() => setSelectedCustomer(null)}>×</button></div><div className="finance-simple__summary"><article><span>Phone</span><strong>{selectedCustomer.phone || "Not recorded"}</strong></article><article><span>WhatsApp</span><strong>{selectedCustomer.whatsapp_phone || "Not recorded"}</strong></article><article><span>Email</span><strong>{selectedCustomer.email || "Not recorded"}</strong></article><article><span>Applications</span><strong>{selectedCustomer.finance_application_count || 0}</strong></article><article><span>Agreements</span><strong>{selectedCustomer.finance_agreement_count || 0}</strong></article><article><span>Outstanding</span><strong>{money(selectedCustomer.outstanding_balance)}</strong></article></div><div className="customer-centre__profile-address"><span>Address</span><p>{selectedCustomer.address || "No address recorded."}</p></div><div className="customer-centre__profile-actions">{canManage ? <button type="button" onClick={() => openEdit(selectedCustomer)}>Edit Customer</button> : null}{isOriginalAdmin ? <button className="is-danger" type="button" onClick={() => setDeleteTarget(selectedCustomer)}>Delete Customer</button> : null}<Link className="finance-simple__button is-primary" to={`/equipment-installment-finance/applications?stage=start&customer=${selectedCustomer.id}`}>Start Installment</Link></div></section></div> : null}
    {deleteTarget ? <InstallmentEntityDeleteDialog entityType="customer" entityId={deleteTarget.id} name={deleteTarget.customer_name} onClose={() => setDeleteTarget(null)} onDeleted={(result) => { setDeleteTarget(null); setNotice(result?.message || "Installment customer deleted."); load(); }} /> : null}
    {editing ? <div className="finance-simple__dialog-backdrop customer-centre__backdrop" role="presentation" onMouseDown={() => setEditing(null)}><section className="customer-centre__edit-dialog" role="dialog" aria-modal="true" onMouseDown={(event) => event.stopPropagation()}><div className="customer-centre__edit-head"><div><p className="finance-simple__eyebrow">Customer identity</p><h2>{editing.id ? "Edit customer" : "Add customer"}</h2><span>Compact, friendly and reusable across Finance.</span></div><button type="button" onClick={() => setEditing(null)}>×</button></div><form onSubmit={save}><div className="customer-centre__photo-row"><CustomerPortraitPicker value={form.profile_photo_data_url} name={form.customer_name || "Customer"} onChange={(value) => setValue("profile_photo_data_url", value)} onError={setPhotoProblem} compact />{photoProblem ? <div className="finance-simple__notice is-error">{photoProblem}</div> : null}</div><div className="customer-centre__form-grid"><Field title="Full name"><input value={form.customer_name} onChange={(event) => setValue("customer_name", event.target.value)} required /></Field><Field title="Customer type"><select value={form.customer_type} onChange={(event) => setValue("customer_type", event.target.value)}><option value="individual">Individual</option><option value="company">Company</option><option value="contractor">Contractor</option><option value="government">Government</option></select></Field><Field title="Phone"><input inputMode="tel" value={form.phone} onChange={(event) => setValue("phone", event.target.value)} required /></Field><Field title="WhatsApp"><input inputMode="tel" value={form.whatsapp_phone} onChange={(event) => setValue("whatsapp_phone", event.target.value)} /></Field><Field title="Email"><input type="email" value={form.email} onChange={(event) => setValue("email", event.target.value)} /></Field><Field title="Contact person"><input value={form.contact_person} onChange={(event) => setValue("contact_person", event.target.value)} /></Field><Field title="Address" wide><textarea value={form.address} onChange={(event) => setValue("address", event.target.value)} /></Field><Field title="Internal note" wide><textarea value={form.risk_notes} onChange={(event) => setValue("risk_notes", event.target.value)} /></Field></div><label className="finance-simple__check customer-centre__duplicate-check"><input type="checkbox" checked={confirmDuplicate} onChange={(event) => setConfirmDuplicate(event.target.checked)} /><span><strong>Confirm this is a different customer</strong><small>Only tick this after checking any similar warning.</small></span></label><div className="customer-centre__form-actions"><span>{editing.id ? "Updating the shared profile" : "Creating a reusable shared profile"}</span><div><button type="button" onClick={() => setEditing(null)}>Cancel</button><button className="is-primary" type="submit" disabled={saving}>{saving ? "Saving…" : "Save customer"}</button></div></div></form></section></div> : null}
  </main>;
}
''')

          wizard = Path('frontend/src/pages/EquipmentFinanceStartWizardPage.jsx')
          wtext = wizard.read_text()
          if 'CustomerPortraitPicker' not in wtext:
              wtext = wtext.replace('import "../styles/equipmentFinancePhaseOne.css";', 'import CustomerPortrait, { CustomerPortraitPicker } from "../components/CustomerPortrait";\nimport "../styles/equipmentFinancePhaseOne.css";', 1)
          wtext = wtext.replace('      contact_person: "",\n', '      contact_person: "",\n      profile_photo_data_url: "",\n', 1)
          wtext = wtext.replace('<main className="finance-simple">', '<main className="finance-simple finance-start-wizard">', 1)
          old_address = '<Field title="Address" hint="Optional for draft"><textarea value={data.customer.address} onChange={(event) => updateSection("customer", "address", event.target.value)} /></Field>'
          new_address = '<div className="finance-start-wizard__customer-photo"><CustomerPortraitPicker value={data.customer.profile_photo_data_url} name={data.customer.customer_name || "Customer"} onChange={(value) => updateSection("customer", "profile_photo_data_url", value)} compact /></div><Field title="Address" hint="Optional for draft"><textarea value={data.customer.address} onChange={(event) => updateSection("customer", "address", event.target.value)} /></Field>'
          if old_address not in wtext: raise SystemExit('Start Wizard address field not found')
          wtext = wtext.replace(old_address, new_address, 1)
          selected_block = '''              </div>
            </>
          ) : (
            <div className="finance-simple__grid">'''
          selected_replacement = '''              </div>
              {selectedCustomer ? <div className="finance-start-wizard__selected-customer"><CustomerPortrait customerId={selectedCustomer.id} name={selectedCustomer.customer_name} size="small" /><div><strong>{selectedCustomer.customer_name}</strong><span>{selectedCustomer.phone || "No phone"} · {selectedCustomer.customer_code}</span></div></div> : null}
            </>
          ) : (
            <div className="finance-simple__grid">'''
          if selected_block in wtext: wtext = wtext.replace(selected_block, selected_replacement, 1)
          wizard.write_text(wtext)

          doc = Path('frontend/src/pages/EquipmentFinanceDocumentCentrePage.jsx')
          dtext = doc.read_text()
          if 'CustomerPortrait' not in dtext:
              dtext = dtext.replace('import { useAuth } from "../context/AuthContext";', 'import { useAuth } from "../context/AuthContext";\nimport CustomerPortrait from "../components/CustomerPortrait";', 1)
          summary_anchor = '''          <section className="finance-docs__summary">
            <div className="finance-docs__machine-preview">'''
          summary_replacement = '''          <section className="finance-docs__summary finance-docs__summary--with-customer">
            <div className="finance-docs__customer-portrait"><CustomerPortrait customerId={selectedAccount?.customer_id} name={snapshot.agreement?.kyc_customer_name || snapshot.agreement?.customer_name_snapshot || "Customer"} size="large" /></div>
            <div className="finance-docs__machine-preview">'''
          if summary_anchor in dtext: dtext = dtext.replace(summary_anchor, summary_replacement, 1)
          doc.write_text(dtext)

          css = Path('frontend/src/styles/equipmentFinancePhaseOne.css')
          css_text = css.read_text()
          css_text += r'''

.customer-portrait { flex:0 0 auto; width:92px; aspect-ratio:35/45; border-radius:14px; overflow:hidden; border:1px solid #d7e1d9; background:linear-gradient(145deg,#eef5ef,#f8fbf8); display:grid; place-items:center; box-shadow:0 8px 18px rgba(25,55,36,.08); color:#2b6741; font-weight:900; font-size:1.15rem; }
.customer-portrait img { width:100%; height:100%; display:block; object-fit:cover; }
.customer-portrait--small { width:58px; border-radius:11px; font-size:.85rem; }
.customer-portrait--medium { width:78px; border-radius:12px; }
.customer-portrait--large { width:112px; border-radius:16px; }
.customer-photo-picker { display:flex; align-items:center; gap:.85rem; padding:.7rem; border:1px solid #dbe5dc; border-radius:16px; background:linear-gradient(135deg,#fbfdfb,#f3f8f4); }
.customer-photo-picker.is-compact { padding:.55rem .65rem; }
.customer-photo-picker__copy { display:flex; flex-direction:column; gap:.3rem; min-width:0; }
.customer-photo-picker__copy strong { color:#193c27; }
.customer-photo-picker__copy strong em { font-style:normal; margin-left:.35rem; color:#6c7b70; font-size:.75rem; font-weight:700; }
.customer-photo-picker__copy>span { color:#68766c; font-size:.8rem; line-height:1.35; }
.customer-photo-picker__actions { display:flex; gap:.45rem; flex-wrap:wrap; }
.customer-photo-picker__button { min-height:36px; padding:.5rem .75rem; border:1px solid #c6d3c8; border-radius:10px; background:#fff; color:#1f4e31; font:inherit; font-weight:800; cursor:pointer; }
.customer-photo-picker__button.is-primary { border-color:#28663e; background:#28663e; color:#fff; }
.finance-customer-centre { max-width:1380px; padding-top:.65rem; }
.finance-customer-centre .finance-simple__hero { padding:.9rem 1rem; border-radius:16px; align-items:center; }
.finance-customer-centre .finance-simple__notice { margin:.65rem 0; padding:.65rem .8rem; }
.customer-centre__grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.75rem; margin-top:.8rem; }
.customer-centre__card { display:grid; grid-template-columns:1.25fr .75fr; gap:.7rem; padding:.8rem; border:1px solid #d9e3db; border-radius:16px; background:#fff; box-shadow:0 8px 22px rgba(30,51,37,.045); }
.customer-centre__card-main { display:flex; gap:.7rem; align-items:center; min-width:0; }
