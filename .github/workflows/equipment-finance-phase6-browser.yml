      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Phase 6 portfolio, reporting and performance journeys
        run: npx playwright test e2e/equipmentFinancePhaseSix.spec.js

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equipment-finance-phase6-browser-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14
