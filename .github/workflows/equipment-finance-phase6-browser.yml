.customer-centre__actions button,.customer-centre__actions a { min-height:36px; padding:.5rem .7rem; border-radius:10px; }
.customer-centre__backdrop { background:rgba(10,24,15,.58); }
.customer-centre__profile-dialog,.customer-centre__edit-dialog { width:min(94vw,720px); max-height:min(88dvh,780px); overflow:auto; background:#fff; border:1px solid #dce6df; border-radius:20px; box-shadow:0 28px 90px rgba(0,0,0,.22); padding:1rem; }
.customer-centre__profile-head,.customer-centre__edit-head { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:.85rem; padding-bottom:.75rem; border-bottom:1px solid #e3eae4; }
.customer-centre__profile-head h2,.customer-centre__edit-head h2 { margin:0; font-size:1.35rem; }
.customer-centre__profile-head span,.customer-centre__edit-head span { color:#68766c; font-size:.82rem; }
.customer-centre__profile-head>button,.customer-centre__edit-head>button { width:36px; height:36px; border:0; border-radius:50%; background:#f2f6f2; color:#365741; font-size:1.15rem; cursor:pointer; }
.customer-centre__profile-address { margin-top:.75rem; padding:.7rem .8rem; border-radius:12px; background:#f7faf7; }
.customer-centre__profile-address span { color:#68766c; font-size:.75rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; }
.customer-centre__profile-address p { margin:.25rem 0 0; color:#233b2a; line-height:1.45; }
.customer-centre__profile-actions,.customer-centre__form-actions { display:flex; align-items:center; justify-content:space-between; gap:.7rem; margin-top:.8rem; padding-top:.7rem; border-top:1px solid #e6ece7; }
.customer-centre__profile-actions>div,.customer-centre__form-actions>div { display:flex; gap:.45rem; flex-wrap:wrap; }
.customer-centre__photo-row { margin:.8rem 0; }
.customer-centre__form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.65rem; }
.customer-centre__duplicate-check { margin-top:.65rem; }
.finance-start-wizard { max-width:1280px; padding-top:.45rem; }
.finance-start-wizard .finance-simple__hero { padding:.8rem .95rem; border-radius:15px; align-items:center; }
.finance-start-wizard .finance-simple__hero h1 { font-size:clamp(1.45rem,3vw,2rem); }
.finance-start-wizard .finance-simple__hero span { margin-top:.3rem; font-size:.86rem; }
.finance-start-wizard .finance-simple__notice { margin:.5rem 0; padding:.55rem .72rem; font-size:.82rem; }
.finance-start-wizard .finance-simple__steps { position:sticky; top:.35rem; z-index:20; margin:.5rem 0; gap:.35rem; padding:.25rem; border:1px solid #dbe5dd; border-radius:14px; background:rgba(255,255,255,.94); box-shadow:0 10px 22px rgba(26,52,34,.08); backdrop-filter:blur(8px); }
.finance-start-wizard .finance-simple__step { min-height:46px; padding:.45rem .55rem; border-radius:11px; font-size:.82rem; }
.finance-start-wizard .finance-simple__panel { margin-top:.55rem; padding:.75rem; border-radius:16px; }
.finance-start-wizard .finance-simple__grid { gap:.6rem; margin-top:.65rem; }
.finance-start-wizard .finance-simple__section { margin-top:.6rem; padding:.72rem; border-radius:14px; box-shadow:none; }
.finance-start-wizard .finance-simple__field>span { font-size:.8rem; }
.finance-start-wizard .finance-simple input,.finance-start-wizard .finance-simple select,.finance-start-wizard .finance-simple textarea { min-height:40px; padding:.58rem .68rem; border-radius:10px; }
.finance-start-wizard .finance-simple textarea { min-height:80px; }
.finance-start-wizard .finance-simple__sticky-actions { width:min(900px,100%); margin:.55rem auto 0; border-radius:14px; padding:.6rem; }
.finance-start-wizard__customer-photo { grid-column:1/-1; }
.finance-start-wizard__selected-customer { display:flex; align-items:center; gap:.6rem; margin-top:.65rem; padding:.55rem; border:1px solid #dbe5dd; border-radius:12px; background:#f8fbf8; }
.finance-start-wizard__selected-customer strong,.finance-start-wizard__selected-customer span { display:block; }
.finance-start-wizard__selected-customer span { color:#6e7b72; font-size:.78rem; }
.finance-docs__summary--with-customer { grid-template-columns:120px minmax(0,1fr) 1.2fr; }
.finance-docs__customer-portrait { display:grid; place-items:start center; }
@media (max-width:900px) { .customer-centre__grid { grid-template-columns:1fr; } .customer-centre__form-grid { grid-template-columns:1fr; } .customer-centre__card { grid-template-columns:1fr; } .finance-docs__summary--with-customer { grid-template-columns:90px minmax(0,1fr); } }
@media (max-width:680px) { .customer-photo-picker { align-items:flex-start; } .finance-start-wizard .finance-simple__hero { align-items:flex-start; } .finance-start-wizard .finance-simple__steps { overflow-x:auto; } .finance-start-wizard .finance-simple__step { min-width:118px; justify-content:flex-start; } }
