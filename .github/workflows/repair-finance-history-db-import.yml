name: Repair Finance payment history DB import

on:
  push:
    branches: [finance-history-db-import-fix]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finance-history-db-import-fix
          fetch-depth: 0
      - name: Repair DB import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('backend/services/equipmentFinancePaymentHistoryService.js')
          s = p.read_text()
          old = 'const pool = require("../config/db");'
          new = 'const { pool } = require("../config/db");'
          assert old in s, 'expected DB import not found'
          p.write_text(s.replace(old, new, 1))
          w = Path('.github/workflows/repair-finance-history-db-import.yml')
          w.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/services/equipmentFinancePaymentHistoryService.js .github/workflows/repair-finance-history-db-import.yml
          git commit -m 'fix: correct Finance payment history DB pool import'
          git push origin finance-history-db-import-fix
